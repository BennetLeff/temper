[project]
name = "temper-workspace"
version = "0.1.0"
description = "Temper induction cooker: zapote validation workspace and firmware"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.6",
    "jinja2>=3.1",           # firmware/tools code generators
    "pyyaml>=6.0",           # firmware/tools, CI scripts
    "kiutils>=1.4",          # zapote/tools/generators/gen_pcb_skeleton.py
    "zapote-bridge",         # zapote_bridge, imported by zapote's unit tools
]

[tool.uv.workspace]
members = ["zapote/packages/zapote-bridge"]

[tool.uv.sources]
zapote-bridge = { workspace = true }

[tool.pytest.ini_options]
# Mirrors the Python suites CI runs; KiCad-dependent tests run under KiCad's
# Python separately (see zapote/CHECKS.md).
testpaths = [
    "firmware/tools",
    "firmware/test/test_codegen_tools.py",
    "zapote/tools/generators/tests",
    "zapote/tools/test_check_campaign_dispatch.py",
    "zapote/tools/test_check_fault_loop.py",
    "scripts/tests",
]
addopts = ["--tb=short"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]
