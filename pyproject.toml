[project]
name = "temper-workspace"
version = "0.1.0"
description = "Temper induction cooker: zapote validation workspace, firmware and the design-bundle crates"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.6",
    "jinja2>=3.1",           # firmware/tools code generators
    "pyyaml>=6.0",           # firmware/tools, CI scripts
    "kiutils>=1.4",          # zapote/tools/generators/gen_pcb_skeleton.py
    "temper-geometry",
    "temper-io-types",
    "temper-design-bundle",  # temper_design_bundle_python, imported by zapote unit tools
]

[tool.uv.workspace]
members = ["packages/*"]
exclude = [
    "packages/temper-py-bridge",
    "packages/temper-py-bridge-derive",
]

[tool.uv.sources]
temper-geometry = { workspace = true }
temper-io-types = { workspace = true }
temper-design-bundle = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["firmware/tools", "zapote/tools", "scripts/tests"]
addopts = ["--tb=short"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]
