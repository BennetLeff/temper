      ac_l (AC mains line) connects only to F1.1 -- the L path continues
      from fuse.p2 through the CMC (modules.ato:889-891), so the net named
      ac_l is just the input-terminal node. Root shape matches the usb_dn/
      usb_dp backlog entries: no AC inlet connector component exists
      anywhere in elec/src, so mains entry is unwired at the schematic
      level. A missing-circuit question for a hardware maintainer, not a
      one-line fix.
