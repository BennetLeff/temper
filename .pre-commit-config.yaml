repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: literal-removal-check
        name: literal-removal-check (advisory)
        description: Flags removed literals still referenced elsewhere in the repo. Never blocks a commit.
        entry: python3 scripts/literal_removal_check.py
        language: system
        pass_filenames: false
        always_run: true

ci:
  autofix_commit_msg: "chore: pre-commit auto-fixes"
  autoupdate_commit_msg: "chore: pre-commit autoupdate"
  skip: [literal-removal-check]
