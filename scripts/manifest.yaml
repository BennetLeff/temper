- path: check_pad_orientation.py
  purpose: 'Pad-orientation gate: catch footprint rotations that never reached the pads. Check 1 -- a
    footprint rotated by a non-multiple of 180 deg whose pads ALL carry absolute angle 0 is the signature
    of a serializer that rotated pad positions but not pad bodies (docs/evidence/2026-07-29-intra-component-shorts-root-cause.md).
    Check 2 -- separating-axis test for intra-footprint copper overlap between different-net pads. Reads
    the board bytes directly (no kiutils, no kicad-cli) so the ABSENCE of an optional angle token is visible.
    Fail-closed on a missing/unparseable board, zero footprints, zero pads, or zero pad pairs compared.
    NOT YET CI-WIRED: check 1 passes on the regenerated board but check 2 still reports K1, whose two
    F.Fab-only pads hit the "no declared copper layer -> assume sharing" fail-closed rule -- a gap in
    this gate''s own contract, analysed in docs/evidence/2026-07-29-board-regeneration-corrected-footprints.md
    Sec 7. Wire it in the change that closes that gap.'
  owner: bennet
  last_run: '2026-07-29'
  category: keep
  disposition: ci-gate
  imports:
