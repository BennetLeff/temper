      UNVERIFIED at any distributor in this pass, see audit doc Sec 6.
      Applied = dc_bus_plus half-bus nominal, modules.ato:1607,1630-1632.
    notes: >-
      docs/hardware/PART_STRESS_AUDIT.md Sec 2.1. Worst DC-bias ratio
      (68%) found in the design; unlike its two 60%-biased siblings, this
      instance carries no in-source derating flag.

