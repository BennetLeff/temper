    mpn: CRGP2512F22K
    domain: power
    unit: W
    rated: 2.0
    applied: 1.31
    guideline_margin: 0.50
    conditional: false
    source: >-
      CRGP2512 family, 2W @ 70C continuous (verified comment,
      modules.ato:831). Applied = 170V*170V/22kohm, modules.ato:845.
    notes: >-
      docs/hardware/PART_STRESS_AUDIT.md Sec 2.4 and Sec 4 -- the
      in-source assertion meant to check this (modules.ato:852-853) is
      written backwards and does not actually enforce a 50% margin; this
      entry's applied/rated figures were computed independently.

  - id: tank_cap_ripple_current
    designators: [C25, C26, C27]
