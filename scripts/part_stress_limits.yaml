    guideline_margin: 0.20
    conditional: false
    source: "TDK B82726S2163N030 datasheet, 'Date: April 2025' rev, 16A @ 50Hz/dTr+60C. components.ato:258-276."
    notes: "docs/hardware/PART_STRESS_AUDIT.md Sec 2.2. Nominal-only (120V/15A); see ac_line_current_low_line for the over-rating case."

  - id: fuse_current_margin
