      frequency-transfer factor to 47kHz, both derived in
      modules.ato:468-496. Applied is the 88uH-coil 22.5A tank-current
      stress point (worse of the two cited operating points).
    notes: >-
      docs/hardware/PART_STRESS_AUDIT.md Sec 2.5. Thin (27-38%
      margin across the two cited operating points) but positive;
      guideline_margin=0.30 here is this audit's own threshold for film
      ripple current, not a datasheet-stated derating rule.

