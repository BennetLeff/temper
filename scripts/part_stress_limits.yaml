# Per-part stress limits for scripts/part_stress_gate.py.
#
# This is DATA, not code, deliberately: docs/hardware/PART_STRESS_AUDIT.md
# §7 explains why -- a part swap or a re-derived stress figure should only
# require editing this file, never the gate script. Every entry's `rated`
# and `source` fields must trace to a real datasheet or an existing
# in-repo evidence document; `applied` is either measured/derived-and-cited
# the same way, or computed from a `formula` (kept as a comment, not
# executed) against committed elec/src/*.ato values. See the audit doc for
# the full derivation of every number below -- this file is the checked-in
# summary a gate reads, not the analysis itself.
#
# Fields:
#   id                  stable key, used in test fixtures and reports
#   designators         refs this entry covers, as they appear in
#                        elec/build/default.csv's Designator column
#   mpn                 expected MPN for ALL of `designators` (per
#                        elec/build/default.csv's Comment/LCSC column) --
#                        used to fail closed if the part has been swapped
#                        since this entry was written
#   domain              voltage_electrolytic | voltage_ceramic_dc_bias |
#                        voltage_film | current | ripple_current | power |
#                        temperature
#   unit                unit string for display only (A, V, W, C)
#   rated               the datasheet/spec absolute limit in `unit`
#   applied              the worst-case (or central-case, noted per entry)
#                        applied stress in `unit`
#   guideline_margin    minimum acceptable (rated-applied)/rated before
#                        this entry is reported WARN instead of OK. A
#                        margin < 0 is always FAIL regardless of this
#                        field (at-or-over the hard rating).
#   conditional          true if `applied` depends on an assumption this
#                        repo could not independently confirm (see notes) --
#                        printed as FAIL(conditional)/WARN(conditional),
#                        never silently merged with an unconditional finding
#   source              datasheet or evidence-doc citation
#   notes                short explanation, cross-referenced to the audit doc

entries:
  # ---------------------------------------------------------------------
  # Section 1: AT OR OVER RATING
  # ---------------------------------------------------------------------
  - id: bus_cap_ripple_current
    designators: [C2, C3, C4, C5]
    mpn: EKMQ251VSN182MA50S
    domain: ripple_current
    unit: A
    rated: 2.70
    applied: 13.02
    guideline_margin: 0.0
    conditional: false
    source: >-
      United Chemi-Con CAT. No. E1001E (KMQ series, 250V row, 1800uF,
      phi35xL50) rated ripple 2.70 Arms @ 105C/120Hz; applied figure is the
      "central" scenario (eta=0.90, conduction angle=40deg) from
      docs/evidence/2026-07-26-bus-capacitor-ripple.md Sec 5, which reports
      a full 11.39-15.57A range across best/central/worst assumptions --
      even the best case (11.39A) is 4.22x rated.
    notes: >-
      docs/hardware/PART_STRESS_AUDIT.md Sec 1.1. Still live: modules.ato
      C_BUS1/1B/2/2B unchanged since the 2026-07-26 finding.

  - id: ac_line_current_low_line
    designators: [F1, L1]
    mpn: null  # covers two different parts (fuse + CMC); MPN check skipped, see notes
    domain: current
    unit: A
    rated: 16.0
    applied: 18.52
    guideline_margin: 0.0
    conditional: true
    source: >-
      Fuse (0034.3129, Schurter FST 5x20 time-lag) and CMC
      (B82726S2163N030, TDK datasheet "Date: April 2025") both rated 16A
      continuous. Applied = P_out/(eta*V_line) = 1800W/(0.90*108V) = 18.52A,
      using main.ato's committed eta=0.90 target and
      docs/ENVIRONMENTAL_SPEC.md's documented 108V input minimum.
    notes: >-
      docs/hardware/PART_STRESS_AUDIT.md Sec 1.2. CONDITIONAL: holds only
      if the control loop holds constant 1800W output as line voltage
      sags -- no line-voltage-based power derating was found in
      firmware/, but that is not proof none exists. This entry uses the
      110V/eta=0.90 case (18.52A) as a representative, not worst-case,
      point -- the audit doc's full table spans 18.12-21.18A depending on
      V_line and eta.

  - id: tank_coil_peak_current
    designators: [R30]
    mpn: CUSTOM_LITZ_COIL
    domain: current
    unit: A
    rated: 15.0
    applied: 31.9
    guideline_margin: 0.0
    conditional: false
    source: >-
      footprint LitzPad_15A (footprints.ato) names its own 15A pad rating.
      Applied figure (28.7-31.9A peak) from modules.ato:585-596, both the
      150uH and 88uH tank models. A second, less severe comparison exists
      against the module's own imposed current_rating=25A (15-28% over).
    notes: >-
      docs/hardware/PART_STRESS_AUDIT.md Sec 1.3. Already flagged
      in-source verbatim; not a new finding, reconfirmed unchanged.

  # ---------------------------------------------------------------------
  # Section 2: BELOW NORMAL DERATING GUIDELINE
  # ---------------------------------------------------------------------
