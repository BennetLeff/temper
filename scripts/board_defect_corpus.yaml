_meta:
  title: Board-defect mutation corpus — seed manifest
  plan: docs/plans/2026-08-02-024-feat-board-defect-mutation-corpus-plan.md
  requirement: R38
  board: pcb/temper.kicad_pcb
  # Content hash of the committed board the seeds below were validated
  # against. The runner compares its run-time board hash to this value; a
  # mismatch means the board changed since the corpus was seeded and every
  # seed is re-validated by the run itself (KTD3: the corpus re-derives from
  # the committed board on every run). Update this hash with
  # `--update-manifest` after a board change has been re-validated green.
  # 2026-08-24: re-stamped by HAND, same reason as the 2026-08-13 entry --
  # `--update-manifest` only stamps on a fully green run and `clearance`
  # remains the documented deliberate uncovered exception, so ok=True is
  # unreachable by design. Was 6928b7c8 / c4956df66 (2026-08-08), i.e.
  # THIRTEEN board-changing commits stale, spanning the elec/src resync
  # (#1134), a full copper regeneration (#1312), two re-routes
  # (#1333/#1334) and five placement passes.
  #
  # Verified before re-stamping, to the same bar as 2026-08-13: the
  # corpus re-derives every mutation from the committed board and
  # reports 6/7 classes covered with `clearance` the only uncovered one
  # -- off-board, pad-short, creepage, courtyard, hole-to-hole and
  # missing-courtyard all fire by identity against this board. That was
  # NOT true before the courtyard re-seed in this same change: the stale
  # seed coordinate had left that class silently uncovered (5/7), which
  # is why the hash could not simply be bumped on its own.
  board_sha256: 53818940d2aa837f16ace104edb00b44b2ae45e2d74da05864651ddd9aa22528
  board_commit: 92c08cd33
  created: 2026-08-02
  reseeded: 2026-08-04
  measured_kicad_cli: 10.0.4
  # 2026-08-13: re-stamped by HAND, not `--update-manifest`, because that
  # flag only stamps on a fully green run (ok=True, zero uncovered
  # classes) and `clearance` is now a documented DELIBERATE uncovered
  # exception (see classes.clearance.uncovered_finding) -- the corpus can
  # no longer reach ok=True while that finding stands, exactly as it could
  # not while missing-courtyard was the deliberate exception before it.
  # pcb/temper.kicad_pcb itself is untouched; only this recorded hash of
  # the (unmodified) committed board was stale, by one commit
  # (c4956df66, 2026-08-08, "declare In1.Cu/In2.Cu as power-plane layers,
  # not signal" -- unrelated to any seeded ref/pad in this manifest).
  # Verified before re-stamping: every OTHER class (off-board, pad-short,
  # creepage, courtyard, hole-to-hole, missing-courtyard) still fires
  # correctly by identity against pcb/temper.kicad_pcb at this hash, and
  # test_manifest_seeds_apply_to_real_board (every seed mutation applies
  # without error) passes.
  reseed_note: >-
    Re-seeded 2026-08-04 from board_sha256 e2fb9237 (commit 54372bbf,
    2026-07-29) to 51e39844 (commit de59c0458, 2026-08-03). The corpus was
    AUTHORED on 2026-08-02 against a 2026-07-29 board that main had already
    moved past: 55226f8ad (#517, 2026-07-31) re-solved the placement and
    changed the position of ALL 169 footprints, and 829af5c59 / 27ea686c5
    (K2 RT314012), a2fdfd1bb (#568 edge-nudge) and de59c0458 (#602, K3
    RT314012 swap) each changed it again. That stale seed is what unmasked
    two vacuous owning-gate choices -- see
    docs/evidence/2026-08-04-board-defect-corpus-uncovered-classes.md.
  note: >-
    Seeds are deterministic transforms on run-time copies of the committed
    board; the committed board is NEVER modified and the DRC-ceiling
    re-measurement convention stays inert. The three real defect instances
    (tank cap off-outline at (at 20.0 272.75), C1 pad2<->R7 pad2 short,
    DC_BUS<->LV_CONTROL creepage crossings) are ALREADY present on the
    committed board, so each seed starts from a DEFECT-FREE point: move an
    in-board tank cap off-board, short a not-yet-shorted pad pair, compress
    a currently-compliant creepage pair.

# Defect-to-gate mapping (KTD2): each class names its owning gate(s); a
# class whose owning gate does not fire on the mutated board is a corpus
# error, not a pass.
#
# failure_signal values:
#   gate-names-defect -- the owning gate must NAME the seeded defect on the
#     mutated board and must NOT name it on the clean board (both halves of
#     R9). Strictly stronger than a count-delta: a count can rise for an
#     unrelated reason, but a finding naming the exact ref/pads the mutator
#     touched cannot.
#   count-delta -- the owning gate's per-class count must exceed the clean
#     board's. Retained only for creepage, whose gate is red on main and so
#     has a documented known-finding baseline rather than a zero.
classes:
  off-board:
    mutation: off-board
    seed: 1
    params:
      ref: C26
      position_mm: [59.38, 256.0]
    owning_gates: [board_containment]
    failure_signal: gate-names-defect
    note: >-
      tank-cap class (the real C27-off-outline staging). C26
      (tank.c_tank2, in-board at (65.92, 72.32) rot 270) is moved to
      (59.38, 256.0), past the bottom edge of the 20..172 x 20..254
      outline. Owning gate is scripts/check_board_containment.py -- the R26
      "every component inside the outline" invariant -- which reports C26
      pads 1 and 2 fully outside the outline on the mutated board and
      reports nothing at all on the clean board.
    superseded_owning_gates: >-
      Until 2026-08-04 this class named courtyards_overlap and
      copper_edge_clearance, described as "the standing proxy for the R26
      containment invariant until R26 lands". Measured 2026-08-04, both
      proxies are vacuous for this class: copper_edge_clearance never fired
      on this seed on ANY board (12 -> 12 today, 15 -> 15 on the seed-era
      board -- it measures copper too CLOSE to the edge, and copper that has
      left the board is simply far from it), and courtyards_overlap fired
      only on the pre-#517 geometry (14 -> 29, when C26 was at rot 0 and the
      move laid its 40mm-pitch body across a populated region), going
      11 -> 11 today at rot 270. Moving a component off the board REMOVES
      its copper from the layout, so DRC counts FALL: hole_clearance
      105 -> 102, shorting_items 200 -> 197, solder_mask_bridge 154 -> 151,
      net -9 errors. No count-delta can ever detect this class.
  pad-short:
    mutation: pad-short
    seed: 2
    params:
      ref: C28
      pad_a: "1"
      pad_b: "2"
    owning_gates: [kicad-drc]
    failure_signal: gate-names-defect
    note: >-
      C1 pad2<->R7 pad2 short class. C28 (0603, pad 1 I_SENSE, pad 2 gnd)
      pad 2's copper is moved onto pad 1's position; the two pads keep
      their distinct nets, so overlapping copper on different nets appears.
      A net-join alone cannot create a short on a static board -- see
      board_defect_mutator.py's mutate_pad_short docstring for the review
      fix rationale. Asserted as "some DRC error names BOTH C28 pad 1 and
      C28 pad 2 on the mutated board, and none does on the clean board".
    superseded_owning_gates: >-
      Until 2026-08-04 this class asserted a shorting_items count-delta
      against max(clean, recorded ceiling). Three independent defects, all
      measured 2026-08-04: (1) KiCad does not assign this defect a stable
      category -- the identical mutation yields shorting_items on the
      seed-era board but "clearance (actual 0.0000 mm)" +
      solder_mask_bridge on today's, so a single hard-coded category name
      cannot see it; (2) shorting_items is not stable enough to carry a +1
      assertion, measuring 199,199,199,200,199 over five runs of ONE
      byte-identical board, so the signal sat inside the noise floor; and
      (3) the max(clean, ceiling) baseline made the assertion
      mathematically unsatisfiable once the recorded ceiling (201) rose
      above clean+1 (clean 200) -- the mutation would have had to produce
      202. That third defect is what turned this class red; the first two
      meant it had never been a sound assertion.
  creepage:
    mutation: creepage
    seed: 3
    params:
      ref: C8
      position_mm: [116.26, 138.72]
    owning_gates: [req-safe-01-creepage-dc-lv]
    failure_signal: count-delta
    baseline_note: >-
      The REQ-SAFE-01 creepage gate is RED on main today (99
      DC_BUS<->LV_CONTROL creepage violations measured 2026-08-02 via
      verify_iec60335_compliance at the matrix's enforced min_creepage_mm
      12.6/6.3). The anti-vacuity control is therefore scoped to the DRC
      categories that ARE green on the clean board, and this class is
      asserted via per-class count-delta against the clean measurement as
      its documented known-finding baseline.
    note: >-
      DC_BUS<->LV_CONTROL creepage class. C8 (DC_BUS_RTN 0603) is moved to
      (116.26, 138.72) -- ~2mm from C11 (LV_CONTROL) -- compressing a
      currently-compliant HV<->SELV pair below the enforced margin.
      Measured 2026-08-02: DC_BUS<->LV_CONTROL creepage 99 -> 102.
  clearance:
    mutation: clearance
    seed: 4
    params:
      ref: R67
      position_mm: [134.66, 140.1]
      pad: "1"
      anchor_ref: R64
      anchor_pad: "1"
    owning_gates: [kicad-drc]
    failure_signal: gate-names-defect
    note: >-
      Ordinary copper-to-copper clearance class (R9/R10 vacuity closure,
      2026-08-07 -- scripts/board_defect_corpus.yaml had NO clearance
      mutation class before this; clearance only ever appeared incidentally
      in the pad-short mutation's kicad-cli output). R67 (0603, pad 1
      +3V3, pad 2 safety.coil_thermal.comp-inp; originally at (101.37,
      144.9) rot 180) is moved to (134.66, 140.1), placing R67 pad 1
      0.05mm from the fixed R64 (0603, pad 1 safety.thermal.comp-inp, pad 2
      safety.thermal-line; NOT moved) pad 1 -- below the applicable
      net-class clearance (netclass 'Default' 0.2mm; R67 pad 1's own net was,
      AT THE TIME, 'FinePitch' 0.1mm -- STALE, see uncovered_finding below,
      it is 'Power' 0.5mm as of 2026-08-13 -- and KiCad enforces the MAX of
      the two classes' requirements) but strictly positive, so no copper
      overlap (unlike
      pad-short, which drives the gap to exactly 0.0mm). Measured
      2026-08-07: kicad-cli reports "Clearance violation (netclass
      'Default' clearance 0.2000 mm; actual 0.0500 mm)" naming R64 pad 1
      and R67 pad 1 on the mutated board, and nothing names that pair on
      the clean board. This is a distinct DRC boundary from both
      pad-short's same-footprint "Fine pitch IC pads" 0.1mm exception
      (RULE 1 in generate_kicad_dru.py -- this mutation moves a whole
      SEPARATE footprint, not a pad within one) and creepage's HV<->SELV
      custom DRU rule (R64/R67's nets are plain LV signals, not
      ACMains/HighVoltage).
    stability_note: >-
      `clearance` is this repo's OWN documented nondeterministic DRC
      category (AGENTS.md's DRC-ceiling section: "observed max + 1
      headroom", >=120 samples required). A raw count-delta on it would
      repeat the exact defect pad-short was fixed for on 2026-08-04, so
      this class is identity-based from the start (asserts the R64
      pad1/R67 pad1 pair is named together, not that the category count
      rises). Measured N=120 repeated runs of the byte-identical mutated
      board (kicad-cli 10.0.5, thread-pinned via _drc_api.py's
      _single_threaded_kicad_env): errors naming BOTH R64 pad 1 and R67
      pad 1 = 2 on every one of 120 runs (zero variance); on 120 repeated
      runs of the clean board it is 0 on every run. The raw 'clearance'
      category total was also observed stable in this sample (339 clean /
      340 mutated, unchanged across all 120 runs each) -- see
      docs/evidence/2026-08-07-clearance-courtyard-corpus-coverage.md for
      the full sample data; the identity signal is asserted regardless.
      STALE as of 2026-08-13 (see uncovered_finding below): this N=120
      measurement, like the note above's, was taken through this corpus's
      OWN measure_drc(), which did not attach a project sidecar at the
      time -- i.e. it was measured context-blind, the same bug
      missing-courtyard's note documents. Not re-measured at N=120 under
      corrected project context because the signal is currently 0/0
      (never fires), not merely noisy.
    uncovered_finding: >-
      DELIBERATE EXCEPTION as of 2026-08-13, discovered while fixing
      check_board_defect_corpus.run_corpus() to give its clean/mutated
      scratch copies a sibling .kicad_pro (see missing-courtyard's
      uncovered_finding addendum above for why that fix was made). Before
      the fix, this class's identity check passed under a context-blind
      measurement (see note/stability_note above, both now marked stale).
      Under the corrected, project-aware measurement it no longer does:
      zero DRC errors name both R64 pad 1 and R67 pad 1, checked across
      several positions along the same mutation axis INCLUDING moving R67
      pad 1 to sit exactly on top of R64 pad 1 (full copper overlap, i.e.
      the pad-short case) -- still no clearance/shorting_items/
      solder_mask_bridge violation names both pads. Other clearance pairs
      DO measure correctly in the same DRC run (e.g. multiple 'HV to LV'
      violations between R64/R67 and a nearby track), so this is not a
      wholesale measurement failure, only this specific pair. The note
      above's own rationale is also now known stale independent of the
      DRC result: it states R67 pad 1's net (+3V3) carries netclass
      'FinePitch' (0.1mm); pcb/temper.kicad_pro's current
      net_settings.netclass_assignments instead maps '+3V3' -> 'Power'
      (0.5mm) -- a real reassignment sometime after 2026-08-07, not a
      measurement artifact (both values were read directly from the
      current committed project file, not inferred). Root cause NOT
      identified beyond that: raising the nominal required clearance
      (Default 0.2mm -> Power 0.5mm) should, if anything, make the
      existing 0.05mm-gap seed MORE of a violation, not remove it, so the
      netclass reassignment on its own does not explain the disappearance
      -- and it does not explain the zero-violation result at full
      overlap either, which should be flagged as a clearance/short
      regardless of which netclass's threshold applies. Not investigated
      further here: the current DRU rule-precedence/netclass-assignment
      machinery (generate_kicad_dru.py, pcb/temper.kicad_pro) has several
      in-flight PRs against it on 2026-08-13 (netclass re-scoping and
      several netclass-assignment fixes), and this corpus's own contract
      is to measure through the SAME unmodified DRC path every other
      class and gate uses, not to special-case one pair. Reported here,
      per METHODOLOGY.md Sec. 5, rather than silently re-seeded onto an
      easier pair or weakened to a count-delta. Re-seeding onto a new
      pair (with the same N=120 rigor and real-geometry derivation the
      2026-08-07 clearance/courtyard classes used) is the right fix once
      the underlying DRC/netclass gap is understood or closed, not before.
  courtyard:
    mutation: courtyard
    seed: 5
    params:
      ref: C38
      # RE-SEEDED 2026-08-24: was [41.54, 189.55], chosen when R48 sat at
      # (41.54, 187.57) -- 1.98mm away, so the moved C38 landed on top of
      # it. #1134's elec/src resync (96db2ccde, 2026-08-15) moved R48 to
      # (84.41, 242.27), ~65mm away, and the seed has dropped C38 into
      # empty space ever since: measured on today's board the old
      # coordinate yields 6 courtyards_overlap with ZERO naming C38, so the
      # class was silently uncovered. This is the same staleness shape the
      # 2026-08-04 reseed_note below records for the whole corpus after
      # #517 re-solved all 169 placements, and the same one
      # check_board_containment.py's docstring records for the off-board
      # class -- a seed coordinate outliving the placement it was aimed at.
      #
      # New coordinate is R48's current position, keeping the anchor
      # unchanged. Measured: 7 courtyards_overlap, exactly 1 naming C38,
      # and it is "Footprint C38 <-> Footprint R48" -- the pair this class
      # asserts on.
      position_mm: [84.41, 242.27]
      anchor_ref: R48
    owning_gates: [kicad-drc]
    failure_signal: gate-names-defect
    note: >-
      Courtyard-overlap class (R9/R10 vacuity closure, 2026-08-07;
      docs/evidence/2026-08-04-board-defect-corpus-uncovered-classes.md
      recorded courtyards_overlap DROPPED as the off-board class's owning
      gate because it was measured NOT to discriminate that seed -- 11 -> 11
      unchanged -- and no replacement gate was ever assigned). Unlike that
      seed, this mutation computes its target position FROM the two
      footprints' own F.CrtYd courtyard geometry (an FpRect bounding box
      read via kiutils, the same kicad_transform rotation convention used
      everywhere else in this module), so the courtyard collision is a
      deterministic property of the seed rather than an accident of
      unrelated placement geometry -- directly addressing the 2026-08-04
      finding instead of repeating it. C38 (0603, originally at (21.24,
      203.44) rot 90, far from R48) is moved to (41.54, 189.55), overlapping
      its F.CrtYd rectangle with the fixed R48 (0603 at (41.54, 187.57) rot
      180; NOT moved) by ~0.23mm in Y, while keeping every pad pair between
      the two >=0.28mm apart (above every applicable net-class clearance),
      so courtyards_overlap is the ONLY violation this mutation produces
      between the two refs -- no confounding clearance/short. Measured
      2026-08-07: kicad-cli reports "Courtyards overlap" naming Footprint
      R48 and Footprint C38 on the mutated board, and nothing names that
      pair on the clean board.
    stability_note: >-
      Identity-based for the same reason as `clearance` above (a
      count-delta on courtyards_overlap is exactly the 2026-08-04 off-board
      failure mode repeating). Measured N=120 repeated runs of the
      byte-identical mutated board (kicad-cli 10.0.5, thread-pinned):
      errors naming both R48 and C38 = 1 on every run (zero variance); 0 on
      every one of 120 runs of the clean board. The raw courtyards_overlap
      category total was also observed stable in this sample (11 clean / 12
      mutated, unchanged across all 120 runs each) -- see
      docs/evidence/2026-08-07-clearance-courtyard-corpus-coverage.md.
  hole-to-hole:
    mutation: hole-to-hole
    seed: 6
    params:
      ref: C24
      position_mm: [95.28, 64.84]
      pad: "1"
      anchor_ref: C2
      anchor_pad: "1"
    owning_gates: [kicad-drc]
    failure_signal: gate-names-defect
    note: >-
      Drilled-hole-to-hole spacing class (STRATEGY.md build order step 4,
      2026-08-07 -- one of the ~10 fault-injection classes; docs/STRATEGY.md
      Sec "Checks by stage" names ampacity/clearance-family Routing checks,
      and PTH hole-to-hole spacing is a real manufacturing rule this repo's
      own SSOT DRU generator emits (scripts/generate_kicad_dru.py, "PTH hole
      to hole", min 0.5mm) but the corpus had no class for it before this).
      C24 (a THT 2-pin capacitor, pad 1 net +170V_BUS; originally at
      (31.57, 88.86) rot 0, 10.9mm+ from every other drilled hole) is moved
      to (95.28, 64.84), placing its pad 1 drill 1.8mm center-to-center
      (0.20mm edge-to-edge) from the fixed C2 (THT 2-pin capacitor, pad 1
      also net +170V_BUS; NOT moved, at (93.48, 64.84)) pad 1 drill -- below
      the 0.4995mm hole_to_hole minimum kicad-cli measures (the DRU's 0.5mm
      minus its own rounding), but the two pads share ONE net deliberately:
      hole_to_hole is a manufacturing/mechanical constraint independent of
      electrical connectivity, so pairing same-net pads lets their copper
      overlap (legal, same net) without also tripping clearance/
      shorting_items -- isolating the hole-to-hole signal the way the
      clearance/courtyard classes above isolate theirs. Measured 2026-08-07:
      kicad-cli reports "Drilled hole too close to other hole (rule 'PTH
      hole to hole' min 0.4995 mm; actual 0.2000 mm)" naming "PTH pad 1
      [+170V_BUS] of C24" and "PTH pad 1 [+170V_BUS] of C2" on the mutated
      board, and nothing names that pair on the clean board.
  missing-courtyard:
    mutation: missing-courtyard
    seed: 7
    params:
      ref: R1
    owning_gates: [kicad-drc]
    failure_signal: gate-names-defect
    note: >-
      Missing-courtyard class (STRATEGY.md build order step 4, 2026-08-07).
      R1 (THT resistor, `allowMissingCourtyard: False`; ONE F.CrtYd FpRect
      graphic item on the clean board) has that item deleted outright --
      not moved, not compressed, DELETED -- via
      board_defect_mutator.mutate_missing_courtyard.
      board_defect_mutator.courtyard_item_count independently re-parses the
      mutated file and confirms 0 F.CrtYd/B.CrtYd items remain on R1 (1 on
      the clean board), proving the injector itself works, before the DRC
      gate is ever asked anything (METHODOLOGY.md Sec. 5, injector
      self-verification).
    uncovered_finding: >-
      RESOLVED 2026-08-13 -- kept for history, see the addendum below for
      current status. Originally (2026-08-07 through 2026-08-13):
      DELIBERATE EXCEPTION: this class's owning gate did NOT fire, and was
      reported as an honest gap rather than weakened or dropped
      (METHODOLOGY.md Sec. 5, "if a gate turns out not to catch its own
      defect class, that is a finding -- report it, do not weaken the
      class"). Two independent, separately verified causes were documented,
      EITHER one of which alone was already sufficient to hide this class
      from every DRC-based gate in this repo (docs/evidence/
      2026-08-07-missing-courtyard-and-hole-to-hole-classes.md has the full
      before/after JSON):
        (1) kicad-cli's compiled-in default severity for the
            `missing_courtyard` rule is `ignore` when no `.kicad_pro`
            accompanies the board file -- true of every mutated board copy
            this corpus (and `run_drc()` generally) ever measures, since
            they live in a scratch workdir next to nothing but a
            regenerated `.kicad_dru`. Measured directly: even
            `kicad-cli pcb drc --severity-all` on a board with R1's
            courtyard genuinely deleted reports 0 `missing_courtyard`
            violations without a project file present.
        (2) `temper_placer.validation._drc_api.run_drc` -- the corpus's
            canonical measurement path, used unmodified so every class
            measures identically -- never passes `--severity-warning` or
            `--severity-all` to kicad-cli, and `missing_courtyard` is a
            `warning`-severity rule in `pcb/temper.kicad_pro`. Measured
            directly: copying `temper.kicad_pro` beside the mutated board
            makes kicad-cli CHECK the rule, but its JSON output still omits
            `missing_courtyard` entries unless `--severity-all` is ALSO
            passed; with BOTH the project file AND `--severity-all`
            present, it correctly reports "Footprint has no courtyard
            defined" naming R1 (plus the 5 pre-existing real instances:
            F1, L2, R30, RT1, U27).
      Neither fix was applied to `_drc_api.py`/`run_drc()` here: that
      function is the canonical path for `drc_ceiling.json`'s own ratchet
      (`ci_check_drc.py`/`DrcRatchet`) and every other DRC-based gate in
      this repo, not just this corpus, and changing its severity flags
      would surface many new categories across the whole DRC-ceiling
      contract -- a real, separate, much larger re-baselining task, out of
      this task's scope (and `power_pcb_dataset/drc_ceiling.json` is
      explicitly not to be touched by this work). Reported here, not
      silently special-cased to pass.
      ADDENDUM 2026-08-13: cause (1) was a bug in THIS corpus's own
      `measure_drc()`, not an inherent kicad-cli limitation --
      `check_board_defect_corpus.run_corpus()` copied the committed board
      to a scratch workdir (`copy_board`/`apply_mutation`) but never gave
      the copy a sibling `.kicad_pro`, so its own DRC measurements were
      themselves running context-blind in exactly the way
      `_drc_api.DrcProjectContextError` (added 2026-08-08, one day after
      this note) warns every caller about. Fixed by calling
      `temper_placer.validation._drc_api.copy_kicad_project_sidecar()` on
      both the clean copy and every mutated copy before measuring. With
      that fix alone (no change to `run_drc()`'s flags, `--severity-all`
      still not passed), `missing_courtyard` now fires correctly --
      empirically, cause (2) does not independently gate the outcome the
      way it was measured to on 2026-08-07 (kicad-cli's JSON default
      apparently does surface a `warning`-severity rule that the project's
      `rule_severities` explicitly sets, once a project is present at
      all; not re-investigated further since the class is covered either
      way). This class is REMOVED from the corpus's set of deliberately
      uncovered classes; see `clearance`'s `uncovered_finding` note below
      for the gap the same fix exposed in its place.
