# Shared build cache.
#
# Every worktree checks out its own copy of this file, so the relative
# `target-dir` below gives each one a private cache. Sharing comes from
# CARGO_TARGET_DIR, set by the `cargo` wrapper that
# scripts/install_cargo_target_dir_guard.py installs at ~/.local/bin/cargo.
# The wrapper derives the main checkout's target-shared path from
# `git rev-parse --git-common-dir`, so every worktree builds into one cache.
# That module's docstring records the 36-74 GB disk incidents behind this.
#
# Hazard: artifacts are shared across worktrees. After a build in another
# worktree, `cargo run` or a library crate can be stale for yours. Touch the
# src/lib.rs of every crate you changed before comparing runs across worktrees.
#
# macOS pyo3 linking (zapote/packages/zapote-bridge): a pyo3 cdylib built with
# `extension-module` deliberately leaves CPython symbols unresolved for the
# loading interpreter. Apple's linker rejects that unless told
# `-undefined dynamic_lookup`, and without it `maturin` builds fail with
# "symbol(s) not found". `cargo build`/`cargo test` are unaffected.

[build]
target-dir = "target-shared"

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]
