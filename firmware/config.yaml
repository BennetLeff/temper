    value: 45722
    c_type: uint16_t
    units: "register word"
    doc: "300Ω PT100 open threshold for 430Ω RREF; 15-bit ADC code shifted left one"
    board_derivation: true  # re-derived from the board's r_ref by scripts/check_firmware_board_contract.py (registry: firmware/tools/board_derivations.yaml)

  - c_symbol: PAN_DEBOUNCE_COUNT
    field: pan_debounce_count
    value: 10
    c_type: uint16_t
    env_var: PAN_DEBOUNCE_COUNT
    doc: "Pan detection debounce samples"

  - c_symbol: PAN_CONFIDENCE_REQUIRED
