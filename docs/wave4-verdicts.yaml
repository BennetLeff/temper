  - pattern: packages/temper-placer/src/temper_placer/__init__.py
    verdict: JUSTIFIED-KEEP
    blocker: &distribution-root >-
      Python distribution root. The package is built by hatchling
      (`pyproject.toml` build-backend, not maturin) and ships two console
      entry points (`temper-placer`, `temper` -> `temper_placer.cli:main`),
      both resolved by Python packaging machinery that requires an importable
      Python package root to exist. A pyo3 extension is imported BY this root,
      it cannot replace it under the current build backend. Re-decidable if
      the distribution moves to maturin and ships `temper_placer` as a native
      extension module -- that is a packaging decision, not a migration, and
      it would delete these files rather than port them.
  - pattern: packages/temper-placer/src/temper_placer/__main__.py
    verdict: JUSTIFIED-KEEP
    blocker: *distribution-root
  - pattern: packages/temper-placer/src/temper_placer/_version.py
    verdict: JUSTIFIED-KEEP
    blocker: *distribution-root
  - pattern: packages/temper-placer/src/temper_placer/protocol.py
    verdict: JUSTIFIED-KEEP
    blocker: >-
      Already decided under R3 in the plan's Phase-2 residual pass (recorded
      2026-08-03): a `@runtime_checkable` structural-typing Protocol is a
      typing construct with no pyclass mapping, `Contract` holds
      `dict[str, type]` of live Python type objects for isinstance schema
      validation, and `ContractViolation` is an exception; written
      cost-benefit -- the full R1 migration battery against 141 LOC and 7
      consumers is net-negative. This entry records that existing verdict
      against the file, it does not re-decide it.
  - pattern: packages/temper-placer/src/temper_placer/runner.py
    verdict: MIGRATE
    phase: 5
    note: >-
      PipelineRunner + data-flow validation + resolve_and_run. The plan's
      Phase-2 residual pass explicitly routes this here ("orchestration seam
      (PipelineRunner, adapters, strategy_registry) -> Phase 5").
  - pattern: packages/temper-placer/src/temper_placer/strategy_registry.py
    verdict: JUSTIFIED-KEEP
    blocker: >-
      Registry-surface independence (D6), decided 2026-08-06 on
      feat/wave4-phase4-strategy-registry-rust. The module is a pure
      import-time registry: two module-level dicts (`_registry`,
      `_composites`) of Python callables and five functions whose every
      operation is a dict membership/insert with Python semantics
      (idempotent register, KeyError raise, the `f"{p}/{n}"` key assembly)
      or a call-back into the stored factory (`_registry[key]()`). Stored
      values are `Callable[[], PipelineStage]` -- live Python callables, and
      `PipelineStage` is a `@runtime_checkable` Protocol with no pyclass
      mapping (the protocol.py R3 record); a Rust implementation would hold
      untyped PyObjects and call back across pyo3 for every instantiation --
      pure marshalling, zero compute gained. The registry is the shared
      import-time seam between the Phase-5 adapters (register_strategies.py
      registers factories as a module-import side effect; the stage
      adapters use register/register_composite) and runner.py
      (get_composite/get in resolve_and_run). Migrating it would make that
      seam -- and therefore both sides of it -- import the pyo3 boundary it
      exists to decouple; the R1 battery has nothing to pin (no kernel, no
      arithmetic, no transformation beyond Python dict/string semantics).
      Recorded alongside the orchestration VERIFICATION.md R3-style record
      for this file; re-decidable if a consumer migrates and carries the
      registry with it. Supersedes the file's prior MIGRATE phase-5 note
      ("same Phase-5 orchestration seam as runner.py"), which misread a
      registry as a migration target; the runner.py MIGRATE verdict is
      unaffected.

