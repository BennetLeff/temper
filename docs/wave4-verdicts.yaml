      DONE 2026-08-06 -- the non-cp_sat compute migrated to
      temper-io-types/placer_core (placer_compute.rs): adjustment.py
      (adjust_for_congestion push loop), deterministic.py
      (place_power_stage_template / place_by_proximity / place_in_zone_center)
      and template.py (ComponentTemplate.apply / ParametricTemplate.apply) are
      delegation shims; the pre-migration implementations are pinned verbatim
      in tests/placer/_placer_*_py_oracle.py and the R1a-R1h records live in
      packages/temper-io-types/VERIFICATION.md. The placer/__init__.py
      package root stays Python (import surface), matching the distribution-root
      keep. cp_sat/ remains covered by its own JUSTIFIED-KEEP entry above.

  - pattern: packages/temper-placer/src/temper_placer/constraints/**
    verdict: MIGRATE
    phase: 4
    note: >-
      Constraint builder/compiler/reporter. temper-constraint-compiler is the
      Rust seed. Not named in the plan's phase table -- surfaced by the R7
      coverage check, which is what that check is for.
  - pattern: packages/temper-placer/src/temper_placer/extraction/**
    verdict: MIGRATE
    phase: 4
