# ===========================================================================
# Python-removal verdict axis (R1)
# ===========================================================================
#
# R7 above answers "should this compute move to Rust?" The goal-set has since
# widened to R1: "remove Python entirely" -- a different question. Under R7,
# most of what follows was NEVER-PORT / JUSTIFIED-KEEP ("no reason to touch
# it"); under R1 the same code mostly has to move anyway, just not by a
# line-by-line port. The re-triage that answers R1
# (docs/plans/2026-08-06-001-docs-python-removal-retriage-plan.md, backed by
# docs/evidence/2026-08-06-never-port-triage.md and
# tools/measurements/retriage_python_removal.py's ROWS table) uses a
# different taxonomy:
#
#   BLOCKER-ORTOOLS -- bound to the OR-Tools Python API. Not portable by
#                      rewriting; needs an FFI to the C++ library, an
#                      out-of-process solver, or a different solver entirely.
#   BLOCKER-SCIPY   -- bound to scipy.ndimage.distance_transform_edt.
#                      Portable in principle (EDT is a known algorithm) but a
#                      real numeric port with an oracle, not glue.
#   PORT            -- must move. Mechanical orchestration/glue, no
#                      third-party blocker, no design question. This is the
#                      re-triage's default/unmarked case -- most of the old
#                      NEVER-PORT tree lands here, because "no reason to
#                      touch it" was itself a Rust-only-compute-question
#                      artifact.
#   REPLACE         -- reimplemented natively rather than translated
#                      line-by-line (clap for the CLI, direct HTML/Plotly-JSON
#                      emission for the visualizer).
#   DELETE          -- disappears with the interpreter: re-export shims,
#                      dict-marshalling at the Rust boundary, dead code.
#   OUT-OF-RUNTIME  -- dev/CI tooling, not shipped runtime. In scope only
#                      under "no Python in the repo", not "no Python at
#                      runtime" -- the re-triage's own open question, left
#                      open here too (recorded, not resolved, per file below).
#   UNDECIDED       -- no removal verdict recorded yet, same discipline as
#                      the R7 UNDECIDED state: an honest backlog entry, not a
#                      guess dressed up as a decision.
#
# WHY A SECOND LIST, NOT A SECOND FIELD ON `surfaces:` ABOVE:
# The two taxonomies cut the tree at different granularities. `router_v6/**`
# is a single R7 MIGRATE entry, but under R1 its clusters land in multiple
# different removal categories (mostly PORT, plus a REPLACE-shaped
# reporting/CLI/diagnostics cluster; two files were BLOCKER-SCIPY until that
# blocker was resolved 2026-08-07 -- see the scipy-EDT section below).
# Recording `removal_verdict:` on the R7 entries directly would force one of two bad
# choices: fragment the R7 `surfaces:` entries to match R1 cluster
# boundaries (rewriting entries that are already correct, settled answers to
# the R7 question -- exactly what "correct forward, don't rewrite" forbids),
# or coarsen the R1 verdict to the R7 grain (hiding the OR-Tools/scipy
# blockers inside a MIGRATE-shaped bucket, which is the kind of decorative
# 100% this ledger exists to prevent). A second list, checked against the
# same `roots:` and the same file inventory by
# scripts/check_verdict_coverage.py, keeps both axes honest independently: a
# file can carry an R7 verdict, an R1 verdict, both, or (correctly) neither
# yet, and neither axis's coverage number can hide behind the other's.
#
# SCOPE, TRANSCRIBED HONESTLY:
# The re-triage's own scope was `packages/temper-placer/src/temper_placer/`
# and `packages/temper-workflow/src/temper_workflow/` -- specifically the
# "no direct import of a Rust extension module" residual (370 files /
# 82,310 LOC at the triage's 2026-08-06 baseline, commit d5f459314). It never
# scored `scripts/`, `benchmarks/`, or `packages/temper-placer/tests/` at
# all, and it never scored the files in temper_placer/temper_workflow that
# already import a Rust extension directly (those are R7-MIGRATE-complete,
# but under R1 the *calling* Python file is still Python and still needs its
# own disposition -- e.g. "invert the boundary" per the re-triage's own
# sequencing section -- which this document does not decide). Both of those
# gaps are real UNDECIDED backlog, not oversights in this transcription: they
# surface below as files that match no `removal_surfaces:` entry, which
# scripts/check_verdict_coverage.py reports as a FAIL, exactly like an
# unmatched file does on the R7 axis.
#
# DRIFT SINCE THE RE-TRIAGE'S BASELINE:
# One day and several merged PRs separate this transcription from the
# re-triage's commit (current HEAD is a descendant of d5f459314). Per-cluster
# LOC below mostly lands within single-digit percent of the doc's stated
# figures (spot-checked file by file, not just at the cluster total) -- close
# enough to be the same code, drifted normally. A few clusters drifted more
# than that or lost/gained files outright; those are called out inline where
# they occur, and the true current LOC is whatever
# scripts/check_verdict_coverage.py measures live, not the doc's snapshot
# figure. Three concrete cases where the doc's named files could not be
# confidently matched to the current tree at all (not just LOC drift, but
# missing/renamed files) are recorded as explicit UNDECIDED entries below
# rather than silently folded into a PORT bucket: `router_v6/zone_emission.py`
# (a directly-verified GEOS blocker per the doc's own correction, not the
# clean PORT its parenthetical cluster listing implies), the two SPLIT/UNKNOWN
# router_v6 files the doc says neither of its two independent passes
# resolved, and `temper_workflow/`'s named files, three of which no longer
