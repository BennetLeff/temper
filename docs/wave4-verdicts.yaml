  # NOTE (2026-08-06, close-out audit -> recommendation recorded, NOT decided):
  # the MIGRATE entry above conflicts with a merged record. Both sides are
  # recorded here so the product authority can decide; the verdict is NOT
  # flipped.
  #   - Measured-keep side (PR #719, merged 2026-08-06 -- "Phase 2 verdict:
  #     _constraint_types is not a pyo3-pyclass candidate (measured)";
  #     evidence docs/evidence/2026-08-04-wave4-phase2-constraint-types-
  #     verdict.md): the surface is declarative pydantic schema, not compute --
