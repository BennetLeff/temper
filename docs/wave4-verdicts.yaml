      max(0, ...)/min(..., +1) -- plus direct numpy writes on
      grid._trace_net_ids). The truncation-vs-floor choice is the
      PRE-EXISTING code, unchanged by this PR: _grid_stage.py is kept as
      Python, so its "oracle" is the same source and the int() truncation
