    verdict: PORT
    note: >-
      _edt_from_obstacle_mask's scipy.ndimage.distance_transform_edt call
      (previously BLOCKER-SCIPY -- see the section note above) is resolved by
      the exact-Rust-EDT spike (docs/evidence/2026-08-07-exact-edt-rust-spike.md,
      commit 0b7c850c): bit-exact vs scipy on every reachable input, this
      call site's exact form (no sampling/return_indices). Migration itself
      is unstarted -- this file still calls scipy today. 477 LOC. Also
      imports scipy.ndimage.label (check_routability_cc) for connected-
      component labeling, a different scipy function the spike explicitly
