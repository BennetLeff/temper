    verdict: MIGRATE
    phase: 2
    note: >-
      Contract layer. board, netlist, loop, design_rules, priority, net_types
      are named in the Phase 2 scope; the rest of core/ moves with them because
      every call site touches these objects together.
  # NOTE (2026-08-05): verdict in conflict -- decision owed to the product
  # authority; this entry is deliberately left AS-IS (MIGRATE phase 2) pending
  # that decision. The two recorded sources disagree on the same tree:
  #   - This ledger (with the plan's Phase 2, recorded 2026-08-01): pcl/**
  #     MIGRATE phase 2 -- "PCL constraints are contract objects;
  #     temper-pcl-ir is the Rust seed."
  #   - The 2026-08-03 migration-program handoff (docs/handoffs/2026-08-03-
  #     wave4-migration-program.md, PR #622, recorded in the plan's Phase 2
  #     section): pcl/constraints.py JUSTIFIED-KEEP'd with a concrete blocker
  #     -- the ortools-encoder entanglement -- alongside routing_results.py
  #     (9 unmigrated router_v6 types) and protocol.py (structural-typing
  #     Protocols), which are recorded against their own files.
  # Open decision: whether constraints.py keeps (the encoder entanglement
  # holds: its constraint encoders build ortools model primitives that the
  # Phase-1 KEEP pins to Python) or migrates with the rest of the pcl/ tree
  # (contract objects, temper-pcl-ir seed). The ledger must name exactly one
  # verdict per file; this conflict means the coverage check cannot yet be
  # trusted to adjudicate pcl/constraints.py either way.
  # NOTE (2026-08-05, product authority): the 2026-08-03 handoff recorded a
  # JUSTIFIED-KEEP for pcl/constraints.py (ortools-encoder entanglement). The
  # authority's always-migrate stance overturns that record: MIGRATE stands.
  # The ortools calls themselves stay Python-side per the Phase-1 KEEP (R4),
  # argued in-source; the constraint objects/parser/registry migrate.
  - pattern: packages/temper-placer/src/temper_placer/pcl/**
    verdict: MIGRATE
    phase: 2
    note: PCL constraints are contract objects; temper-pcl-ir is the Rust seed.
  - pattern: packages/temper-placer/src/temper_placer/_constraint_types/**
    verdict: JUSTIFIED-KEEP
    phase: 2
    blocker: >-
      config_loader.rs (already Rust) calls PlacementConstraints.model_validate
      back into Python as "final authority, never reimplemented in Rust" -- a
      pyclass migration breaks the exception type + validation semantics, and
      the gen_config_reference CI gate reads model_fields. No compute to port
      (34 models / 5 methods / one float expression; value types already
      pyclasses, compute already Rust).
    note: >-
      RESOLVED 2026-08-11 (R7 axis conflict closed, product authority):
      justified-keep with evidence -- docs/evidence/2026-08-11-r7-constraint-types-resolution.md.
      The "generated stubs" framing was factually wrong (hand-written pydantic
      BaseModel, no generator exists). Not ortools-coupled. See `blocker:`
      above for the real, measured blocker.
  # NOTE (2026-08-06, close-out audit -> recommendation recorded, NOT decided):
  # the MIGRATE entry above conflicts with a merged record. Both sides are
  # recorded here so the product authority can decide; the verdict is NOT
  # flipped.
  #   - Measured-keep side (PR #719, merged 2026-08-06 -- "Phase 2 verdict:
  #     _constraint_types is not a pyo3-pyclass candidate (measured)";
  #     evidence docs/evidence/2026-08-04-wave4-phase2-constraint-types-
  #     verdict.md): the surface is declarative pydantic schema, not compute --
  #     34 BaseModel subclasses, exactly 5 methods (~58 LOC of bodies), no
  #     numpy / no accumulation / one float expression. Five load-bearing
  #     pydantic behaviours break under a #[pyclass]: model_fields (the input
  #     to the gen_config_reference CI gate), model_validate + ValidationError
  #     at the sole YAML entry point (io/config_loader.py), model_dump, and
  #     field constraints / extra="forbid" / frozen=True. Measured reads are
  #     ~10-21x slower in Rust; three of the five methods have no production
  #     call sites. #719 deliberately did NOT edit this ledger and calls the
  #     document "the measured input for revising it". D6 admits a
  #     JUSTIFIED-KEEP on a measured blocker -- this is the ledger's own
  #     "measured verdict" branch of the JUSTIFIED-KEEP definition.
  #   - Always-migrate side (product authority, recorded 2026-08-05 in this
  #     file -- the pcl/** and router_v6 routing_results notes): the
  #     authority's always-migrate stance overturns JUSTIFIED-KEEP records
  #     (the ortools calls themselves stay Python-side per the Phase-1 KEEP,
  #     argued in-source; the contract objects/parser/registry migrate). Under
  #     that stance the MIGRATE phase-2 verdict stands until re-decided.
  #   - Open decision (product authority): whether the measured #719 blocker
  #     re-scopes _constraint_types to JUSTIFIED-KEEP (measured-verdict
  #     branch) or the always-migrate stance keeps MIGRATE standing. The
  #     ledger must name exactly one verdict per file; until this is decided
  #     the coverage check cannot be trusted to adjudicate _constraint_types
  #     either way. The recommendation is deliberately not made here. Full
  #     reasoning in docs/evidence/2026-08-06-wave4-owned-surface-closeout.md
  #     (Sec 1, Sec 4, Sec 6).

