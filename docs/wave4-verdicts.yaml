  # ---- scipy EDT: BLOCKER RESOLVED 2026-08-07, now PORT ----------------------
  # Source: evidence doc Sec 2.1 (router_v6/ table) and Sec 5.2 (KTD8
  # consumer-list gap) originally recorded these two files BLOCKER-SCIPY --
  # bound to scipy.ndimage.distance_transform_edt, with the `edt` Rust crate
  # measured and rejected (max diff 2.0-2.236, an approximate algorithm).
  #
  # That blocker no longer holds. docs/evidence/2026-08-07-exact-edt-rust-
  # spike.md (commit 0b7c850c, packages/temper-geometry/src/edt.rs) implements
  # the exact Felzenszwalb-Huttenlocher separable EDT in Rust and measures it
  # bit-exact against scipy.ndimage.distance_transform_edt: 0.0 max abs diff,
  # 0 differing cells across 7,435,980 cells (23 curated cases + 300 random
  # trials), 1.6-1.7x faster than scipy including the Python<->Rust FFI
  # boundary, at real production grid sizes (up to 5.3M cells). The one
  # divergence found is scipy's own undocumented behavior on an all-foreground
  # mask (no background cell anywhere) -- unreachable by all three consumers
  # by construction, per the evidence doc Sec 3's read of each call site
  # (channel_widths.py:171, _astar_heuristics.py:103, routability_check.py:397
  # -- all three call the plain scalar form, no `sampling`, no
  # `return_indices`, which is exactly what the spike implements).
  #
  # Precision matters here (the spike brief's own words): the blocking
  # *question* is answered, the *work* is not. Per the spike's own scope, the
  # three consumer call sites are deliberately untouched -- "no migration
  # happened here." That is exactly the re-triage taxonomy's PORT definition
  # applied to the specific case the taxonomy's own scipy-EDT row already
  # anticipated: "EDT is a known algorithm with a clear Rust implementation
  # path. It is a real numeric port with an oracle, not glue, so it belongs
  # in the PORT stream with a differential rather than in a spike" (re-triage
  # plan, "The critical path is OR-Tools" section). No new removal-taxonomy
  # value is needed; PORT with this note carries the full history. This
  # leaves OR-Tools (3,599 LOC, six BLOCKER-ORTOOLS entries above) as the
  # sole remaining genuine R1 blocker -- BLOCKER-SCIPY no longer has any
  # members in this ledger.
  - paths:
