  # ---- Phase 1 gated: the solver boundary ---------------------------------
  # Decided 2026-08-04; evidence docs/evidence/2026-08-04-wave4-residual-verdicts.md
  # The plan's Phase-1 dependency rationale splits this tree: the ortools
  # model/solve wiring is the gated boundary, "the remaining placer compute
