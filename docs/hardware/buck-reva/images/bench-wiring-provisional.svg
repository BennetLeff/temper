<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" font-family="sans-serif">
<rect x="0" y="0" width="640" height="48" fill="#a00"/>
<text x="320" y="30" fill="#fff" font-size="18" text-anchor="middle" font-weight="bold">PROVISIONAL — verify against frozen assembly drawing before use</text>
<!-- supply -->
<rect x="30" y="120" width="130" height="120" fill="#eef" stroke="#333"/>
<text x="95" y="145" font-size="13" text-anchor="middle" font-weight="bold">DC supply</text>
<text x="95" y="163" font-size="11" text-anchor="middle">isolated, 13.5-16.5 V</text>
<text x="95" y="179" font-size="11" text-anchor="middle">current-limited</text>
<circle cx="150" cy="200" r="5" fill="#c00"/><text x="160" y="204" font-size="11">+ to J1.1</text>
<circle cx="150" cy="222" r="5" fill="#000"/><text x="160" y="226" font-size="11">- to J1.2</text>
<!-- board -->
<rect x="250" y="120" width="140" height="120" fill="#efe" stroke="#333" stroke-width="2"/>
<text x="320" y="145" font-size="13" text-anchor="middle" font-weight="bold">Buck Rev A</text>
<text x="320" y="163" font-size="11" text-anchor="middle">J1.1 VIN / J1.2 GND</text>
<text x="320" y="179" font-size="11" text-anchor="middle">J2.1 3V3 / J2.2 GND</text>
<text x="320" y="197" font-size="11" text-anchor="middle">TP1/TP2 VIN</text>
<text x="320" y="213" font-size="11" text-anchor="middle">TP3/TP4 VOUT</text>
<!-- load -->
<rect x="480" y="120" width="130" height="120" fill="#fee" stroke="#333"/>
<text x="545" y="145" font-size="13" text-anchor="middle" font-weight="bold">E-load (CC)</text>
<text x="545" y="163" font-size="11" text-anchor="middle">+ from J2.1</text>
<text x="545" y="179" font-size="11" text-anchor="middle">- from J2.2</text>
<text x="545" y="197" font-size="11" text-anchor="middle">verify I slew/plateau</text>
<!-- wires -->
<line x1="160" y1="200" x2="250" y2="160" stroke="#c00" stroke-width="2"/>
<line x1="160" y1="222" x2="250" y2="200" stroke="#000" stroke-width="2"/>
<line x1="390" y1="160" x2="480" y2="170" stroke="#c00" stroke-width="2"/>
<line x1="390" y1="200" x2="480" y2="200" stroke="#000" stroke-width="2"/>
<!-- scope -->
<rect x="250" y="270" width="140" height="80" fill="#ffe" stroke="#333"/>
<text x="320" y="295" font-size="13" text-anchor="middle" font-weight="bold">Scope + DMM</text>
<text x="320" y="313" font-size="11" text-anchor="middle">short-return ripple probe</text>
<text x="320" y="329" font-size="11" text-anchor="middle">clips only on verified GND</text>
<text x="320" y="372" font-size="12" text-anchor="middle">Sense VIN/VOUT at board terminals. Check earth connections before probing.</text>
</svg>
