[package]
name = "pumpkin-engine"
version = "0.1.0"
edition = "2021"
description = "Standalone pumpkin-solver binary implementing the BLOCKER-ORTOOLS equivalence harness's Engine protocol (docs/evidence/2026-08-07-cpsat-equivalence-harness.py). Reads a PlacementModel spec as JSON on stdin, emits a solve outcome as JSON on stdout. Not part of any package/ or crates/ workspace member -- standalone by design, see docs/evidence/2026-08-07-pumpkin-engine-differential.md."
publish = false

[[bin]]
name = "pumpkin_engine"
path = "src/main.rs"

[dependencies]
pumpkin-solver = "0.5.0"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
