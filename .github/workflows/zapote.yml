name: zapote
# Zapote's Rust validation suite. KiCad-backed native tests are #[ignore]d in
# the main run and run afterwards against the pinned KiCad 10.0.4
# (zapote/tools/install_kicad_ci.sh); see zapote/CHECKS.md.
on:
  pull_request:
    paths: ["zapote/**", ".github/workflows/zapote.yml", "pyproject.toml", "uv.lock"]
  push:
    branches: [main]
    paths: ["zapote/**", ".github/workflows/zapote.yml", "pyproject.toml", "uv.lock"]
# Cancel superseded PR runs only; every push to main keeps its own verdict.
# No cargo cache: the job takes ~3 min (measured 2026-10-08) and CI is
# capacity-bound, so a ~1 GB release target dir in the shared 10 GB cache
# would cost more (evicting venv caches) than it saves.
concurrency:
  group: zapote-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  rust:
    name: zapote / rust
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Tree budget
        run: |
          python3 zapote/tools/test_evidence_archive.py
          python3 zapote/tools/evidence_archive.py check
      - name: Python tool tests (generators, stale-extension gate, campaign dispatch, fault loop)
        run: |
          python3 -m pip install --quiet pytest kiutils
          python3 -m pytest -q zapote/tools/generators/tests zapote/tools/test_check_campaign_dispatch.py zapote/tools/test_check_fault_loop.py
      - name: Rust tests
        working-directory: zapote
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/zapote-target
        run: cargo test --release --locked --workspace
      - name: Pinned KiCad 10.0.4 for the live native tests
        run: zapote/tools/install_kicad_ci.sh
      - name: Live KiCad tests (fab pass, board check, unit runner, native layout)
        working-directory: zapote
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/zapote-target
        run: cargo test --release --locked --workspace -- --ignored
      - name: Build and import zapote_bridge (what zapote's unit tools load)
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/zapote-target
        run: |
          python3 -m pip install --quiet maturin
          python3 -m maturin build --release --manifest-path zapote/packages/zapote-bridge/Cargo.toml --out "$RUNNER_TEMP/wheels"
          python3 -m pip install --quiet "$RUNNER_TEMP"/wheels/zapote_bridge-*.whl
          python3 -c "import zapote_bridge as b; names = ('candidate_convert_bridge', 'candidate_validate_pin_map', 'candidate_check_freshness', 'candidate_check_net_admission'); assert all(hasattr(b, n) for n in names), names; print('zapote_bridge OK')"
