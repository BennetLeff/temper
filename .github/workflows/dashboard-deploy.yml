name: Dashboard Deploy

concurrency:
  group: dashboard-pages
  cancel-in-progress: true

on:
  # no-pr-trigger: dashboard deployment, post-merge only
  push:
    branches: [main]
    paths:
      - '.github/required-checks.json'
      - '.github/workflows/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - 'components/**'
      - 'crates/**'
      - 'dashboard/**'
      - 'docs/hardware/**'
      - 'elec/**'
      - 'firmware/**'
      - 'packages/**'
      - 'pcb/**'
      - 'power_pcb_dataset/**'
      - 'scripts/**'

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Build and validate architecture atlas
        run: >-
          node dashboard/architecture/validate.mjs
          --write-build-info dashboard/architecture/build-info.js
          --commit "$GITHUB_SHA"
          --ref main

      - name: Copy JSONL into dashboard
        run: |
          if [ -f power_pcb_dataset/metrics/pipeline_metrics.jsonl ]; then
            cp power_pcb_dataset/metrics/pipeline_metrics.jsonl dashboard/
          else
            echo '{"schema_version":1,"timestamp":"","git_commit":"","board":"","stage":"","module":"","metrics":{}}' > dashboard/pipeline_metrics.jsonl
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dashboard
          publish_branch: gh-pages
          commit_message: 'chore(dashboard): deploy ${{ github.sha }}'
