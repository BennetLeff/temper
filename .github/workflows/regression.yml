name: Regression Suite

# Grouped per commit so a push cannot cancel the previous commit's run.
# See the rationale block in python-tests.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main, feat/**]
    paths:
      - 'packages/temper-placer/**'
      - 'packages/temper-drc-rs/**'
      - 'power_pcb_dataset/**'
      - 'pcb/**'
      - 'scripts/ci_closure_test.py'
      - 'scripts/ci_check_drc.py'
      - 'scripts/ci_regression.sh'
      - 'scripts/check_regression.py'
      - 'scripts/quarantine_report.py'
      - '.github/workflows/regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/temper-placer/**'
      - 'packages/temper-drc-rs/**'
      - 'power_pcb_dataset/**'
      - 'pcb/**'
      - 'scripts/ci_closure_test.py'
      - 'scripts/ci_check_drc.py'
      - 'scripts/ci_regression.sh'
      - 'scripts/check_regression.py'
      - 'scripts/quarantine_report.py'
      - '.github/workflows/regression.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bennetleff/temper-ci:latest
      options: --user root
    timeout-minutes: 30
    strategy:
      fail-fast: false
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache virtualenv
        uses: actions/cache@v6
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: Create virtualenv (cache miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: uv venv

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Cache netlist
        id: cache-netlist
        uses: actions/cache@v6
        with:
          path: elec/build
          key: netlist-${{ hashFiles('elec/src/**', 'elec/ato.yaml', 'Makefile') }}

      - name: Build electronics netlist
        if: steps.cache-netlist.outputs.cache-hit != 'true'
        run: make netlist

      # The placer/validation tests exercise the Rust-backed migrations
      # (temper-geometry, temper-thermal, temper-rust-router,
      # temper-constraints) — the venv cache key only tracks uv.lock, so a
      # restored cache carries stale (or absent) compiled extensions. Build
      # them explicitly on every run.
      - name: Build and install Rust extensions
        run: |
          for crate in \
            packages/temper-geometry \
            packages/temper-thermal \
            packages/temper-rust-router; do
            uv run maturin develop --release --manifest-path "$crate/Cargo.toml"
          done
          # temper-constraints is the one abi3 crate; without the
          # forward-compat env it fails to build against a newer CPython
          # than the pinned pyo3 knows about (same special-case as the
          # Makefile's `extensions` target).
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 \
            uv run maturin develop --release \
            --manifest-path packages/temper-placer/temper-constraints/Cargo.toml

      # RETIRED 2026-07-27: this step invoked the JAX/benders_loop placement
      # path, which was removed from the codebase. corpus_runner.py:416-419
      # now raises NotImplementedError("JAX optimizer removed."), so every
      # board failed at setup. It was masked as "JAX nondeterministic on CI
      # runners" -- a description of flakiness, not of a deleted capability.
      # Retired rather than left masked; see docs/evidence/ for the audit.

      - name: KiCad DRC truth gate
        run: uv run python scripts/ci_check_drc.py --backend kicad-cli

      - name: Round-Trip Integrity Tests
        working-directory: packages/temper-placer
        run: uv run pytest tests/test_round_trip_integrity.py -v --tb=short -m "slow or l4_regression" --timeout=600

      - name: Metamorphic Oracle Tests
        working-directory: packages/temper-placer
        run: uv run pytest tests/test_metamorphic_oracles.py -v --tb=short -m "slow or property" --timeout=600
        continue-on-error: true  # TODO: temper-NNN -- hard-fail after 2026-09-01

      - name: CP-SAT Placer Tests
        working-directory: packages/temper-placer
        run: uv run pytest tests/placer/cp_sat/ tests/metrics/test_external_oracle.py tests/cli/test_cp_sat_flag.py -v --tb=short --ignore=tests/placer/cp_sat/test_zone_pour_production_measurement.py

      - name: Zone/Pour Production Measurement
        working-directory: packages/temper-placer
        run: uv run pytest tests/placer/cp_sat/test_zone_pour_production_measurement.py -v --tb=short -rs -s

      - name: Quarantine Report
        run: uv run python scripts/quarantine_report.py

      - name: Summary
        if: always()
        run: |
          echo "## Regression Suite Results" >> $GITHUB_STEP_SUMMARY
          echo "Regression suite, DRC ratchet, round-trip integrity, metamorphic oracles, zone-pour measurement, and quarantine report executed." >> $GITHUB_STEP_SUMMARY
