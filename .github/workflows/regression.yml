name: Regression Suite

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, feat/**]
    paths:
      - 'packages/temper-placer/**'
      - 'packages/temper-drc-rs/**'
      - 'power_pcb_dataset/**'
      - 'pcb/**'
      - 'scripts/ci_closure_test.py'
      - 'scripts/ci_check_drc.py'
      - 'scripts/ci_regression.sh'
      - 'scripts/check_regression.py'
      - 'scripts/quarantine_report.py'
      - '.github/workflows/regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/temper-placer/**'
      - 'packages/temper-drc-rs/**'
      - 'power_pcb_dataset/**'
      - 'pcb/**'
      - 'scripts/ci_closure_test.py'
      - 'scripts/ci_check_drc.py'
      - 'scripts/ci_regression.sh'
      - 'scripts/check_regression.py'
      - 'scripts/quarantine_report.py'
      - '.github/workflows/regression.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bennetleff/temper-ci:latest
      options: --user root
    timeout-minutes: 30
    strategy:
      fail-fast: false
    env:
      XLA_PYTHON_CLIENT_MEM_FRACTION: 0.35
      JAX_PLATFORM_NAME: cpu
      VIRTUAL_ENV: ${{ github.workspace }}/.venv

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache virtualenv
        uses: actions/cache@v6
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: Create virtualenv (cache miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: uv venv

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Cache netlist
        uses: actions/cache@v6
        with:
          path: elec/build
          key: netlist-${{ hashFiles('elec/src/**') }}

      - name: Build electronics netlist
        run: make netlist

      - name: Regression Suite
        run: uv run python -m temper_placer.regression.cli run-corpus --json
        continue-on-error: true  # JAX nondeterministic on CI runners; temper-N6-U8 -- hard-fail after 2026-09-01

      - name: KiCad DRC truth gate
        run: uv run python scripts/ci_check_drc.py --backend kicad-cli

      - name: Round-Trip Integrity Tests
        working-directory: packages/temper-placer
        run: uv run pytest tests/test_round_trip_integrity.py -v --tb=short -m "slow or l4_regression" --timeout=600
        continue-on-error: true  # TODO: temper-NNN -- hard-fail after 2026-09-01
        env:
          XLA_PYTHON_CLIENT_MEM_FRACTION: 0.25
          JAX_PLATFORM_NAME: cpu

      - name: Metamorphic Oracle Tests
        working-directory: packages/temper-placer
        run: uv run pytest tests/test_metamorphic_oracles.py -v --tb=short -m "slow or property" --timeout=600
        continue-on-error: true  # TODO: temper-NNN -- hard-fail after 2026-09-01
        env:
          XLA_PYTHON_CLIENT_MEM_FRACTION: 0.25
          JAX_PLATFORM_NAME: cpu

      - name: CP-SAT Placer Tests
        working-directory: packages/temper-placer
        run: uv run pytest tests/placer/cp_sat/ tests/metrics/test_external_oracle.py tests/cli/test_cp_sat_flag.py -v --tb=short --ignore=tests/placer/cp_sat/test_zone_pour_production_measurement.py
        env:
          XLA_PYTHON_CLIENT_MEM_FRACTION: 0.25
          JAX_PLATFORM_NAME: cpu

      - name: Zone/Pour Production Measurement
        working-directory: packages/temper-placer
        run: uv run pytest tests/placer/cp_sat/test_zone_pour_production_measurement.py -v --tb=short -rs -s
        env:
          XLA_PYTHON_CLIENT_MEM_FRACTION: 0.25
          JAX_PLATFORM_NAME: cpu

      - name: Quarantine Report
        run: uv run python scripts/quarantine_report.py
        continue-on-error: true  # TODO: temper-NNN -- hard-fail after 2026-09-01

      - name: Summary
        if: always()
        run: |
          echo "## Regression Suite Results" >> $GITHUB_STEP_SUMMARY
          echo "Regression suite, DRC ratchet, round-trip integrity, metamorphic oracles, zone-pour measurement, and quarantine report executed." >> $GITHUB_STEP_SUMMARY
