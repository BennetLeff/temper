name: Regression Suite

# Grouped per commit so a push cannot cancel the previous commit's run.
# See the rationale block in python-tests.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # PRs: cancel in progress -- a superseded PR run is worthless.
  # push (i.e. main): DO NOT cancel. A run already executing is main's
  # only verification; killing it mid-flight is how 6 of 8 consecutive
  # main runs ended up `cancelled` on 2026-08-06, with zero successes,
  # so `cargo test`/clippy results never landed during a merge burst.
  # Sharing one group by `github.ref` still prevents the 88-run pileup
  # the sha-keyed group allowed: later pushes queue, and GitHub keeps
  # only the newest PENDING run, so intermediate commits are still
  # superseded -- just not the one actually running.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  # On-demand only. `PRODUCTION_ROUTER_OUTPUT_*` in
  # tests/placer/cp_sat/test_regression_drc.py is a ratchet whose provenance
  # blocks record macOS arm64 measurements, while the gate is enforced in this
  # container -- and kicad-cli's geometric counts differ between the two (+107
  # on `total`, measured on one commit; see
  # docs/evidence/2026-08-04-router-output-rebaseline-interim.md). A re-baseline
  # therefore has to be measured here. This runs as a step inside the existing
  # `regression` job rather than as a new job, so it reuses that job's setup and
  # adds nothing to the per-push job count -- the concurrency ceiling is ~24
  # against ~40 requested per push.
  workflow_dispatch:
    inputs:
      measure_router_baseline:
        description: 'Measure router-output DRC constants in this container (N>=11)'
        type: boolean
        default: false
      drc_runs:
        description: 'DRC sample size'
        type: string
        default: '15'
  # `feat/**` was removed from this list on 2026-08-04. Every open PR is on a
  # feature branch, so `feat/**` made each push fire this workflow TWICE: once
  # for `pull_request` and once for `push`, on identical content. The push copy
  # is strictly worse than the PR copy:
  #   - it is not cancellable (`cancel-in-progress` is false for `push`, and the
  #     group key falls back to `github.sha`, so no run ever supersedes another
  #     -- every commit on the branch keeps its own 30-minute slot alive);
  #   - it is redundant. Both copies check out the same head SHA and run the
  #     same steps, so the push copy adds no information the PR copy lacks --
  #     it only duplicates the `regression` check run on the commit;
  #   - it is non-gating. "Regression Suite" is not in
  #     `.github/required-checks.json`'s `required_contexts`, so neither copy
  #     can block a merge.
  # Measured 2026-08-04 against the live queue: of 10 in-flight Regression Suite
  # runs, 8 were `push` events on `feat/**` branches (two branches had two
  # apiece), against an account ceiling of ~24 concurrent jobs. Dropping
  # `feat/**` returns those 8 slots and loses no signal -- the `pull_request`
  # trigger below still runs the suite on exactly the same commits.
  push:
    branches: [main]
    paths:
      - 'packages/temper-placer/**'
      - 'packages/temper-drc-rs/**'
      - 'power_pcb_dataset/**'
      - 'pcb/**'
      - 'scripts/ci_closure_test.py'
      - 'scripts/ci_check_drc.py'
      - 'scripts/ci_regression.sh'
      - 'scripts/check_regression.py'
      - 'scripts/quarantine_report.py'
      - '.github/workflows/regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/temper-placer/**'
      - 'packages/temper-drc-rs/**'
      - 'power_pcb_dataset/**'
      - 'pcb/**'
      - 'scripts/ci_closure_test.py'
      - 'scripts/ci_check_drc.py'
      - 'scripts/ci_regression.sh'
      - 'scripts/check_regression.py'
      - 'scripts/quarantine_report.py'
      - '.github/workflows/regression.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bennetleff/temper-ci:latest
      options: --user root
    timeout-minutes: 30
    strategy:
      fail-fast: false
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache virtualenv
        uses: actions/cache@v6
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: Create virtualenv (cache miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: uv venv

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Cache netlist
        id: cache-netlist
        uses: actions/cache@v6
        with:
          path: elec/build
          key: netlist-${{ hashFiles('elec/src/**', 'elec/ato.yaml', 'Makefile') }}

      - name: Build electronics netlist
        if: steps.cache-netlist.outputs.cache-hit != 'true'
        run: make netlist

      # The placer/validation tests exercise the Rust-backed migrations
      # (temper-geometry, temper-thermal, temper-rust-router, temper-drc-rs,
      # temper-constraints) — the venv cache key only tracks uv.lock, so a
      # restored cache carries stale (or absent) compiled extensions. Build
      # them explicitly on every run. temper-drc-rs is NOT a declared project
      # dependency and python-tests.yml's shared venv cache excludes it
      # (--no-install-package), so on a cold/evicted cache the ratchet and
      # closure gates would otherwise crash with `ImportError: No module
      # named 'temper_drc_rs'` instead of a clean gate FAIL.
      - name: Build and install Rust extensions
        run: |
          uv pip install maturin
          for crate in \
            packages/temper-geometry \
            packages/temper-thermal \
            packages/temper-rust-router \
            packages/temper-drc-rs; do
            uv run maturin develop --release --manifest-path "$crate/Cargo.toml"
          done
          # temper-constraints is the one abi3 crate; without the
          # forward-compat env it fails to build against a newer CPython
          # than the pinned pyo3 knows about (same special-case as the
          # Makefile's `extensions` target).
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 \
            uv run maturin develop --release \
            --manifest-path packages/temper-placer/temper-constraints/Cargo.toml

      # RETIRED 2026-07-27: this step invoked the JAX/benders_loop placement
      # path, which was removed from the codebase. corpus_runner._run_board
      # now returns the retired-optimizer error for every valid board (the
      # JAX optimizer and its stubs were removed in the cleanup C2 sweep), so
      # every board failed at setup. It was masked as "JAX nondeterministic on
      # CI runners" -- a description of flakiness, not of a deleted capability.
      # Retired rather than left masked; see docs/evidence/ for the audit.

      # Reports the router-output DRC constants as measured in THIS container,
      # which is where the gate is enforced. Asserts nothing and writes no
      # constants -- landing them is a human ratchet decision requiring a
      # provenance block, per AGENTS.md's same-PR re-measurement rule. Runs
      # before the test steps so a red gate does not prevent the measurement
      # that would explain it.
      - name: Measure router-output DRC baseline (on demand)
        if: ${{ inputs.measure_router_baseline }}
        run: |
          uv run python scripts/measure_router_output_baseline.py \
            --drc-runs "${{ inputs.drc_runs }}" \
            --route-runs 2 \
            --json-out router-output-baseline.json

      - name: Upload measured baseline
        if: ${{ inputs.measure_router_baseline }}
        uses: actions/upload-artifact@v7
        with:
          name: router-output-baseline
          path: router-output-baseline.json
          if-no-files-found: error

      - name: KiCad DRC truth gate
        run: uv run python scripts/ci_check_drc.py --backend kicad-cli

      - name: Round-Trip Integrity Tests
        working-directory: packages/temper-placer
        run: uv run pytest tests/test_round_trip_integrity.py -v --tb=short -m "slow or l4_regression" --timeout=600

      - name: Metamorphic Oracle Tests
        working-directory: packages/temper-placer
        run: uv run pytest tests/test_metamorphic_oracles.py -v --tb=short --timeout=600

      - name: CP-SAT Placer Tests
        working-directory: packages/temper-placer
        # Hybrid pour evidence test excluded 2026-08-01: it is not a gate
        # (docstring: evidence for the pending R9 promotion decision) and was
        # running ~987s per PR here on top of the same ~987s in python-tests'
        # cp-sat slow job -- ~33 min/day of duplicated serial work. It now
        # runs nightly + on demand in .github/workflows/r9-evidence.yml.
        # The production-board routing DRC test is sharded into the parallel
        # production-routing-regression job below. It takes ~20m by itself
        # (1252s in run 33231812889); leaving it in this 30m job after the
        # ~6m setup and the other CP-SAT tests caused the job to hit its hard
        # timeout at 30:00 with the test still running. The dedicated job
        # preserves the test on both PR and main paths without changing its
        # assertion or masking its result.
        run: >
          uv run pytest tests/placer/cp_sat/ tests/metrics/test_external_oracle.py
          tests/cli/test_cp_sat_flag.py -v --tb=short
          --ignore=tests/placer/cp_sat/test_zone_pour_production_measurement.py
          --ignore=tests/placer/cp_sat/test_hybrid_pour_stitch_measurement.py
          --deselect "tests/placer/cp_sat/test_regression_drc.py::test_production_board_routing_drc_regression"

      - name: Quarantine Report
        run: uv run python scripts/quarantine_report.py

      - name: Summary
        if: always()
        run: |
          echo "## Regression Suite Results" >> $GITHUB_STEP_SUMMARY
          echo "Regression suite, DRC ratchet, round-trip integrity, metamorphic oracles, and quarantine report executed. Zone/pour production measurement runs in its dedicated lane." >> $GITHUB_STEP_SUMMARY

  # The full production-board routing DRC regression is intentionally a
  # separate lane. The main regression job has ~6m of setup before its CP-SAT
  # step, while this one test has measured at 1252s (20m52s) on the same
  # runner. Running it after the 1296-item CP-SAT collection therefore leaves
  # no margin under the 30m job ceiling. Sharding by exact node ID keeps the
  # assertion running on every PR and main event, and gives its setup + route
  # a dedicated budget. The first dedicated run reached its 35m ceiling
  # before the route produced a result; its setup took 6m58s, leaving only
  # 28m02s for the test. The subsequent 45m dedicated run (33270908898)
  # again reached its ceiling after 38m11s in the test, with no result. The
  # trunk-only routing lane also reached its 50m ceiling after 43m56s in the
  # test (33262575088). Those observations supersede the old 1252s (~20m52s)
  # measurement: the route is currently materially slower and needs a
  # dedicated ceiling that includes measured runner variance. Use 75m: it
  # leaves 68m for the route after setup, while remaining finite and
  # fail-closed.
  # This is a timing fix only: no test is skipped, masked, or made less strict.
  production-routing-regression:
    name: Production board routing regression
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bennetleff/temper-ci:latest
      options: --user root
    timeout-minutes: 75
    strategy:
      fail-fast: false
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache virtualenv
        uses: actions/cache@v6
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: Create virtualenv (cache miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: uv venv

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Cache netlist
        id: cache-netlist
        uses: actions/cache@v6
        with:
          path: elec/build
          key: netlist-${{ hashFiles('elec/src/**', 'elec/ato.yaml', 'Makefile') }}

      - name: Build electronics netlist
        if: steps.cache-netlist.outputs.cache-hit != 'true'
        run: make netlist

      # Match the extension environment used by the main regression job. A
      # restored uv cache alone is not sufficient because it can contain
      # artifacts built from an older checkout.
      - name: Build and install Rust extensions
        run: |
          uv pip install maturin
          for crate in \
            packages/temper-geometry \
            packages/temper-thermal \
            packages/temper-rust-router \
            packages/temper-drc-rs; do
            uv run maturin develop --release --manifest-path "$crate/Cargo.toml"
          done
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 \
            uv run maturin develop --release \
            --manifest-path packages/temper-placer/temper-constraints/Cargo.toml

      - name: Production board routing DRC regression
        working-directory: packages/temper-placer
        run: >
          uv run python ../../scripts/pytest_guard.py --min-tests 1 --
          "tests/placer/cp_sat/test_regression_drc.py::test_production_board_routing_drc_regression"
          -v --tb=short -p no:cacheprovider --maxfail=1

  # The zone/pour production measurement is intentionally a separate lane.
  # The main regression job completes its 1293-test CP-SAT collection in
  # about 127s, but this one measurement took 1241s (20m41s) after that
  # collection in run 33263816906. Running it after the collection and
  # routing work in the same 30m job leaves no margin. Its setup plus the
  # measurement has a dedicated budget. The first dedicated run reached its
  # 35m ceiling before producing a result; its setup took 6m59s, leaving only
  # 28m01s for the two-arm measurement. That arm was previously measured at
  # 1241s (20m41s), but it is sensitive to runner load and must include both
  # full routes, zone fills, and DRC sampling. The 45m dedicated run
  # (33270908898) reached its ceiling after 37m42s in the test, while the same
  # test completed in 45m08s on main (33262575088). That measured completion
  # is materially slower than the old 1241s (~20m41s) estimate. Use 60m: it
  # leaves 52m42s for the measurement after the observed setup, with roughly
  # 7m34s above the measured completion, while remaining finite and
  # fail-closed. The exact test invocation is preserved on both PR and main
  # paths without masking or changing it.
  production-zone-pour-measurement:
    name: Zone/pour production measurement
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bennetleff/temper-ci:latest
      options: --user root
    timeout-minutes: 60
    strategy:
      fail-fast: false
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache virtualenv
        uses: actions/cache@v6
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: Create virtualenv (cache miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: uv venv

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Cache netlist
        id: cache-netlist
        uses: actions/cache@v6
        with:
          path: elec/build
          key: netlist-${{ hashFiles('elec/src/**', 'elec/ato.yaml', 'Makefile') }}

      - name: Build electronics netlist
        if: steps.cache-netlist.outputs.cache-hit != 'true'
        run: make netlist

      # Match the extension environment used by the main regression job. A
      # restored uv cache alone is not sufficient because it can contain
      # artifacts built from an older checkout.
      - name: Build and install Rust extensions
        run: |
          uv pip install maturin
          for crate in \
            packages/temper-geometry \
            packages/temper-thermal \
            packages/temper-rust-router \
            packages/temper-drc-rs; do
            uv run maturin develop --release --manifest-path "$crate/Cargo.toml"
          done
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 \
            uv run maturin develop --release \
            --manifest-path packages/temper-placer/temper-constraints/Cargo.toml

      - name: Zone/Pour Production Measurement
        working-directory: packages/temper-placer
        run: uv run pytest tests/placer/cp_sat/test_zone_pour_production_measurement.py -v --tb=short -rs -s

      - name: Summary
        if: always()
        run: |
          echo "## Zone/Pour Production Measurement Results" >> $GITHUB_STEP_SUMMARY
          echo "Zone/pour production measurement executed in its dedicated regression lane." >> $GITHUB_STEP_SUMMARY
