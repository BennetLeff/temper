name: Metrics Record

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # PRs: cancel in progress -- a superseded PR run is worthless.
  # push (i.e. main): DO NOT cancel. A run already executing is main's
  # only verification; killing it mid-flight is how 6 of 8 consecutive
  # main runs ended up `cancelled` on 2026-08-06, with zero successes,
  # so `cargo test`/clippy results never landed during a merge burst.
  # Sharing one group by `github.ref` still prevents the 88-run pileup
  # the sha-keyed group allowed: later pushes queue, and GitHub keeps
  # only the newest PENDING run, so intermediate commits are still
  # superseded -- just not the one actually running.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  # no-pr-trigger: record pipeline metrics post-merge, not meaningful on PRs
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'pcb/**'
      - 'scripts/ci_closure_test.py'
      - 'scripts/pipeline_metrics.py'
      - '.github/workflows/metrics-record.yml'
      - 'power_pcb_dataset/timing_baselines.yaml'
  workflow_dispatch:

jobs:
  record:
    name: Record Pipeline Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NDJSON_FILE: /tmp/pipeline-metrics-${{ github.run_id }}.ndjson
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Cache virtualenv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Cache netlist
        id: cache-netlist
        uses: actions/cache@v6
        with:
          path: elec/build
          key: netlist-${{ hashFiles('elec/src/**', 'elec/ato.yaml', 'Makefile') }}
      - name: Build electronics netlist
        if: steps.cache-netlist.outputs.cache-hit != 'true'
        run: make netlist
      # ci_closure_test.py imports temper_drc_rs (the closure kernels +
      # run_drc). The shared venv cache is keyed only on uv.lock and is
      # populated by python-tests.yml's sync, which excludes temper-drc-rs
      # (--no-install-package) -- so a restored cache can carry a venv
      # without it, and ci_closure_test.py crashes with `ImportError: No
      # module named 'temper_drc_rs'` instead of a clean failure. Build the
      # extension explicitly (after the sync, so uv cannot evict it). Mirrors
      # python-tests.yml's per-crate maturin step.
      - name: Build and install temper-drc-rs
        run: |
          uv pip install maturin
          uv run maturin develop --release --manifest-path packages/temper-drc-rs/Cargo.toml
      - name: Verify temper-drc-rs loads
        run: uv run python3 -c "import temper_drc_rs; print('temper_drc_rs loaded OK')"
      # Removed 2026-08-07: `continue-on-error` was dead weight here -- the
      # `run:` command already ends in `|| echo "CLOSURE_EXIT=$?" >>
      # $GITHUB_ENV`, which makes the step exit 0 unconditionally regardless
      # of ci_closure_test.py's real exit code, so the mask had nothing left
      # to guard (same self-swallow pattern as the pr-pipeline-scorecard.yml
      # "Run closure test on PR head" step, and $CLOSURE_EXIT is written but
      # never read anywhere in this repo). NOT fixed here (out of scope for
      # a masking cleanup, needs its own PR): the underlying command
      # genuinely fails every run -- `ci_closure_test.py`'s PlacementStage
      # adapter still calls the removed JAX/benders_loop backend
      # (packages/temper-placer/src/temper_placer/adapters/
      # register_strategies.py:44, `NotImplementedError`) instead of the
      # CP-SAT deterministic placer, verified 2026-08-07. Making this step
      # actually hard-fail (drop the `|| echo` too) should wait for that
      # migration, or it will just turn this job red on every push.
      - name: Run closure test
        run: >
          uv run python3 scripts/ci_closure_test.py
          --pcb pcb/temper.kicad_pcb
          --require-all-stages
          --output closure-result.json
          --metrics-dir ./pipeline-metrics
          || echo "CLOSURE_EXIT=$?" >> "$GITHUB_ENV"
      - name: Record pipeline metrics
        run: |
          uv run python scripts/pipeline_metrics.py record \
            --board temper --commit "${{ github.sha }}" \
            --closure-json closure-result.json \
            --metrics-file "$NDJSON_FILE"
      - name: Upload baseline for PR scorecard
        uses: actions/upload-artifact@v7
        with:
          name: baseline-metrics
          path: pipeline-metrics/pipeline_metrics.jsonl
      # Removed 2026-08-07: dead weight, verified by running both halves of
      # the pipe locally -- `temper profile run --module loss-fn ...` and
      # the downstream `pipeline_metrics.py record --from-stdin` both exit
      # 0 with a clean recorded metric.
      - name: Profile loss functions
        run: |
          uv run temper profile run \
            --module loss-fn --board temper \
            --commit "${{ github.sha }}" --json \
            | uv run python scripts/pipeline_metrics.py record \
              --board temper --commit "${{ github.sha }}" \
              --from-stdin --metrics-file "$NDJSON_FILE"
      # router-bench profiles all 4 fixture boards (Piantor_Right,
      # LibreSolar_BMS, RP2040_DesignGuide, BitAxe_Ultra) through full
      # topological CP-SAT routing -- a genuinely heavy, multi-minute
      # benchmark. Spot-checked 2026-08-07: no errors observed through
      # board 1's full SAT solve (15.8M vars, 23.4M clauses, 14.7s) and well
      # into board 2, but a full run was not observed to a clean exit
      # locally (session time limits, not a failure). Kept non-blocking
      # until a maintainer confirms one complete CI run finishes within this
      # job's 30-minute budget with exit 0; remove once confirmed.
      - name: Profile router benchmarks
        continue-on-error: true
        run: |
          uv run temper profile run \
            --module router-bench \
            --commit "${{ github.sha }}" --json \
            | uv run python scripts/pipeline_metrics.py record \
              --board temper --commit "${{ github.sha }}" \
              --from-stdin --metrics-file "$NDJSON_FILE"
          echo "=== NDJSON contents ==="
          cat "$NDJSON_FILE"
      # ORDERING IS LOAD-BEARING: this upload is the only path by which recorded
      # metrics reach main. metrics-reconcile.yml globs `pipeline-metrics-*`
      # artifacts, reconciles them into
      # power_pcb_dataset/metrics/pipeline_metrics.jsonl and commits the result.
      #
      # It used to sit *below* "Generate HTML report". That step began raising
      # FileNotFoundError on 2026-06-30 (it required
      # packages/temper-placer/pipeline_execution.json, a run artifact untracked
      # since #310), which aborted the job and left this upload `skipped`. The
      # series was frozen for 35 days -- last successful run 2026-06-30T00:19Z,
      # last record 2026-06-30T00:22Z -- while metrics-trend-check.yml,
      # pr-pipeline-scorecard.yml, health-digest.yml and dashboard-deploy.yml
      # went on reporting against it.
      #
      # Data capture must never sit downstream of report rendering. Keep this
      # step above the report, and keep `if: always()` on it, so no future
      # rendering failure can eat the measurements again.
      - name: Upload metrics artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.NDJSON_FILE }}
      - name: Generate HTML report
        run: >
          uv run python scripts/pipeline_report.py
          --metrics-file power_pcb_dataset/metrics/pipeline_metrics.jsonl
          --execution-log packages/temper-placer/pipeline_execution.json
          --output pipeline_report.html
      - name: Upload report artifact
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-report
          path: pipeline_report.html
      # This step auto-writes power_pcb_dataset/timing_baselines.yaml and
      # pushes the commit directly to main (see the git commit/push below,
      # retry-looped) -- it is feature-flagged off by default
      # (FEATURE_AUTO_BASELINE_TIGHTEN) and exists purely for auto-
      # maintenance, not correctness. `temper timing tighten --ci` does have
      # real non-zero exit paths (malformed baseline data, missing metrics
      # file; packages/temper-placer/src/temper_placer/cli/timing.py), so
      # this isn't unconditionally safe -- but a transient push race or a
      # temporarily-malformed metrics file legitimately should not fail
      # pipeline-metrics *recording*, which is this job's actual purpose.
      - name: Auto-tighten timing baselines
        if: env.FEATURE_AUTO_BASELINE_TIGHTEN == 'true'
        continue-on-error: true
        run: |
          echo "Checking for eligible baseline tightening..."
          uv run temper timing tighten --ci \
            --n-runs "${AUTO_TIGHTEN_N:-7}" \
            --threshold "${AUTO_TIGHTEN_THRESHOLD:-0.50}"
          if git diff --quiet power_pcb_dataset/timing_baselines.yaml; then
            echo "No baselines tightened."
          else
            echo "Baselines tightened — committing directly."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add power_pcb_dataset/timing_baselines.yaml
            git commit -m "chore(timing): auto-tighten baselines for ${{ github.sha }}"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break
              echo "Push attempt $i failed, retrying..."; sleep 5
            done
          fi
        env:
          FEATURE_AUTO_BASELINE_TIGHTEN: ${{ vars.FEATURE_AUTO_BASELINE_TIGHTEN || 'false' }}
          AUTO_TIGHTEN_N: ${{ vars.AUTO_TIGHTEN_N || '7' }}
          AUTO_TIGHTEN_THRESHOLD: ${{ vars.AUTO_TIGHTEN_THRESHOLD || '0.50' }}
