name: Required Checks

on:
  # This workflow only reads PR metadata and checks out the trusted base
  # revision. pull_request_target ensures a PR cannot replace the aggregator
  # definition or checker while it is deciding whether the PR may merge.
  pull_request_target:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  checks: read

# This aggregator polls for candidate checks while occupying a runner slot --
# i.e. it consumes capacity from the very pool the jobs it waits on need in
# order to start. Without a concurrency group, every `synchronize` on a PR
# stacks another poller on top of the previous ones, each holding a slot for up
# to `timeout-minutes` (240). Measured 2026-08-03: ~24 concurrent jobs is the
# account ceiling and a single push already requests ~40, so stacked pollers
# are a self-amplifying starvation loop -- enough concurrently-pushed PRs and
# every slot is held by a job waiting for jobs that can never start.
#
# Cancelling a superseded run is always correct here: its verdict is about the
# previous head SHA, which can no longer merge. The newest run re-derives the
# verdict from scratch, so nothing is lost by cancelling the older one.
concurrency:
  group: required-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  required-python-tests:
    name: Required Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 240
    if: ${{ always() }}
    steps:
      # Evaluate trusted base-branch code so a PR cannot weaken the required
      # check by changing this checker or its manifest in the same PR.
      - name: Check out base revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Evaluate candidate Python Tests checks
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_required_checks.py --manifest .github/required-checks.json
