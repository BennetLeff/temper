name: WASM Tier Nightly Sweep (R19 Agreement)

# Nightly scheduled dispatch of the WASM verification tier, matching
# board-regeneration.yml's own precedent: a scheduled job does not contend
# with push-triggered jobs for the account's ~24 concurrent runner ceiling;
# it runs when no push is in flight. This is the wiring the goal-set plan's
# Q1 answered (docs/evidence/2026-08-07-wasm-tier-phase2-4-status.md §5,
# adopted by docs/plans/2026-08-07-002-feat-wasm-tier-phase2-4-plan.md §3):
# continuous/scheduled, not per-change -- per-change would put the tier back
# in competition with exactly the concurrency ceiling D3 rejected Cloudflare
# containers over.
#
# Job-count argument (matching board-regeneration.yml:6-13,
# required-checks.yml:19, codeql.yml:20): this is +1 scheduled workflow
# (2 jobs), +0 push-contended jobs. Runner-minute cost is the local wasm32
# build + sweep (small: temper-drc-rs + temper-wasm-test-runner only, not the
# full workspace) plus the deployed-Worker sweep once credentials exist --
# both well inside board-regeneration.yml's own 120-minute nightly budget.
#
# Before this workflow, every WASM-tier measurement (Phase 1's U1, U5, U6,
# U8) was a manual, researcher-driven sweep -- nothing triggered the tier and
# nothing consumed its results (docs/evidence/2026-08-07-wasm-tier-phase2-4-
# status.md, "The gap"). This workflow is that wiring in both directions:
# it dispatches the tier and it fails the run when the tier's verdicts
# disagree with the same commit's native/CI verdicts (the R19 agreement
# check) -- that disagreement gate is the tier's actual safety property, not
# a nice-to-have. A run that produces numbers nobody reads, or that reports
# green when nothing ran, is exactly the failure mode this workflow exists to
# avoid: neither job below uses `continue-on-error`, and the Worker-dispatch
# job below FAILS LOUDLY (not skips) when Cloudflare credentials are absent.
#
# Two jobs, deliberately split so a Cloudflare outage or a missing credential
# cannot silently suppress the half of this workflow that needs neither:
#
#   local-sweep-r19               -- always runs. No credentials needed.
#                                     Builds temper-wasm-test-runner for
#                                     wasm32, runs it under Node, and compares
#                                     every verdict against the same commit's
#                                     native `cargo test` run (both taken in
#                                     this very job). Fails on disagreement.
#                                     Does this ONCE PER TIER -- see below.
#   worker-dispatch-r19           -- requires the deployed Workers to answer
#                                     /health. If any does not, this job FAILS
#                                     with an explicit error naming which --
#                                     it does not skip. (It formerly required
#                                     CLOUDFLARE_API_TOKEN/ACCOUNT_ID secrets,
#                                     which nothing it runs ever read; see the
#                                     preflight step's comment.) Checks the
#                                     deployed corpus is not STALE (R5.1, see
#                                     below), then dispatches the 7 deployed
#                                     per-family Workers
#                                     (tools/wasm/sweep_multi_worker.mjs),
#                                     compares their verdicts against
#                                     local-sweep-r19's native results
#                                     (downloaded as an artifact), and fails
#                                     the run on disagreement.
#
# R5.1 -- the staleness control (added 2026-08-10;
# docs/plans/2026-08-10-001-feat-wasm-tier-phase5-plan.md D5.3).
#
# Reachability was never the whole precondition. From 2026-08-07 to 2026-08-10
# all 8 Workers answered /health perfectly while carrying 147 tests, and
# temper-drc-rs's suite had meanwhile grown to 1,708. This workflow reported
# `agreement_rate: 1.0` every night of that window: r19_compare.py compares the
# verdicts it is handed, and a test the deployed corpus does not contain is
# `native_only`, not `disagree`. The tier was answering for an 8.4% sample and
# saying so in green.
#
# The damning part is that BOTH JOBS BELOW ALREADY PUBLISHED THE DISCREPANCY.
# local-sweep-r19's artifact said 1,708 registered; worker-dispatch-r19's said
# 147. Same workflow, same run, two numbers that must be equal, and nothing
# compared them. tools/wasm/check_deployed_freshness.mjs is that comparison,
# and it is the cheapest possible one: local-sweep-r19 has ALREADY compiled the
# commit's wasm32 module and recorded `summary.registered`, and this job
# ALREADY downloads that artifact for the native comparison. No rebuild is
# added -- the number was sitting in the artifact the whole time.
#
# It also checks that a tier's per-family shard counts sum to exactly its built
# count. The shards are what sweep_multi_worker.mjs dispatches; a tier's
# full-corpus Worker is not in that fan-out at all, so a fresh full-corpus
# module over stale shards would leave the dispatched path stale behind a
# correct-looking headline number.
#
# THREE CRATES, THREE TIERS, ONE INVARIANT PER TIER (2026-08-10).
#
# The tier now serves temper-drc-rs (temper-wasm-tier + 7 family shards),
# temper-geometry (temper-wasm-geometry) and temper-thermal
# (temper-wasm-thermal) -- the latter two each a single script that is both its
# tier's full-corpus Worker and its only shard, because each crate declares one
# family. The Worker list lives in tools/wasm/wasm_tier_topology.json and every
# step below reads it.
#
# Everything downstream is done PER TIER, and that is a correctness requirement
# rather than tidiness. r19_compare.py joins wasm32 verdicts against ONE
# `cargo test` invocation's verdicts BY TEST NAME, and scores a name it cannot
# find on the native side as `wasm32_only` -- counted nowhere, failing nothing.
# So a single merged sweep compared against temper-drc-rs's native run would
# silently absolve all 722 geometry verdicts, which is the same "green over a
# corpus nobody compared" failure the R5.1 check exists to rule out, rebuilt
# one crate later. Hence: one native `cargo test` per crate, one wasm32 module
# per crate, one expected-failure manifest per crate, one comparison per crate.
#
# temper-thermal makes that argument concrete rather than hypothetical. Before
# this workflow's thermal steps landed, that crate had NO `cargo test` step in
# ANY workflow -- not here, not on the PR path (only temper-design-bundle,
# temper-geometry and temper-orchestration get one there). So its 143 wasm32
# verdicts had nothing to be compared against at all: a merged sweep would have
# filed every one of them under `wasm32_only`, and the tier would have reported
# on temper-thermal in green while comparing exactly none of it. The native arm
# below is not a nicety attached to the deployed Worker; it is the other half of
# the only claim the deployed Worker can make.
#
# Likewise the staleness check is stated per crate rather than over the union:
# a union check would let a +11 drift in one crate cancel a -11 drift in the
# other and pass with two stale modules. See check_deployed_freshness.mjs's
# header for that argument in full, and for the rule that every tier MUST be
# given a built count -- there is no flag that skips one.
#
# R5 (goal-set plan): every finding names the exact artifact it came from by
# content hash. Both jobs compute pcb/temper.kicad_pcb's sha256 and thread it
# through tools/wasm/r19_compare.py's --board-sha256 (and, for the deployed
# path, into every dispatched request body via sweep_multi_worker.mjs's
# --board-sha256) so every persisted artifact is traceable to the exact board
# bytes the run happened alongside -- even though, as of this workflow, no
# individual wasm32 test verdict is itself board-content-dependent (see
# docs/evidence/2026-08-07-wasm-tier-phase2-4-status.md's R5 discussion for
# why that is a real, named gap this workflow does not close).
#
# What this workflow deliberately does NOT do (mirrors board-regeneration.yml
# §"Hard prohibitions" and this task's own constraints):
# - Never deploys a Worker, never invokes `wrangler`. Deploying is
#   .github/workflows/wasm-tier-deploy.yml, which is `workflow_dispatch`-only
#   and lives in its own file precisely so this prohibition stays literally
#   true and no scheduled trigger can ever reach a `wrangler deploy`.
# - Never makes any tier verdict a required PR context (D5.4): this workflow is
#   scheduled + manual, and nothing here runs on `pull_request`.
# - Never writes power_pcb_dataset/drc_ceiling.json or pcb/temper.kicad_pcb.
# - Never opens a PR.
# - `permissions: contents: read` only.

on:
  schedule:
    # Nightly at 04:40 UTC -- clear of python-tests' 03:00, r9-evidence's
    # 04:15, and board-regeneration's 05:00 (see that workflow's own header
    # for the peak-scheduling-window reasoning this slot also avoids).
    - cron: '40 4 * * *'
  workflow_dispatch:
    inputs:
      inject_disagreement:
        description: 'Anti-vacuity: flip one local wasm32 verdict before comparing, to prove the R19 disagreement gate actually fails the run'
        required: false
        type: choice
        default: 'none'
        options:
          - none
          - flip_one_verdict

permissions:
  contents: read

jobs:
  local-sweep-r19:
    name: Local wasm32 sweep vs native (R19, no credentials needed)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      commit_sha: ${{ steps.identity.outputs.commit_sha }}
      board_sha256: ${{ steps.identity.outputs.board_sha256 }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute artifact identity (R5 — commit + board content hash)
        id: identity
        run: |
          set -euo pipefail
          COMMIT_SHA="$(git rev-parse HEAD)"
          BOARD_SHA256="$(sha256sum pcb/temper.kicad_pcb | cut -d' ' -f1)"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "board_sha256=${BOARD_SHA256}" >> "$GITHUB_OUTPUT"
          echo "COMMIT_SHA=${COMMIT_SHA}" >> "$GITHUB_ENV"
          echo "BOARD_SHA256=${BOARD_SHA256}" >> "$GITHUB_ENV"
          echo "commit:        ${COMMIT_SHA}"
          echo "board sha256:  ${BOARD_SHA256}  (pcb/temper.kicad_pcb)"

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # ------------------------------------------------------------------
      # Native side: the same commit's `cargo test` verdicts, captured
      # directly in this job (not a separate CI run) so the R19 comparison
      # below is genuinely "the same commit's GitHub Actions results," per
      # this workflow's own dispatch brief.
      #
      # `set -o pipefail` is load-bearing: without it, `cargo test | tee`
      # always exits 0 regardless of test failures, and a real native
      # regression would silently vanish from this job's exit code. If any
      # native test fails, this step (and therefore the job) fails here,
      # before the wasm32 side is even built — a native regression is not
      # something the R19 comparison needs to explain.
      # ------------------------------------------------------------------

      - name: Native cargo test (temper-drc-rs, --no-default-features)
        run: |
          set -euo pipefail
          cargo test --no-default-features \
            --manifest-path packages/temper-drc-rs/Cargo.toml 2>&1 | tee /tmp/native_raw.txt
          grep '^test ' /tmp/native_raw.txt > /tmp/native.txt

      # temper-geometry's native arm. A DIFFERENT `cargo test` invocation, not a
      # bigger one: the two crates' registries are disjoint and each wasm32
      # module is compared only against its own crate's native verdicts.
      #
      # DEBUG, NOT RELEASE, and that is load-bearing. Measured 2026-08-10 on
      # x86_64-unknown-linux-gnu: `cargo test --no-default-features` passes
      # 779/779, while `cargo test --release --no-default-features` fails 1 --
      # pad_geometry::tests::pow2_is_exact_where_powi_is_not, which asserts that
      # powi(2, -1024) still overflows-then-inverts to 0.0. At opt-level 3 LLVM
      # folds it to the exact subnormal instead, i.e. release x86_64 acquires
      # the very wasm32 behaviour that test is a staleness guard against. Run
      # this arm in release and the test fails on BOTH sides, r19_compare.py
      # scores agree_fail, and a real divergence stops being reported as one.
      #
      # This also runs 31 integration tests (tests/*.rs) and 1 doctest that the
      # wasm32 registry does not carry -- gen_wasm_test_registry.py registers
      # `#[cfg(test)]` modules inside src/ only. Those, plus the ~55 lib tests
      # the generator excludes, land in r19_compare.py's `native_only` bucket:
      # reported in the matrix, not silently dropped, and correctly not counted
      # as agreement.
      - name: Native cargo test (temper-geometry, --no-default-features)
        run: |
          set -euo pipefail
          cargo test --no-default-features \
            --manifest-path packages/temper-geometry/Cargo.toml 2>&1 | tee /tmp/native_geometry_raw.txt
          grep '^test ' /tmp/native_geometry_raw.txt > /tmp/native_geometry.txt

      # temper-thermal's native arm. This is the FIRST `cargo test` this crate
      # has in any workflow -- the PR path runs one for temper-design-bundle,
      # temper-geometry and temper-orchestration only -- so it is both the R19
      # join partner for the 143 wasm32 verdicts and, incidentally, the first
      # scheduled execution of temper-thermal's 191 native tests anywhere.
      #
      # `--no-default-features` is load-bearing here in a way it is not for the
      # other two tiers: this crate's DEFAULT feature is `python`, which pulls
      # pyo3 (`extension-module`) and faer into a plain `cargo test`. Measured
      # 2026-08-10 on x86_64-unknown-linux-gnu: default passes 198/0,
      # --no-default-features passes 191/0, and the 7-test difference is EXACTLY
      # `solve::tests::*` -- a `#[cfg(feature = "python")]` module that is the
      # faer sparse-LU call plus its pyo3 bridge, and which the wasm32 registry
      # cannot contain. Nothing else differs in either direction, so those 7 are
      # `native_only` under EITHER invocation. Paying a pyo3 + faer build every
      # night to move 7 tests between native_only buckets buys no comparison
      # coverage; all 143 wasm32 names are present natively either way
      # (verified: 0 wasm32_only).
      #
      # DEBUG, NOT RELEASE, like the two arms above -- but for a weaker reason
      # than geometry's, and the difference is worth stating rather than
      # inheriting. Measured 2026-08-10: temper-thermal passes 191/0 in BOTH
      # profiles, and all four b7-pow-divergence-absent guards pass in both.
      # They survive -O3 because hostmath::pow is a `dlsym`-resolved function
      # pointer, opaque to LLVM, so there is nothing to constant-fold -- unlike
      # geometry's `powi` intrinsic, which release DOES fold, failing
      # pad_geometry::tests::pow2_is_exact_where_powi_is_not natively and
      # turning a real divergence into an agree_fail. That immunity is a
      # property of hostmath.rs's current implementation, not a guarantee: the
      # day hostmath falls back to `f64::powf` natively -- exactly what it
      # already does on wasm32, and the reason those four tests are in the
      # manifest at all -- release would fold and this crate would acquire
      # geometry's failure mode. Debug is where the guards have headroom, it
      # matches the other two arms, and it spares the job a second optimised
      # x86_64 compile of the dependency graph. Nothing here wants release: no
      # wasm32 verdict depends on the native profile, only the join does.
      - name: Native cargo test (temper-thermal, --no-default-features)
        run: |
          set -euo pipefail
          cargo test --no-default-features \
            --manifest-path packages/temper-thermal/Cargo.toml 2>&1 | tee /tmp/native_thermal_raw.txt
          grep '^test ' /tmp/native_thermal_raw.txt > /tmp/native_thermal.txt

      - name: Build temper-wasm-test-runner for wasm32
        run: |
          set -euo pipefail
          # `--features wasm-test-registry` is REQUIRED, not decorative.
          # `--no-default-features` here turns off the runner's own default,
          # which IS `wasm-test-registry` -- and that feature is the only
          # thing that turns on `temper-drc-rs/wasm-test-registry`, which
          # implies the `wasm-registry` feature gating
          # `temper_drc_rs::wasm_test_registry` (temper-drc-rs/src/lib.rs:47).
          # Without it the runner's `use temper_drc_rs::wasm_test_registry`
          # fails to compile with E0432 and the whole nightly is red -- which
          # is exactly what happened on every run of this workflow from the
          # day it landed (2026-08-09, 2026-08-10) until this fix.
          #
          # `--no-default-features` is kept rather than dropped so the flag
          # pair states the intent explicitly: no implicit features, exactly
          # the registry we name. The runner's dependency on temper-drc-rs is
          # already `default-features = false` in its manifest, so pyo3 is not
          # pulled in by this line (see issue #872 for the separate
          # feature-unification problem that does pull it in).
          cargo build --release --target wasm32-unknown-unknown --no-default-features \
            --features wasm-test-registry \
            --manifest-path packages/temper-wasm-test-runner/Cargo.toml

      - name: Run wasm32 test registry (Node host)
        id: wasm_run
        run: |
          set -euo pipefail
          node tools/wasm/run_wasm_tests.mjs \
            target-shared/wasm32-unknown-unknown/release/temper_wasm_test_runner.wasm \
            --json /tmp/wasm_local.json

      # temper-geometry's wasm32 arm. `geometry-wasm-test-registry` implies
      # `geometry-registry`, which is `dep:temper-geometry` -- the dependency is
      # OPTIONAL precisely so this feature is the only thing that pulls the
      # crate into the graph and a drc-only build is byte-for-byte unchanged.
      # The two builds write the same output filename, so this one is copied
      # aside before the census; the staging script does the same thing for the
      # deploy path.
      - name: Build + run temper-geometry's wasm32 registry (Node host)
        run: |
          set -euo pipefail
          cargo build --release --target wasm32-unknown-unknown --no-default-features \
            --features geometry-wasm-test-registry \
            --manifest-path packages/temper-wasm-test-runner/Cargo.toml
          cp target-shared/wasm32-unknown-unknown/release/temper_wasm_test_runner.wasm \
             /tmp/temper_wasm_test_runner_geometry.wasm
          node tools/wasm/run_wasm_tests.mjs \
            /tmp/temper_wasm_test_runner_geometry.wasm \
            --expected-failures tools/wasm/wasm_expected_failures_geometry.json \
            --json /tmp/wasm_local_geometry.json

      # temper-thermal's wasm32 arm, mirroring geometry's exactly.
      # `thermal-wasm-test-registry` implies `thermal-registry`, which is
      # `dep:temper-thermal` -- optional precisely so this feature is the only
      # thing that pulls the crate into the graph and a drc-only build is
      # byte-for-byte unchanged. The runner's dependency additionally sets
      # `default-features = false`, which is what keeps thermal's OWN default
      # (`python` -> pyo3) out of a wasm32-unknown-unknown link that has no
      # business seeing it.
      #
      # `summary.registered` from this step is what the deployed-corpus
      # staleness check compares temper-wasm-thermal's /health against, so this
      # is also where a thermal count that drifts from the deployed Worker
      # becomes visible.
      - name: Build + run temper-thermal's wasm32 registry (Node host)
        run: |
          set -euo pipefail
          cargo build --release --target wasm32-unknown-unknown --no-default-features \
            --features thermal-wasm-test-registry \
            --manifest-path packages/temper-wasm-test-runner/Cargo.toml
          cp target-shared/wasm32-unknown-unknown/release/temper_wasm_test_runner.wasm \
             /tmp/temper_wasm_test_runner_thermal.wasm
          node tools/wasm/run_wasm_tests.mjs \
            /tmp/temper_wasm_test_runner_thermal.wasm \
            --expected-failures tools/wasm/wasm_expected_failures_thermal.json \
            --json /tmp/wasm_local_thermal.json

      - name: Anti-vacuity — inject a disagreement (workflow_dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.inject_disagreement == 'flip_one_verdict' }}
        run: |
          set -euo pipefail
          python3 -c "
          import json
          path = '/tmp/wasm_local.json'
          data = json.load(open(path))
          flipped = False
          for r in data['results']:
              if r['status'] == 'pass':
                  print(f\"injecting disagreement: flipping {r['name']} pass -> fail\")
                  r['status'] = 'fail'
                  flipped = True
                  break
          if not flipped:
              raise SystemExit('no pass-status result found to flip — cannot demonstrate the gate')
          json.dump(data, open(path, 'w'))
          "

      - name: R19 comparison (native vs local wasm32) — fails on disagreement
        run: |
          set -euo pipefail
          python3 tools/wasm/r19_compare.py \
            --native-file /tmp/native.txt \
            --wasm-json /tmp/wasm_local.json \
            --expected-failures tools/wasm/wasm_expected_failures.json \
            --commit "${COMMIT_SHA}" \
            --board-sha256 "${BOARD_SHA256}" \
            --output "/tmp/r19_local_${COMMIT_SHA:0:8}_${BOARD_SHA256:0:8}.json" \
            --fail-on-disagree

      # Separate step, not `if: always()` folded into the one above: a
      # temper-drc-rs disagreement and a temper-geometry disagreement are
      # different findings and each must be able to fail the job on its own.
      - name: R19 comparison (native vs local wasm32, temper-geometry)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 tools/wasm/r19_compare.py \
            --native-file /tmp/native_geometry.txt \
            --wasm-json /tmp/wasm_local_geometry.json \
            --expected-failures tools/wasm/wasm_expected_failures_geometry.json \
            --commit "${COMMIT_SHA}" \
            --board-sha256 "${BOARD_SHA256}" \
            --output "/tmp/r19_local_geometry_${COMMIT_SHA:0:8}_${BOARD_SHA256:0:8}.json" \
            --fail-on-disagree

      # Its own step for the same reason geometry's is: a temper-thermal
      # disagreement is a distinct finding and must be able to fail the job
      # whether or not the other two comparisons ran.
      #
      # Measured on this branch (2026-08-10): 139 agree-pass, 0 agree-fail,
      # 4 expected-fail, 0 disagreements, 48 native-only, 0 wasm32-only,
      # agreement 1.000000. All four expected-fails are
      # b7-pow-divergence-absent. The 48 native-only are the proptest modules
      # gen_wasm_test_registry.py excludes plus the tests inside them --
      # reported in the matrix, not silently dropped, and correctly not counted
      # as agreement.
      - name: R19 comparison (native vs local wasm32, temper-thermal)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 tools/wasm/r19_compare.py \
            --native-file /tmp/native_thermal.txt \
            --wasm-json /tmp/wasm_local_thermal.json \
            --expected-failures tools/wasm/wasm_expected_failures_thermal.json \
            --commit "${COMMIT_SHA}" \
            --board-sha256 "${BOARD_SHA256}" \
            --output "/tmp/r19_local_thermal_${COMMIT_SHA:0:8}_${BOARD_SHA256:0:8}.json" \
            --fail-on-disagree

      - name: Write job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Local wasm32 vs native — R19 agreement"
            echo ""
            echo "- commit: \`${COMMIT_SHA}\`"
            echo "- board sha256: \`${BOARD_SHA256}\` (\`pcb/temper.kicad_pcb\`)"
            echo ""
            echo "#### temper-drc-rs"
            echo ""
            echo '```'
            cat "/tmp/r19_local_${COMMIT_SHA:0:8}_${BOARD_SHA256:0:8}.json" 2>/dev/null | head -c 4000 || echo "(comparison output not produced — see earlier failed step)"
            echo '```'
            echo ""
            echo "#### temper-geometry"
            echo ""
            echo '```'
            cat "/tmp/r19_local_geometry_${COMMIT_SHA:0:8}_${BOARD_SHA256:0:8}.json" 2>/dev/null | head -c 4000 || echo "(comparison output not produced — see earlier failed step)"
            echo '```'
            echo ""
            echo "#### temper-thermal"
            echo ""
            echo '```'
            cat "/tmp/r19_local_thermal_${COMMIT_SHA:0:8}_${BOARD_SHA256:0:8}.json" 2>/dev/null | head -c 4000 || echo "(comparison output not produced — see earlier failed step)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload local sweep artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: wasm-tier-nightly-local-${{ github.run_id }}
          path: |
            /tmp/native.txt
            /tmp/native_raw.txt
            /tmp/wasm_local.json
            /tmp/native_geometry.txt
            /tmp/native_geometry_raw.txt
            /tmp/wasm_local_geometry.json
            /tmp/native_thermal.txt
            /tmp/native_thermal_raw.txt
            /tmp/wasm_local_thermal.json
            /tmp/r19_local_*.json
          retention-days: 30
          if-no-files-found: error

  worker-dispatch-r19:
    name: Deployed-Worker sweep vs native (R19, requires Cloudflare secrets)
    needs: local-sweep-r19
    # Deliberately NOT the default `needs` behavior (skip if local-sweep-r19
    # failed). The two jobs check independent things — a local-sweep failure
    # (native regression, or a local wasm32/native disagreement) must not
    # suppress the deployed-Worker signal, and a missing-credential failure
    # here must surface every night regardless of what local-sweep-r19 found.
    # local-sweep-r19's own artifact-upload step runs under the same
    # `!cancelled()` guard, so the native-results artifact this job downloads
    # exists even when that job's own R19 check failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Before the preflight, not after: the preflight now reads the Worker list
      # from tools/wasm/wasm_tier_topology.json with `node`, and relying on
      # whatever node the runner image happens to ship is how a job starts
      # depending on the image instead of on its own setup.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # ------------------------------------------------------------------
      # Fail loudly, never skip, when the deployed path is not there.
      #
      # This job used to gate on the PRESENCE of CLOUDFLARE_API_TOKEN and
      # CLOUDFLARE_ACCOUNT_ID as repository secrets, treating that pair as the
      # canonical signal for "the deployed path is provisioned" (Phase 1's own
      # evidence — U7, U8, and the phase2-4 status doc's blocker #6 — all gate
      # on exactly that pair). The intent was sound and is preserved below;
      # the instrument was not.
      #
      # The 7 per-family Workers are unauthenticated public HTTPS endpoints
      # (packages/temper-worker/src/worker_core.js's /run-test handler takes no
      # credential) and tools/wasm/sweep_multi_worker.mjs contains zero
      # `process.env` references — so nothing this job runs ever read either
      # secret. The gate was a proxy that is neither necessary nor sufficient:
      # a secret can be present while every Worker is deleted, and every Worker
      # can be live while the secret is absent. The consequence was not
      # theoretical — this job failed on every run from the day it landed
      # (2026-08-09, 2026-08-10, and the 2026-08-10 manual dispatch) on a
      # precondition that was never actually a precondition.
      #
      # The preflight below asks the Workers directly. That is the real
      # precondition, it subsumes what the secret pair stood in for, and it
      # keeps the fail-loud contract: a run that reports green while nothing
      # was exercised is the failure mode this workflow exists to rule out.
      # If the deployed path is later put behind Cloudflare Access or a
      # wrangler-authenticated dispatch, the credential check belongs back —
      # on the step that consumes the credential.
      #
      # Separately, `wrangler` itself (not invoked by this workflow — see the
      # header's hard prohibitions) additionally needs Node >=22; this job
      # pins Node 22 below so that if a future change needs `wrangler` for a
      # deploy-verification step, the runner is already correctly provisioned.
      # ------------------------------------------------------------------

      - name: Preflight — the deployed Workers answer (provisioning signal)
        run: |
          set -euo pipefail
          # This replaces a secret-presence check on CLOUDFLARE_API_TOKEN +
          # CLOUDFLARE_ACCOUNT_ID. That check's INTENT was right and is kept
          # here: the job must not report a clean result for a path that was
          # never actually exercised, so it fails loudly rather than skipping.
          # Its INSTRUMENT was wrong. As the comment above already conceded,
          # neither secret is consumed by anything this job runs --
          # tools/wasm/sweep_multi_worker.mjs contains zero `process.env`
          # references and calls unauthenticated public `*.workers.dev`
          # endpoints -- so the pair was a proxy for "provisioned", and one
          # that is neither necessary nor sufficient: a secret can be present
          # while every Worker is deleted, and every Worker can be live while
          # the secret is absent. The job stayed red from the day it landed on
          # exactly that false precondition.
          #
          # Asking the Workers whether they are there tests the real
          # precondition directly and subsumes what the secret check stood in
          # for. If the deployed path is ever put behind Cloudflare Access or
          # a wrangler-authenticated dispatch, the credential requirement
          # belongs back -- attached to the step that actually consumes it.
          #
          # The host list comes from tools/wasm/wasm_tier_topology.json rather
          # than being spelled out here, so a Worker added to the tier is
          # preflighted without anyone remembering to edit this string.
          node -e '
            import("./tools/wasm/tier_topology.mjs").then(({ loadTopology }) => {
              const t = loadTopology();
              const scripts = [...new Set(t.tiers.flatMap((x) => [x.full_corpus_worker, ...x.shards.map((s) => s.worker)]))];
              console.log(scripts.map((s) => `${s}.${t.base_domain}`).join(" "));
            }).catch((e) => { console.error(e.message); process.exit(1); });
          ' > /tmp/preflight_hosts.txt
          HOSTS="$(cat /tmp/preflight_hosts.txt)"
          # An empty host list would make the loop below a no-op and report
          # "all Workers answering" having asked none.
          [ -n "${HOSTS}" ]
          unreachable=""
          n=0
          for h in $HOSTS; do
            n=$((n + 1))
            code="$(curl -s -m 15 -o /dev/null -w '%{http_code}' "https://${h}/health" || echo 000)"
            if [ "$code" != "200" ]; then
              unreachable="${unreachable} ${h}(HTTP:${code})"
            else
              echo "ok   ${h}"
            fi
          done
          if [ -n "${unreachable}" ]; then
            echo "::error::Deployed Worker(s) not answering /health:${unreachable}. The R19 deployed-path comparison below would compare nothing or fail confusingly, so this job FAILS here rather than reporting a clean result for a path that was never exercised. Redeploy with 'gh workflow run wasm-tier-deploy.yml' (docs/evidence/2026-08-07-phase1-u7-deploy-runbook.md)."
            exit 1
          fi
          echo "All ${n} Workers answering — proceeding."

      - name: Compute artifact identity (R5 — commit + board content hash)
        id: identity
        run: |
          set -euo pipefail
          COMMIT_SHA="$(git rev-parse HEAD)"
          BOARD_SHA256="$(sha256sum pcb/temper.kicad_pcb | cut -d' ' -f1)"
          echo "COMMIT_SHA=${COMMIT_SHA}" >> "$GITHUB_ENV"
          echo "BOARD_SHA256=${BOARD_SHA256}" >> "$GITHUB_ENV"
          echo "commit:        ${COMMIT_SHA}"
          echo "board sha256:  ${BOARD_SHA256}  (pcb/temper.kicad_pcb)"

      - name: Download native results from local-sweep-r19
        uses: actions/download-artifact@v6
        with:
          name: wasm-tier-nightly-local-${{ github.run_id }}
          path: /tmp/local-artifact

      # ------------------------------------------------------------------
      # R5.1 — the deployed corpus is the commit's corpus, or this job fails.
      #
      # Runs BEFORE the sweep on purpose: a sweep over a stale corpus produces
      # an agreement number that is arithmetically true and epistemically
      # worthless, and the run should not spend 1,708 HTTP round-trips
      # computing one. See this workflow's header for the 147-vs-1,708 window
      # this would have caught on 2026-08-09.
      #
      # The expected count is read from local-sweep-r19's own artifact
      # (`summary.registered` = `temper_test_count()` of the wasm32 module that
      # job built from THIS commit), which this job already downloads above.
      # Rebuilding the module here was the alternative and was rejected: it
      # would add a full `cargo build --release --target wasm32` to every
      # nightly to recompute a number the previous job already wrote down, and
      # a second build could differ from the compared-against one, which is a
      # new failure mode rather than a check. Both jobs `actions/checkout@v7`
      # the same ref, so the artifact is this commit's count by construction.
      #
      # If that artifact is missing or unparseable, the checker exits 2 and
      # names why (local-sweep-r19 failed before running the registry). It does
      # not pass on an unknown -- that is the whole bug being fixed here.
      # ------------------------------------------------------------------
      #
      # One census per tier, ALL required. Omitting --built-json-thermal does
      # not narrow the check to the other two, it exits 2 naming the tier that
      # has no count -- see check_deployed_freshness.mjs's header for why a
      # check that can be switched off by dropping an argument eventually is.
      #
      # Spelled out rather than generated (unlike wasm-tier-deploy.yml's
      # post-deploy verification, which derives the same flags from the
      # topology) because the paths here are not a function of the crate name:
      # they are local-sweep-r19's artifact filenames, which predate the tier
      # model and are kept at their historical names so anything that knows
      # wasm_local.json by name still finds it. The safety net is the same
      # either way -- a tier added to the topology and forgotten here exits 2 on
      # the very next nightly rather than checking one crate fewer in green.
      - name: Deployed-corpus staleness check (R5.1) — fails on count mismatch
        run: |
          set -euo pipefail
          node tools/wasm/check_deployed_freshness.mjs \
            --built-json /tmp/local-artifact/wasm_local.json \
            --built-json-geometry /tmp/local-artifact/wasm_local_geometry.json \
            --built-json-thermal /tmp/local-artifact/wasm_local_thermal.json \
            --json /tmp/freshness.json

      # Fan out across the 7 deployed per-family Workers
      # (temper-wasm-<family>.bennetleff.workers.dev).
      #
      # A comment here used to claim a scope gap: "3 test families (dfm, types,
      # integration; ~56 of ~147 registered tests) have no per-family Worker
      # yet, so they will legitimately show up as native_only". That was never
      # true. packages/temper-drc-rs/src/wasm_test_registry.rs assigns
      # `crate::dfm::tests`, every `crate::types::*::tests`, and
      # `crate::rules::integration_tests` to `wasm-registry-infra` — they ride
      # the temper-wasm-infra shard. The seven shard features are exactly the
      # members of `wasm-registry-all`, which IS `wasm-test-registry`, so the
      # shards partition the full corpus by construction: 1510+15+12+25+18+18+
      # 110 = 1708 today, and 1+14+9+0+12+2+109 = 147 on 2026-08-07, when the
      # comment was written. The staleness step above now enforces that
      # identity, so a genuine "family not deployed" gap fails the job loudly
      # instead of being pre-excused as expected native_only noise.
      #
      # ONE SWEEP PER TIER, with `--tier` passed explicitly. The default (no
      # --tier) sweeps every shard of every tier into one file, which is right
      # for an ad-hoc liveness check and wrong here: r19_compare.py joins by
      # test name against ONE crate's native run and scores the other crate's
      # names as `wasm32_only`, which fails nothing. A merged sweep would
      # therefore report agreement over temper-drc-rs while silently absolving
      # every temper-geometry verdict.
      - name: Dispatch deployed Workers (temper-drc-rs tier)
        run: |
          set -euo pipefail
          node tools/wasm/sweep_multi_worker.mjs \
            --tier temper-drc-rs \
            --concurrency 64 \
            --board-sha256 "${BOARD_SHA256}" \
            --json /tmp/worker_sweep.json

      - name: Dispatch deployed Workers (temper-geometry tier)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          node tools/wasm/sweep_multi_worker.mjs \
            --tier temper-geometry \
            --concurrency 64 \
            --board-sha256 "${BOARD_SHA256}" \
            --json /tmp/worker_sweep_geometry.json

      - name: Dispatch deployed Workers (temper-thermal tier)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          node tools/wasm/sweep_multi_worker.mjs \
            --tier temper-thermal \
            --concurrency 64 \
            --board-sha256 "${BOARD_SHA256}" \
            --json /tmp/worker_sweep_thermal.json

      - name: R19 comparison (native vs deployed Workers) — fails on disagreement
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # This step runs under `!cancelled()` so a failure in the dispatch
          # step still gets compared where possible. When an earlier step
          # failed hard enough that there is no sweep at all (the staleness
          # check above, or a dispatch that produced no file), say so plainly
          # rather than letting r19_compare.py fail on a missing path — the
          # cause is above, not here.
          if [ ! -f /tmp/worker_sweep.json ]; then
            echo "::error::No deployed-Worker sweep to compare: /tmp/worker_sweep.json was never written, because an earlier step in this job failed (staleness check, or the dispatch itself). See that step's error. This step fails rather than reporting an agreement result for a sweep that did not happen."
            exit 1
          fi
          python3 tools/wasm/r19_compare.py \
            --native-file /tmp/local-artifact/native.txt \
            --wasm-json /tmp/worker_sweep.json \
            --expected-failures tools/wasm/wasm_expected_failures.json \
            --commit "${COMMIT_SHA}" \
            --board-sha256 "${BOARD_SHA256}" \
            --output "/tmp/r19_worker_${COMMIT_SHA:0:8}_${BOARD_SHA256:0:8}.json" \
            --fail-on-disagree

      - name: R19 comparison (native vs deployed Workers, temper-geometry)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if [ ! -f /tmp/worker_sweep_geometry.json ]; then
            echo "::error::No deployed-Worker sweep for temper-geometry: /tmp/worker_sweep_geometry.json was never written, because an earlier step in this job failed (staleness check, or the dispatch itself). See that step's error. This step fails rather than reporting an agreement result for a sweep that did not happen."
            exit 1
          fi
          python3 tools/wasm/r19_compare.py \
            --native-file /tmp/local-artifact/native_geometry.txt \
            --wasm-json /tmp/worker_sweep_geometry.json \
            --expected-failures tools/wasm/wasm_expected_failures_geometry.json \
            --commit "${COMMIT_SHA}" \
            --board-sha256 "${BOARD_SHA256}" \
            --output "/tmp/r19_worker_geometry_${COMMIT_SHA:0:8}_${BOARD_SHA256:0:8}.json" \
            --fail-on-disagree

      - name: R19 comparison (native vs deployed Workers, temper-thermal)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if [ ! -f /tmp/worker_sweep_thermal.json ]; then
            echo "::error::No deployed-Worker sweep for temper-thermal: /tmp/worker_sweep_thermal.json was never written, because an earlier step in this job failed (staleness check, or the dispatch itself). See that step's error. This step fails rather than reporting an agreement result for a sweep that did not happen."
            exit 1
          fi
          python3 tools/wasm/r19_compare.py \
            --native-file /tmp/local-artifact/native_thermal.txt \
            --wasm-json /tmp/worker_sweep_thermal.json \
            --expected-failures tools/wasm/wasm_expected_failures_thermal.json \
            --commit "${COMMIT_SHA}" \
            --board-sha256 "${BOARD_SHA256}" \
            --output "/tmp/r19_worker_thermal_${COMMIT_SHA:0:8}_${BOARD_SHA256:0:8}.json" \
            --fail-on-disagree

      - name: Write job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Deployed Workers vs native — R19 agreement"
            echo ""
            echo "- commit: \`${COMMIT_SHA}\`"
            echo "- board sha256: \`${BOARD_SHA256}\` (\`pcb/temper.kicad_pcb\`)"
            echo ""
            echo "#### Deployed-corpus freshness (R5.1, per tier)"
            echo ""
            echo '```'
            cat /tmp/freshness.json 2>/dev/null || echo "(freshness census not produced — see the staleness step)"
            echo '```'
            echo ""
            echo "#### R19 comparison — temper-drc-rs"
            echo ""
            echo '```'
            cat "/tmp/r19_worker_${COMMIT_SHA:0:8}_${BOARD_SHA256:0:8}.json" 2>/dev/null | head -c 4000 || echo "(comparison output not produced — see earlier failed step)"
            echo '```'
            echo ""
            echo "#### R19 comparison — temper-geometry"
            echo ""
            echo '```'
            cat "/tmp/r19_worker_geometry_${COMMIT_SHA:0:8}_${BOARD_SHA256:0:8}.json" 2>/dev/null | head -c 4000 || echo "(comparison output not produced — see earlier failed step)"
            echo '```'
            echo ""
            echo "#### R19 comparison — temper-thermal"
            echo ""
            echo '```'
            cat "/tmp/r19_worker_thermal_${COMMIT_SHA:0:8}_${BOARD_SHA256:0:8}.json" 2>/dev/null | head -c 4000 || echo "(comparison output not produced — see earlier failed step)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployed-Worker sweep artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: wasm-tier-nightly-worker-${{ github.run_id }}
          path: |
            /tmp/freshness.json
            /tmp/worker_sweep.json
            /tmp/worker_sweep_geometry.json
            /tmp/worker_sweep_thermal.json
            /tmp/r19_worker_*.json
          retention-days: 30
          if-no-files-found: warn
