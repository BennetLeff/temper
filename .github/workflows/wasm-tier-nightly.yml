name: WASM Tier Nightly Sweep (R19 Agreement)

# Nightly scheduled dispatch of the WASM verification tier, matching
# board-regeneration.yml's own precedent: a scheduled job does not contend
# with push-triggered jobs for the account's ~24 concurrent runner ceiling;
# it runs when no push is in flight. This is the wiring the goal-set plan's
# Q1 answered (docs/evidence/2026-08-07-wasm-tier-phase2-4-status.md §5,
# adopted by docs/plans/2026-08-07-002-feat-wasm-tier-phase2-4-plan.md §3):
# continuous/scheduled, not per-change -- per-change would put the tier back
# in competition with exactly the concurrency ceiling D3 rejected Cloudflare
# containers over.
#
# Job-count argument (matching board-regeneration.yml:6-13,
# required-checks.yml:19, codeql.yml:20): this is +1 scheduled workflow
# (2 jobs), +0 push-contended jobs. Runner-minute cost is the local wasm32
# build + sweep (small: temper-drc-rs + temper-wasm-test-runner only, not the
# full workspace) plus the deployed-Worker sweep once credentials exist --
# both well inside board-regeneration.yml's own 120-minute nightly budget.
#
# Before this workflow, every WASM-tier measurement (Phase 1's U1, U5, U6,
# U8) was a manual, researcher-driven sweep -- nothing triggered the tier and
# nothing consumed its results (docs/evidence/2026-08-07-wasm-tier-phase2-4-
# status.md, "The gap"). This workflow is that wiring in both directions:
# it dispatches the tier and it fails the run when the tier's verdicts
# disagree with the same commit's native/CI verdicts (the R19 agreement
# check) -- that disagreement gate is the tier's actual safety property, not
# a nice-to-have. A run that produces numbers nobody reads, or that reports
# green when nothing ran, is exactly the failure mode this workflow exists to
# avoid: neither job below uses `continue-on-error`, and the Worker-dispatch
# job below FAILS LOUDLY (not skips) when Cloudflare credentials are absent.
#
# Two jobs, deliberately split so a Cloudflare outage or a missing credential
# cannot silently suppress the half of this workflow that needs neither:
#
#   local-sweep-r19               -- always runs. No credentials needed.
#                                     Builds temper-wasm-test-runner for
#                                     wasm32, runs it under Node, and compares
#                                     every verdict against the same commit's
#                                     native `cargo test` run (both taken in
#                                     this very job). Fails on disagreement.
#                                     Does this ONCE PER TIER -- see below.
#   worker-dispatch-r19           -- requires the deployed Workers to answer
#                                     /health. If any does not, this job FAILS
#                                     with an explicit error naming which --
#                                     it does not skip. (It formerly required
#                                     CLOUDFLARE_API_TOKEN/ACCOUNT_ID secrets,
#                                     which nothing it runs ever read; see the
#                                     preflight step's comment.) Checks the
#                                     deployed corpus is not STALE (R5.1, see
#                                     below), then dispatches every deployed
#                                     shard Worker in the topology -- 12 today,
#                                     temper-drc-rs's 7 family shards plus the
#                                     five single-family tiers
#                                     (tools/wasm/sweep_multi_worker.mjs),
#                                     compares their verdicts against
#                                     local-sweep-r19's native results
#                                     (downloaded as an artifact), and fails
#                                     the run on disagreement.
#
# R5.1 -- the staleness control (added 2026-08-10;
# docs/plans/2026-08-10-001-feat-wasm-tier-phase5-plan.md D5.3).
#
# Reachability was never the whole precondition. From 2026-08-07 to 2026-08-10
# all 8 Workers answered /health perfectly while carrying 147 tests, and
# temper-drc-rs's suite had meanwhile grown to 1,708. This workflow reported
# `agreement_rate: 1.0` every night of that window: r19_compare.py compares the
# verdicts it is handed, and a test the deployed corpus does not contain is
# `native_only`, not `disagree`. The tier was answering for an 8.4% sample and
# saying so in green.
#
# The damning part is that BOTH JOBS BELOW ALREADY PUBLISHED THE DISCREPANCY.
# local-sweep-r19's artifact said 1,708 registered; worker-dispatch-r19's said
# 147. Same workflow, same run, two numbers that must be equal, and nothing
# compared them. tools/wasm/check_deployed_freshness.mjs is that comparison,
# and it is the cheapest possible one: local-sweep-r19 has ALREADY compiled the
# commit's wasm32 module and recorded `summary.registered`, and this job
# ALREADY downloads that artifact for the native comparison. No rebuild is
# added -- the number was sitting in the artifact the whole time.
#
# It also checks that a tier's per-family shard counts sum to exactly its built
# count. The shards are what sweep_multi_worker.mjs dispatches; a tier's
# full-corpus Worker is not in that fan-out at all, so a fresh full-corpus
# module over stale shards would leave the dispatched path stale behind a
# correct-looking headline number.
#
# SIX CRATES, SIX TIERS, ONE INVARIANT PER TIER (2026-08-11).
#
# The tier serves temper-drc-rs (temper-wasm-tier + 7 family shards, 1719),
# temper-geometry (722), temper-thermal (143), temper-rust-router-core (111),
# temper-constraint-compiler (69) and temper-design-bundle (24) -- the last five
# each a single script that is both its tier's full-corpus Worker and its only
# shard, because each of those crates declares one family. The Worker list lives
# in tools/wasm/wasm_tier_topology.json and every step below reads it.
#
# NOTHING IN THIS FILE NAMES A CRATE ANY MORE. As of 2026-08-11 the native arms,
# the wasm32 builds, both R19 comparison passes, the sweeps, the freshness flags
# and both job summaries are loops over that topology; the per-crate steps they
# replace were three copies each of the same six lines, and going to six would
# have made it six. The topology's `native_test_args` in particular was
# DOCUMENTED AND READ BY NOTHING until this change -- a field describing what
# this workflow does while this workflow did it from its own copy, which is the
# same two-places-one-silent shape PR #940 removed from the Worker list. Adding
# a seventh tier is now a one-object edit to that file.
#
# Everything downstream is done PER TIER, and that is a correctness requirement
# rather than tidiness. r19_compare.py joins wasm32 verdicts against ONE
# `cargo test` invocation's verdicts BY TEST NAME, and scores a name it cannot
# find on the native side as `wasm32_only` -- counted nowhere, failing nothing.
# So a single merged sweep compared against temper-drc-rs's native run would
# silently absolve all 1069 non-drc verdicts, which is the same "green over a
# corpus nobody compared" failure the R5.1 check exists to rule out, rebuilt
# one crate at a time. Hence: one native `cargo test` per crate, one wasm32
# module per crate, one expected-failure manifest per crate, one comparison per
# crate.
#
# temper-thermal made that argument concrete rather than hypothetical, and the
# three crates added on 2026-08-11 repeat it: NONE of them had a `cargo test`
# step in any workflow either (the PR path runs one for temper-design-bundle,
# temper-geometry and temper-orchestration only, so temper-rust-router-core and
# temper-constraint-compiler had none anywhere). Without the native arm their
# 204 wasm32 verdicts would have been filed under `wasm32_only` and the tier
# would have reported on them in green while comparing exactly none of them. The
# native arm is not a nicety attached to a deployed Worker; it is the other half
# of the only claim a deployed Worker can make.
#
# Likewise the staleness check is stated per crate rather than over the union:
# a union check would let a +11 drift in one crate cancel a -11 drift in the
# other and pass with two stale modules. See check_deployed_freshness.mjs's
# header for that argument in full, and for the rule that every tier MUST be
# given a built count -- there is no flag that skips one.
#
# R5 (goal-set plan): every finding names the exact artifact it came from by
# content hash. Both jobs compute pcb/temper.kicad_pcb's sha256 and thread it
# through tools/wasm/r19_compare.py's --board-sha256 (and, for the deployed
# path, into every dispatched request body via sweep_multi_worker.mjs's
# --board-sha256) so every persisted artifact is traceable to the exact board
# bytes the run happened alongside -- even though, as of this workflow, no
# individual wasm32 test verdict is itself board-content-dependent (see
# docs/evidence/2026-08-07-wasm-tier-phase2-4-status.md's R5 discussion for
# why that is a real, named gap this workflow does not close).
#
# What this workflow deliberately does NOT do (mirrors board-regeneration.yml
# §"Hard prohibitions" and this task's own constraints):
# - Never deploys a Worker, never invokes `wrangler`. Deploying is
#   .github/workflows/wasm-tier-deploy.yml, which is `workflow_dispatch`-only
#   and lives in its own file precisely so this prohibition stays literally
#   true and no scheduled trigger can ever reach a `wrangler deploy`.
# - Never makes any tier verdict a required PR context (D5.4): this workflow is
#   scheduled + manual, and nothing here runs on `pull_request`.
# - Never writes power_pcb_dataset/drc_ceiling.json or pcb/temper.kicad_pcb.
# - Never opens a PR.
# - `permissions: contents: read` only.
#
# -----------------------------------------------------------------------------
# R19 NATIVE-ARM ROTATION (2026-08-11) -- the cost fix, and why it is scoped
# the way it is.
# -----------------------------------------------------------------------------
#
# THE PROBLEM, MEASURED. Every tier's native `cargo test` used to run EVERY
# night, for the SAME reason all nine tiers' wasm32 census already runs every
# night -- but unlike the census (see below), the native run is pure
# duplication: the deployed Cloudflare tier already proves the wasm32 side
# passes, so re-deriving the NATIVE side of a comparison nightly, for every
# tier, at the corpus's current size, does work that scales with the corpus
# for no reason the corpus itself provides. Measured directly on run
# 31455191432 (2026-08-11, 9 tiers): the "Native cargo test" step alone took
# 88s of the local-sweep-r19 job's 175s total (the job grew 73s -> 175s across
# five dispatches the same day as property campaigns took temper-geometry and
# temper-drc-rs's registries into five figures combined -- gh api on this
# workflow's own run history). Every test any of the five other concurrent
# agents added to ANY tier's wasm32 registry that day added native `cargo
# test` time here, on EVERY subsequent run, regardless of which tier they
# touched. That is backwards, and it is what this section fixes.
#
# THE DESIGN CHOSEN: sample / rotate, not retire, not native-only-tests-only.
# Of the three options this task named:
#   - "Native arm only for non-tier tests" was rejected: it would delete the
#     ONLY place wasm32/native agreement is re-derived for the corpus the tier
#     actually claims to cover, which is the exact evidence R19 exists to
#     produce -- the tier's authority over its own 4,569+ tests would rest on
#     nothing measured, ever again.
#   - "Retire R19" was rejected outright: no replacement trust source was
#     proposed for it, and this task requires one if chosen.
#   - Sample/rotate was chosen: ONE tier, selected deterministically per
#     night, gets the FULL unmodified treatment this file always ran for
#     every tier -- native `cargo test`, R19 comparison against its own
#     wasm32 census, the whole works. The other eight get NONE of it tonight.
#     Every tier cycles back in every `len(tiers)` nights (9 tiers today --
#     under 1.5 weeks), which is where the "even if only weekly" floor this
#     task set for host-libm-class native-only tests comes from: a tier's own
#     native-only tests execute whenever ITS rotation night comes up, because
#     the native arm on that night is the ordinary, unfiltered `cargo test`
#     for that crate -- nothing about rotation excludes any test WITHIN the
#     tier that is up.
#
# WHY THIS STOPS THE SCALING THE TASK IDENTIFIED. Before: nightly native cost
# = SUM of all nine tiers' native suites, every night; a test added to ANY
# tier raised EVERY night's cost. After: nightly native cost = ONE tier's
# native suite, the one whose rotation night it is; a test added to a tier
# that is not tonight's pick costs nothing tonight -- it is only paid on that
# tier's own rotation night, at most once every 9 nights. This does not make
# any SINGLE tier's own growth free (temper-drc-rs's own rotation night still
# costs more as temper-drc-rs grows) -- what stops scaling is the thing the
# task measured: the LOCAL JOB'S total cost no longer grows with the SUM
# across nine tiers times however many agents are adding tests to any of
# them, because eight of those nine tiers cost nothing on any given night.
#
# WHAT DELIBERATELY DOES NOT ROTATE, AND WHY. The wasm32 build+execute step
# ("Build + run every tier's wasm32 registry") still runs for all nine tiers,
# every night, unchanged. That is not the duplication this task named -- it
# is the ONLY source of the freshly-BUILT `summary.registered` count
# tools/wasm/check_deployed_freshness.mjs compares the deployed Workers
# against (R5.1, this file's own earlier header section), and that script is
# explicitly out of scope for this change ("Do NOT touch
# check_deployed_freshness.mjs" -- assigning task's scope boundary) and its
# own docstring is explicit that it takes a built count for EVERY tier, no
# flag skips one. Rotating that step would either break R5.1's staleness
# detection for eight tiers a night (silently trusting a stale built count)
# or require feeding it a stale cached count -- both are a real weakening of
# an existing safety property this task did not ask for and this file does
# not make. The wasm32 side of the corpus growth problem (68s of the same
# 175s run) is therefore NOT solved here; only the native arm -- the piece
# this task identified as pure duplication of what the tier itself already
# proves -- is.
#
# ANTI-VACUITY, GENERALISED. `inject_disagreement` used to hardcode
# `temper-drc-rs`'s file, which only worked because temper-drc-rs's native
# arm ran every night. Now only tonight's rotated tier has a native
# comparison to disagree with, so the injection step below reads
# `ROTATED_SUFFIX` (set by the new "Select tonight's R19 native-arm tier"
# step) instead of a literal crate name -- the demonstration still targets
# whichever tier is actually under test tonight, rotated or forced via the
# `r19_tier` dispatch input.
on:
  schedule:
    # Nightly at 04:40 UTC -- clear of python-tests' 03:00, r9-evidence's
    # 04:15, and board-regeneration's 05:00 (see that workflow's own header
    # for the peak-scheduling-window reasoning this slot also avoids).
    - cron: '40 4 * * *'
  workflow_dispatch:
    inputs:
      inject_disagreement:
        description: 'Anti-vacuity: flip one local wasm32 verdict before comparing, to prove the R19 disagreement gate actually fails the run'
        required: false
        type: choice
        default: 'none'
        options:
          - none
          - flip_one_verdict
      r19_tier:
        description: 'R19 native-arm rotation: which tier gets the full native/R19 treatment tonight. auto = date-based rotation (matches schedule behavior).'
        required: false
        type: choice
        default: 'auto'
        options:
          - auto
          - temper-drc-rs
          - temper-geometry
          - temper-thermal
          - temper-design-bundle
          - temper-rust-router-core
          - temper-constraint-compiler
          - temper-quality-oracle
          - temper-io-types
          - temper-pcl-ir

permissions:
  contents: read

jobs:
  local-sweep-r19:
    name: Local wasm32 sweep vs native (R19, no credentials needed)
    runs-on: ubuntu-latest
    # 30 -> 60 when this job went from three tiers to six (2026-08-11): it now
    # runs six native `cargo test` invocations and six wasm32 `cargo build`s on
    # a cold runner cache. The three added crates are small, but each wasm32
    # feature combination is a separate link of the runner crate. Raised
    # deliberately rather than after the first timeout, because a timeout here
    # is indistinguishable in the run list from a real failure and the next
    # nightly would report on nothing.
    timeout-minutes: 60
    outputs:
      commit_sha: ${{ steps.identity.outputs.commit_sha }}
      board_sha256: ${{ steps.identity.outputs.board_sha256 }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute artifact identity (R5 — commit + board content hash)
        id: identity
        run: |
          set -euo pipefail
          COMMIT_SHA="$(git rev-parse HEAD)"
          BOARD_SHA256="$(sha256sum pcb/temper.kicad_pcb | cut -d' ' -f1)"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "board_sha256=${BOARD_SHA256}" >> "$GITHUB_OUTPUT"
          echo "COMMIT_SHA=${COMMIT_SHA}" >> "$GITHUB_ENV"
          echo "BOARD_SHA256=${BOARD_SHA256}" >> "$GITHUB_ENV"
          echo "commit:        ${COMMIT_SHA}"
          echo "board sha256:  ${BOARD_SHA256}  (pcb/temper.kicad_pcb)"

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # ------------------------------------------------------------------
      # R19 native-arm rotation (2026-08-11, see this file's own header for
      # the full "why"). Selects ONE tier to get the full native `cargo
      # test` + R19 comparison treatment tonight; the other eight get
      # neither. `auto` (schedule, or workflow_dispatch left at its default)
      # rotates by day-of-year mod tier count -- deterministic, auditable,
      # and a full cycle in exactly `len(tiers)` nights (9 today, under 1.5
      # weeks). `workflow_dispatch` can force a specific tier via `r19_tier`,
      # which is what makes the anti-vacuity demo and the before/after
      # measurement below reproducible on demand rather than waiting for the
      # calendar to cooperate.
      - name: Select tonight's R19 native-arm tier (rotation)
        id: rotation
        run: |
          set -euo pipefail
          # GitHub Actions expression context cannot call `date`, so the
          # day-of-year is computed here, in the shell, and handed to node as
          # an env var. `%-j` (no leading zeros) avoids bash's octal parsing
          # of a plain `%j` value like `008`.
          # `export`, not a plain assignment: the `node -e` child below reads
          # this via `process.env.DAY_OF_YEAR`, and a non-exported shell var is
          # invisible to it. Without the export, `Number(undefined)` is NaN,
          # `tiers[NaN]` is undefined, and the step dies on `picked.crate` --
          # which is exactly how this shipped, because every verification run
          # used the `r19_tier` override and took the `forced` branch instead.
          export DAY_OF_YEAR="$(date -u +%-j)"
          node -e '
            import("./tools/wasm/tier_topology.mjs").then(({ loadTopology, tierFlagSuffix }) => {
              const tiers = loadTopology().tiers;
              const forced = process.env.R19_TIER_INPUT || "auto";
              let picked;
              if (forced !== "auto") {
                picked = tiers.find((t) => t.crate === forced);
                if (!picked) {
                  console.error(`::error::r19_tier=${forced} is not a known tier. Known: ${tiers.map((t) => t.crate).join(", ")}`);
                  process.exit(1);
                }
              } else {
                const dayOfYear = Number(process.env.DAY_OF_YEAR);
                picked = tiers[dayOfYear % tiers.length];
              }
              console.log(`ROTATED_CRATE=${picked.crate}`);
              console.log(`ROTATED_SUFFIX=${tierFlagSuffix(picked.crate)}`);
            }).catch((e) => { console.error(e.message); process.exit(1); });
          ' > /tmp/rotation.env
          cat /tmp/rotation.env
          cat /tmp/rotation.env >> "$GITHUB_ENV"
          cat /tmp/rotation.env >> "$GITHUB_OUTPUT"
          echo "tonight's R19 native-arm tier selected (day-of-year ${DAY_OF_YEAR} mod tier count, or the r19_tier override)"
        env:
          R19_TIER_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.r19_tier || 'auto' }}

      # ------------------------------------------------------------------
      # Native side: the same commit's `cargo test` verdicts, captured
      # directly in this job (not a separate CI run) so the R19 comparison
      # below is genuinely "the same commit's GitHub Actions results," per
      # this workflow's own dispatch brief.
      #
      # SCOPED TO TONIGHT'S ROTATED TIER ONLY (`ROTATED_CRATE`/`ROTATED_SUFFIX`,
      # set above) -- this is the cost fix this file's header describes. The
      # loop below is unchanged from before rotation; only the tsv it reads
      # now has one row instead of nine.
      # ------------------------------------------------------------------

      # ONE STEP, ONE INVOCATION TONIGHT, ZERO HAND-WRITTEN CRATE NAMES. The
      # arguments come from tonight's rotated tier's `native_test_args` in
      # tools/wasm/wasm_tier_topology.json.
      #
      # This used to be one hand-written step per crate. That was tolerable at
      # two and questionable at three; at six it would have been six copies of
      # the same six lines, and -- the actual defect -- `native_test_args` was
      # already IN the topology and READ BY NOTHING. A field that documents what
      # a workflow does, while the workflow does it from its own copy, is the
      # exact shape this file's Worker list had before PR #940: two places to
      # edit, one of which fails silently. Editing that field now changes what
      # runs.
      #
      # DEBUG, NOT RELEASE, for every tier, and geometry FORCED that choice
      # rather than it being a preference. Measured 2026-08-10 on
      # x86_64-unknown-linux-gnu: `cargo test --no-default-features` on
      # temper-geometry passes 779/779, while `--release` fails 1 --
      # pad_geometry::tests::pow2_is_exact_where_powi_is_not, which asserts that
      # powi(2, -1024) still overflows-then-inverts to 0.0. At opt-level 3 LLVM
      # folds it to the exact subnormal instead, i.e. release x86_64 acquires
      # the very wasm32 behaviour that test is a staleness guard against. Run
      # that arm in release and the test fails on BOTH sides, r19_compare.py
      # scores agree_fail, and a real divergence stops being reported as one.
      # The other five tiers pass in both profiles (measured; temper-thermal
      # 2026-08-10, the three added 2026-08-11 with their test-NAME SETS diffed,
      # not just their counts) and are pinned to debug anyway: it is what the
      # forced arm runs, and release would add a second optimised x86_64 compile
      # of each dependency graph to every nightly for no verdict that differs.
      # See the topology's "Why every native arm is debug" for the per-crate
      # numbers and for what would make this worth re-measuring.
      #
      # `--no-default-features` on every arm, also per crate rather than by
      # habit -- see the topology's "Why every native arm is --no-default-
      # features". Two of the six would otherwise build pyo3 and a C++ SAT
      # solver nightly (temper-thermal, temper-constraint-compiler) and one more
      # a SAT solver (temper-rust-router-core), and the name-set diffs show that
      # buys 0 additional comparable tests in every case: what the flag drops is
      # always `#[cfg(feature = ...)]` modules the wasm32 registry cannot
      # contain under any invocation.
      #
      # `set -o pipefail` is load-bearing: without it `cargo test | tee` exits 0
      # regardless of test failures and a native regression vanishes from this
      # job's exit code. A native regression is not something the R19 comparison
      # needs to explain, so the job fails here, before the wasm32 side is built.
      # Failures are COLLECTED rather than fail-fast, so one broken crate does
      # not hide the state of the other five -- the step still fails, naming all
      # of them.
      - name: Native cargo test, one per tier (arguments from the topology)
        run: |
          set -euo pipefail
          # FILTERED TO ROTATED_CRATE (rotation step above) -- the row count
          # here is 1, not `len(tiers)`. This is the actual cost fix: before
          # rotation this generated one row per tier and ran `cargo test` for
          # every one of them, every night; now it runs for whichever single
          # tier tonight's rotation (or the `r19_tier` override) picked.
          node -e '
            import("./tools/wasm/tier_topology.mjs").then(({ loadTopology, tierFlagSuffix }) => {
              for (const t of loadTopology().tiers) {
                if (t.crate !== process.env.ROTATED_CRATE) continue;
                console.log([t.crate, tierFlagSuffix(t.crate), t.native_test_args.join(" ")].join("\t"));
              }
            }).catch((e) => { console.error(e.message); process.exit(1); });
          ' > /tmp/native_arms.tsv
          # An empty matrix would make the loop below a no-op that reports a
          # green native arm having run none -- here that would mean the
          # rotation step's ROTATED_CRATE does not match any topology entry,
          # which should be structurally impossible (the rotation step reads
          # the same topology) but is still checked rather than assumed.
          test -s /tmp/native_arms.tsv
          echo "native arms:"; cat /tmp/native_arms.tsv
          failed=""
          ran=0
          while IFS=$'\t' read -r crate suffix args; do
            echo "::group::native cargo test ${crate} (${args})"
            # Unquoted on purpose: ${args} is an argument LIST from the topology,
            # not one string. `< /dev/null` so a child cannot consume the rest of
            # this loop's stdin and end it early after one crate.
            # shellcheck disable=SC2086
            if cargo test ${args} < /dev/null 2>&1 | tee "/tmp/native_${suffix}_raw.txt"; then
              :
            else
              failed="${failed} ${crate}"
            fi
            grep '^test ' "/tmp/native_${suffix}_raw.txt" > "/tmp/native_${suffix}.txt" || true
            # A native arm that produced no verdicts is worse than one that
            # failed: r19_compare.py would score every one of that crate's wasm32
            # names as `wasm32_only` -- counted nowhere, failing nothing -- and
            # the tier would report on it in green. That is the exact failure
            # mode temper-thermal's arm was added to close, so an empty file is
            # fatal here rather than downstream.
            if [ ! -s "/tmp/native_${suffix}.txt" ]; then
              echo "::error::${crate}'s native arm produced no 'test ' lines. r19_compare.py would then find no native verdict for ANY of that crate's wasm32 test names and score them all as wasm32_only -- counted nowhere, failing nothing. Failing here instead."
              failed="${failed} ${crate}(no-verdicts)"
            fi
            ran=$((ran + 1))
            echo "::endgroup::"
          done < /tmp/native_arms.tsv
          expected="$(wc -l < /tmp/native_arms.tsv)"
          if [ "${ran}" != "${expected}" ]; then
            echo "::error::Ran ${ran} of ${expected} native arms — the loop ended early, so some tier has no native verdicts and its wasm32 corpus would be compared against nothing."
            exit 1
          fi
          if [ -n "${failed}" ]; then
            echo "::error::Native cargo test failed for:${failed}. A native regression is not something the R19 comparison needs to explain, so this job stops before building the wasm32 side."
            exit 1
          fi
          echo "all ${ran} native arms green (tonight: ${ROTATED_CRATE})"
          # Kept at their historical paths so any reader, doc or tool that knows
          # temper-drc-rs's native results by these names still finds them
          # (docs/evidence/2026-08-10-wasm-tier-u3-native-only-classification.md
          # is one) -- ONLY on a night temper-drc-rs is the rotated tier, since
          # that is the only night its native results exist at all post-
          # rotation. The suffixed files are the canonical ones every other
          # night, and every night regardless.
          if [ "${ROTATED_CRATE}" = "temper-drc-rs" ]; then
            cp /tmp/native_drc-rs.txt /tmp/native.txt
            cp /tmp/native_drc-rs_raw.txt /tmp/native_raw.txt
          fi

      # ONE STEP, SIX MODULES, and again no hand-written crate list: the feature
      # name, the staged module name and the expected-failure manifest all come
      # from tools/wasm/wasm_tier_topology.json -- the SAME fields
      # scripts/stage_wasm_families.sh builds the deployed .wasm from. That
      # shared source is what makes `summary.registered` here a legitimate
      # expected count for the deployed Worker in the job below: the two are the
      # same build definition, not two lists that happen to agree.
      #
      # `--features <tier>` is REQUIRED, not decorative, and
      # `--no-default-features` turns off the runner's own default (which IS
      # `wasm-test-registry`, the only thing enabling
      # `temper-drc-rs/wasm-test-registry`, which gates
      # `temper_drc_rs::wasm_test_registry`). Without the pair, the runner fails
      # to compile with E0432 -- which is what happened on every run of this
      # workflow from the day it landed (2026-08-09, 2026-08-10) until that was
      # fixed. Each non-drc tier's feature also implies its `dep:` -- those five
      # crates are OPTIONAL dependencies precisely so a drc-only build's
      # dependency graph is byte-for-byte what it was.
      #
      # Every build writes the same output filename, so each is copied aside
      # under the topology's `staged_module` name before the next; the staging
      # script does the same thing for the deploy path.
      #
      # run_wasm_tests.mjs does not merely census: it EXECUTES every test and
      # exits non-zero on an unexpected failure, an unexpected PASS (a manifest
      # entry naming a test that now works -- how temper-rust-router-core's 23
      # no-clock entries were identified as stale after #947), an ORPHAN
      # EXCLUSION, or a vacuous registry. Failures are collected so one broken
      # module does not hide the other five.
      #
      # NOT SCOPED TO ROTATED_CRATE, deliberately, unlike the native step
      # above. This step's `summary.registered` per tier is the only source
      # of the freshly-BUILT count tools/wasm/check_deployed_freshness.mjs
      # (out of scope for this change) compares the deployed Workers against
      # for EVERY tier, every night (R5.1) -- that script takes a built count
      # for all nine tiers unconditionally, with no flag to skip one.
      # Rotating this step would either break R5.1's staleness detection for
      # eight tiers a night or require feeding it a stale cached count, both
      # a real weakening of an existing safety property this task did not
      # ask for. So this remains the one piece of the old per-tier loop that
      # still runs for every tier, every night -- see this file's own header,
      # "R19 NATIVE-ARM ROTATION," for the full accounting of what did and
      # did not shrink.
      - name: Build + run every tier's wasm32 registry (Node host)
        run: |
          set -euo pipefail
          node -e '
            import("./tools/wasm/tier_topology.mjs").then(({ loadTopology, tierFlagSuffix }) => {
              for (const t of loadTopology().tiers) {
                console.log([t.crate, tierFlagSuffix(t.crate), t.cargo_features, t.staged_module, t.expected_failures].join("\t"));
              }
            }).catch((e) => { console.error(e.message); process.exit(1); });
          ' > /tmp/wasm_arms.tsv
          test -s /tmp/wasm_arms.tsv
          echo "wasm32 arms:"; cat /tmp/wasm_arms.tsv
          failed=""
          ran=0
          while IFS=$'\t' read -r crate suffix features staged manifest; do
            echo "::group::wasm32 ${crate} (--features ${features})"
            # Every tier writes the SAME output filename, so a failed build must
            # not fall through to the copy: it would stage the PREVIOUS tier's
            # module under this tier's name and run it against this tier's
            # manifest — a page of orphan exclusions whose stated cause is the
            # wrong crate. Skip to the next tier instead, having recorded the
            # failure.
            if cargo build --release --target wasm32-unknown-unknown --no-default-features \
                 --features "${features}" \
                 --manifest-path packages/temper-wasm-test-runner/Cargo.toml < /dev/null; then
              cp target-shared/wasm32-unknown-unknown/release/temper_wasm_test_runner.wasm \
                 "/tmp/${staged}"
              node tools/wasm/run_wasm_tests.mjs "/tmp/${staged}" \
                --expected-failures "${manifest}" \
                --json "/tmp/wasm_local_${suffix}.json" < /dev/null \
                || failed="${failed} ${crate}(run)"
            else
              failed="${failed} ${crate}(build)"
            fi
            ran=$((ran + 1))
            echo "::endgroup::"
          done < /tmp/wasm_arms.tsv
          expected="$(wc -l < /tmp/wasm_arms.tsv)"
          if [ "${ran}" != "${expected}" ]; then
            echo "::error::Built ${ran} of ${expected} wasm32 modules — the loop ended early. A tier with no census here has no expected count for the deployed-corpus staleness check in the next job, which exits 2 rather than passing on an unknown."
            exit 1
          fi
          if [ -n "${failed}" ]; then
            echo "::error::wasm32 build or execution failed for:${failed}. run_wasm_tests.mjs exits non-zero on an unexpected failure, an UNEXPECTED PASS (a manifest entry naming a test that now works), an orphan exclusion, or a vacuous registry — see its output above for which."
            exit 1
          fi
          echo "all ${ran} wasm32 arms green"
          # Historical path, kept for the same reason /tmp/native.txt is.
          cp /tmp/wasm_local_drc-rs.json /tmp/wasm_local.json

      # Flips one verdict in TONIGHT'S ROTATED TIER's CANONICAL suffixed
      # census, before the comparison loop reads it, so the injected
      # disagreement travels exactly as a real one would.
      #
      # Generalised from a hardcoded temper-drc-rs path (2026-08-11, R19
      # rotation): only the rotated tier has a native comparison to disagree
      # with tonight -- flipping any other tier's verdict would be flipped in
      # a file the R19 comparison step below never reads, and the anti-
      # vacuity demonstration would silently prove nothing.
      - name: Anti-vacuity — inject a disagreement (workflow_dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.inject_disagreement == 'flip_one_verdict' }}
        run: |
          set -euo pipefail
          python3 -c "
          import json
          path = '/tmp/wasm_local_${ROTATED_SUFFIX}.json'
          data = json.load(open(path))
          flipped = False
          for r in data['results']:
              if r['status'] == 'pass':
                  print(f\"injecting disagreement: flipping {r['name']} pass -> fail ({path})\")
                  r['status'] = 'fail'
                  flipped = True
                  break
          if not flipped:
              raise SystemExit('no pass-status result found to flip — cannot demonstrate the gate')
          json.dump(data, open(path, 'w'))
          "
          # Keep the historical alias in step with the canonical file, or the
          # uploaded artifact would disagree with what was actually compared.
          # Only meaningful when temper-drc-rs is itself tonight's rotated
          # tier -- otherwise the alias mirrors drc-rs's un-flipped file, and
          # leaving it untouched is correct.
          if [ "${ROTATED_CRATE}" = "temper-drc-rs" ]; then
            cp /tmp/wasm_local_drc-rs.json /tmp/wasm_local.json
          fi

      # ONE COMPARISON, TONIGHT'S ROTATED TIER ONLY (R19 rotation, 2026-08-11
      # -- see this file's header). Before rotation this ran once per tier,
      # every night, nine comparisons; the native side no longer exists for
      # the other eight tonight (the native cargo test step above only ran
      # for ROTATED_CRATE), so comparing them would either error on a
      # missing file or -- worse -- silently score every one of their wasm32
      # names as `native_only`/`wasm32_only`, which is counted nowhere and
      # fails nothing: exactly the false-agreement shape this job's own
      # design already rejects for a MERGED sweep (see the untouched
      # commentary below, which still applies within tonight's one tier).
      #
      # Each tier, ON ITS OWN ROTATION NIGHT, is still compared against ITS
      # OWN native file, ITS OWN wasm32 census and ITS OWN expected-failure
      # manifest -- crossing any of the three remains meaningless for the
      # same reason it always was: r19_compare.py joins BY TEST NAME, so a
      # wasm32 name absent from the native side is scored `wasm32_only` --
      # counted nowhere, failing nothing.
      - name: R19 comparison — tonight's rotated tier only (native vs local wasm32)
        run: |
          set -euo pipefail
          node -e '
            import("./tools/wasm/tier_topology.mjs").then(({ loadTopology, tierFlagSuffix }) => {
              for (const t of loadTopology().tiers) {
                if (t.crate !== process.env.ROTATED_CRATE) continue;
                console.log([t.crate, tierFlagSuffix(t.crate), t.expected_failures].join("\t"));
              }
            }).catch((e) => { console.error(e.message); process.exit(1); });
          ' > /tmp/r19_arms.tsv
          test -s /tmp/r19_arms.tsv
          disagreed=""
          ran=0
          while IFS=$'\t' read -r crate suffix manifest; do
            echo "::group::R19 ${crate}"
            if ! python3 tools/wasm/r19_compare.py \
                 --native-file "/tmp/native_${suffix}.txt" \
                 --wasm-json "/tmp/wasm_local_${suffix}.json" \
                 --expected-failures "${manifest}" \
                 --commit "${COMMIT_SHA}" \
                 --board-sha256 "${BOARD_SHA256}" \
                 --output "/tmp/r19_local_${suffix}_${COMMIT_SHA:0:8}_${BOARD_SHA256:0:8}.json" \
                 --fail-on-disagree < /dev/null; then
              disagreed="${disagreed} ${crate}"
            fi
            ran=$((ran + 1))
            echo "::endgroup::"
          done < /tmp/r19_arms.tsv
          expected="$(wc -l < /tmp/r19_arms.tsv)"
          if [ "${ran}" != "${expected}" ]; then
            echo "::error::Compared ${ran} of ${expected} tiers — the loop ended early, so tonight's rotated tier's wasm32 verdicts were compared against nothing."
            exit 1
          fi
          if [ -n "${disagreed}" ]; then
            echo "::error::R19 disagreement (native vs local wasm32) in:${disagreed}. Each crate's matrix is in the artifact; a disagreement is a test whose native and wasm32 verdicts differ and which is NOT in that crate's expected-failure manifest."
            exit 1
          fi
          echo "tonight's rotated tier (${ROTATED_CRATE}) agrees"
          # Historical path, as elsewhere in this job -- only meaningful (and
          # only produced) when temper-drc-rs is tonight's rotated tier.
          if [ "${ROTATED_CRATE}" = "temper-drc-rs" ]; then
            cp "/tmp/r19_local_drc-rs_${COMMIT_SHA:0:8}_${BOARD_SHA256:0:8}.json" \
               "/tmp/r19_local_${COMMIT_SHA:0:8}_${BOARD_SHA256:0:8}.json"
          fi

      # Per-tier sections, generated from the topology like everything else in
      # this job — a tier added to that file appears in the summary without
      # anyone remembering to add a heading, and a tier whose comparison did not
      # run says so in its own section instead of being absent.
      - name: Write job summary
        if: ${{ !cancelled() }}
        run: |
          # Regenerated here rather than reused from the comparison step: this
          # step runs under `!cancelled()`, so it must work even when that step
          # died before writing its list.
          node -e '
            import("./tools/wasm/tier_topology.mjs").then(({ loadTopology, tierFlagSuffix }) => {
              for (const t of loadTopology().tiers) console.log([t.crate, tierFlagSuffix(t.crate)].join("\t"));
            }).catch((e) => { console.error(e.message); process.exit(1); });
          ' > /tmp/summary_tiers.tsv
          {
            echo "### Local wasm32 vs native — R19 agreement"
            echo ""
            echo "- commit: \`${COMMIT_SHA}\`"
            echo "- board sha256: \`${BOARD_SHA256}\` (\`pcb/temper.kicad_pcb\`)"
            echo "- **R19 native-arm rotation: \`${ROTATED_CRATE:-unresolved}\`** gets the full native/R19 treatment tonight; the other eight tiers are not re-derived tonight (full cycle every \`len(tiers)\` nights — see this file's header, \"R19 NATIVE-ARM ROTATION\")."
            echo ""
            while IFS=$'\t' read -r crate suffix; do
              echo "#### ${crate}"
              echo ""
              if [ "${crate}" != "${ROTATED_CRATE:-}" ]; then
                echo "_Not sampled tonight — rotation picked \`${ROTATED_CRATE:-unresolved}\`. This tier's wasm32 build/census still ran above (R5.1 freshness); only the native-comparison arm skipped it._"
              else
                echo '```'
                cat "/tmp/r19_local_${suffix}_${COMMIT_SHA:0:8}_${BOARD_SHA256:0:8}.json" 2>/dev/null | head -c 4000 \
                  || echo "(comparison output not produced — see earlier failed step)"
                echo '```'
              fi
              echo ""
            done < /tmp/summary_tiers.tsv
          } >> "$GITHUB_STEP_SUMMARY"

      # Globs rather than a per-tier list: the files are named from the
      # topology's tier suffixes, so a new tier's artifacts are uploaded without
      # a matching edit here. `if-no-files-found: error` keeps that honest --
      # the deployed-Worker job DOWNLOADS this artifact and reads a census from
      # it per tier, so an upload that silently matched nothing would surface
      # there as "temper-X has no built count", exit 2.
      - name: Upload local sweep artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: wasm-tier-nightly-local-${{ github.run_id }}
          path: |
            /tmp/native_*.txt
            /tmp/native.txt
            /tmp/native_raw.txt
            /tmp/wasm_local*.json
            /tmp/r19_local_*.json
            /tmp/native_arms.tsv
            /tmp/wasm_arms.tsv
            /tmp/r19_arms.tsv
          retention-days: 30
          if-no-files-found: error

  worker-dispatch-r19:
    name: Deployed-Worker sweep vs native (R19, requires Cloudflare secrets)
    needs: local-sweep-r19
    # Deliberately NOT the default `needs` behavior (skip if local-sweep-r19
    # failed). The two jobs check independent things — a local-sweep failure
    # (native regression, or a local wasm32/native disagreement) must not
    # suppress the deployed-Worker signal, and a missing-credential failure
    # here must surface every night regardless of what local-sweep-r19 found.
    # local-sweep-r19's own artifact-upload step runs under the same
    # `!cancelled()` guard, so the native-results artifact this job downloads
    # exists even when that job's own R19 check failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Before the preflight, not after: the preflight now reads the Worker list
      # from tools/wasm/wasm_tier_topology.json with `node`, and relying on
      # whatever node the runner image happens to ship is how a job starts
      # depending on the image instead of on its own setup.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # ------------------------------------------------------------------
      # Fail loudly, never skip, when the deployed path is not there.
      #
      # This job used to gate on the PRESENCE of CLOUDFLARE_API_TOKEN and
      # CLOUDFLARE_ACCOUNT_ID as repository secrets, treating that pair as the
      # canonical signal for "the deployed path is provisioned" (Phase 1's own
      # evidence — U7, U8, and the phase2-4 status doc's blocker #6 — all gate
      # on exactly that pair). The intent was sound and is preserved below;
      # the instrument was not.
      #
      # The deployed Workers are unauthenticated public HTTPS endpoints
      # (packages/temper-worker/src/worker_core.js's /run-test handler takes no
      # credential) and tools/wasm/sweep_multi_worker.mjs contains zero
      # `process.env` references — so nothing this job runs ever read either
      # secret. The gate was a proxy that is neither necessary nor sufficient:
      # a secret can be present while every Worker is deleted, and every Worker
      # can be live while the secret is absent. The consequence was not
      # theoretical — this job failed on every run from the day it landed
      # (2026-08-09, 2026-08-10, and the 2026-08-10 manual dispatch) on a
      # precondition that was never actually a precondition.
      #
      # The preflight below asks the Workers directly. That is the real
      # precondition, it subsumes what the secret pair stood in for, and it
      # keeps the fail-loud contract: a run that reports green while nothing
      # was exercised is the failure mode this workflow exists to rule out.
      # If the deployed path is later put behind Cloudflare Access or a
      # wrangler-authenticated dispatch, the credential check belongs back —
      # on the step that consumes the credential.
      #
      # Separately, `wrangler` itself (not invoked by this workflow — see the
      # header's hard prohibitions) additionally needs Node >=22; this job
      # pins Node 22 below so that if a future change needs `wrangler` for a
      # deploy-verification step, the runner is already correctly provisioned.
      # ------------------------------------------------------------------

      - name: Preflight — the deployed Workers answer (provisioning signal)
        run: |
          set -euo pipefail
          # This replaces a secret-presence check on CLOUDFLARE_API_TOKEN +
          # CLOUDFLARE_ACCOUNT_ID. That check's INTENT was right and is kept
          # here: the job must not report a clean result for a path that was
          # never actually exercised, so it fails loudly rather than skipping.
          # Its INSTRUMENT was wrong. As the comment above already conceded,
          # neither secret is consumed by anything this job runs --
          # tools/wasm/sweep_multi_worker.mjs contains zero `process.env`
          # references and calls unauthenticated public `*.workers.dev`
          # endpoints -- so the pair was a proxy for "provisioned", and one
          # that is neither necessary nor sufficient: a secret can be present
          # while every Worker is deleted, and every Worker can be live while
          # the secret is absent. The job stayed red from the day it landed on
          # exactly that false precondition.
          #
          # Asking the Workers whether they are there tests the real
          # precondition directly and subsumes what the secret check stood in
          # for. If the deployed path is ever put behind Cloudflare Access or
          # a wrangler-authenticated dispatch, the credential requirement
          # belongs back -- attached to the step that actually consumes it.
          #
          # The host list comes from tools/wasm/wasm_tier_topology.json rather
          # than being spelled out here, so a Worker added to the tier is
          # preflighted without anyone remembering to edit this string.
          node -e '
            import("./tools/wasm/tier_topology.mjs").then(({ loadTopology }) => {
              const t = loadTopology();
              const scripts = [...new Set(t.tiers.flatMap((x) => [x.full_corpus_worker, ...x.shards.map((s) => s.worker)]))];
              console.log(scripts.map((s) => `${s}.${t.base_domain}`).join(" "));
            }).catch((e) => { console.error(e.message); process.exit(1); });
          ' > /tmp/preflight_hosts.txt
          HOSTS="$(cat /tmp/preflight_hosts.txt)"
          # An empty host list would make the loop below a no-op and report
          # "all Workers answering" having asked none.
          [ -n "${HOSTS}" ]
          unreachable=""
          n=0
          for h in $HOSTS; do
            n=$((n + 1))
            code="$(curl -s -m 15 -o /dev/null -w '%{http_code}' "https://${h}/health" || echo 000)"
            if [ "$code" != "200" ]; then
              unreachable="${unreachable} ${h}(HTTP:${code})"
            else
              echo "ok   ${h}"
            fi
          done
          if [ -n "${unreachable}" ]; then
            echo "::error::Deployed Worker(s) not answering /health:${unreachable}. The R19 deployed-path comparison below would compare nothing or fail confusingly, so this job FAILS here rather than reporting a clean result for a path that was never exercised. Redeploy with 'gh workflow run wasm-tier-deploy.yml' (docs/evidence/2026-08-07-phase1-u7-deploy-runbook.md)."
            exit 1
          fi
          echo "All ${n} Workers answering — proceeding."

      - name: Compute artifact identity (R5 — commit + board content hash)
        id: identity
        run: |
          set -euo pipefail
          COMMIT_SHA="$(git rev-parse HEAD)"
          BOARD_SHA256="$(sha256sum pcb/temper.kicad_pcb | cut -d' ' -f1)"
          echo "COMMIT_SHA=${COMMIT_SHA}" >> "$GITHUB_ENV"
          echo "BOARD_SHA256=${BOARD_SHA256}" >> "$GITHUB_ENV"
          echo "commit:        ${COMMIT_SHA}"
          echo "board sha256:  ${BOARD_SHA256}  (pcb/temper.kicad_pcb)"

      - name: Download native results from local-sweep-r19
        uses: actions/download-artifact@v6
        with:
          name: wasm-tier-nightly-local-${{ github.run_id }}
          path: /tmp/local-artifact

      # ------------------------------------------------------------------
      # R5.1 — the deployed corpus is the commit's corpus, or this job fails.
      #
      # Runs BEFORE the sweep on purpose: a sweep over a stale corpus produces
      # an agreement number that is arithmetically true and epistemically
      # worthless, and the run should not spend 1,708 HTTP round-trips
      # computing one. See this workflow's header for the 147-vs-1,708 window
      # this would have caught on 2026-08-09.
      #
      # The expected count is read from local-sweep-r19's own artifact
      # (`summary.registered` = `temper_test_count()` of the wasm32 module that
      # job built from THIS commit), which this job already downloads above.
      # Rebuilding the module here was the alternative and was rejected: it
      # would add a full `cargo build --release --target wasm32` to every
      # nightly to recompute a number the previous job already wrote down, and
      # a second build could differ from the compared-against one, which is a
      # new failure mode rather than a check. Both jobs `actions/checkout@v7`
      # the same ref, so the artifact is this commit's count by construction.
      #
      # If that artifact is missing or unparseable, the checker exits 2 and
      # names why (local-sweep-r19 failed before running the registry). It does
      # not pass on an unknown -- that is the whole bug being fixed here.
      # ------------------------------------------------------------------
      #
      # One census per tier, ALL required. Omitting a tier's --built-json does
      # not narrow the check to the others, it exits 2 naming the tier that has
      # no count -- see check_deployed_freshness.mjs's header for why a check
      # that can be switched off by dropping an argument eventually is.
      #
      # GENERATED, not typed, exactly as wasm-tier-deploy.yml's post-deploy
      # verification does it. This step used to spell the flags out, on the
      # reasoning that local-sweep-r19's artifact filenames were historical
      # rather than a function of the crate name. That is no longer true: that
      # job now names its census files from the topology's tier suffixes, so the
      # path IS `wasm_local_<tierFlagSuffix(crate)>.json` and `freshnessArgs`
      # can derive both halves. `tierFlagSuffix` is the same export the checker
      # parses the flag names with, so the two sides cannot drift.
      #
      # The safety net does not depend on that: a tier in the topology with no
      # count here is exit 2 naming it, on the very next nightly, rather than a
      # green run over one crate fewer.
      - name: Deployed-corpus staleness check (R5.1) — fails on count mismatch
        run: |
          set -euo pipefail
          node -e '
            import("./tools/wasm/tier_topology.mjs").then(({ loadTopology, freshnessArgs, tierFlagSuffix }) => {
              const args = freshnessArgs(loadTopology(), (crate) => `/tmp/local-artifact/wasm_local_${tierFlagSuffix(crate)}.json`);
              console.log(args.join(" "));
            }).catch((e) => { console.error(e.message); process.exit(1); });
          ' > /tmp/freshness_args.txt
          test -s /tmp/freshness_args.txt
          FRESHNESS_ARGS="$(cat /tmp/freshness_args.txt)"
          echo "freshness args: ${FRESHNESS_ARGS}"
          # Unquoted on purpose: a generated flag list, not one string.
          # shellcheck disable=SC2086
          node tools/wasm/check_deployed_freshness.mjs \
            ${FRESHNESS_ARGS} \
            --json /tmp/freshness.json

      # Fan out across every deployed shard Worker
      # (temper-wasm-<family>.bennetleff.workers.dev) -- 12 today.
      #
      # A comment here used to claim a scope gap: "3 test families (dfm, types,
      # integration; ~56 of ~147 registered tests) have no per-family Worker
      # yet, so they will legitimately show up as native_only". That was never
      # true. packages/temper-drc-rs/src/wasm_test_registry.rs assigns
      # `crate::dfm::tests`, every `crate::types::*::tests`, and
      # `crate::rules::integration_tests` to `wasm-registry-infra` — they ride
      # the temper-wasm-infra shard. The seven shard features are exactly the
      # members of `wasm-registry-all`, which IS `wasm-test-registry`, so the
      # shards partition the full corpus by construction: 1510+15+12+25+18+18+
      # 110 = 1708 today, and 1+14+9+0+12+2+109 = 147 on 2026-08-07, when the
      # comment was written. The staleness step above now enforces that
      # identity, so a genuine "family not deployed" gap fails the job loudly
      # instead of being pre-excused as expected native_only noise.
      #
      # ONE SWEEP PER TIER, with `--tier` passed explicitly. The default (no
      # --tier) sweeps every shard of every tier into one file, which is right
      # for an ad-hoc liveness check and wrong here: r19_compare.py joins by
      # test name against ONE crate's native run and scores the other crates'
      # names as `wasm32_only`, which fails nothing. A merged sweep would
      # therefore report agreement over temper-drc-rs while silently absolving
      # the other 1069 verdicts.
      #
      # The tier list comes from the topology, so `--tier` cannot fall behind
      # it: a crate deployed and staleness-checked but never dispatched would be
      # a Worker the nightly proves current and never runs.
      - name: Dispatch deployed Workers, one sweep per tier
        run: |
          set -euo pipefail
          node -e '
            import("./tools/wasm/tier_topology.mjs").then(({ loadTopology, tierFlagSuffix }) => {
              for (const t of loadTopology().tiers) console.log([t.crate, tierFlagSuffix(t.crate)].join("\t"));
            }).catch((e) => { console.error(e.message); process.exit(1); });
          ' > /tmp/sweep_tiers.tsv
          test -s /tmp/sweep_tiers.tsv
          failed=""
          ran=0
          while IFS=$'\t' read -r crate suffix; do
            echo "::group::sweep ${crate}"
            node tools/wasm/sweep_multi_worker.mjs \
              --tier "${crate}" \
              --concurrency 64 \
              --board-sha256 "${BOARD_SHA256}" \
              --json "/tmp/worker_sweep_${suffix}.json" < /dev/null \
              || failed="${failed} ${crate}"
            ran=$((ran + 1))
            echo "::endgroup::"
          done < /tmp/sweep_tiers.tsv
          expected="$(wc -l < /tmp/sweep_tiers.tsv)"
          if [ "${ran}" != "${expected}" ]; then
            echo "::error::Swept ${ran} of ${expected} tiers — the loop ended early, so some deployed tier was never dispatched."
            exit 1
          fi
          # NO unsuffixed /tmp/worker_sweep.json alias here (audited 2026-08-11:
          # nothing reads it -- not wasm-tier-pr.yml, not the Makefile, not
          # r19_compare.py, not check_deployed_freshness.mjs -- grep the repo for
          # `worker_sweep` and this file is the only hit). Before this change the
          # upload step's `worker_sweep*.json` glob below picked up BOTH this
          # alias and /tmp/worker_sweep_drc-rs.json in the same artifact: same
          # tier, same family list, same 1719-test total, uploaded twice under
          # two names. Anyone summing every file matching that glob (a
          # plausible reading of "add up the sweep artifacts") double-counts
          # drc-rs and gets 6017 instead of 4567. The per-tier files
          # (worker_sweep_<suffix>.json, one per tools/wasm/wasm_tier_topology.json
          # entry) were always the ones every consumer in this job actually reads
          # (see the `--json "/tmp/worker_sweep_${suffix}.json"` above and the R19
          # comparison step below) -- the alias was a backward-compat leftover
          # from before this step became a topology-driven loop, and was already
          # redundant with those the day it stopped being the only file written.
          if [ -n "${failed}" ]; then
            echo "::error::Deployed-Worker sweep reported failures for:${failed}. sweep_multi_worker.mjs exits 1 on any fail/error verdict and 2 when it could not enumerate a family's corpus at all — see its output above. The comparison step below still runs on whatever sweeps were written."
            exit 1
          fi
          echo "all ${ran} tiers swept"

      # ONE COMPARISON, TONIGHT'S ROTATED TIER ONLY (R19 rotation, 2026-08-11
      # -- mirrors local-sweep-r19's own R19 comparison step, and reads
      # WHICH tier that was from local-sweep-r19's own uploaded
      # native_arms.tsv rather than re-deriving it independently (a second,
      # separate rotation computation here could disagree with the first on
      # a date rollover mid-run, or on the r19_tier override not being
      # visible to this job at all). native_arms.tsv has exactly one row
      # post-rotation: (crate, suffix, native_test_args).
      #
      # The other eight tiers are EXPECTED to have no native file tonight —
      # that is not a failure, it is what rotation means — so they are
      # reported as "not sampled tonight" rather than as a problem. This is
      # a real narrowing of what "all deployed tiers agree with native"
      # meant before rotation: today it means "the rotated tier's deployed
      # verdicts agree with a same-commit native run," not "every tier's
      # do." The deployed-Worker SWEEP above (which this step does not
      # gate) still answers "did any deployed test fail on wasm32" for
      # every tier, every night, same as before.
      - name: R19 comparison — tonight's rotated tier only (native vs deployed Workers)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if [ ! -s /tmp/local-artifact/native_arms.tsv ]; then
            echo "::error::local-sweep-r19's native_arms.tsv artifact is missing or empty — that job did not record which tier was rotated tonight (or failed before reaching that step). No R19 native-agreement comparison can be performed against ANY deployed tier this run; the sweep above still ran and is the only signal tonight."
            exit 1
          fi
          ROTATED_CRATE_D="$(cut -f1 /tmp/local-artifact/native_arms.tsv | head -1)"
          export ROTATED_CRATE_D
          echo "tonight's rotated tier (from local-sweep-r19's artifact): ${ROTATED_CRATE_D}"
          node -e '
            import("./tools/wasm/tier_topology.mjs").then(({ loadTopology, tierFlagSuffix }) => {
              for (const t of loadTopology().tiers) {
                console.log([t.crate, tierFlagSuffix(t.crate), t.expected_failures, t.crate === process.env.ROTATED_CRATE_D ? "1" : "0"].join("\t"));
              }
            }).catch((e) => { console.error(e.message); process.exit(1); });
          ' > /tmp/worker_r19_arms.tsv
          test -s /tmp/worker_r19_arms.tsv
          problems=""
          ran=0
          skipped=0
          while IFS=$'\t' read -r crate suffix manifest rotated; do
            if [ "${rotated}" != "1" ]; then
              echo "R19 (deployed) ${crate}: not sampled tonight (rotation picked ${ROTATED_CRATE_D})"
              skipped=$((skipped + 1))
              continue
            fi
            echo "::group::R19 (deployed) ${crate}"
            if [ ! -f "/tmp/worker_sweep_${suffix}.json" ]; then
              echo "::error::No deployed-Worker sweep for ${crate}: /tmp/worker_sweep_${suffix}.json was never written, because an earlier step failed (the staleness check, or the dispatch itself). Reporting no agreement result for a sweep that did not happen."
              problems="${problems} ${crate}(no-sweep)"
            elif [ ! -f "/tmp/local-artifact/native_${suffix}.txt" ]; then
              echo "::error::${crate} is tonight's rotated tier per native_arms.tsv, but /tmp/local-artifact/native_${suffix}.txt is missing — local-sweep-r19's native cargo test step must have failed for it. That job's own R19 check would already have failed the run; this is reported here too rather than silently comparing nothing."
              problems="${problems} ${crate}(no-native-file)"
            elif ! python3 tools/wasm/r19_compare.py \
                   --native-file "/tmp/local-artifact/native_${suffix}.txt" \
                   --wasm-json "/tmp/worker_sweep_${suffix}.json" \
                   --expected-failures "${manifest}" \
                   --commit "${COMMIT_SHA}" \
                   --board-sha256 "${BOARD_SHA256}" \
                   --output "/tmp/r19_worker_${suffix}_${COMMIT_SHA:0:8}_${BOARD_SHA256:0:8}.json" \
                   --fail-on-disagree < /dev/null; then
              problems="${problems} ${crate}(disagree)"
            fi
            ran=$((ran + 1))
            echo "::endgroup::"
          done < /tmp/worker_r19_arms.tsv
          expected=1
          if [ "${ran}" != "${expected}" ]; then
            echo "::error::Compared ${ran} of ${expected} rotated tier(s) — expected exactly one (${ROTATED_CRATE_D})."
            exit 1
          fi
          cp "/tmp/r19_worker_drc-rs_${COMMIT_SHA:0:8}_${BOARD_SHA256:0:8}.json" \
             "/tmp/r19_worker_${COMMIT_SHA:0:8}_${BOARD_SHA256:0:8}.json" 2>/dev/null || true
          if [ -n "${problems}" ]; then
            echo "::error::Deployed-path R19 problems in:${problems}."
            exit 1
          fi
          echo "rotated tier (${ROTATED_CRATE_D}) agrees with native; ${skipped} tier(s) not sampled tonight"

      - name: Write job summary
        if: ${{ !cancelled() }}
        run: |
          # Regenerated rather than reused, for the same reason local-sweep-r19's
          # summary regenerates its list: this step runs under `!cancelled()`.
          node -e '
            import("./tools/wasm/tier_topology.mjs").then(({ loadTopology, tierFlagSuffix }) => {
              for (const t of loadTopology().tiers) console.log([t.crate, tierFlagSuffix(t.crate)].join("\t"));
            }).catch((e) => { console.error(e.message); process.exit(1); });
          ' > /tmp/summary_tiers.tsv
          ROTATED_CRATE_D="$(cut -f1 /tmp/local-artifact/native_arms.tsv 2>/dev/null | head -1)"
          {
            echo "### Deployed Workers vs native — R19 agreement"
            echo ""
            echo "- commit: \`${COMMIT_SHA}\`"
            echo "- board sha256: \`${BOARD_SHA256}\` (\`pcb/temper.kicad_pcb\`)"
            echo "- **R19 native-arm rotation: \`${ROTATED_CRATE_D:-unresolved}\`** — the only tier compared against native tonight. Every other tier below was still SWEPT on wasm32 (does it pass?) but not compared against a native re-derivation (does it still agree?) — see this workflow's header, \"R19 NATIVE-ARM ROTATION\"."
            echo ""
            echo "#### Deployed-corpus freshness (R5.1, per tier)"
            echo ""
            echo '```'
            cat /tmp/freshness.json 2>/dev/null || echo "(freshness census not produced — see the staleness step)"
            echo '```'
            echo ""
            while IFS=$'\t' read -r crate suffix; do
              echo "#### R19 comparison — ${crate}"
              echo ""
              if [ "${crate}" != "${ROTATED_CRATE_D:-}" ]; then
                echo "_Not sampled tonight — rotation picked \`${ROTATED_CRATE_D:-unresolved}\`. This tier was still swept on wasm32 above._"
              else
                echo '```'
                cat "/tmp/r19_worker_${suffix}_${COMMIT_SHA:0:8}_${BOARD_SHA256:0:8}.json" 2>/dev/null | head -c 4000 \
                  || echo "(comparison output not produced — see earlier failed step)"
                echo '```'
              fi
              echo ""
            done < /tmp/summary_tiers.tsv
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployed-Worker sweep artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: wasm-tier-nightly-worker-${{ github.run_id }}
          path: |
            /tmp/freshness.json
            /tmp/freshness_args.txt
            /tmp/worker_sweep*.json
            /tmp/r19_worker_*.json
          retention-days: 30
          if-no-files-found: warn
