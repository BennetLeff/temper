name: PR Pipeline Scorecard

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'packages/**'

jobs:
  baseline:
    name: Baseline (from main)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_metrics: ${{ steps.check.outputs.has_metrics }}
    steps:
      - name: Download stored baseline from main
        id: download
        run: |
          RUN_ID=$(gh run list --workflow "Metrics Record" --branch main \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --name baseline-metrics --dir baseline-metrics 2>/dev/null || true
          fi
        continue-on-error: true  # TODO: temper-NNN -- optional baseline download; hard-fail after 2026-09-01
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check metrics exist
        id: check
        run: |
          if [ -f baseline-metrics/pipeline_metrics.jsonl ]; then
            echo "has_metrics=true" >> "$GITHUB_OUTPUT"
            echo "Baseline metrics found from main."
          else
            echo "has_metrics=false" >> "$GITHUB_OUTPUT"
            echo "Baseline metrics not available — scorecard will be limited."
          fi
      - name: Upload baseline metrics
        if: steps.check.outputs.has_metrics == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: baseline-metrics
          path: baseline-metrics/pipeline_metrics.jsonl
          retention-days: 1

  current:
    name: Current (PR head)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Cache netlist
        uses: actions/cache@v4
        with:
          path: elec/build
          key: netlist-${{ hashFiles('elec/src/**') }}
      - name: Build electronics netlist
        run: make netlist
      - name: Run closure test on PR head
        continue-on-error: true  # TODO: temper-NNN -- scorecard best-effort; hard-fail after 2026-09-01
        run: >
          uv run python3 scripts/ci_closure_test.py
          --pcb pcb/temper.kicad_pcb
          --require-all-stages
          --metrics-dir ./current-metrics
          || echo "CLOSURE_EXIT=$?" >> "$GITHUB_ENV"
      - name: Upload current metrics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-metrics
          path: current-metrics/pipeline_metrics.jsonl
          retention-days: 1

  scorecard:
    name: Generate Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [baseline, current]
    if: always() && needs.baseline.result != 'skipped'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Download baseline metrics
        uses: actions/download-artifact@v8
        with:
          name: baseline-metrics
          path: baseline-metrics
        continue-on-error: true  # TODO: temper-NNN -- optional artifact; hard-fail after 2026-09-01

      - name: Download current metrics
        uses: actions/download-artifact@v8
        with:
          name: current-metrics
          path: current-metrics
        continue-on-error: true  # TODO: temper-NNN -- optional artifact; hard-fail after 2026-09-01

      - name: Generate scorecard
        id: scorecard
        run: |
          MISSING=false
          if [ ! -f baseline-metrics/pipeline_metrics.jsonl ]; then
            echo "WARNING: baseline metrics not available" >> "$GITHUB_STEP_SUMMARY"
            MISSING=true
          fi
          if [ ! -f current-metrics/pipeline_metrics.jsonl ]; then
            echo "WARNING: current metrics not available" >> "$GITHUB_STEP_SUMMARY"
            MISSING=true
          fi
          if [ "$MISSING" = true ]; then
            {
              echo "## Pipeline Scorecard"
              echo ""
              echo ":warning: Metrics unavailable for comparison."
              echo ""
              echo "| Artifact | Status |"
              echo "|----------|--------|"
              if [ -f baseline-metrics/pipeline_metrics.jsonl ]; then
                echo "| Baseline (merge-base) | :white_check_mark: Available |"
              else
                echo "| Baseline (merge-base) | :x: Missing |"
              fi
              if [ -f current-metrics/pipeline_metrics.jsonl ]; then
                echo "| Current (PR) | :white_check_mark: Available |"
              else
                echo "| Current (PR) | :x: Missing |"
              fi
            } > scorecard.md
          else
            uv run python scripts/pr_scorecard.py \
              --baseline baseline-metrics/pipeline_metrics.jsonl \
              --current current-metrics/pipeline_metrics.jsonl \
              > scorecard.md
          fi
          echo "## Raw Output" >> "$GITHUB_STEP_SUMMARY"
          cat scorecard.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post scorecard comment
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: pipeline-scorecard
          path: scorecard.md
