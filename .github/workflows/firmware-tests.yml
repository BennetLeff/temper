name: Firmware Tests

# Grouped per commit so a push cannot cancel the previous commit's run.
# See the rationale block in python-tests.yml. This job runs in ~30s, so the
# added cost is negligible; it is changed for consistency with the others.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install codegen dependencies
        run: pip install -r firmware/tools/requirements.txt pytest

      - name: Regenerate config.h and check drift
        run: |
          python3 firmware/tools/gen_config.py
          git diff --exit-code firmware/config.h

      - name: Check header matches manifest
        run: python3 firmware/tools/check_config_matches_manifest.py

      - name: Regenerate fault list and check drift
        run: |
          python3 firmware/tools/gen_fault_list.py
          git diff --exit-code firmware/main/fault_list_generated.h

      - name: Check fault list consistency
        run: python3 scripts/check_fault_list_consistency.py

      - name: Regenerate transition table and check drift
        run: |
          python3 firmware/tools/gen_transition_table.py
          git diff --exit-code firmware/main/transition_table.h

      - name: Build and run host tests
        run: |
          cmake -B firmware/test/build firmware/test
          cmake --build firmware/test/build --target test_state_machine_only test_fault_list_only
          ctest --test-dir firmware/test/build -R "state_machine|fault_list" --output-on-failure

      # R40 transition-table mutation suite (P1). The sweep mutates each row
      # of the test-side manifest (firmware/test/gen_transition_table.py
      # TRANSITIONS), regenerates the test C into a scratch build, and
      # classifies each mutant killed/live/equivalent. The gate fails on live
      # mutants, mutation errors, or skipped rows -- and (freshness check)
      # refuses any report not generated by this run, so the sweep can never
      # be silently scheduled away onto stale data.
      - name: Run mutation-suite host pytest
        run: python3 -m pytest firmware/test/test_mutation_sweep.py -v --tb=short

      - name: Run transition-table mutation sweep
        run: |
          python3 firmware/test/mutate_transition_table.py --sweep \
            --scratch-dir firmware/test/build/mutations \
            --report firmware/test/build/mutations/report.json

      - name: Gate transition-table mutation report
        run: |
          python3 scripts/check_transition_table_mutations.py \
            --report firmware/test/build/mutations/report.json \
            --max-report-age-seconds 900

      - name: Build and run SIL fault injection tests
        run: |
          cmake -B firmware/test/build firmware/test
          cmake --build firmware/test/build --target test_sil_fault_injection
          ctest --test-dir firmware/test/build -R sil_fault_tests --output-on-failure
