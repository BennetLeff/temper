name: Firmware Tests

# Grouped per commit so a push cannot cancel the previous commit's run.
# See the rationale block in python-tests.yml. This job runs in ~30s, so the
# added cost is negligible; it is changed for consistency with the others.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - 'pcb/**'
      - 'scripts/check_firmware_board_contract.py'
      - 'scripts/check_pll_range_consistency.py'
      - 'scripts/check_state_machine_model.py'
      - 'scripts/check_firmware_invariants.py'
      - 'scripts/check_sil_coverage.py'
      - 'scripts/check_firmware_link.py'
      - '.firmware-link-inventory'
      - 'state-machine-crosscheck-allowlist.yaml'
      - '.github/workflows/firmware-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'firmware/**'
      - 'pcb/**'
      - 'scripts/check_firmware_board_contract.py'
      - 'scripts/check_pll_range_consistency.py'
      - 'scripts/check_state_machine_model.py'
      - 'scripts/check_firmware_invariants.py'
      - 'scripts/check_sil_coverage.py'
      - 'scripts/check_firmware_link.py'
      - '.firmware-link-inventory'
      - 'state-machine-crosscheck-allowlist.yaml'
      - '.github/workflows/firmware-tests.yml'

jobs:
  test:
    # Explicit name: the bare job id `test` is a generic, collision-prone
    # GitHub check-run name (required-checks.json's aggregator resolves a
    # required context to a check-run purely by name-match -- see the
    # identical rationale on placer-regression.yml's job, added alongside
    # this one for the same reason). No other workflow in this repo
    # currently posts a check-run literally named "test" (python-tests.yml's
    # own `test` job carries `name: Core Tests`), but naming this ahead of
    # adding it to required_contexts removes the risk rather than relying on
    # that staying true.
    name: Firmware Tests (state-machine + fault-injection)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install codegen dependencies
        run: pip install -r firmware/tools/requirements.txt pytest

      - name: Regenerate config.h and check drift
        run: |
          python3 firmware/tools/gen_config.py
          git diff --exit-code firmware/config.h

      - name: Check header matches manifest
        run: python3 firmware/tools/check_config_matches_manifest.py

      - name: Regenerate fault list and check drift
        run: |
          python3 firmware/tools/gen_fault_list.py
          git diff --exit-code firmware/main/fault_list_generated.h

      - name: Check fault list consistency
        run: python3 scripts/check_fault_list_consistency.py

      # Firmware-assumption contract oracle (plan 2026-08-02-027, R18):
      # re-derives every board-derived firmware constant
      # (PLL_MIN_FREQ_HZ, MAX31865 threshold words) from the ACTUAL board
      # (pcb/temper.kicad_pcb) -- hardware and firmware cannot disagree
      # about a load-bearing value.
      #
      # Was ADVISORY (continue-on-error) until the board fix landed: the
      # oracle was RED by design because tank.c_tank3 was staged
      # OFF-OUTLINE at (20.0, 272.75) -- the exact defect class this
      # oracle exists to catch. The tank-cap placement fix landed in
      # de59c045 (#602, 2026-08-03); the oracle now PASSES 3/3 on the
      # current board (verified stable across repeated local runs on
      # 2026-08-07) and the mask was removed -- it was dead weight, not a
      # live advisory. This is now a hard gate, per the landing contract
      # the original comment described.
      - name: Firmware-board contract oracle
        run: python3 scripts/check_firmware_board_contract.py

      # Drift guard: every constant annotated with a board-derivation
      # marker (@board-derived in pll_control.h, board_derivation: true in
      # config.yaml) must have a registry entry in
      # firmware/tools/board_derivations.yaml, or the oracle will never
      # check it. Hard gate -- annotated-but-unregistered is a silent gap.
      - name: Board-derivation coverage drift guard
        run: python3 firmware/tools/check_board_derivation_coverage.py

      - name: Regenerate transition table and check drift
        run: |
          python3 firmware/tools/gen_transition_table.py
          git diff --exit-code firmware/main/transition_table.h

      # State-machine model check (R28, plan 2026-08-02-028-feat-state-
      # machine-model-check-plan.md U4): exhaustive reachability from
      # STATE_INIT, transition-property checks P1-P4, and a manifest
      # cross-check between firmware/transition_table.yaml (production) and
      # firmware/test/gen_transition_table.py's TRANSITIONS list (test-side).
      # One real, pre-existing manifest divergence
      # ((STATE_FAULT, EVENT_FAULT_RESET_PERSISTS)) is a dated backlog entry
      # (state-machine-crosscheck-allowlist.yaml, seeded 2026-08-07) --
      # deferred to a firmware maintainer's call, not fixed here; any NEW
      # divergence still fails this step immediately. No continue-on-error.
      - name: State-machine model check (reachability, P1-P4, manifest cross-check)
        run: python3 scripts/check_state_machine_model.py

      # Firmware invariant proofs (R29, plan 2026-08-02-028-feat-state-
      # machine-model-check-plan.md U7): re-derives every declared invariant
      # from the current manifest on every run (never trusts the committed
      # firmware/tools/proof_record.json's verdict, only its byte-identity to
      # a fresh regeneration -- KTD5).
      - name: Firmware invariant proofs (proof_record.json freshness + invariant verification)
        run: python3 scripts/check_firmware_invariants.py

      - name: Build and run host tests
        run: |
          cmake -B firmware/test/build firmware/test
          cmake --build firmware/test/build --target test_state_machine_only test_fault_list_only
          ctest --test-dir firmware/test/build -R "state_machine|fault_list" --output-on-failure

      # R40 transition-table mutation suite (P1). The sweep mutates each row
      # of the test-side manifest (firmware/test/gen_transition_table.py
      # TRANSITIONS), regenerates the test C into a scratch build, and
      # classifies each mutant killed/live/equivalent. The gate fails on live
      # mutants, mutation errors, or skipped rows -- and (freshness check)
      # refuses any report not generated by this run, so the sweep can never
      # be silently scheduled away onto stale data.
      - name: Run mutation-suite host pytest
        run: python3 -m pytest firmware/test/test_mutation_sweep.py -v --tb=short

      - name: Run transition-table mutation sweep
        run: |
          python3 firmware/test/mutate_transition_table.py --sweep \
            --scratch-dir firmware/test/build/mutations \
            --report firmware/test/build/mutations/report.json

      - name: Gate transition-table mutation report
        run: |
          python3 scripts/check_transition_table_mutations.py \
            --report firmware/test/build/mutations/report.json \
            --max-report-age-seconds 900

      - name: Build and run SIL fault injection tests
        run: |
          cmake -B firmware/test/build firmware/test
          cmake --build firmware/test/build --target test_sil_fault_injection
          ctest --test-dir firmware/test/build -R sil_fault_tests --output-on-failure

      # SIL fault-injection coverage gate (plan 2026-08-02-031, U1/U4): every
      # (fault class, origin state) pair the transition table (plus the
      # documented C-only interlock paths) defines must be covered by a
      # manifest.json scenario. Thin wrapper around
      # firmware/test/test_sil_coverage.py --gate; see that script's
      # docstring for why it is a standalone scripts/check_*.py entry point
      # rather than folded into the CMake/CTest build above.
      - name: SIL fault-injection coverage gate
        run: python3 scripts/check_sil_coverage.py

  # ---------------------------------------------------------------------------
  # Firmware BUILD gate (added 2026-08-20).
  #
  # Until this job existed, no PR or push CI had ever compiled this firmware.
  # `idf.py build` appeared in exactly two workflows: release-artifacts.yml
  # (`release: published` only) and firmware-perf-record.yml (needs a
  # `[self-hosted, esp32]` runner its own header says was never provisioned).
  # The `test` job above is thorough about the state machine and the fault
  # tables, but every one of its steps is a host-side python/cmake check -- none
  # of them cross-compiles for the ESP32-S3, so five independently fatal
  # build-system defects and four silently-excluded components accumulated
  # without a single red check. Two of the excluded components were `safety` and
  # `control`.
  #
  # WHY THIS IS NOT A PLAIN "does it build" JOB, AND WHY IT IS GREEN TODAY:
  # the firmware genuinely does not link. There is no sensor/peripheral
  # implementation layer, so 34 symbols -- including read_dc_bus_current and
  # read_heatsink_temperature, which the IGBT short-circuit, over-current and
  # thermal trips dispatch on -- are declared and called but defined nowhere.
  # Stubbing them would silently fabricate protection and is strictly worse than
  # the honest link failure. So this job asserts the SHAPE of the failure
  # instead: the tree must configure and compile cleanly, and the undefined
  # symbol set must match .firmware-link-inventory exactly. New symbol -> red.
  # Symbol fixed without updating the ledger -> red. Anything failing before the
  # linker -> red. A component silently dropped for want of a CMakeLists.txt ->
  # red. Same shrink-only ratchet shape as .hash-order-inventory.
  #
  # That is deliberate. A gate that ships red gets switched off -- this repo has
  # several tripwires that died exactly that way, including one that called
  # itself "the CI tripwire against future drift" and was never invoked. This
  # one is green on a correct tree, so it has no reason to be disabled, and the
  # undefined-symbol count is printed to the job summary on every run whatever
  # the verdict.
  #
  # NOT YET BLOCKING: "Firmware Build (ESP32-S3 link ratchet)" is deliberately
  # absent from .github/required-checks.json's `required_contexts`. To make it
  # blocking, follow the same fix-then-require sequencing that file's
  # _gate_vacuity_survey_note documents for the other four contexts:
  #   1. confirm this job is green across ~15 consecutive main runs
  #      (`gh run list --workflow=firmware-tests.yml --branch=main`);
  #   2. add "Firmware Build (ESP32-S3 link ratchet)" to `required_contexts`
  #      AND give it a `context_triggers` entry mirroring this workflow's paths
  #      list -- both, in the same PR. Adding the context without the trigger
  #      entry wedges every PR that matches the manifest's global trigger_paths
  #      but none of this workflow's own paths: the check-run is never created,
  #      so it reads as "missing" rather than "skipped" and the aggregator polls
  #      until timeout.
  # Nothing about the job needs to change for that; it is a manifest edit.
  build:
    name: Firmware Build (ESP32-S3 link ratchet)
    runs-on: ubuntu-latest
    # Pinned to the same image release-artifacts.yml uses, so this gate and the
    # artifact build cannot diverge in toolchain.
    container: espressif/idf:release-v5.3
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Mark checkout safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # firmware/CMakeLists.txt regenerates config.h and transition_table.h at
      # configure time. Without jinja2 it warns and silently falls back to the
      # committed copies, which would make this job build something other than
      # what config.yaml says. The `test` job above is what gates drift between
      # them; this just makes sure codegen actually runs here.
      - name: Install codegen dependencies
        run: pip install -r firmware/tools/requirements.txt

      # The image adds idf.py to PATH from its ENTRYPOINT, which GitHub Actions
      # bypasses for `container:` jobs (steps run via docker exec). export.sh
      # must therefore be sourced explicitly in every step that calls idf.py.
      - name: Build firmware for ESP32-S3
        working-directory: firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          # The build is EXPECTED to stop at the link today; the verdict belongs
          # to the ratchet step below, which hard-fails on any drift in either
          # direction. `set +e` here is not masking a check -- it hands the
          # decision to the gate rather than reddening this job for the one
          # outcome the ledger says is currently correct. The exit code is
          # echoed either way, and a pre-link failure is a hard FAIL in the gate.
          set +e
          set -o pipefail
          idf.py build 2>&1 | tee "$RUNNER_TEMP/idf-build.log"
          echo "idf.py build exit code: ${PIPESTATUS[0]}"

      # The real gate. Prints the distinct-symbol and total-reference counts to
      # the job summary on every run, then ratchets. Also asserts that no
      # simulation symbol (safety.c's sim_state / *_sim_*, guarded by
      # `#ifndef ESP_PLATFORM`) is DEFINED in any built object -- linking a
      # simulated sensor read into a production cooktop image is the worst
      # outcome available here, so it is checked rather than assumed.
      - name: Firmware link ratchet
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python3 scripts/check_firmware_link.py \
            --log "$RUNNER_TEMP/idf-build.log" \
            --check-sim-symbols firmware/build
