name: Release Artifacts

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  firmware:
    # Evidence releases (zapote/tools/evidence_archive.py) are data, not product builds.
    if: ${{ !startsWith(github.event.release.tag_name, 'zapote-evidence-') }}
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.3
    steps:
      - uses: actions/checkout@v7
      - name: Build firmware
        working-directory: firmware
        run: idf.py build
      - name: Upload firmware to release
        uses: softprops/action-gh-release@v3
        with:
          files: firmware/build/temper.bin

