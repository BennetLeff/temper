name: Release Please

on:
  # no-pr-trigger: release-please bot, push to main only
  push:
    branches: [main]

# release-please always derives the release PR from the CURRENT state of main,
# so a superseded run can only recompute what the newer run already will.
# Without a group these accumulate one per push: five were queued at once on
# 2026-08-06, each holding a slot against a ~24-job account ceiling.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          release-type: simple
