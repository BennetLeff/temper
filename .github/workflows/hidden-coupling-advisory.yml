name: Hidden-Coupling Advisory

on:
  pull_request:
    paths:
      - 'packages/temper-placer/src/**'
      - 'firmware/**'

jobs:
  advisory:
    runs-on: ubuntu-latest
    continue-on-error: true  # TODO: temper-NNN -- advisory-only job by design; hard-fail after 2026-09-01
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 500

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/checkout@v7
        with:
          repository: BennetLeff/gusano
          path: .gusano

      - name: Install gusano
        working-directory: .gusano
        run: bun install --frozen-lockfile

      - name: Install sem
        run: |
          curl -fsSL https://ataraxy-labs.github.io/sem/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Drift detector
        id: drift
        continue-on-error: true  # TODO: temper-NNN -- advisory-only; hard-fail after 2026-09-01
        working-directory: .gusano
        run: |
          bun packages/enola-sem-drift/src/cli.ts \
            --repo-path "$GITHUB_WORKSPACE" \
            --max-pairs 20 \
            --force-snapshot > .drift-output.txt 2>/dev/null
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Post hidden-coupling comment
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try { output = fs.readFileSync('.gusano/.drift-output.txt', 'utf8'); } catch {}

            const lines = output.split('\n').filter(l => l.includes('↔'));
            if (lines.length === 0) {
              // Check for "could not analyze" — also worth surfacing
              const cnaHeader = output.indexOf('Could not analyze');
              if (cnaHeader >= 0) {
                const cnaCount = (output.slice(cnaHeader).match(/unmapped:/g) || []).length;
                if (cnaCount > 0) {
                  const body = `**gusano: ${cnaCount} co-change pairs could not be structurally analyzed** (entities sem tracks but enola cannot resolve). This may indicate renamed, moved, or Rust code. Advisory only — not blocking.`;
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    body
                  });
                }
              }
              return;
            }

            const items = lines.slice(0, 8).map(l => `- ${l.trim()}`).join('\n');
            const body = `**gusano: hidden-coupling advisory**\n\nThe following entities changed in this PR and historically co-change with entities NOT touched here — with no static dependency edge:\n\n${items}\n\n_Advisory only — not blocking._`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
