name: Golden Regression Check

# PR runs grouped per PR number, cancelled when superseded; main runs grouped
# per SHA and never cancelled. Rationale: python-tests.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - 'packages/temper-placer/src/temper_placer/**'
      - 'power_pcb_dataset/goldens/**'
      - 'pcb/**'
  push:
    branches: [main]
    paths:
      - 'packages/temper-placer/src/temper_placer/**'
      - 'power_pcb_dataset/goldens/**'

jobs:
  golden-check:
    runs-on: ubuntu-latest
    # Runs in the same CI image python-tests.yml's board-gates/consistency-gates
    # jobs use (.github/docker/ci.Dockerfile), which has kicad-cli preinstalled
    # (KiCad 10.0 PPA). Before this, golden-check ran on bare ubuntu-latest with
    # no KiCad at all: drc_available: true in the baseline would have made
    # RegressionRunner._run_board's `run_drc()` call raise, and the old
    # try/except there silently fell back to comparing a fabricated 0 against
    # the pinned drc_errors/drc_warnings ceiling -- always passing, regardless
    # of the board's actual DRC state. With component_count/net_count no
    # longer gating either (2026-07-29), that left this job asserting
    # approximately nothing beyond "the board parses" -- a green-and-empty
    # gate, worse than the red-but-meaningless one it replaced because nobody
    # investigates a passing check. See docs/solutions/best-practices/
    # stale-absolute-baseline-vs-mutable-board-2026-07-29.md and
    # docs/solutions/best-practices/falsify-the-fix-before-believing-it-2026-07-29.md.
    container:
      image: ghcr.io/bennetleff/temper-ci:latest
      options: --user root
    steps:
      - uses: actions/checkout@v7

      # Container runs as root; workspace is owned by the runner user --
      # same pattern as board-gates in python-tests.yml. Without this, every
      # `git` call in a later step exits 128 on "dubious ownership".
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache virtualenv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        run: uv sync --all-packages

      # Fail loudly, here, if the image ever stops shipping kicad-cli --
      # rather than letting RegressionRunner._run_board discover it via a
      # caught exception and (per the hardening above) hard-fail the whole
      # board with a less obvious message.
      - name: Verify kicad-cli is available
        run: kicad-cli --version

      - name: Run golden regression suite
        # `shell: bash` is load-bearing now that this job runs in a
        # container: the container's default shell is dash, where
        # `set -o pipefail` is not a valid option and the step dies with
        # "Illegal option -o pipefail" before the suite ever runs. On the
        # bare ubuntu-latest runner this job used previously, the default
        # was already bash and the directive was unnecessary.
        shell: bash
        run: |
          # pipefail is load-bearing: without it the pipeline returns tee's
          # exit status (always 0) and this gate stops failing entirely.
          set -o pipefail
          uv run temper-placer regression 2>&1 | tee golden-output.txt

      # A board whose baseline file is missing is reported SKIP, and skipped is
      # excluded from the failure count (corpus_runner.py:109,238), so it can
      # never fail this gate. bitaxe_ultra has had no baseline since it was
      # added and nothing surfaced that. This step does not change pass/fail --
      # it just stops the gap being invisible outside the raw logs.
      - name: Summarize golden results
        if: always()
        run: |
          {
            echo "### Golden regression"
            echo
            if [ -f golden-output.txt ]; then
              echo '```'
              sed -n '/=== Regression Suite Results ===/,$p' golden-output.txt
              echo '```'
              if grep -q '\[SKIP\]' golden-output.txt; then
                echo
                echo "> **Skipped boards did not run and cannot fail this gate.**"
                echo "> Each line below is a board with no baseline on disk:"
                echo
                grep '\[SKIP\]' golden-output.txt | sed 's/^ */> - /'
              fi
            else
              echo "No golden output captured — the suite did not run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
