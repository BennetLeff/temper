name: Golden Regression Check

on:
  pull_request:
    paths:
      - 'packages/temper-placer/src/temper_placer/**'
      - 'power_pcb_dataset/goldens/**'
      - 'pcb/**'
  push:
    branches: [main]
    paths:
      - 'packages/temper-placer/src/temper_placer/**'
      - 'power_pcb_dataset/goldens/**'

jobs:
  golden-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run golden regression suite
        run: uv run temper-placer regression
