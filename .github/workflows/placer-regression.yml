name: Placer Regression

# Grouped per commit so a push cannot cancel the previous commit's run.
# See the rationale block in python-tests.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # PRs: cancel in progress -- a superseded PR run is worthless.
  # push (i.e. main): DO NOT cancel. A run already executing is main's
  # only verification; killing it mid-flight is how 6 of 8 consecutive
  # main runs ended up `cancelled` on 2026-08-06, with zero successes,
  # so `cargo test`/clippy results never landed during a merge burst.
  # Sharing one group by `github.ref` still prevents the 88-run pileup
  # the sha-keyed group allowed: later pushes queue, and GitHub keeps
  # only the newest PENDING run, so intermediate commits are still
  # superseded -- just not the one actually running.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/temper-placer/src/**'
      - 'power_pcb_dataset/corpus/**'
      - 'packages/temper-placer/configs/**'
      - '.github/workflows/placer-regression.yml'
  push:
    branches: [main]
    paths:
      - 'packages/temper-placer/src/**'
      - 'power_pcb_dataset/corpus/**'
      - 'packages/temper-placer/configs/**'
      - '.github/workflows/placer-regression.yml'

jobs:
  regression:
    # Explicit name so the GitHub check-run this job posts is NOT literally
    # "regression" -- regression.yml's own job (id `regression`, also
    # unnamed) posts a check-run under that exact same name, and both
    # workflows' path filters overlap (regression.yml triggers on
    # `packages/temper-placer/**`, a superset of this workflow's
    # `packages/temper-placer/src/**`), so a PR touching the placer's `src/`
    # fires BOTH. Two check-runs sharing one name is not just cosmetic
    # confusion: `required-checks.json`'s aggregator (scripts/
    # check_required_checks.py) resolves a required context to a GitHub
    # check-run purely by name-match, so an un-disambiguated "regression"
    # required context could silently observe whichever of the two posted
    # last -- see docs/evidence/2026-08-11-gate-vacuity-audit.md finding 21
    # lead (a). Named ahead of adding this job to required_contexts, not
    # after, so the collision never exists in a required state.
    name: Placer Regression (baseline-approval gate)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bennetleff/temper-ci:latest
      options: --user root
    timeout-minutes: 30
    # NARROWED 2026-08-11 (docs/evidence/2026-08-11-python-ci-load-inventory.md):
    # this job used to fan out over a 5-board matrix (1 board on PR, 5 on push
    # to main -- temper, minimal, rp2040_designguide, bitaxe_ultra,
    # piantor_right), each a full container + `uv sync` setup. The step that
    # motivated the per-board fan-out (a corpus regression run keyed on
    # ${{ matrix.board }}) was RETIRED 2026-07-27 (see the comments at the
    # bottom of this file) when its JAX/benders_loop backend was removed from
    # the codebase; the matrix itself was never collapsed afterward. The one
    # step that remains, "Check for baseline changes without approval", is a
    # `git diff`/`git log` check against the PR's own commit range -- it does
    # not reference `matrix.board` and produces an identical verdict on every
    # board. Measured on 5 recent push runs: all 5 per-board jobs ran
    # 6m07s-6m42s, confirming they were doing the same work 5 times over.
    # Collapsing to a single job removes 4x redundant container-pull +
    # `uv sync` setup on every push to main (~140 push runs/week measured),
    # with zero coverage loss -- the surviving check's result does not vary
    # by board, so four of the five copies were never anything but the same
    # answer computed four extra times.
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Container runs as root; workspace is owned by the runner user. The
      # baseline-approval check below shells out to `git diff`/`git log`, which
      # exit 128 on "dubious ownership" without this.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache virtualenv
        uses: actions/cache@v6
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: Create virtualenv (cache miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: uv venv

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Record KiCad DRC tool version
        run: |
          echo "kicad-cli: $(kicad-cli version 2>/dev/null || echo unavailable)"
          echo "platform: $(uname -a)"

      - name: Check for baseline changes without approval
        run: |
          if git diff --name-only origin/main...HEAD | grep -q 'power_pcb_dataset/corpus/.*/baseline.json'; then
            echo "Checking for baseline approval in commit messages..."
            if ! git log origin/main..HEAD --format=%B | grep -q 'Ceiling-Approval:'; then
              echo "FAIL: baseline.json modified without Ceiling-Approval in commit message"
              echo "Please add 'Ceiling-Approval: <reason>' to your commit message body."
              exit 2
            fi
            echo "Baseline-Approval found in commit message."
          fi

      # RETIRED 2026-07-27: this step invoked the JAX/benders_loop placement
      # path, which was removed from the codebase. corpus_runner._run_board
      # now returns the retired-optimizer error for every valid board (the
      # JAX optimizer and its stubs were removed in the cleanup C2 sweep), so
      # every board failed at setup. It was masked as "JAX nondeterministic on
      # CI runners" -- a description of flakiness, not of a deleted capability.
      # Retired rather than left masked; see docs/evidence/ for the audit.

      # RETIRED 2026-07-27: the summary table and report upload both consumed
      # regression-report.json, which was produced only by the corpus
      # regression step retired above. Nothing writes that file now.

# RETIRED 2026-07-27: the update-cache job existed to fold regression-report
# artifacts into power_pcb_dataset/corpus/.regression-cache.json. With the
# corpus run retired there are no reports to fold, so it updated nothing.
# The baseline-approval gate above is kept: corpus baselines still have live
# consumers (scripts/quarantine_report.py, the PR scorecard tests).
