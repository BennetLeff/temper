name: Placer Regression

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/temper-placer/src/**'
      - 'power_pcb_dataset/corpus/**'
      - 'packages/temper-placer/configs/**'
      - '.github/workflows/placer-regression.yml'
  push:
    branches: [main]
    paths:
      - 'packages/temper-placer/src/**'
      - 'power_pcb_dataset/corpus/**'
      - 'packages/temper-placer/configs/**'
      - '.github/workflows/placer-regression.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bennetleff/temper-ci:latest
      options: --user root
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        board: ${{ github.event_name == 'pull_request' && fromJson('["temper"]') || fromJson('["temper", "minimal", "rp2040_designguide", "bitaxe_ultra", "piantor_right"]') }}
    env:
      JAX_PLATFORM_NAME: cpu
      XLA_PYTHON_CLIENT_MEM_FRACTION: 0.5
      VIRTUAL_ENV: ${{ github.workspace }}/.venv

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Container runs as root; workspace is owned by the runner user. The
      # baseline-approval check below shells out to `git diff`/`git log`, which
      # exit 128 on "dubious ownership" without this.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache virtualenv
        uses: actions/cache@v6
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: Create virtualenv (cache miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: uv venv

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Check for baseline changes without approval
        run: |
          if git diff --name-only origin/main...HEAD | grep -q 'power_pcb_dataset/corpus/.*/baseline.json'; then
            echo "Checking for baseline approval in commit messages..."
            if ! git log origin/main..HEAD --format=%B | grep -q 'Ceiling-Approval:'; then
              echo "FAIL: baseline.json modified without Ceiling-Approval in commit message"
              echo "Please add 'Ceiling-Approval: <reason>' to your commit message body."
              exit 2
            fi
            echo "Baseline-Approval found in commit message."
          fi

      # RETIRED 2026-07-27: this step invoked the JAX/benders_loop placement
      # path, which was removed from the codebase. corpus_runner.py:416-419
      # now raises NotImplementedError("JAX optimizer removed."), so every
      # board failed at setup. It was masked as "JAX nondeterministic on CI
      # runners" -- a description of flakiness, not of a deleted capability.
      # Retired rather than left masked; see docs/evidence/ for the audit.

      # RETIRED 2026-07-27: the summary table and report upload both consumed
      # regression-report.json, which was produced only by the corpus
      # regression step retired above. Nothing writes that file now.

# RETIRED 2026-07-27: the update-cache job existed to fold regression-report
# artifacts into power_pcb_dataset/corpus/.regression-cache.json. With the
# corpus run retired there are no reports to fold, so it updated nothing.
# The baseline-approval gate above is kept: corpus baselines still have live
# consumers (scripts/quarantine_report.py, the PR scorecard tests).
