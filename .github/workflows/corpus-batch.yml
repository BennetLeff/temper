name: Corpus Batch Validation

on:
  schedule:
    - cron: '0 4 * * 0'  # weekly Sunday 4am UTC
  workflow_dispatch:      # manual trigger

jobs:
  batch-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Cache virtualenv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Scan external corpus (refresh manifest)
        run: uv run python scripts/scan_external_corpus.py

      # Removed 2026-08-07: dead weight. batch_pipeline_validate.py catches
      # every per-board failure and quarantines it rather than re-raising --
      # there is no path in main() that exits non-zero, so this mask could
      # never fire. Separately (not a masking issue, flagged for whoever
      # owns the corpus pipeline): benchmarks/downloads_digital_iot/ is
      # gitignored and nothing in this workflow populates it in a fresh CI
      # checkout, so this step currently validates 0 real boards in CI.
      - name: Batch pipeline validation
        run: uv run python scripts/batch_pipeline_validate.py --max-boards 80

      # Removed 2026-08-07: dead weight. quarantine_report.py can exit
      # non-zero (regressions/new failures), but only when fed real
      # quarantine entries -- the step above never produces any (see its
      # comment), so this has never had anything to fail on.
      - name: Quarantine report
        run: uv run python scripts/quarantine_report.py

      - name: Upload quarantine artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quarantine-${{ github.run_id }}
          path: power_pcb_dataset/quarantine/

      - name: Upload manifest artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: corpus-manifest-${{ github.run_id }}
          path: benchmarks/downloads_digital_iot/manifest.yaml
