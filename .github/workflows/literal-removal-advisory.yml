name: Literal-Removal Advisory

# PR runs grouped per PR number, cancelled when superseded; main runs grouped
# per SHA and never cancelled. Rationale: python-tests.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:

jobs:
  advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    # The check runs one `git grep` over the whole repo per removed literal, so
    # a large PR diff makes it slow. It used to crash out in ~16s on a decode
    # error, which hid that; with the crash fixed it runs to completion and
    # would otherwise inherit the 6-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run literal-removal check
        run: python3 scripts/literal_removal_check.py --base ${{ github.event.pull_request.base.sha }}
