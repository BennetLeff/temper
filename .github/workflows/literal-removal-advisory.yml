name: Literal-Removal Advisory

# Runs once per merge to main, NOT per pull-request push.
#
# scripts/literal_removal_check.py "always exits 0" by its own docstring, so
# this job can never block a merge -- its only output is text for a human to
# read. (Until 2026-08-07 this job also carried a job-level
# `continue-on-error: true`; removed as dead weight once confirmed the script
# genuinely never returns non-zero, so the mask never had anything to
# guard.)
#
# On the PR path that made it pure capacity consumption. Measured 2026-08-03:
# the account ceiling is ~24 concurrent jobs while a single push already
# requests ~40, and 4 of these were in flight at once against 33 open PRs. Each
# run is a full-history checkout (`fetch-depth: 0`) plus one `git grep` over the
# whole repo per removed literal, budgeted at 15 minutes.
#
# Coverage of what actually LANDS is unchanged: on a squash merge,
# `github.event.before` is the previous main tip, so the diff analysed here is
# exactly the merged PR's diff. What is lost is pre-merge visibility -- the
# advice now arrives just after a merge rather than just before one. That is the
# deliberate trade: a check that cannot fail does not justify holding a runner
# slot away from the checks that can.
# Keyed on the BRANCH, not the SHA. A per-SHA group is a group of one, so
# nothing is ever superseded and every push to main adds a permanent queue
# entry: measured 2026-08-06, seven of these were queued simultaneously, the
# oldest three hours stale, while main's actual verification could not get a
# runner. Keying on the ref means a newer push supersedes an older one, which
# is the whole point of a concurrency group.
#
# Cancelling is safe here for the reason given above -- this advisory cannot
# fail a build, and its verdict is about a commit that a newer push has already
# replaced. It is recomputed from scratch on every run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# no-pr-trigger: advisory only -- scripts/literal_removal_check.py "always
# exits 0" by its own docstring, so it can never block a merge. Running it per merge
# instead of per PR push analyses exactly the same diffs (on a squash merge
# github.event.before is the previous main tip) at a fraction of the runner
# cost.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  advisory:
    runs-on: ubuntu-latest
    # Removed 2026-08-07: dead weight, confirmed by running the script
    # directly (`python3 scripts/literal_removal_check.py --base HEAD~1`,
    # exit 0). scripts/literal_removal_check.py's own docstring says it
    # "always exits 0", and reading main() confirms every code path returns
    # 0; the one thing that could raise (an invalid diff base) is already
    # prevented by the "Resolve diff base" step above, which falls back to
    # HEAD~1 (guaranteed to resolve given fetch-depth: 0) whenever
    # github.event.before is unusable. This job-level mask could never fire.
    # The header comment above already asserted this; this just makes the
    # code match what the comment already claimed.
    # The check runs one `git grep` over the whole repo per removed literal, so
    # a large diff makes it slow. It used to crash out in ~16s on a decode
    # error, which hid that; with the crash fixed it runs to completion and
    # would otherwise inherit the 6-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `github.event.before` is all-zeros on a branch's first push and can be
      # unreachable after a force-push, so fall back to the first parent rather
      # than letting `git diff` fail the step.
      - name: Resolve diff base
        id: base
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE="$(git rev-parse HEAD~1)"
          fi
          echo "ref=$BEFORE" >> "$GITHUB_OUTPUT"

      - name: Run literal-removal check
        run: python3 scripts/literal_removal_check.py --base "${{ steps.base.outputs.ref }}"
