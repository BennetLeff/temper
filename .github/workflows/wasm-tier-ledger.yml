name: WASM R19 Agreement Ledger

on:
  workflow_run:
    workflows: ["WASM Tier Nightly Sweep (R19 Agreement)"]
    types: [completed]
    branches: [main]
  # The nightly is expected at 04:40 UTC.  This independent 07:10 census is
  # beyond the 90-minute grace period, so a run that never started cannot
  # disappear from the evidence record.
  schedule:
    - cron: '10 7 * * *'
  workflow_dispatch:
    inputs:
      nightly_run_id:
        description: 'Optional completed WASM Tier Nightly run to reconcile'
        required: false
        type: string

concurrency:
  group: wasm-r19-agreement-ledger
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  reconcile:
    name: Validate and append R19 evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always execute trusted ledger code from main.  Candidate artifacts are
      # data only: this workflow never checks out or executes their contents.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Preserve trusted reconciler
        run: |
          cp tools/wasm/r19_agreement_ledger.py /tmp/r19_agreement_ledger.py
          cp tools/wasm/wasm_tier_topology.json /tmp/wasm_tier_topology.json

      - name: Download untrusted nightly candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          DISPATCH_RUN_ID: ${{ inputs.nightly_run_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r19-candidates
          source_run_id="${WORKFLOW_RUN_ID:-${DISPATCH_RUN_ID:-}}"
          if [ -n "${source_run_id}" ]; then
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${source_run_id}" \
              > /tmp/r19-source-run.json
            gh run download "${source_run_id}" \
              --pattern 'r19-ledger-candidate-*' \
              --dir /tmp/r19-candidates \
              || echo "::warning::run ${source_run_id} published no R19 candidate artifact"
          fi

      - name: Census today's expected scheduled run
        if: ${{ github.event_name != 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          day="$(date -u +%Y-%m-%d)"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/wasm-tier-nightly.yml/runs?event=schedule&created=${day}&per_page=100" \
            --jq '{workflow_runs: [.workflow_runs[] | {event: .event, status: .status, conclusion: .conclusion, run_id: (.id | tostring), run_attempt: .run_attempt, expected_schedule_slot: (.created_at[0:10] + "T04:40:00Z")}]}' \
            > /tmp/r19-run-census.json
          echo "${day}T04:40:00Z" > /tmp/r19-expected-slot.txt

      - name: Check out the serialized evidence branch
        run: |
          set -euo pipefail
          branch="evidence/r19-agreement-ledger"
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            git fetch origin "${branch}"
            git checkout -B "${branch}" "origin/${branch}"
          else
            git checkout -b "${branch}" origin/main
          fi
          git rev-parse HEAD > /tmp/r19-ledger-start-head.txt
          test -f tools/wasm/r19_agreement_ledger.jsonl
          python3 /tmp/r19_agreement_ledger.py validate \
            --ledger tools/wasm/r19_agreement_ledger.jsonl
          cp tools/wasm/r19_agreement_ledger.jsonl /tmp/r19-ledger-before.jsonl

      - name: Reconcile candidates and watchdog slot
        run: |
          set -euo pipefail
          ledger=tools/wasm/r19_agreement_ledger.jsonl
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          if find /tmp/r19-candidates -type f -size +1M -print -quit | grep -q .; then
            echo '::error::R19 candidate artifact exceeds the 1 MiB data-only limit.'
            exit 1
          fi

          while IFS= read -r -d '' candidate; do
            # One candidate per artifact preserves one accepted row per commit.
            jq -e 'type == "object"' "${candidate}" >/dev/null
            test -s /tmp/r19-source-run.json
            python3 /tmp/r19_agreement_ledger.py validate-source-run \
              --candidate "${candidate}" \
              --run-metadata /tmp/r19-source-run.json \
              --workflow-path .github/workflows/wasm-tier-nightly.yml \
              --branch main
            python3 /tmp/r19_agreement_ledger.py append \
              --ledger "${ledger}" --candidate "${candidate}"
            if ! git diff --quiet -- "${ledger}"; then
              sequence="$(tail -n 1 "${ledger}" | jq -r '.sequence')"
              git add "${ledger}"
              git commit -m "chore(wasm): append R19 agreement row ${sequence}" -- "${ledger}"
            fi
          done < <(find /tmp/r19-candidates -type f -name '*.json' -print0 | sort -z)

          if [ -f /tmp/r19-run-census.json ]; then
            while IFS= read -r candidate; do
              python3 /tmp/r19_agreement_ledger.py watchdog \
                --ledger "${ledger}" \
                --candidate-name "${candidate}" \
                --expected-slot "$(cat /tmp/r19-expected-slot.txt)" \
                --run-census /tmp/r19-run-census.json \
                --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --grace-minutes 90
              if ! git diff --quiet -- "${ledger}"; then
                sequence="$(tail -n 1 "${ledger}" | jq -r '.sequence')"
                git add "${ledger}"
                git commit -m "chore(wasm): record missing R19 result ${sequence}" -- "${ledger}"
              fi
            done < <(
              jq -r '(.promotion_candidates // [])[] | if type == "string" then . else .crate end' \
                /tmp/wasm_tier_topology.json
            )
          fi
          python3 /tmp/r19_agreement_ledger.py validate --ledger "${ledger}"
          python3 /tmp/r19_agreement_ledger.py validate-append-only \
            --previous /tmp/r19-ledger-before.jsonl \
            --ledger "${ledger}"

      - name: Push evidence branch without rewriting history
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" = "$(cat /tmp/r19-ledger-start-head.txt)" ]; then
            echo 'No new ledger rows to push.'
            exit 0
          fi
          git push origin HEAD:refs/heads/evidence/r19-agreement-ledger
