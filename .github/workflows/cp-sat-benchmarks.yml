name: CP-SAT Benchmarks

# PR runs grouped per PR number, cancelled when superseded; main runs grouped
# per SHA and never cancelled. Rationale: python-tests.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    branches: [main]
    paths: ['packages/temper-placer/src/**','packages/temper-placer/configs/**','benchmarks/**','.github/workflows/cp-sat-benchmarks.yml']
# Opt-in (2026-08-04). This workflow's only output is an uploaded
# `cp_sat_metrics.jsonl` artifact: nothing reads it during the PR, no comment
# is posted, and its contexts ("benchmarks (trivial)" / "benchmarks (small)")
# are not in `.github/required-checks.json`'s `required_contexts`, so it
# cannot fail a merge. It fires on `packages/temper-placer/src/**` for a
# measured median of 2 jobs and 7.4 job-minutes per push, against an account
# ceiling of ~24 concurrent jobs. Add the `ci-advisory` label to a PR when the
# benchmark numbers are actually wanted for that change.
jobs:
  benchmarks:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'ci-advisory')
    container:
      image: ghcr.io/bennetleff/temper-ci:latest
      options: --user root
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario: [trivial, small]
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {version: "latest", enable-cache: true}
      - name: Cache virtualenv
        uses: actions/cache@v6
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}
      - name: Create virtualenv (cache miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: uv venv
      - run: uv sync --all-packages
      - run: uv run python benchmarks/cp_sat_bench.py --scenario ${{ matrix.scenario }} --output benchmarks/results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cp-sat-bench-${{ matrix.scenario }}
          path: benchmarks/results/cp_sat_metrics.jsonl
          retention-days: 30
