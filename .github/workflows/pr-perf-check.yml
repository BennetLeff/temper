name: PR Performance Check

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'packages/**'

jobs:
  perf-check:
    name: PR Performance Comparison
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bennetleff/temper-ci:latest
      options: --user root
    timeout-minutes: 20
    permissions:
      pull-requests: write
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # This job runs in a container as root while the workspace is checked out
      # by the runner user. actions/checkout marks the repo safe only under its
      # own temporary HOME, so later `run:` steps get "detected dubious
      # ownership" and exit 128. Mark it safe for root's real gitconfig.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: Create virtualenv (cache miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: uv venv

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Profile PR branch
        id: profile
        run: |
          uv run temper profile run \
            --module all --board temper \
            --commit "${{ github.event.pull_request.head.sha }}" \
            --json > pr-metrics.jsonl
          cat pr-metrics.jsonl

      - name: Fetch main-branch JSONL
        run: |
          git fetch origin main --depth=100
          git show origin/main:power_pcb_dataset/metrics/pipeline_metrics.jsonl \
            > main-pipeline_metrics.jsonl 2>/dev/null || echo "" > main-pipeline_metrics.jsonl

      - name: Compare and comment
        continue-on-error: true  # JSON parse race in PR comments; temper-N6-U8 -- hard-fail after 2026-09-01
        run: |
          REPORT=$(uv run python scripts/pr_perf_compare.py \
            --pr-metrics pr-metrics.jsonl \
            --main-jsonl main-pipeline_metrics.jsonl)
          echo "PR_PERF_REPORT<<EOF" >> "$GITHUB_ENV"
          echo "$REPORT" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Post PR comment
        uses: actions/github-script@v9
        with:
          script: |
            const body = process.env.PR_PERF_REPORT || "Performance comparison failed.";
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.body.startsWith("## Performance Comparison"));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
