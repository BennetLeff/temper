name: PR Performance Check

# PR runs grouped per PR number, cancelled when superseded. Non-PR runs are
# CAPTURE runs and are grouped per RUN, never cancelled. Rationale:
# python-tests.yml.
#
# 2026-08-05: the non-PR key was `github.sha`, which silently defeated the
# `workflow_dispatch` trigger that exists immediately below for "topping the
# baseline up on demand". Every dispatch against a given ref carries the SAME
# sha, so all of them landed in ONE concurrency group; with
# `cancel-in-progress: false` GitHub keeps only the newest PENDING run per
# group and cancels the rest. Measured: six dispatches issued back-to-back on
# main produced FOUR `cancelled` and one survivor.
#
# That capped on-demand capture at one row per sitting, against a baseline
# convention of n=6 per stage -- and n=1 is the exact defect the push trigger
# below was added to fix (see its comment: a single row makes the "rolling
# median of the trailing 5" a no-op, and ordinary runner variance then trips
# the 20% margin; PR #544 was reported as a +26.6% regression by a runtime
# no-op). A capture path that cannot capture more than one sample cannot
# repair that.
#
# `github.run_id` is unique per run, so each capture gets its own group and
# they all execute. This does NOT weaken supersession where it matters: the
# `pull_request` branch of the expression is unchanged, so a superseded PR push
# still cancels its predecessor. Capture runs are samples, not gates -- there
# is nothing to supersede, and discarding one discards data.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      # Wave 4 R2 widens this beyond `packages/**` to the surfaces that now
      # carry the A/B harness itself. It deliberately does NOT widen to all of
      # `scripts/**`: no migrated code lives there today, and CI is
      # capacity-bound (~24 concurrent job ceiling against ~40 requested per
      # push), so a blanket widen would cost slots for no coverage. Add the
      # specific path when a migrated surface lands under scripts/.
      - 'packages/**'
      - 'benchmarks/**'
      - 'scripts/pr_perf_compare.py'
      - 'scripts/tests/test_pr_perf_compare.py'
      - 'scripts/tests/test_perf_ab_oracle_paths.py'
      - 'power_pcb_dataset/metrics/perf_ab_baseline.jsonl'
      - '.github/workflows/pr-perf-check.yml'

  # 2026-08-04: the capture path. Until this trigger existed the workflow ran on
  # `pull_request` ONLY, so no row could ever be measured on main -- yet
  # scripts/pr_perf_compare.py takes a rolling median of the trailing 5 rows per
  # (module, board, stage), and benchmarks/perf_ab.py's capture docs say
  # "prefer several runs from main once they exist". They could not exist. The
  # committed baseline sat at n=1 per stage, so the "median" was that single
  # row, no smoothing was applied at all, and ordinary runner variance tripped
  # the 20% margin: PR #544 (a one-line typing.cast(), a runtime no-op in a
  # module the benchmark does not even touch) was reported as a +26.6%
  # regression on hard_blocked_batch while wall times in the same run moved
  # +42.5% and +57.8%. n=1 was the bug; this trigger is the fix.
  #
  # Same paths as the PR trigger: a main push that could not have changed the
  # measurement should not spend a runner slot (CI here is capacity-bound).
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'benchmarks/**'
      - 'scripts/pr_perf_compare.py'
      - 'scripts/tests/test_pr_perf_compare.py'
      - 'scripts/tests/test_perf_ab_oracle_paths.py'
      - 'power_pcb_dataset/metrics/perf_ab_baseline.jsonl'
      - '.github/workflows/pr-perf-check.yml'

  # Manual capture, for topping the baseline up on demand rather than waiting
  # for main pushes to land in the trigger paths.
  workflow_dispatch:

jobs:
  perf-check:
    # The job name is the check-run context registered in
    # .github/required-checks.json. It stays "PR Performance Comparison" even
    # though the job now also runs on main pushes: renaming it would unregister
    # the required context. Two modes, one job -- see the `if:` conditions
    # below for which steps belong to which.
    name: PR Performance Comparison
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bennetleff/temper-ci:latest
      options: --user root
    timeout-minutes: 20
    permissions:
      pull-requests: write
      actions: read
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
      BASELINE_PATH: power_pcb_dataset/metrics/perf_ab_baseline.jsonl
      # On `pull_request` this is the PR head; on `push`/`workflow_dispatch`
      # `github.event.pull_request.head.sha` is the empty string, which GitHub
      # expressions treat as falsy, so it falls through to the pushed SHA.
      MEASURED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # This job runs in a container as root while the workspace is checked out
      # by the runner user. actions/checkout marks the repo safe only under its
      # own temporary HOME, so later `run:` steps get "detected dubious
      # ownership" and exit 128. Mark it safe for root's real gitconfig.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache virtualenv
        uses: actions/cache@v6
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: Create virtualenv (cache miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: uv venv

      - name: Install dependencies
        run: uv sync --all-packages

      # The unit tests for the comparator (scripts/tests/test_pr_perf_compare.py)
      # are a trigger path of this workflow -- both the PR and the push trigger
      # list them, and the script itself is too -- but until this step they ran
      # NOWHERE: this workflow had no pytest step, and no job in python-tests.yml
      # owns the perf gate (its scripts/tests steps sit next to the gate each
      # test belongs to, and this gate lives in THIS workflow, not in
      # python-tests.yml). A regression in pr_perf_compare.py therefore passed
      # CI silently. This step closes that hole. It runs in BOTH modes like the
      # A/B itself -- the suite is pure-python and finishes in under a second,
      # and the push/capture mode is exactly where the windowing logic is most
      # likely to bit-rot unseen. Placed before the A/B: a broken comparator
      # fails here for pennies instead of after a ~5-20 minute measurement.
      - name: Run perf-compare unit tests
        run: uv run python -m pytest scripts/tests/test_pr_perf_compare.py -q

      # Static check that every oracle/fixture perf_ab.py loads by path still
      # exists. `packages/**` is in this workflow's trigger paths, so the PR
      # that deletes an oracle runs this -- which is the whole point: #1411
      # deleted two of them, this file was missed in the sweep, and the harness
      # only said so at run time, as a traceback naming the FIRST one. The
      # second was invisible behind it for four days. Placed with the
      # comparator's tests and before the A/B, same reasoning as above: a
      # dangling path fails here for pennies, with both names, instead of
      # after the measurement.
      - name: Run perf_ab oracle-path guard
        run: uv run python -m pytest scripts/tests/test_perf_ab_oracle_paths.py -q

      # The performance A/B runs both arms -- the verbatim pre-migration Python
      # oracle and the Rust kernel that replaced it -- in one process, and
      # reports their ratio. See benchmarks/perf_ab.py for why the ratio, and
      # not an absolute wall time, is the gated metric.
      #
      # This replaced `temper profile run --module all`, which emitted
      # `wall_time_ms: 0` for every record (profile_pipeline times a dataclass
      # constructor, not the pipeline) and polluted its own NDJSON stream with
      # the router benchmark's progress prints. Evidence: run 30885725905.
      #
      # Runs in BOTH modes. On a PR it is the measurement under test; on a main
      # push it is the baseline sample. Identical command, identical container,
      # so the two are comparable by construction -- which is the whole point
      # of capturing on CI rather than locally (see benchmarks/perf_ab.py for
      # the measured -11% darwin-vs-linux platform bias).
      - name: Run the performance A/B
        run: |
          uv run python benchmarks/perf_ab.py \
            --commit "$MEASURED_SHA" \
            --json > perf-metrics.jsonl
          cat perf-metrics.jsonl

      # The baseline is read from main, never from the PR checkout: a PR must
      # not be able to move the bar it is being measured against. An absent
      # file yields an empty baseline, which the comparison fails closed on.
      - name: Fetch the committed baseline from main
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --depth=100
          git show "origin/main:$BASELINE_PATH" > main-perf-baseline.jsonl 2>/dev/null \
            || : > main-perf-baseline.jsonl
          wc -l main-perf-baseline.jsonl

          # main's benchmark registry, so the comparator can tell a benchmark
          # that is NEW to main (no baseline can exist yet -- the baseline is
          # read from main, and main does not have this code) from one that
          # exists on main and is missing its row (the vacuity case, which
          # still fails closed). Without this file every unbaselined key stays
          # NO_BASELINE, so a fetch failure degrades to the strict behaviour.
          git show "origin/main:benchmarks/perf_ab.py" > main-perf-ab.py 2>/dev/null \
            || : > main-perf-ab.py
          git show "origin/main:scripts/pr_perf_compare.py" > main-pr-perf-compare.py 2>/dev/null \
            || : > main-pr-perf-compare.py
          python3 - <<'EOF' > main-benchmarks.tsv
          import ast, pathlib
          src = pathlib.Path("main-perf-ab.py").read_text()
          keys = []
          try:
              tree = ast.parse(src)
          except SyntaxError:
              tree = None
          if tree is not None:
              for node in ast.walk(tree):
                  if not isinstance(node, ast.AnnAssign):
                      continue
                  tgt = getattr(node.target, "id", None)
                  if tgt != "_BENCHMARKS" or not isinstance(node.value, ast.Dict):
                      continue
                  for k in node.value.keys:
                      if isinstance(k, ast.Tuple) and len(k.elts) == 2:
                          a, b = k.elts
                          if isinstance(a, ast.Constant) and isinstance(b, ast.Constant):
                              keys.append((a.value, b.value))
          for module, stage in keys:
              print(f"{module}\t{stage}")
          EOF
          wc -l main-benchmarks.tsv

      # A baseline-changing PR may use its candidate only after the reviewed
      # validator has proved an append-only five-run capture and unchanged
      # benchmark-owned inputs. Ordinary PRs keep the main baseline
      # unconditionally. The API identity checks below are independent of the
      # validator, and the validator itself must come from origin/main. A PR
      # cannot bootstrap schema 2 by executing its own approval code.
      - name: Validate reviewed baseline refresh (if requested)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          REFRESH_MANIFEST: power_pcb_dataset/metrics/perf_ab_baseline_refresh/manifest.json
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "BASELINE_FOR_COMPARE=main-perf-baseline.jsonl" >> "$GITHUB_ENV"
          if git diff --quiet origin/main...HEAD -- "$BASELINE_PATH"; then
            echo "No candidate baseline change; comparison remains pinned to origin/main."
            exit 0
          fi
          test -s "$REFRESH_MANIFEST" || {
            echo "::error::Baseline changed without a reviewed refresh manifest: $REFRESH_MANIFEST" >&2
            exit 1
          }

          # The manifest records five distinct successful Actions
          # run/artifact identities.  Verify every identity through the
          # GitHub API before trusting the committed evidence bytes.  A green
          # local-looking JSON file cannot stand in for a real capture run.
          verify_run() {
            local run_id="$1" expected_sha="$2"
            local run_json
            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            test "$(jq -r '.status' <<<"$run_json")" = completed
            test "$(jq -r '.conclusion' <<<"$run_json")" = success
            test "$(jq -r '.event' <<<"$run_json")" = workflow_dispatch
            test "$(jq -r '.head_sha' <<<"$run_json" | tr '[:upper:]' '[:lower:]')" = "${expected_sha,,}"
            test "$(jq -r '.workflow_id' <<<"$run_json")" = 303796920
            test "$(jq -r '.path' <<<"$run_json")" = .github/workflows/pr-perf-check.yml
          }
          capture_sha="$(jq -r '.primary_capture.capture_sha' "$REFRESH_MANIFEST")"
          test "$capture_sha" != "null"
          jq -e '.primary_capture.captures | length == 5' "$REFRESH_MANIFEST" >/dev/null
          while read -r run_id artifact_id evidence expected_hash; do
            test -n "$run_id" && test -n "$artifact_id" && test -n "$evidence" && test -n "$expected_hash"
            verify_run "$run_id" "$capture_sha"
            artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}")"
            test "$(jq -r '.workflow_run.id' <<<"$artifact_json")" = "$run_id"
            test "$(jq -r '.expired' <<<"$artifact_json")" = false
            test "$(jq -r '.name' <<<"$artifact_json")" = "perf-ab-baseline-rows-${run_id}-1"
            test -f "$evidence"
            archive="$(mktemp)"
            extracted="$(mktemp)"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$archive"
            unzip -Z1 "$archive" | grep -Fx 'perf-metrics.jsonl' >/dev/null
            unzip -p "$archive" perf-metrics.jsonl > "$extracted"
            test "$(sha256sum "$extracted" | awk '{print $1}')" = "${expected_hash,,}"
            cmp -- "$extracted" "$evidence"
          done < <(jq -r '.primary_capture.captures[] | [.workflow_run_id, .artifact_id, .artifact, .artifact_sha256] | @tsv' "$REFRESH_MANIFEST")

          mapfile -t changed_paths < <(git diff --name-only origin/main...HEAD)
          validator_dir="$(mktemp -d)"
          git show origin/main:scripts/validate_perf_capture.py > "$validator_dir/validate_perf_capture.py" 2>/dev/null || {
            echo "::error::Trusted baseline-refresh validator is not yet present on origin/main" >&2
            exit 1
          }
          git show origin/main:scripts/pr_perf_compare.py > "$validator_dir/pr_perf_compare.py" 2>/dev/null || {
            echo "::error::Trusted performance comparator is not present on origin/main" >&2
            exit 1
          }
          args=(
            --baseline main-perf-baseline.jsonl
            --candidate-baseline "$BASELINE_PATH"
            --baseline-refresh-manifest "$REFRESH_MANIFEST"
            --validated-margins-output "$RUNNER_TEMP/validated-perf-margins.json"
            --registry benchmarks/perf_ab.py
            --repo-root "$GITHUB_WORKSPACE"
          )
          for changed_path in "${changed_paths[@]}"; do
            args+=(--changed-path "$changed_path")
          done
          grep -q 'BASELINE_REFRESH_SCHEMA_VERSION = 2' "$validator_dir/validate_perf_capture.py" || {
            echo "::error::origin/main does not yet support baseline-refresh schema 2" >&2
            exit 1
          }
          python3 "$validator_dir/validate_perf_capture.py" "${args[@]}"
          test -s "$RUNNER_TEMP/validated-perf-margins.json"
          echo "VALIDATED_MARGINS_JSON=$RUNNER_TEMP/validated-perf-margins.json" >> "$GITHUB_ENV"
          echo "BASELINE_FOR_COMPARE=$BASELINE_PATH" >> "$GITHUB_ENV"

      # 2026-08-04 (Wave 4 Phase 0, R2): `continue-on-error: true` removed. It
      # cited `temper-N6-U8`, a placeholder ticket id shared across 27 masks and
      # documented as a stub in
      # docs/plans/2026-07-25-002-refactor-baseline-burndown-plan.md:37, whose
      # own requirement is that stubs be replaced with an explicit dated
      # decision. This is that decision: the performance A/B is a hard merge
      # gate, and a comparison that cannot be made fails closed.
      #
      # The mask's stated reason -- "JSON parse race in PR comments" -- was not
      # what it was hiding. It was hiding a traceback: the comparison had been
      # crashing on every run since the profiler began emitting NDJSON, and the
      # job reported success anyway. Comment posting is the step that can
      # legitimately race, so that step -- not this one -- carries
      # `if: always()`, and it reports its own failures.
      #
      # PR-ONLY. On main this step is skipped, deliberately:
      #   * There is no PR to block, so a failure here would be pure noise on
      #     the trunk-health signal -- and this repo has no push-side
      #     protection, so a red main run is inherited by every branch cut from
      #     it as a false alarm.
      #   * It would be self-referential. main's own rows ARE the baseline, so
      #     comparing a main run against them is asking a sample whether it
      #     matches the median of its own population; it can only ever report
      #     runner variance, and would fail exactly when a sample is most
      #     valuable -- the tail readings are what make the median robust.
      #   * A regression that reaches main is a post-merge fact. The gate that
      #     is supposed to stop it is this same job on the PR, and the answer
      #     to one that got through is a revert, not a second red X.
      # Capture on main, gate on PRs.
      - name: Compare against baseline (hard gate)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          compare_args=(
            --pr-metrics perf-metrics.jsonl
            --baseline-jsonl "$BASELINE_FOR_COMPARE"
            --main-benchmarks main-benchmarks.tsv
            --report-file perf-report.md
          )
          if [[ -n "${VALIDATED_MARGINS_JSON:-}" ]]; then
            compare_args+=(--validated-margins-json "$VALIDATED_MARGINS_JSON")
          fi
          python3 main-pr-perf-compare.py "${compare_args[@]}"

      # CAPTURE-ONLY (main / manual). Emits the measured rows two ways: as a
      # downloadable artifact, and inline in the job summary so the append is a
      # copy-paste with no artifact download.
      #
      # These rows are NOT auto-committed, and that is a decision, not an
      # omission. A bot with write access to main is a separate risk surface
      # with its own review (this repo already has one such path --
      # metrics-record.yml's "Auto-tighten timing baselines" -- and it ships
      # default-OFF behind the FEATURE_AUTO_BASELINE_TIGHTEN repo variable,
      # which is the precedent). It is also the wrong default *for this file*:
      # the baseline is the bar a hard merge gate is measured against, every
      # appended row moves it, and a row is only valid if the commit that
      # produced it did not modify the benchmarked code -- a judgement no
      # unattended push can make. An automated appender that silently ratchets
      # the bar on a bad row is strictly worse than a stale baseline, because
      # the stale one is visible in the diff. Human-in-the-loop append keeps
      # every baseline change reviewable in a PR, which is where it belongs.
      # If auto-commit is ever wanted, do it as metrics-reconcile.yml does --
      # a separate workflow that globs these artifacts and opens a PR.
      - name: Publish the captured baseline rows
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "## Performance A/B baseline capture"
            echo
            echo "Commit: \`$MEASURED_SHA\`"
            echo
            echo "Append these rows to \`$BASELINE_PATH\` **only if this commit"
            echo "does not modify the benchmarked code** (the module named in"
            echo "each row). The comparison medians the trailing 5 rows per"
            echo "(module, board, stage), so 5+ rows per stage is the target;"
            echo "trim the oldest rows once well past that."
            echo
            echo '```jsonl'
            cat perf-metrics.jsonl
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the captured baseline rows
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: perf-ab-baseline-rows-${{ github.run_id }}-${{ github.run_attempt }}
          path: perf-metrics.jsonl

      # PR-ONLY: `context.issue.number` is undefined on a push event, so this
      # step would hard-error there.
      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const body = fs.existsSync("perf-report.md")
              ? fs.readFileSync("perf-report.md", "utf8")
              : "## Performance Comparison\n\nThe performance A/B did not reach " +
                "the point of producing a report. See the job log.";
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.body.startsWith("## Performance Comparison"));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
