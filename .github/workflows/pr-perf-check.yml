name: PR Performance Check

# PR runs grouped per PR number, cancelled when superseded; main runs grouped
# per SHA and never cancelled. Rationale: python-tests.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      # Wave 4 R2 widens this beyond `packages/**` to the surfaces that now
      # carry the A/B harness itself. It deliberately does NOT widen to all of
      # `scripts/**`: no migrated code lives there today, and CI is
      # capacity-bound (~24 concurrent job ceiling against ~40 requested per
      # push), so a blanket widen would cost slots for no coverage. Add the
      # specific path when a migrated surface lands under scripts/.
      - 'packages/**'
      - 'benchmarks/**'
      - 'scripts/pr_perf_compare.py'
      - 'scripts/tests/test_pr_perf_compare.py'
      - 'power_pcb_dataset/metrics/perf_ab_baseline.jsonl'
      - '.github/workflows/pr-perf-check.yml'

  # 2026-08-04: the capture path. Until this trigger existed the workflow ran on
  # `pull_request` ONLY, so no row could ever be measured on main -- yet
  # scripts/pr_perf_compare.py takes a rolling median of the trailing 5 rows per
  # (module, board, stage), and benchmarks/perf_ab.py's capture docs say
  # "prefer several runs from main once they exist". They could not exist. The
  # committed baseline sat at n=1 per stage, so the "median" was that single
  # row, no smoothing was applied at all, and ordinary runner variance tripped
  # the 20% margin: PR #544 (a one-line typing.cast(), a runtime no-op in a
  # module the benchmark does not even touch) was reported as a +26.6%
  # regression on hard_blocked_batch while wall times in the same run moved
  # +42.5% and +57.8%. n=1 was the bug; this trigger is the fix.
  #
  # Same paths as the PR trigger: a main push that could not have changed the
  # measurement should not spend a runner slot (CI here is capacity-bound).
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'benchmarks/**'
      - 'scripts/pr_perf_compare.py'
      - 'scripts/tests/test_pr_perf_compare.py'
      - 'power_pcb_dataset/metrics/perf_ab_baseline.jsonl'
      - '.github/workflows/pr-perf-check.yml'

  # Manual capture, for topping the baseline up on demand rather than waiting
  # for main pushes to land in the trigger paths.
  workflow_dispatch:

jobs:
  perf-check:
    # The job name is the check-run context registered in
    # .github/required-checks.json. It stays "PR Performance Comparison" even
    # though the job now also runs on main pushes: renaming it would unregister
    # the required context. Two modes, one job -- see the `if:` conditions
    # below for which steps belong to which.
    name: PR Performance Comparison
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bennetleff/temper-ci:latest
      options: --user root
    timeout-minutes: 20
    permissions:
      pull-requests: write
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
      BASELINE_PATH: power_pcb_dataset/metrics/perf_ab_baseline.jsonl
      # On `pull_request` this is the PR head; on `push`/`workflow_dispatch`
      # `github.event.pull_request.head.sha` is the empty string, which GitHub
      # expressions treat as falsy, so it falls through to the pushed SHA.
      MEASURED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # This job runs in a container as root while the workspace is checked out
      # by the runner user. actions/checkout marks the repo safe only under its
      # own temporary HOME, so later `run:` steps get "detected dubious
      # ownership" and exit 128. Mark it safe for root's real gitconfig.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache virtualenv
        uses: actions/cache@v6
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: Create virtualenv (cache miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: uv venv

      - name: Install dependencies
        run: uv sync --all-packages

      # The performance A/B runs both arms -- the verbatim pre-migration Python
      # oracle and the Rust kernel that replaced it -- in one process, and
      # reports their ratio. See benchmarks/perf_ab.py for why the ratio, and
      # not an absolute wall time, is the gated metric.
      #
      # This replaced `temper profile run --module all`, which emitted
      # `wall_time_ms: 0` for every record (profile_pipeline times a dataclass
      # constructor, not the pipeline) and polluted its own NDJSON stream with
      # the router benchmark's progress prints. Evidence: run 30885725905.
      #
      # Runs in BOTH modes. On a PR it is the measurement under test; on a main
      # push it is the baseline sample. Identical command, identical container,
      # so the two are comparable by construction -- which is the whole point
      # of capturing on CI rather than locally (see benchmarks/perf_ab.py for
      # the measured -11% darwin-vs-linux platform bias).
      - name: Run the performance A/B
        run: |
          uv run python benchmarks/perf_ab.py \
            --commit "$MEASURED_SHA" \
            --json > perf-metrics.jsonl
          cat perf-metrics.jsonl

      # The baseline is read from main, never from the PR checkout: a PR must
      # not be able to move the bar it is being measured against. An absent
      # file yields an empty baseline, which the comparison fails closed on.
      - name: Fetch the committed baseline from main
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --depth=100
          git show "origin/main:$BASELINE_PATH" > main-perf-baseline.jsonl 2>/dev/null \
            || : > main-perf-baseline.jsonl
          wc -l main-perf-baseline.jsonl

      # 2026-08-04 (Wave 4 Phase 0, R2): `continue-on-error: true` removed. It
      # cited `temper-N6-U8`, a placeholder ticket id shared across 27 masks and
      # documented as a stub in
      # docs/plans/2026-07-25-002-refactor-baseline-burndown-plan.md:37, whose
      # own requirement is that stubs be replaced with an explicit dated
      # decision. This is that decision: the performance A/B is a hard merge
      # gate, and a comparison that cannot be made fails closed.
      #
      # The mask's stated reason -- "JSON parse race in PR comments" -- was not
      # what it was hiding. It was hiding a traceback: the comparison had been
      # crashing on every run since the profiler began emitting NDJSON, and the
      # job reported success anyway. Comment posting is the step that can
      # legitimately race, so that step -- not this one -- carries
      # `if: always()`, and it reports its own failures.
      #
      # PR-ONLY. On main this step is skipped, deliberately:
      #   * There is no PR to block, so a failure here would be pure noise on
      #     the trunk-health signal -- and this repo has no push-side
      #     protection, so a red main run is inherited by every branch cut from
      #     it as a false alarm.
      #   * It would be self-referential. main's own rows ARE the baseline, so
      #     comparing a main run against them is asking a sample whether it
      #     matches the median of its own population; it can only ever report
      #     runner variance, and would fail exactly when a sample is most
      #     valuable -- the tail readings are what make the median robust.
      #   * A regression that reaches main is a post-merge fact. The gate that
      #     is supposed to stop it is this same job on the PR, and the answer
      #     to one that got through is a revert, not a second red X.
      # Capture on main, gate on PRs.
      - name: Compare against baseline (hard gate)
        if: github.event_name == 'pull_request'
        run: |
          uv run python scripts/pr_perf_compare.py \
            --pr-metrics perf-metrics.jsonl \
            --baseline-jsonl main-perf-baseline.jsonl \
            --report-file perf-report.md

      # CAPTURE-ONLY (main / manual). Emits the measured rows two ways: as a
      # downloadable artifact, and inline in the job summary so the append is a
      # copy-paste with no artifact download.
      #
      # These rows are NOT auto-committed, and that is a decision, not an
      # omission. A bot with write access to main is a separate risk surface
      # with its own review (this repo already has one such path --
      # metrics-record.yml's "Auto-tighten timing baselines" -- and it ships
      # default-OFF behind the FEATURE_AUTO_BASELINE_TIGHTEN repo variable,
      # which is the precedent). It is also the wrong default *for this file*:
      # the baseline is the bar a hard merge gate is measured against, every
      # appended row moves it, and a row is only valid if the commit that
      # produced it did not modify the benchmarked code -- a judgement no
      # unattended push can make. An automated appender that silently ratchets
      # the bar on a bad row is strictly worse than a stale baseline, because
      # the stale one is visible in the diff. Human-in-the-loop append keeps
      # every baseline change reviewable in a PR, which is where it belongs.
      # If auto-commit is ever wanted, do it as metrics-reconcile.yml does --
      # a separate workflow that globs these artifacts and opens a PR.
      - name: Publish the captured baseline rows
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "## Performance A/B baseline capture"
            echo
            echo "Commit: \`$MEASURED_SHA\`"
            echo
            echo "Append these rows to \`$BASELINE_PATH\` **only if this commit"
            echo "does not modify the benchmarked code** (the module named in"
            echo "each row). The comparison medians the trailing 5 rows per"
            echo "(module, board, stage), so 5+ rows per stage is the target;"
            echo "trim the oldest rows once well past that."
            echo
            echo '```jsonl'
            cat perf-metrics.jsonl
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the captured baseline rows
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: perf-ab-baseline-rows-${{ github.run_id }}-${{ github.run_attempt }}
          path: perf-metrics.jsonl

      # PR-ONLY: `context.issue.number` is undefined on a push event, so this
      # step would hard-error there.
      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const body = fs.existsSync("perf-report.md")
              ? fs.readFileSync("perf-report.md", "utf8")
              : "## Performance Comparison\n\nThe performance A/B did not reach " +
                "the point of producing a report. See the job log.";
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.body.startsWith("## Performance Comparison"));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
