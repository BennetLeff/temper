name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - 'packages/**'
  pull_request:
    branches: [main]
    paths:
      - 'firmware/**'
      - 'packages/**'
  schedule:
    - cron: '0 8 * * 1'  # Mondays 08:00 UTC

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        continue-on-error: true  # SARIF processing bug on GitHub side; temper-N6-U8 -- hard-fail after 2026-09-01
