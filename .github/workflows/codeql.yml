name: CodeQL

# no-pr-trigger: per-PR CodeQL cost ~40 runs/day x ~25min (~17h/day) for zero
# merge impact (not in required-checks.json); every merge is scanned on
# push-to-main and the Monday schedule catches deprecation drift. See the
# comment in the `on:` block below for the full reasoning.

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - 'packages/**'
  # pull_request trigger removed 2026-08-01: ~40 PR-triggered runs/day at
  # ~25 min each (~17h/day of runner time) with zero merge impact -- CodeQL is
  # not in .github/required-checks.json's required_contexts. Every merge still
  # gets scanned on push to main (the run that matters for SARIF/history), and
  # the Monday schedule is a catch-all for deprecation drift. Restore the PR
  # trigger if per-PR CodeQL feedback becomes a merge requirement.
  schedule:
    - cron: '0 8 * * 1'  # Mondays 08:00 UTC

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        continue-on-error: true  # SARIF processing bug on GitHub side; temper-N6-U8 -- hard-fail after 2026-09-01
