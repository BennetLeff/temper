name: WASM exact-head preview publisher and status

# workflow_run is base-owned even when the source artifact was built from a
# fork. No publisher step checks out the PR head or executes artifact content.
on:
  workflow_run:
    workflows: ["WASM candidate preview artifact"]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-preview:
    name: Publish and sweep immutable preview
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-wasm-preview
    permissions:
      actions: read
      contents: read
      pull-requests: read
      checks: write
    steps:
      - name: Initialize non-secret diagnostic directory
        run: mkdir -p /tmp/preview-diagnostics

      - name: Check out base-owned publisher controls only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up fixed Node host
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Set up fixed Python host
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Download base-owned exact-head source identity
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wasm-preview-source-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: /tmp/preview-source
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download only the exact source-run artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wasm-pr-preview-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: /tmp/untrusted-preview
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Resolve artifact source and the exact old-head pending check
        id: source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require("node:fs");
            const run = context.payload.workflow_run;
            if (!run || run.event !== "pull_request_target") throw new Error("unexpected source workflow event");
            const manifest = JSON.parse(fs.readFileSync("/tmp/untrusted-preview/manifest.json", "utf8"));
            const source = manifest.source ?? {};
            if (source.run_id !== run.id || source.run_attempt !== run.run_attempt) throw new Error("artifact run identity mismatch");
            if (!Number.isSafeInteger(source.pull_request_number) || source.pull_request_number <= 0) throw new Error("artifact PR identity mismatch");
            const number = source.pull_request_number;
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            if (source.head_repository !== pr.head.repo.full_name) throw new Error("artifact head repository mismatch");
            const expectedExternal = ["temper-wasm-preview-v1", run.id, run.run_attempt, number, source.head_sha].join(":");
            const { data } = await github.rest.checks.listForRef({ ...context.repo, ref: source.head_sha, per_page: 100 });
            const matches = data.check_runs.filter((item) => item.name === "Cloudflare exact-head WASM preview" && item.external_id === expectedExternal);
            if (matches.length !== 1) throw new Error(`expected one producer-bound pending check on artifact head, got ${matches.length}`);
            core.setOutput("pr", String(number));
            core.setOutput("head_sha", source.head_sha);
            core.setOutput("head_repository", source.head_repository);
            core.setOutput("check_id", String(matches[0].id));
            core.setOutput("run_id", String(run.id));
            core.setOutput("run_attempt", String(run.run_attempt));

      - name: Validate, upload, sweep, compare, and preserve diagnostics
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_TOKEN }}
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          PR_NUMBER: ${{ steps.source.outputs.pr }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          HEAD_REPOSITORY: ${{ steps.source.outputs.head_repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo '::error::CLOUDFLARE_API_TOKEN is empty. This protected step maps it from repository secret CF_TOKEN; Wrangler reads only CLOUDFLARE_API_TOKEN.'
            exit 1
          fi
          mkdir -p /tmp/preview-diagnostics /tmp/preview-stage
          printf 'started\n' > /tmp/preview-diagnostics/stages.txt
          production_guard=0
          finalize() {
            rc=$?
            trap - EXIT
            rm -f /tmp/preview-stage/secrets.json
            if [ "${production_guard}" = 1 ]; then
              if ! "${WRANGLER}" deployments list --config /tmp/preview-stage/wrangler.toml --json > /tmp/preview-diagnostics/production-after.json \
                || ! node tools/wasm/preview_version.mjs production-invariant --before /tmp/preview-diagnostics/production-before.json --after /tmp/preview-diagnostics/production-after.json; then
                rc=1
              else
                printf 'production_unchanged\n' >> /tmp/preview-diagnostics/stages.txt
              fi
            fi
            rm -rf /tmp/preview-stage
            exit "${rc}"
          }
          trap finalize EXIT

          gh api "repos/${HEAD_REPOSITORY}/contents/tools/wasm/wasm_tier_topology.json?ref=${HEAD_SHA}" \
            --jq .content | base64 --decode > /tmp/head-preview-topology.json
          node tools/wasm/tier_topology.mjs preview-candidate --topology tools/wasm/wasm_tier_topology.json > /tmp/base-preview-candidate.json
          node tools/wasm/tier_topology.mjs preview-candidate --topology /tmp/head-preview-topology.json > /tmp/head-preview-candidate.json
          if ! cmp -s /tmp/base-preview-candidate.json /tmp/head-preview-candidate.json; then
            echo '::error::head preview control contract differs from the base-owned contract'
            exit 1
          fi
          node tools/wasm/tier_topology.mjs validate-preview \
            --topology /tmp/head-preview-topology.json \
            --artifact-dir /tmp/untrusted-preview \
            > /tmp/preview-diagnostics/revalidated-manifest.json
          node tools/wasm/preview_version.mjs validate-artifact \
            --manifest /tmp/untrusted-preview/manifest.json \
            --repository "${GITHUB_REPOSITORY}" --pr "${PR_NUMBER}" \
            --head-sha "${HEAD_SHA}" --run-id "${SOURCE_RUN_ID}" \
            --run-attempt "${SOURCE_RUN_ATTEMPT}" \
            --output /tmp/preview-diagnostics/publisher-manifest.json
          BASE_EXPECTED_PATH="$(jq -r .expected_failures_source /tmp/base-preview-candidate.json)"
          node tools/wasm/preview_version.mjs validate-expected-failures \
            --candidate /tmp/untrusted-preview/expected-failures.json \
            --base "${GITHUB_WORKSPACE}/${BASE_EXPECTED_PATH}"
          printf 'artifact_validated\n' >> /tmp/preview-diagnostics/stages.txt

          MODULE_NAME="$(jq -r '.candidate.staged_module' /tmp/untrusted-preview/manifest.json)"
          WASM_SHA256="$(jq -r '.census.wasm_sha256' /tmp/untrusted-preview/manifest.json)"
          TEST_COUNT="$(jq -r '.census.registered' /tmp/untrusted-preview/manifest.json)"
          COMPARATOR_SHA256="$(sha256sum tools/wasm/r19_compare.py | cut -d' ' -f1)"
          CONTRACT_SHA256="$(node tools/wasm/preview_version.mjs contract-digest \
            --candidate temper-io-types --census /tmp/untrusted-preview/census.json \
            --expected-failures /tmp/untrusted-preview/expected-failures.json \
            --topology /tmp/head-preview-topology.json --comparator-sha256 "${COMPARATOR_SHA256}" \
            --abi immutable-worker-v1)"

          cp "/tmp/untrusted-preview/${MODULE_NAME}" /tmp/preview-stage/candidate.wasm
          cp /tmp/untrusted-preview/expected-failures.json /tmp/preview-stage/expected-failures.json
          cp packages/temper-worker/src/worker_core.js /tmp/preview-stage/worker_core.js
          cp packages/temper-worker/src/preview_worker_core.js /tmp/preview-stage/preview_worker_core.js
          printf '{"sha256":"%s"}\n' "${WASM_SHA256}" > /tmp/preview-stage/module-digest.json
          cat > /tmp/preview-stage/index.js <<'EOF'
          import CANDIDATE from "./candidate.wasm";
          import EXPECTED from "./expected-failures.json";
          import DIGEST from "./module-digest.json";
          import { createWorker } from "./worker_core.js";
          import { createPreviewWorker } from "./preview_worker_core.js";
          export default createPreviewWorker(createWorker(CANDIDATE, EXPECTED, DIGEST.sha256));
          EOF

          CAPABILITY="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n')"
          EXPIRES_AT="$(( $(date +%s) + 1800 ))"
          cat > /tmp/preview-stage/wrangler.toml <<EOF
          name = "temper-wasm-io-types"
          main = "index.js"
          compatibility_date = "2026-08-01"
          account_id = "03f642afe070f05b727f7cd31f02ef48"
          preview_urls = true

          [limits]
          cpu_ms = 1000

          [version_metadata]
          binding = "CF_VERSION_METADATA"

          [vars]
          ABI_VERSION = "1"
          PREVIEW_EXPIRES_AT = "${EXPIRES_AT}"
          PREVIEW_MAX_TESTS = "10000"
          PREVIEW_HEAD_SHA = "${HEAD_SHA}"
          PREVIEW_MODULE_SHA256 = "${WASM_SHA256}"
          PREVIEW_COMPARISON_CONTRACT_SHA256 = "${CONTRACT_SHA256}"
          PREVIEW_SERVICE = "temper-wasm-io-types"
          EOF
          umask 077
          printf '{"PREVIEW_CAPABILITY":"%s"}\n' "${CAPABILITY}" > /tmp/preview-stage/secrets.json

          WRANGLER_RUNTIME=tools/wasm/wrangler-preview-runtime
          test "$(jq -r '.packages["node_modules/wrangler"].integrity' "${WRANGLER_RUNTIME}/package-lock.json")" = \
            'sha512-jNXy9e8/pbx8iqTzXPiuflnitKJZoAfEUSUUDLW87bwyeMvJ7kb3yQMSbxEcfNdfHqJW38KRcKaLljOYV4N/4w=='
          npm ci --prefix "${WRANGLER_RUNTIME}" --ignore-scripts --no-audit --no-fund
          test "$(node -p 'require("./tools/wasm/wrangler-preview-runtime/node_modules/wrangler/package.json").version')" = 4.128.0
          WRANGLER="${GITHUB_WORKSPACE}/${WRANGLER_RUNTIME}/node_modules/.bin/wrangler"
          "${WRANGLER}" deployments list --config /tmp/preview-stage/wrangler.toml --json \
            > /tmp/preview-diagnostics/production-before.json
          production_guard=1

          TAG="$(node --input-type=module -e '
            import { makeUploadTag } from "./tools/wasm/preview_version.mjs";
            process.stdout.write(makeUploadTag({ repository: process.env.GITHUB_REPOSITORY, pr: Number(process.env.PR_NUMBER), headSha: process.env.HEAD_SHA, runId: Number(process.env.SOURCE_RUN_ID), runAttempt: Number(process.env.SOURCE_RUN_ATTEMPT) }));
          ')"
          MESSAGE="${GITHUB_REPOSITORY} PR #${PR_NUMBER} head ${HEAD_SHA} run ${SOURCE_RUN_ID} attempt ${SOURCE_RUN_ATTEMPT}"
          # `versions upload` may fail after rendering diagnostic output. Disable
          # errexit until that output has been scrubbed so a failing command can
          # never bypass the capability-leak guard below.
          set +e
          "${WRANGLER}" versions upload /tmp/preview-stage/index.js \
            --config /tmp/preview-stage/wrangler.toml --secrets-file /tmp/preview-stage/secrets.json \
            --tag "${TAG}" --message "${MESSAGE}" \
            > /tmp/preview-diagnostics/upload.txt 2>&1
          upload_rc=$?
          set -e
          rm -f /tmp/preview-stage/secrets.json
          TEMPER_PREVIEW_CAPABILITY="${CAPABILITY}" node tools/wasm/preview_version.mjs \
            scrub-upload --upload-output /tmp/preview-diagnostics/upload.txt \
            --exit-code "${upload_rc}"
          if grep -R -Fq "${CLOUDFLARE_API_TOKEN}" /tmp/preview-diagnostics; then
            echo '::error::Cloudflare API token reached diagnostic output; deleting diagnostics rather than logging or publishing it'
            rm -rf /tmp/preview-diagnostics
            exit 1
          fi
          cat /tmp/preview-diagnostics/upload.txt
          node tools/wasm/preview_version.mjs parse-upload \
            --upload-output /tmp/preview-diagnostics/upload.txt --service temper-wasm-io-types \
            --output /tmp/preview-diagnostics/upload-identity.json
          "${WRANGLER}" versions list --config /tmp/preview-stage/wrangler.toml --json \
            > /tmp/preview-diagnostics/versions.json
          node tools/wasm/preview_version.mjs resolve-version \
            --versions /tmp/preview-diagnostics/versions.json --tag "${TAG}" \
            --service temper-wasm-io-types --output /tmp/preview-diagnostics/resolved-version.json
          VERSION_ID="$(jq -r '.id' /tmp/preview-diagnostics/upload-identity.json)"
          PREVIEW_URL="$(jq -r '.preview_url' /tmp/preview-diagnostics/upload-identity.json)"
          test "$(jq -r '.id' /tmp/preview-diagnostics/resolved-version.json)" = "${VERSION_ID}"
          printf 'version_uploaded\n' >> /tmp/preview-diagnostics/stages.txt

          healthy=false
          propagation_delays=(2 4 8 16 30 30 30)
          for attempt in {0..7}; do
            code="$(curl --silent --show-error --max-time 20 \
              -H "x-temper-preview-capability: ${CAPABILITY}" \
              -o /tmp/preview-diagnostics/health.json -w '%{http_code}' "${PREVIEW_URL}/health" || true)"
            if [ "${code}" = 200 ]; then healthy=true; break; fi
            if [ "${attempt}" -lt 7 ]; then sleep "${propagation_delays[attempt]}"; fi
          done
          test "${healthy}" = true
          node tools/wasm/preview_version.mjs validate-health \
            --health /tmp/preview-diagnostics/health.json --head-sha "${HEAD_SHA}" \
            --wasm-sha256 "${WASM_SHA256}" --contract-sha256 "${CONTRACT_SHA256}" \
            --service temper-wasm-io-types --version-id "${VERSION_ID}" \
            --test-count "${TEST_COUNT}" --abi-version 1
          printf 'health_verified\n' >> /tmp/preview-diagnostics/stages.txt

          TEMPER_PREVIEW_CAPABILITY="${CAPABILITY}" node tools/wasm/sweep_multi_worker.mjs \
            --tier temper-io-types --preview-url "${PREVIEW_URL}" --concurrency 64 \
            --request-timeout-ms 20000 --max-retries 2 \
            --json /tmp/preview-diagnostics/sweep.json
          python3 tools/wasm/r19_compare.py \
            --native-file /tmp/untrusted-preview/native_raw.txt \
            --wasm-json /tmp/preview-diagnostics/sweep.json \
            --expected-failures /tmp/untrusted-preview/expected-failures.json \
            --commit "${HEAD_SHA}" --output /tmp/preview-diagnostics/r19.json \
            --fail-on-disagree
          if grep -R -Fq "${CAPABILITY}" /tmp/preview-diagnostics \
            || grep -R -Fq "${CLOUDFLARE_API_TOKEN}" /tmp/preview-diagnostics; then
            echo '::error::preview credential reached diagnostic output; deleting diagnostics rather than publishing it'
            rm -rf /tmp/preview-diagnostics
            exit 1
          fi
          printf 'sweep_and_r19_verified\n' >> /tmp/preview-diagnostics/stages.txt

      - name: Re-read PR head before authoritative completion
        id: revalidate
        if: ${{ always() && !cancelled() }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require("node:fs");
            const identity = JSON.parse(fs.readFileSync("/tmp/preview-source/preview-source-identity.json", "utf8"));
            const number = Number("${{ steps.source.outputs.pr }}") || identity.pull_request_number;
            const expectedHead = "${{ steps.source.outputs.head_sha }}" || identity.head_sha;
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            core.setOutput("current", String(pr.state === "open" && !pr.draft && pr.head.sha === expectedHead));

      - name: Upload diagnostics for every non-cancelled exit
        id: diagnostics
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wasm-preview-verdict-${{ steps.source.outputs.run_id }}-${{ steps.source.outputs.run_attempt }}
          path: /tmp/preview-diagnostics
          if-no-files-found: error
          retention-days: 30

      - name: Complete producer-bound check
        if: ${{ always() && !cancelled() }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require("node:fs");
            const publishOk = "${{ steps.publish.outcome }}" === "success";
            const current = "${{ steps.revalidate.outputs.current }}" === "true";
            const diagnosticsOk = "${{ steps.diagnostics.outcome }}" === "success";
            const identity = JSON.parse(fs.readFileSync("/tmp/preview-source/preview-source-identity.json", "utf8"));
            let checkId = Number("${{ steps.source.outputs.check_id }}");
            if (!checkId) {
              const identity = JSON.parse(fs.readFileSync("/tmp/preview-source/preview-source-identity.json", "utf8"));
              const { data } = await github.rest.checks.listForRef({ ...context.repo, ref: identity.head_sha, per_page: 100 });
              const matches = data.check_runs.filter((item) => item.name === "Cloudflare exact-head WASM preview" && item.external_id === identity.external_id);
              if (matches.length !== 1) throw new Error(`cannot recover exact pending check: ${matches.length} matches`);
              checkId = matches[0].id;
            }
            await github.rest.checks.update({
              ...context.repo,
              check_run_id: checkId,
              status: "completed",
              conclusion: publishOk && diagnosticsOk && current ? "success" : (current ? "failure" : "cancelled"),
              completed_at: new Date().toISOString(),
              output: {
                title: publishOk && diagnosticsOk && current ? "Exact PR-head Worker agrees with native" : (current ? "Preview publication, evidence, or verdict failed" : "PR head changed before publication"),
                summary: `Source run ${identity.run_id} attempt ${identity.run_attempt}; immutable diagnostics are attached to this publisher run.`,
              },
            });

  terminalize-source-failure:
    name: Terminalize failed source build
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: read
      checks: write
    steps:
      - name: Download base-owned exact-head source identity
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wasm-preview-source-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: /tmp/preview-source
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Fail the exact pending record if it still exists
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require("node:fs");
            const run = context.payload.workflow_run;
            const identity = JSON.parse(fs.readFileSync("/tmp/preview-source/preview-source-identity.json", "utf8"));
            if (identity.run_id !== run.id || identity.run_attempt !== run.run_attempt) throw new Error("source identity artifact mismatch");
            const { data } = await github.rest.checks.listForRef({ ...context.repo, ref: identity.head_sha, per_page: 100 });
            for (const check of data.check_runs.filter((item) => item.name === "Cloudflare exact-head WASM preview" && item.external_id === identity.external_id && item.status !== "completed")) {
              await github.rest.checks.update({ ...context.repo, check_run_id: check.id, status: "completed", conclusion: run.conclusion === "cancelled" ? "cancelled" : "failure", completed_at: new Date().toISOString(), output: { title: "Credential-free source build did not complete", summary: `Source workflow conclusion: ${run.conclusion}. Open the linked run for diagnostics or approve the fork run if GitHub is waiting for approval.` } });
            }

  reconcile-pending:
    name: Reconcile orphaned preview checks
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pull-requests: read
      checks: write
    steps:
      - name: Download recent base-owned source identities, including old heads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/preview-source-identities
          gh run list --workflow wasm-tier-preview-verdict.yml --event pull_request_target \
            --limit 100 --json databaseId --jq '.[].databaseId' > /tmp/preview-run-ids.txt
          while IFS= read -r run_id; do
            [ -n "${run_id}" ] || continue
            mkdir -p "/tmp/preview-source-identities/${run_id}"
            gh run download "${run_id}" --pattern 'wasm-preview-source-*' \
              --dir "/tmp/preview-source-identities/${run_id}" >/dev/null 2>&1 || true
          done < /tmp/preview-run-ids.txt

      - name: Close orphaned or expired pending checks
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            function files(dir) {
              if (!fs.existsSync(dir)) return [];
              return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
                const item = path.join(dir, entry.name);
                return entry.isDirectory() ? files(item) : (entry.name === "preview-source-identity.json" ? [item] : []);
              });
            }
            const now = Date.now();
            for (const file of files("/tmp/preview-source-identities")) {
              const identity = JSON.parse(fs.readFileSync(file, "utf8"));
              const { data } = await github.rest.checks.listForRef({ ...context.repo, ref: identity.head_sha, per_page: 100 });
              for (const check of data.check_runs.filter((item) => item.name === "Cloudflare exact-head WASM preview" && item.external_id === identity.external_id && item.status !== "completed")) {
                const runId = identity.run_id;
                const age = now - Date.parse(check.started_at ?? check.created_at);
                let source = null;
                try { source = (await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: runId })).data; } catch (error) { if (error.status !== 404) throw error; }
                const approvalPending = source?.status === "waiting" || source?.status === "requested";
                if (approvalPending && age <= 24 * 60 * 60_000) continue;
                const sourceCompletedAt = Date.parse(source?.updated_at ?? source?.run_started_at ?? source?.created_at ?? "");
                const sourceCompletedAge = source?.status === "completed"
                  ? (Number.isFinite(sourceCompletedAt) ? now - sourceCompletedAt : age)
                  : null;
                const orphan = !source || (source.status === "completed" && sourceCompletedAge > 30 * 60_000);
                const deadline = source?.status !== "completed" && age > 60 * 60_000;
                if (!orphan && !deadline) continue;
                await github.rest.checks.update({ ...context.repo, check_run_id: check.id, status: "completed", conclusion: orphan ? "failure" : "timed_out", completed_at: new Date().toISOString(), output: { title: orphan ? "Preview publisher did not complete" : "Preview verdict deadline expired", summary: approvalPending ? "The approval window expired before the credential-free fork build started." : "Re-run the exact-head preview workflow; this pending record failed closed instead of disappearing." } });
              }
            }
