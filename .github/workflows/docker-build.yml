name: Docker CI Image

on:
  push:
    branches: [main, feat/hybrid-pour-trace-stitch]
    paths:
      - '.github/docker/ci.Dockerfile'
      - '.github/workflows/docker-build.yml'
      - 'uv.lock'
      - 'packages/*/Cargo.lock'
      - 'packages/temper-placer/temper-constraints/Cargo.lock'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-ci

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag from lock files
        id: tag
        run: |
          HASH=$(cat uv.lock packages/*/Cargo.lock packages/temper-placer/temper-constraints/Cargo.lock 2>/dev/null | sha256sum | cut -c1-12)
          echo "hash=${HASH}" >> "$GITHUB_OUTPUT"
          echo "full=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${HASH}" >> "$GITHUB_OUTPUT"
          echo "latest=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"

      - name: Check if image already exists
        id: check
        run: |
          if docker manifest inspect "${{ steps.tag.outputs.full }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image already exists, skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Build and push
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/ci.Dockerfile
          push: true
          tags: |
            ${{ steps.tag.outputs.full }}
            ${{ steps.tag.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
