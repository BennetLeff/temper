name: Lint Workflows

# PR runs grouped per PR number, cancelled when superseded; main runs grouped
# per SHA and never cancelled. Rationale: python-tests.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Download actionlint
        shell: bash
        run: bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7

      - name: Lint workflow files
        shell: bash
        env:
          # Only fail on shellcheck errors, not style/info suggestions, so the
          # gate catches real bugs (bad indentation, duplicate keys, unknown
          # actions/labels) without churning on pre-existing style nits.
          SHELLCHECK_OPTS: --severity=error
        run: ./actionlint -color -ignore 'constant expression "false" in condition'

      - name: Check pull_request trigger coverage
        run: python3 scripts/check_workflow_pr_triggers.py
