          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

      - name: Verify temper-constraints loads
        run: uv run python3 -c "import temper_constraints"
        env:
          RUST_BACKTRACE: full

      - name: Install dependencies
        run: >
          uv sync --all-packages --inexact
          --no-install-package temper-rust-router
          --no-install-package temper-drc-rs
          --no-install-package temper-constraints

      - name: Cache netlist
        id: cache-netlist
        uses: actions/cache@v6
        with:
          path: elec/build
          key: netlist-${{ hashFiles('elec/src/**', 'elec/ato.yaml', 'Makefile') }}

      - name: Build electronics netlist
        if: steps.cache-netlist.outputs.cache-hit != 'true'
        run: make netlist

      - name: Run invariant tests (io, deterministic, physics, fields, cp_sat, metrics)
        working-directory: packages/temper-placer
        run: >
          uv run python ../../scripts/pytest_guard.py --min-tests 2350 --
          tests/io/ tests/deterministic/ tests/physics/ tests/fields/ tests/placer/cp_sat/ tests/metrics/
          -v --tb=short -p no:cacheprovider --maxfail=10 -m "not slow"
          --continue-on-collection-errors -n auto --dist loadgroup
        # Re-measured to completion 2026-08-07 on this exact invocation:
        # 3147 passed, 14 failed, 14 skipped, 1 xfailed in 135s (exit 2 --
        # xdist stopped at the --maxfail=10 bound, overshooting to 14).
        # pytest_guard floor satisfied at 3161 executed. NOT flakiness --
        # every failure is deterministic and falls in one of three buckets:
        #
        #   9  need KiCad and this host has none -- 7 in
        #      tests/placer/cp_sat/test_erc_gate.py (kicad-cli absent) and 2
        #      in tests/io/test_finepitch_production_board.py (footprint
        #      library absent). These pass in the pinned CI container
        #      (.github/docker/ci.Dockerfile, kicad 10.0.5), so they are a
        #      local-environment artifact, not a CI failure.
        #   4  self-invalidating discriminator PRECONDITIONS in the physics
        #      differential suites, e.g. test_device_power_rust_differential
        #      .py:223 `assert x**2 != x*x, "test input must discriminate
        #      pow(x,2.0) from x*x"` -- on this libm/CPU the two are bit-
        #      equal for the chosen input, so the test invalidates its own
        #      premise before testing anything. A test-design issue that
        #      varies with the math library, not a product defect.
        #   1  an exact float-equality assertion failing by one ULP
        #      (test_zone_aware_slot_generation_pbt.py:73, 51.926515850281426
        #      vs 51.92651585028143), found by Hypothesis search. Brittle
        #      assertion; the closest thing here to genuine run-to-run
        #      variance, and it is still a test bug, not product behaviour.
        #
        # Kept masked because 14 red tests would block trunk today, but the
        # "parallel test suite flakiness" label was wrong: nothing here is
        # an xdist race. Removable once the four discriminator preconditions
        # and the one ULP assertion are fixed -- after which the only
        # remaining failures are KiCad-dependent and already pass in CI.
        continue-on-error: true

      # Wave 4 Phase 4: the validation collection is a HARD gate on trunk
      # (no continue-on-error), unlike the other collections above which
      # keep their documented parallel-flakiness mask. The anti-vacuity
      # differentials are additionally hard-gated in the PR `test` job.
      # The two --deselects are PRE-EXISTING trunk failures unrelated to
      # this PR, previously hidden by the step-wide mask; unmasking without
      # first fixing them would turn trunk red, so they are isolated and
      # documented instead:
      #   * test_mfem_runner.py::test_check_mfem_binary_present asserts a
      #     binary at /tmp/mfem_tempsolve that no CI environment builds
      #     (the CI image does not compile MFEM); the sibling integration
      #     tests correctly skipif on its absence, this preflight does not.
      #   * test_ucc21550_contract_pbt.py::test_schematic_keeps_fault_qualified_set_dominant_wiring
      #     asserts wiring that a board redesign changed (elec/src/modules.ato).
      - name: Run validation invariant tests (hard gate)
        working-directory: packages/temper-placer
        run: >
          uv run python ../../scripts/pytest_guard.py --min-tests 590 --
          tests/validation/
          --deselect tests/validation/test_mfem_runner.py::test_check_mfem_binary_present
          --deselect tests/validation/test_ucc21550_contract_pbt.py::test_schematic_keeps_fault_qualified_set_dominant_wiring
          -v --tb=short -p no:cacheprovider --maxfail=10 -m "not slow"
          --continue-on-collection-errors -n auto --dist loadgroup
  closure:
    name: Pipeline Closure Test (Truth-Gated)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bennetleff/temper-ci:latest
      options: --user root
    timeout-minutes: 20
    # Its sole substantive step carries continue-on-error, so it cannot fail
    # any build on any trigger. Not in required-checks.json's
    # required_contexts.
    #
    # NARROWED 2026-08-11 (docs/evidence/2026-08-11-python-ci-load-inventory.md):
    # was `if: github.event_name != 'pull_request'` (every push to main, not
    # just PRs -- ~159 executing pushes/week x ~11 min, the single most
    # expensive masked job in this workflow, for a step nothing can act on).
    # Moved to schedule/workflow_dispatch only; nightly cadence (and the
    # artifact upload below, still `if: always()`) unchanged.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    env:
      VIRTUAL_ENV: /_temper-venv
      UV_PROJECT_ENVIRONMENT: /_temper-venv
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Cache netlist
        id: cache-netlist
        uses: actions/cache@v6
        with:
          path: elec/build
          key: netlist-${{ hashFiles('elec/src/**', 'elec/ato.yaml', 'Makefile') }}

      - name: Build electronics netlist
        if: steps.cache-netlist.outputs.cache-hit != 'true'
        run: make netlist

      # Still genuinely failing, verified 2026-08-07: `uv run python3
      # scripts/ci_closure_test.py --pcb pcb/temper.kicad_pcb --output ...`
      # -> exit 1, "Status: FAIL", "benders_iterations <= 0", "All
      # strategies exhausted for phase='placement': ['template',
      # 'template']". The stated reason ("observability merge race") does
      # not match: the real cause is ci_closure_test.py's PlacementStage
      # adapter still calling the removed JAX/benders_loop backend
      # (packages/temper-placer/src/temper_placer/adapters/
      # register_strategies.py:44, raises NotImplementedError) instead of
      # the CP-SAT deterministic placer -- same root cause independently
      # confirmed on the equivalent step in metrics-record.yml. `temper-N6-
      # U8` is a placeholder ticket id shared across ~27 masks (see
      # docs/evidence/2026-08-04-perf-ab-harness-noise-floor.md), not a
      # real reference. Tolerated until that adapter migration lands (same
      # blocker as metrics-record.yml's "Run closure test" step);
      # hard-failing now would turn this job red on every push for a known,
      # unrelated-to-this-PR reason.
      - name: Run closure test (truth-gated)
        run: >
          uv run python3 scripts/ci_closure_test.py
          --pcb pcb/temper.kicad_pcb
          --output closure-result.json
        continue-on-error: true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: closure-result
          path: closure-result.json

# RETIRED 2026-07-27: the `regression` job ("Performance & Quality Regression")
# had exactly two gates, `make regression` and `make perf-regression`, and both
# drove the JAX/benders_loop placement path that no longer exists. run-corpus
# reaches corpus_runner._run_board, which returns the retired-optimizer error
# for every valid board (the JAX optimizer and its stubs were removed in the
# cleanup C2 sweep); check_perf_regression.py imported `jax` and
# `temper_placer.losses.*`, both deleted from the tree. With both gates retired
# the job was setup steps and nothing else, so the job goes too. Restoring this
# coverage requires a placement strategy that still exists.

  # ---------------------------------------------------------------------------
  # `fast-gates` is the merge of four bare-runner jobs -- `loc-cap`,
  # `repo-state`, `type-check` and `known-failure-pins` -- into one slot.
  #
  # WHY. Those four are the only jobs in this workflow with no `container:`, so
  # they cannot consume the image's baked `/_temper-venv` and each one builds a
  # Python environment from scratch. The runner prologue is cheap (checkout +
  # setup-uv is ~15s); the environment is not, and it is invisible because uv
  # syncs lazily inside the first `uv run`, so the cost is billed to the gate
  # step rather than to setup. Measured on run 31048753257 (2026-08-05):
  #
  #   Known-Failure Pin Registry Gate  4.5 min -- `uv sync --all-packages` 4m18s,
  #                                    then the gate itself 0s and its unit
  #                                    tests 1s
  #   Type Check                       2.0 min -- prologue 13s, `uv run` sync +
  #                                    mypy 1m48s
  #   LOC Cap Gate                     2.0 min -- prologue 16s, `uv run` sync +
  #                                    the check 1m45s
  #   Generated Repo State             2.0 min -- prologue 17s, `uv run pytest`
  #                                    sync + tests 1m36s, the drift check 0s
  #
  # Median over 33 PR runs: 4 slots, 10.4 job-minutes, for work that is seconds.
  # Merged, the environment is built once and every gate runs against it.
  #
  # WHY NOT MOVE THEM INTO THE CONTAINER instead. A bare container job's
  # prologue is ~55s of `Initialize containers` (measured: Cargo / Rustc Smoke
  # Check, same run), and `/_temper-venv` deliberately carries third-party
  # packages only -- the 15 workspace members install editable and are not
  # baked. `check_typecheck_gate.py` compares per-file mypy counts against
  # `.typecheck-allowlist`, and mypy's counts depend on which workspace members
  # are importable, so changing that environment is a verdict-changing change to
  # a required gate. Not worth it to save 15s of prologue.
  #
  # ENVIRONMENT PARITY. `loc-cap`, `repo-state` and `type-check` today run
  # against whatever the first `uv run` syncs -- the project's default dependency
  # groups. The explicit `uv sync` below is that same set, so mypy sees exactly
  # the environment it sees now. `known-failure-pins` is the one behaviour change:
  # it drops from `uv sync --all-packages` to the default sync. That is safe by
  # inspection -- `scripts/known_failure_pins.py` imports argparse, datetime,
  # sys, dataclasses, pathlib, typing and yaml, and `_nodeid_resolves` documents
  # itself as a regex-level check specifically to avoid "spinning up the target
  # package's environment". `pyyaml` and `pytest` are both in the root `dev`
  # group, so nothing it or its unit tests import comes from a workspace member.
  #
  # GATE INDEPENDENCE. Same idiom as the 2026-07-28 split above: every gate step
  # carries `if: ${{ !cancelled() && steps.setup.outcome == 'success' }}`, so one
  # red gate still lets the others report their own verdict in the same run, and
  # a failed setup skips all of them rather than reporting them against a
  # half-built environment. `steps.setup` has no `if:` of its own -- that is what
  # keeps setup fail-fast.
  # ---------------------------------------------------------------------------
  fast-gates:
    name: Fast Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv

    steps:
      # fetch-depth: 0 is the union of the four jobs' checkouts. `loc-cap`,
      # `repo-state` and `known-failure-pins` all take full history today;
      # `type-check` takes a shallow one and does not care either way.
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      # Carried over from `type-check`. Harmless on a bare runner, and it keeps
      # every `git` call in the gate steps behaving identically if this job ever
      # moves under a root container.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache virtualenv
        uses: actions/cache@v6
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      # Explicit, so that a broken environment fails HERE -- before the barrier
      # -- instead of being billed to whichever gate step happened to be first.
      - name: Install dependencies
        run: uv sync

      - name: Setup barrier -- environment ready
        id: setup
        run: echo "environment ready"

      # The "LOC cap gate" step ran here until 2026-08-18. Retired by owner
      # decision, not erosion -- see docs/adr/2026-08-18-retire-loc-cap-gate.md.
      # Its value was as a prioritizer for the Python->Rust migration, and that
      # role is now served by a measured port list. `fast-gates` therefore
      # merges three gate steps, not four.

      # Unit tests for the generator itself -- includes an anti-vacuity check
      # that mutates DIRECTORY_PURPOSE for one real, currently-described
      # directory and asserts the completeness check still fires (exit 2).
      - name: Generator unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_gen_repo_state.py -v --tb=short

      # Deliberately NOT continue-on-error and deliberately not soft-launched.
      # The blocks are generated, so they start clean and there is nothing to
      # grandfather. Exit 1 = drift, exit 2 = tool error (missing marker,
      # undescribed directory) -- both block.
      - name: Generated repo state matches committed
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/gen_repo_state.py --check

      # The OTHER member of scripts/regen_derived.py's `PURE_GENERATORS` table.
      # That table lists the generators that are pure functions of tracked
      # source and are safe to --check anywhere: `gen_repo_state.py` (the step
      # above) and `gen_wasm_test_registry.py`, once per crate. Until this
      # step, only the first was wired to anything.
      # `grep -rn 'gen_wasm_test_registry|regen_derived|regen-check'
      # .github/workflows/` returned NOTHING: the wasm registry gate existed
      # only behind `make regen-check`, run by hand, despite its own docstring
      # calling itself "the CI drift gate".
      #
      # WHAT IT PREVENTS, both arms:
      #  1. DRIFT -- a `#[test]` added to an already-registered module does not
      #     reach the WASM verification tier until the generated `WASM_TESTS`
      #     const is regenerated and committed.
      #  2. UNREGISTERED MODULES (`check_unregistered`, added by #937) -- a
      #     whole test module that could register but is on no list. That arm
      #     exists because `packages/temper-drc-rs/src/ipc.rs`'s 11 portable
      #     tests had never registered and had never run on the tier
      #     (docs/evidence/2026-08-10-wasm-tier-u3-native-only-classification
      #     .md). It returns 1 in write mode too, because regenerating cannot
      #     invent a list entry -- it needs a human.
      #
      # Modules with a STATED reason to stay out are not failures and do not
      # trip arm 2 -- `pymath.rs::proptests` and friends are excluded as
      # `[proptest-dev-dependency]`, visible in
      # `gen_wasm_test_registry.py --census`. Verified: adding a `#[test]`
      # there leaves this step green, while adding one to `pymath::tests`
      # (registered) or removing `ipc.rs` from the eligible list turns it red.
      # So "green" here means every module is either registered or excluded
      # for a written reason -- not that nothing was looked at.
      #
      # Either way the tier would keep reporting agreement over a registry that
      # silently lags the crate: the same generated-artifact-drift family as
      # the deployed-Worker staleness control in wasm-tier-nightly.yml, one
      # layer down. That one compares deployed Workers against the commit's
      # registry; this one compares the registry against the crate's tests.
      #
      # WHY `regen_derived.py --check` IS NOT THE HANDLE. It bundles five
      # further gates (oracles, hash-order, manifest, unwired, wire-format)
      # whose verdicts are unrelated to registry drift. A gate that is red for
      # unrelated reasons is a gate people learn to ignore.
      #
      # WHY THE CRATE LIST IS DISCOVERED, NOT HARD-CODED. `--crate` arrived
      # with #937 and defaults to `temper-drc-rs`, so a bare `--check` would
      # silently gate ONE of the two crates now on the tier and leave
      # `temper-geometry`'s 724 tests unwatched -- the precise shape of the bug
      # this step exists to prevent, reintroduced by the step itself. Reading
      # `CRATES` from the script means a third crate is covered the day it is
      # added, with no edit here. If that name ever moves, the import fails
      # loudly below rather than quietly checking less.
      #
      # JOB-COUNT ARGUMENT (matching this workflow's own precedent and
      # wasm-tier-nightly.yml:13-18): +0 jobs, +0 workflows -- one step in an
      # existing job. It is a Python scan of the crates' .rs files with no
      # cargo build, well under a second inside a job already budgeted 20
      # minutes. It is NOT added to .github/required-checks.json: what blocks
      # a merge is a maintainer decision, not this step's to make.
      # The generator's own unit tests, run BEFORE the gate that depends on
      # it. `scripts/tests/` is not in pyproject's `testpaths` and this
      # workflow names each file it runs individually, so a test file added
      # there without a step here never executes -- the "unwired for its
      # entire existence" shape the step below was itself added to end.
      - name: WASM registry generator unit tests (brace scan + eligibility)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_gen_wasm_test_registry_braces.py -v --tb=short

      - name: WASM test registry matches committed (drift + unregistered gate)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # The `-e` this step's body says it does not have: `run:` defaults to
        # `bash -e {0}`, so until 2026-08-24 the first crate whose --check
        # exited non-zero killed the step. The `failed` accumulation below and
        # the ::error:: naming every stale crate were unreachable -- observed
        # on PR #1470, where the log ends at `--- temper-orchestration ---`
        # with a bare `unbalanced braces at line 814` and the five crates
        # after it never ran. An override is needed because a `run:` body
        # cannot unset a shell flag its own interpreter was started with.
        shell: bash --noprofile --norc -uo pipefail {0}
        run: |
          set -uo pipefail

          crates="$(uv run python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import gen_wasm_test_registry as g
          print(" ".join(sorted(g.CRATES)))
          PY
          )"
          if [ -z "${crates}" ]; then
            echo "::error::Could not read the crate list (CRATES) from scripts/gen_wasm_test_registry.py, so this step cannot know which registries to gate. Refusing to check a subset and report green. Fix the import in .github/workflows/python-tests.yml to match the script."
            exit 1
          fi
          echo "registries under gate: ${crates}"

          failed=""
          for crate in ${crates}; do
            echo "--- ${crate} ---"
            uv run python scripts/gen_wasm_test_registry.py --check --crate "${crate}"
            rc=$?
            if [ "${rc}" -eq 2 ]; then
              # argparse's usage-error code, and the only way this script exits
              # 2 -- main() returns 0 or 1 and its SystemExit(str) paths exit 1.
              # So this means the flag surface moved under this step. Failing
              # loudly beats guessing at flags: a drift gate that silently
              # stopped running is the exact failure this step was added to end.
              echo "::error::scripts/gen_wasm_test_registry.py rejected '--check --crate ${crate}' as a usage error (exit 2). Its argument surface has changed; update this step's invocation in .github/workflows/python-tests.yml to match. Do NOT drop the step -- the gate was unwired for its entire existence before this."
              exit 1
            fi
            if [ "${rc}" -ne 0 ]; then
              failed="${failed} ${crate}"
            fi
          done

          if [ -n "${failed}" ]; then
            echo "::error::The committed wasm32 test registry is out of date for:${failed} (see the per-crate output above for which files, or which modules hold unregistered tests). That registry is what the WASM verification tier runs, so a stale one means the tier reports agreement over a corpus smaller than this commit's. FIX: for drift, run 'python3 scripts/gen_wasm_test_registry.py --crate <name>' and commit the regenerated files; for an unregistered module, add it to that script's eligible list (or give discover_eligible() a predicate naming why it cannot register)."
            exit 1
          fi

      # The sibling of the step above, one layer further out, and unwired for
      # exactly the same reason: `grep -rn 'gen_test_family_map'
      # .github/workflows/` returned NOTHING, despite that script's own
      # docstring calling `--check` "the CI drift gate".
      #
      # The step above keeps `wasm_test_registry.rs` honest about the crate's
      # `#[test]` functions. This one keeps `tools/wasm/test_family_map.json`
      # -- the nine-family classification `tools/wasm/coverage_report.py` joins
      # against a run's results to produce the R7/R8 per-family non-vacuity
      # report -- honest about that registry.
      #
      # WHAT BEING UNWIRED COST. The gate was not merely unrun, it was BROKEN:
      # `rules/drc/property_campaigns.rs` (1,504 tests, 87% of the crate's
      # corpus) landed unclassified, so `--check` could not even produce a map
      # to compare, and six further modules behind it -- `rules::drc::
      # zone_containment`, the three `rules::safety` rules, `rules::placement::
      # thermal_constraint`, `rules::routing::isolation_barrier` -- were equally
      # unclassified and invisible. The committed map stood at 147 tests against
      # a live registry of 1,719: 1,573 registered tests, and every `safety`
      # rule module, absent from every coverage report built on it. Nothing
      # reported that, because nothing ran it. That is what this step ends.
      #
      # WHY NO `--crate` LOOP, unlike the step above. That script takes
      # `--crate` and gates six registries, so hard-coding one would have been
      # the bug it exists to prevent. This one has no such flag and cannot: it
      # imports `ELIGIBLE`/`SRC` from `gen_wasm_test_registry` at module scope,
      # which are bound to `temper-drc-rs`, and the nine rule families are a
      # `temper-drc-rs` taxonomy that the other five crates (each a single
      # degenerate family named after itself) have no analogue for. A bare
      # `--check` is therefore its full surface, not a subset of it. The other
      # crates' tests are not silently mis-filed by this: `coverage_report.py`
      # buckets anything the map does not name under `unmapped` and lists every
      # one of them in an "Unmapped Tests" section.
      #
      # It exits 0 (in sync), or 1 for any of: drift between the committed map
      # and a fresh regeneration, a registered module with no family, a map
      # entry for a module that is no longer registered, a family assignment
      # that contradicts the `wasm-registry-<family>` Cargo shard the module
      # actually compiles into, or a `canary_defects` entry naming a test that
      # no longer exists.
      #
      # JOB-COUNT ARGUMENT (same as the step above): +0 jobs, +0 workflows --
      # one step in an existing job, a Python scan of already-read .rs files,
      # well under a second. NOT added to .github/required-checks.json: what
      # blocks a merge is a maintainer decision, not this step's to make.
      - name: WASM test family map matches the registry
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # Same `-e` correction as the step above: `rc=$?` is only reachable if
        # the failing command did not already end the step.
        shell: bash --noprofile --norc -uo pipefail {0}
        run: |
          set -uo pipefail

          uv run python tools/wasm/gen_test_family_map.py --check
          rc=$?
          if [ "${rc}" -eq 2 ]; then
            # argparse's usage-error code, and the only way this script exits 2
            # -- main() returns 0 or 1 and its SystemExit(str) paths exit 1. So
            # this means the flag surface moved under this step. Failing loudly
            # beats guessing at flags: a drift gate that silently stopped
            # running is the exact failure this step was added to end.
            echo "::error::tools/wasm/gen_test_family_map.py rejected '--check' as a usage error (exit 2). Its argument surface has changed; update this step's invocation in .github/workflows/python-tests.yml to match. Do NOT drop the step -- the gate was unwired, and broken, for its entire existence before this."
            exit 1
          fi
          if [ "${rc}" -ne 0 ]; then
            echo "::error::tools/wasm/test_family_map.json disagrees with the live wasm32 test registry (see the output above for which tests or modules). That map is what tools/wasm/coverage_report.py uses to decide which rule family each tier result counts towards, so a stale one means the per-family non-vacuity report describes a corpus this commit does not have. FIX: run 'python3 tools/wasm/gen_test_family_map.py' and commit the result; if it names an unclassified module, add that module to MODULE_FAMILY in the same file first."
            exit 1
          fi

      # Validates known-failure-pins.yaml itself (see scripts/known_failure_pins.py
      # and docs/solutions/best-practices/pin-known-failure-reasons-2026-07-30.md):
      # every pin must cite a real evidence/solutions doc, stay within its
      # lifetime cap, resolve to a real test, and the registry must not exceed
      # its live-pin ratchet. This is what stops the mechanism from becoming an
      # xfail list -- a pin nobody is forced to revisit is not a pin.
      - name: Known-failure pin registry gate
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/known_failure_pins.py

      - name: Known-failure pin mechanism unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_known_failure_pins.py -v --tb=short

      - name: Type-check gate (monotonic-shrink baseline)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_typecheck_gate.py

  astar-nightly:
    name: A* 4x4 Exhaustive Verification (Nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'schedule'
    env:
      RUN_NIGHTLY: 1

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages

      - name: 4x4 exhaustive A*+Dijkstra verification
        working-directory: packages/temper-placer
        run: >
          uv run pytest tests/router_v6/test_astar_inductive_ladder.py::test_l2b_4x4_exhaustive
          -v --tb=short -m nightly
          -p no:cacheprovider
        env:
          RUN_NIGHTLY: 1
