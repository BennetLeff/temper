      - name: Verify config reference doc is up-to-date (plan 2026-07-22-005, U7)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          uv run python packages/temper-placer/scripts/gen_config_reference.py --check

      # Oracle content-hash gate (decision 2026-08-06; issues #754 P2-2, #758).
      #
      # Every _*_py_oracle.py under packages/ is a VERBATIM pin of a
      # pre-migration Python implementation that the Wave-4 differential
      # suites compare the Rust kernels against. An edit to an oracle that is
