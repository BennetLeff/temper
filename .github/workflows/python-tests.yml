  #      isn't in it), so `--dist loadgroup` schedules each of the three to
  #      whichever worker is free, same as plain `--dist load` would for
  #      ungrouped items -- `loadgroup` is still the required flag per this
  #      job's own instructions, it just isn't doing anything materially
  #      different from `load` for exactly these three items. Measured
  #      worker count on this container via a same-day `invariant-router-v6-1`
  #      log: "created: 2/2 workers" -- only 2 CPUs, so the realistic gain is
  #      running the biggest test (~880-990s) alongside the second (~210-235s)
  #      instead of after it, then picking up the third (~100-115s) on
  #      whichever worker frees first. Expected wall-clock floor is therefore
  #      close to the single largest test's own duration (~900-1000s) rather
  #      than the sum (~1225-1300s) -- a real reduction, not a full 3x, and
  #      the actual number is measured post-merge (see PR) rather than
  #      assumed, because CPU-bound subprocess tests sharing 2 cores may not
  #      scale linearly.
  #   3. Setup is not duplicated beyond what already existed after the
  #      2026-07-29 split -- both new jobs still need the full maturin/uv
  #      chain, same as every other split-out job in this file. Not attacked
  #      here since (per point above) it was never the dominant cost.
  #   4. `timeout-minutes` on `extended-cpsat-slow` is left at 25 -- the same
  #      number the combined cp-sat job already had, not a raise. Parallelism
  #      is expected to reduce, not increase, the time needed against that
  #      budget; the actual post-parallelization numbers get measured in CI
  #      before this number is revisited downward.
  #   `extended-cpsat` (this job, now just the fast remainder) drops to
  #   `timeout-minutes: 15`, matching `extended-bundle-workflow-checks`'s
  #   budget for a suite of the same "well under a minute" shape.
  extended-cpsat:
    name: Extended Test Suites (cp-sat, fast)
    # Trunk-only -- masked test step, cannot fail a PR. See the note on
    # extended-bundle-workflow-checks. This was the longest job in the run
    # (6.9 min) and gated nothing.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bennetleff/temper-ci:latest
