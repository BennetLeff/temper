jobs:
  # ---------------------------------------------------------------------------
  # Change-driven CI (plan 2026-08-02-001). The path-conditional jobs below
  # carry job-level `if:` path predicates: they run only when the PR's
  # changed files map to their manifest trigger sets (job_triggers in
  # .github/required-checks.json), the catch-all paths, or any residual
  # (unmapped) path; docs/** and **/TRACEABILITY map to nothing. This job
  # computes those decisions on every event -- on push to main, schedule and
  # workflow_dispatch it reports every job as should-run, preserving the
  # pre-conditions behavior.
  #
  # The classification script and the required-checks checker derive from the
  # SAME manifest and the SAME path_matches implementation
  # (check_required_checks.job_should_run), so a job skipped here is exactly
  # a skip the checker verifies -- an unverifiable skip fails the "Required
  # Python Tests" aggregate (fail-closed). The conditions are structurally
  # cross-checked against the manifest by validate_job_conditions in
  # scripts/check_required_checks.py, so a condition that is not a pure path
  # predicate, or a trigger set that drifted from the workflow, fails that
  # check. This job is deliberately cheap: stdlib python + `git diff` only --
  # no container, no uv, no venv.
  changes:
    name: Change Classification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # These outputs must match the manifest's job_triggers ids EXACTLY --
    # validate_job_conditions fails closed on any drift. router_v6 group 3 is
    # the only invariant shard listed because it is the only one whose test
    # step is not masked by continue-on-error, i.e. the only real gate. Groups
    # 1/2/4, invariant-rest and the extended suites are trunk-only now (see
    # their `if:` conditions), so they are deliberately absent.
    #
    # Keep this block free of interleaved comments: load_job_blocks parses it
    # line-by-line and stops at the first non-output line.
    outputs:
      cargo-smoke: ${{ steps.classify.outputs.cargo-smoke }}
      test: ${{ steps.classify.outputs.test }}
      rust-checks: ${{ steps.classify.outputs.rust-checks }}
      board-provenance-requirements-gates: ${{ steps.classify.outputs.board-provenance-requirements-gates }}
      consistency-gates: ${{ steps.classify.outputs.consistency-gates }}
      hygiene-gates: ${{ steps.classify.outputs.hygiene-gates }}
      invariant-router-v6-3: ${{ steps.classify.outputs.invariant-router-v6-3 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changed paths against manifest trigger sets
        id: classify
        run: python3 scripts/classify_changed_paths.py

  cargo-smoke:
    name: Cargo / Rustc Smoke Check
    needs: [changes]
    if: ${{ github.event_name == 'push' || needs.changes.outputs.cargo-smoke == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bennetleff/temper-ci:latest
      options: --user root
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain smoke
        run: |
          rustc --version
          cargo --version

  # ---------------------------------------------------------------------------
  # 2026-07-28: this job used to hold every gate in the pipeline -- 58 workflow
  # steps in one sequential job, most of them fail-closed gates. Because a
  # non-`continue-on-error` step failure aborts the rest of the job, ONE red gate
  # deleted the verdict of every gate behind it. Measured on main, run
  # 30390466165: "Physical mains<->SELV isolation-barrier gate" failed at step
  # 27 of 66 and steps 28-60 (33 real gate/test steps) never ran -- vulture, MPN
  # fabrication, PLL range, net classification, undeclared imports, evidence
  # provenance, capacity budget, derived-doc drift, board identity, coverage,
  # script manifest, import-linter, requirements (safety/EMC/review/DFM), the
  # extended suites. Earlier the same day a single clippy lint masked 43 steps
  # including two safety gates. The isolation gate cannot be fixed in CI at all
  # -- it reports that a physical keepout zone does not exist on the board -- so
  # it stays red until hardware work lands, masking everything behind it the
  # whole time.
  #
  # The gates are now split across independent jobs, grouped by the setup they
  # share (container + three `maturin develop` builds + `uv sync` + netlist,
  # ~130s) rather than one job per gate. No gate's command line, env, or
  # pass/fail logic changed, and no `continue-on-error` was added: the split is
  # purely about which gates can hide which.
  #
  # SECOND-ORDER FIX, same day: the split fixed masking ACROSS jobs but each job
  # was still internally sequential, so the pipeline reported at most one failure
  # per job per run. Demonstrated within hours -- three gates were fixed and each
  # fix immediately revealed a DIFFERENT failure in the same job (board-gates:
  # capacity budget #385 -> isolation barrier; provenance-gates: evidence
  # provenance #383 -> measurement provenance; hygiene-gates: vulture #387 ->
  # undeclared-import tests). Each of those was a gate that had been red all
  # along and could not be seen.
  #
  # Every gate step in the 8 split jobs now carries
  #     if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
  # An `if:` containing a status-check function suppresses the implicit
  # `success()` GitHub prepends, so the step runs even though an earlier step in
  # the job failed -- and because none of these steps is `continue-on-error`, a
  # failed gate still sets the JOB conclusion to `failure`. Independence here is
  # about reporting, never about tolerance.
  #
  # `steps.setup` is an explicit no-op barrier step placed at the end of each
  # job's setup region, and it deliberately has NO `if:` of its own. That is what
  # keeps setup fail-fast: if `maturin develop`, `uv sync` or `make netlist`
  # fails, the barrier never runs, `steps.setup.outcome` is not `success`, and
  # every gate below is SKIPPED rather than executed against a half-built
  # environment and reported as a gate verdict. The barrier must assert success
  # affirmatively -- `outcome != 'failure'` would be wrong, because a step the
  # runner never reached has an EMPTY outcome, which also satisfies
  # `!= 'failure'`.
  #
  # Consequence for ordering: putting a known-red gate last is no longer
  # load-bearing (it masks nothing wherever it sits). The existing orderings are
  # kept as-is anyway, because reordering them would be churn with no verdict
  # attached, and because two of them encode a real data dependency
  # (`Script manifest gate` before `Rebuild script invocation graph`).
  #
  # What stays in this job: the Rust extension build chain and the suites that
  # can only run once those wheels are installed.
  # ---------------------------------------------------------------------------
  test:
    name: Core Tests
    needs: [changes]
    if: ${{ github.event_name == 'push' || needs.changes.outputs.test == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bennetleff/temper-ci:latest
      options: --user root
    # Raised 15 -> 30. The 15-minute budget was only ever sufficient because
    # tests were failing fast: runs that errored early finished in 4-7 min,
    # while any run that got past them hit the wall (15.1 min here, 13.7 min on
    # followup/post-344) and was killed mid-suite. With the ON_SIDE registry
    # pollution and the uv-sync extension eviction fixed, the suite actually
    # executes end-to-end and needs the headroom. Evidence: run 30291488317
    # completed every step through "Coverage gate (temper-placer)" and was
    # cancelled inside "Run extended test suites in parallel" -- real progress,
    # not a hang.
    # Raised 30 -> 45. Run 30314210438 on main was killed at exactly
    # 30m04s (23:27:49Z -> 23:57:53Z) with no failing step -- the timeout, not a
    # defect. The job grew twice in one day: the extended suite it had been
    # skipping via a phantom path is ~14 min on its own, and the newly wired
    # safety/EMC/review requirement tests added 137 more. 45 leaves real
    # headroom rather than another 4-second miss.
    # Lowered 45 -> 35 with the 2026-07-28 gate split: the two items that drove
    # the 30 -> 45 raise (the extended suites at ~14 min, the 240 requirements
    # tests) both left this job for `extended-suites` and `requirements-tests`.
    # What remains is setup + the constraints/placer-core suites. 35 keeps the
    # same kind of headroom against a smaller job rather than trimming to fit.
    timeout-minutes: 35
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
      # CI is the environment where the Rust DRC/clearance accelerator and
      # its Python-equivalence proof are themselves under test, so a skip
      # here must not be silent -- see the presence-gate step below and
      # docs/evidence/2026-07-26-rust-backend-presence-gate.md.
      TEMPER_REQUIRE_RUST_DRC: "1"

    steps:
      - uses: actions/checkout@v7

      # Container runs as root; workspace is owned by the runner user. Without
      # this, every `git` call in a later `run:` step exits 128 on "dubious
      # ownership" rather than doing its job.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
      
      - name: Cache virtualenv
        uses: actions/cache@v6
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: Create virtualenv (cache miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: uv venv

      - name: Install maturin
        run: uv pip install maturin

      - name: Build and install Rust crate
        run: uv run maturin develop --release --manifest-path packages/temper-rust-router/Cargo.toml

      - name: Verify Rust module loads
        run: uv run python3 -c "import temper_rust_router; print('temper_rust_router loaded OK')"
        env:
          RUST_BACKTRACE: full

      - name: Build and install temper-drc-rs
        run: uv run maturin develop --release --manifest-path packages/temper-drc-rs/Cargo.toml

      - name: Verify temper-drc-rs loads
        run: uv run python3 -c "import temper_drc_rs; print('temper_drc_rs loaded OK')"
        env:
          RUST_BACKTRACE: full

      # A bare import (above) cannot detect a *stale* wheel -- one built
      # from an older revision of the crate that is missing a symbol the
      # current source registers (e.g. verify_route_clearance, added
      # 2026-07-26). This happened once already in the primary checkout:
      # the module imported fine, but the differential proof that depends
      # on the missing symbol silently skipped instead of failing. See
      # docs/evidence/2026-07-26-rust-backend-presence-gate.md.
      # TEMPER_REQUIRE_RUST_DRC=1 makes this step -- and the differential
      # test itself -- fail loudly instead of skipping, because CI is
      # exactly where the accelerator and its equivalence proof are the
      # thing under test.
      - name: Verify temper-drc-rs is fresh (presence + symbol gate)
        run: uv run python3 scripts/check_rust_drc_presence.py
        env:
          TEMPER_REQUIRE_RUST_DRC: "1"

      - name: Build and install temper-constraints
        run: >
          uv run maturin develop --release
          --manifest-path packages/temper-placer/temper-constraints/Cargo.toml
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

      - name: Verify temper-constraints loads
        run: uv run python3 -c "import temper_constraints; print('temper_constraints loaded OK, version', temper_constraints.version_py())"
        env:
          RUST_BACKTRACE: full

      # `uv sync` defaults to an *exact* sync: anything installed in the venv
      # that is not part of this invocation's resolved target set gets
      # uninstalled as "extraneous". `--no-install-package X` excludes X from
      # that target set -- it does NOT mean "leave X alone". Without
      # `--inexact`, the three flags below were therefore silently
      # UNINSTALLING the release wheels that "Build and install ..." just
      # built and "Verify ... loads" just confirmed importable, minutes
      # earlier in this same job. Reproduced locally: `uv sync --all-packages
      # --no-install-package temper-rust-router ...` (no --inexact) prints
      # "Uninstalled 2 packages" and `- temper-rust-router==0.1.0` in its
      # diff, and a subsequent bare import fails with ModuleNotFoundError.
      # `--inexact` disables the extraneous-package removal, so these three
      # packages are truly left untouched (mtimes unchanged, no rebuild)
      # instead of evicted -- confirmed locally: with --inexact added, the
      # same command reports "Audited N packages" (no install/uninstall) and
      # the modules remain importable afterward.
      - name: Install dependencies
        run: >
          uv sync --all-packages --inexact
          --no-install-package temper-rust-router
          --no-install-package temper-drc-rs
          --no-install-package temper-constraints

      # ---- SETUP / GATE BOUNDARY -------------------------------------------
      # Everything ABOVE is setup and stays fail-fast: it has no `if:`, so if
      # any of it fails this step never runs, `steps.setup_env.outcome` is not
      # `success`, and every gate below is SKIPPED rather than run against a
      # half-built environment. Everything BELOW is a gate and reports
      # independently.
      - name: Setup barrier -- extension build chain complete
        id: setup_env
        run: echo "extensions built and installed; gates below report independently"

      - name: Stale-extension gate tests
        if: ${{ !cancelled() && steps.setup_env.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_stale_extensions.py -v --tb=short

      # Build side of content-hash freshness (scripts/_lib/freshness.py).
      # Every pyo3 crate has just been built or installed from THIS
      # checkout, so the mtime comparison is correct right here and now --
      # this records that verdict as a SHA-256 of each crate's sources,
      # beside the installed .so, so it survives into a context where
      # mtimes are not correct: a restored .venv cache, or a wheel baked
      # into the CI image (~77s of `maturin develop` per job, 5-6 jobs).
      # It stamps only crates the gate below already considers fresh, so
      # it can never launder a stale artifact -- and it must therefore run
      # AFTER every build step, never alongside one.
      #
      # `--no-sync`: a bare `uv run` may auto-sync and reinstall a package,
      # which would replace the .so out from under the stamp just written
      # for it (that exact auto-sync reinstalled a stale cached wheel over
      # a freshly-built extension once already -- see
      # docs/evidence/2026-07-27-stale-extension-gate.md).
      - name: Record extension build stamps (content-hash freshness)
        if: ${{ !cancelled() && steps.setup_env.outcome == 'success' }}
        run: uv run --no-sync python scripts/write_extension_stamps.py

      # Every pyo3/maturin crate under packages/ is built by this point (the
      # three `maturin develop` steps above, plus everything `uv sync
      # --all-packages` just built/installed). TEMPER_REQUIRE_FRESH_EXTENSIONS=1
      # makes both STALE (always fatal regardless of this flag) and MISSING
      # (fatal only under this flag) hard-block CI -- see
      # scripts/check_stale_extensions.py and
      # docs/evidence/2026-07-27-stale-extension-gate.md for the incident this
      # closes: a missing .cargo/config.toml silently froze every installed
      # .so on macOS while `cargo test` stayed green.
      - name: Stale-compiled-extension gate (all pyo3 crates)
        if: ${{ !cancelled() && steps.setup_env.outcome == 'success' }}
        run: uv run python scripts/check_stale_extensions.py
        env:
          TEMPER_REQUIRE_FRESH_EXTENSIONS: "1"

      - name: Cache netlist
        id: cache-netlist
        if: ${{ !cancelled() && steps.setup_env.outcome == 'success' }}
        uses: actions/cache@v6
        with:
          path: elec/build
          key: netlist-${{ hashFiles('elec/src/**', 'elec/ato.yaml', 'Makefile') }}

      - name: Build electronics netlist
        id: netlist
        if: ${{ !cancelled() && steps.setup_env.outcome == 'success' && steps.cache-netlist.outputs.cache-hit != 'true' }}
        run: make netlist

      # Second barrier: the netlist steps above are SETUP, but they sit after
      # three gate steps, so they carry the same `!cancelled()` guard to reach
      # them at all. `steps.netlist.outcome != 'failure'` is safe only because
      # the first conjunct already establishes that `netlist` was reached: on a
      # cache hit its outcome is `skipped`, never the empty string a
      # never-evaluated step would give.
      - name: Setup barrier -- netlist available
        id: setup
        if: ${{ !cancelled() && steps.setup_env.outcome == 'success' && steps.netlist.outcome != 'failure' }}
        run: echo "netlist available; gates below report independently"

      - name: Run temper-constraints integration tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: packages/temper-placer
        run: uv run pytest tests/rust_integration/ -v --tb=short -p no:cacheprovider -m "not benchmark"
        env:
          RUST_BACKTRACE: full

      - name: Run temper-placer tests (core only for CI speed)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: packages/temper-placer
        run: uv run pytest tests/core/ -v --tb=short -p no:cacheprovider --maxfail=10 --cov=temper_placer --cov-report=json --cov-report=term --cov-config=../../pyproject.toml
        env:
          RUST_BACKTRACE: full
          PYTHONFAULTHANDLER: 1

      - name: Coverage gate (temper-placer)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: packages/temper-placer
        run: >
          uv run python ../../scripts/check_coverage_gate.py
          --coverage-json coverage.json
          --allowlist ../../.coverage-allowlist
          || echo "::warning title=Coverage Gate::Phase 1 paydown prerequisite not yet met; gate is warn-only."
        continue-on-error: true  # TODO: temper-NNN -- coverage gate remains warn-only pending Phase 1 paydown; hard-fail after 2026-09-01

  # Split out of Core Tests 2026-07-28. These two cargo steps ran at position
  # 16-17 of the old 58-step job, ahead of every Python gate in the pipeline. On
  # 2026-07-28 a single clippy lint error in one crate therefore masked 43
  # downstream steps -- including two safety gates -- for hours; fixing the lint
  # moved the job from 15 to 29 executed steps, which is the measurement that
  # says those 43 steps were hidden by clippy alone. A Rust lint verdict and a
  # Python gate verdict are independent facts and now report independently.
  #
  # No `uv sync` / no maturin here: `cargo check` and `cargo clippy` need only
  # the toolchain. The venv steps are kept because VIRTUAL_ENV is set job-wide
  # and pyo3 build scripts resolve their interpreter through it, exactly as they
  # did when these steps ran inside Core Tests. Note the cargo target dir is
  # cold in this job (the workflow caches no Rust artifacts anywhere), so these
  # steps compile their dependency graph from scratch -- hence the budget.
  # Clippy now runs on all 14 Rust crates (every one carries
  # `[lints.clippy] unwrap_used = "deny", expect_used = "deny"`), so the loop
  # below is the gate that catches production unwraps/expects across the FFI
  # bridges -- including the pyo3 crates that maturin installs.
  rust-checks:
    name: Rust Checks (cargo check + clippy)
    needs: [changes]
    if: ${{ github.event_name == 'push' || needs.changes.outputs.rust-checks == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bennetleff/temper-ci:latest
      options: --user root
    timeout-minutes: 45
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
      TEMPER_REQUIRE_RUST_DRC: "1"
    steps:
      - uses: actions/checkout@v7

      # Container runs as root; workspace is owned by the runner user. Without
      # this, every `git` call in a later `run:` step exits 128 on "dubious
      # ownership" rather than doing its job.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache virtualenv
        uses: actions/cache@v6
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: Create virtualenv (cache miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: uv venv

      # ---- SETUP / GATE BOUNDARY -------------------------------------------
      # Everything ABOVE is setup and stays fail-fast: it has no `if:`, so if
      # any of it fails (maturin, uv sync, make netlist) this step never runs,
      # `steps.setup.outcome` is not `success`, and every gate below is SKIPPED
      # rather than run against a half-built environment and reported as a gate
      # verdict. Everything BELOW is a gate: each carries
      # `if: !cancelled() && steps.setup.outcome == 'success'` so a red gate no
      # longer deletes the verdict of the gates behind it. None of them is
      # `continue-on-error`, so the job still concludes `failure` if any fails.
      - name: Setup barrier -- environment ready
        id: setup
        run: echo "setup complete; gates below report independently"

      - name: Check temper-constraint-compiler compiles
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo check --manifest-path packages/temper-constraint-compiler/Cargo.toml

      - name: Clippy (all Rust crates, -D warnings)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          for manifest in \
                       packages/temper-constraint-compiler/Cargo.toml \
                       packages/temper-design-bundle/Cargo.toml \
                       packages/temper-drc-rs/Cargo.toml \
                       packages/temper-dsn/Cargo.toml \
                       packages/temper-geometry/Cargo.toml \
                       packages/temper-io-types/Cargo.toml \
                       packages/temper-ipc/Cargo.toml \
                       packages/temper-pcl-ir/Cargo.toml \
                       packages/temper-py-bridge/Cargo.toml \
                       packages/temper-py-bridge-derive/Cargo.toml \
                       packages/temper-quality-oracle/Cargo.toml \
                       packages/temper-rust-router-core/Cargo.toml \
                       packages/temper-rust-router/Cargo.toml \
                       packages/temper-placer/temper-constraints/Cargo.toml; do
            echo "=== clippy $manifest ==="
            # temper-constraints is the one abi3 crate; without the forward-compat
            # env it fails to build against a newer CPython than the pinned pyo3
            # knows about (same special-case as the Makefile's `extensions` target).
            if [ "$manifest" = "packages/temper-placer/temper-constraints/Cargo.toml" ]; then
              PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 \
                cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
            else
              cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
            fi
          done

  # Split out of Core Tests 2026-07-28. Everything here reads the compiled
  # netlist (elec/build/default.net, default.csv) or pcb/temper.kicad_pcb, so
  # they share the `make netlist` setup and belong together.
  #
  # "Physical mains<->SELV isolation-barrier gate" is LAST. It is the gate that
  # is red on main right now (run 30390466165) and it cannot be fixed from CI --
  # pcb/temper.kicad_pcb has zero keepout zones and the fix is hardware work.
  # Its position is no longer load-bearing: since every gate step below the
  # setup barrier carries `if: !cancelled() && steps.setup.outcome == 'success'`,
  # this gate masks nothing wherever it sits, and a step added after it will run
  # and report on its own. Kept last because that is where it reads best.
  # MERGED 2026-08-03 from board-gates + provenance-gates + requirements-tests.
  # Each paid the same ~225s prologue (container init, 3x maturin, uv sync,
  # make netlist) for well under a minute of actual gate work -- measured
  # 2026-08-03: 79% of this workflow's job-time was setup, and a single push
  # requested ~40 jobs against a ~24-job account concurrency ceiling. Sharing
  # one prologue collapses 3 runners into 1 and drops ~7.5 job-minutes/run.
  #
  # None of the three was a required context, so merging needed no rename
  # migration -- unlike the remaining gate jobs, whose names branch protection
  # and .github/required-checks.json still match exactly.
  #
  # Gate independence is preserved verbatim: every gate keeps
  # `if: !cancelled() && steps.setup.outcome == 'success'`, so one red gate
  # still cannot delete the verdict of the gates behind it, and none of them
  # runs against a half-built environment.
  #
  # ORDERING IS LOAD-BEARING: 'Regenerate schematics and check drift' writes
  # pcb/*.kicad_sch and is therefore placed LAST, after every gate that reads
  # committed board state (copper-net drift, footprint drift, identity,
  # measurement provenance). Job isolation used to guarantee this for free.
  board-provenance-requirements-gates:
    name: Board, Provenance & Requirements Gates
    needs: [changes]
    if: ${{ github.event_name == 'push' || needs.changes.outputs.board-provenance-requirements-gates == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bennetleff/temper-ci:latest
      options: --user root
    # Sum of the three former budgets (25+20+25) less the two prologues no
    # longer paid; the gates themselves totalled well under a minute.
    timeout-minutes: 40
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
      TEMPER_REQUIRE_RUST_DRC: "1"
    steps:
      # fetch-depth: 0 (full history, not the default shallow depth-1 clone):
      # the DRC ceiling approval gate below needs `origin/main` and a real
      # merge-base to diff drc_ceiling.json and enumerate this PR's commits
      # for a Ceiling-Approval: trailer -- a shallow clone would make that
      # merge-base unresolvable and the gate would have to fail closed on
      # every run. Same convention already used by the loc-cap and
      # repo-state jobs below, which have the same need.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Container runs as root; workspace is owned by the runner user. Without
      # this, every `git` call in a later `run:` step exits 128 on "dubious
      # ownership" rather than doing its job.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache virtualenv
        uses: actions/cache@v6
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: Create virtualenv (cache miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: uv venv

      - name: Install maturin
        run: uv pip install maturin

      - name: Build and install Rust crate
        run: uv run maturin develop --release --manifest-path packages/temper-rust-router/Cargo.toml

      - name: Verify Rust module loads
        run: uv run python3 -c "import temper_rust_router; print('temper_rust_router loaded OK')"
        env:
          RUST_BACKTRACE: full

      - name: Build and install temper-drc-rs
        run: uv run maturin develop --release --manifest-path packages/temper-drc-rs/Cargo.toml

      - name: Verify temper-drc-rs loads
        run: uv run python3 -c "import temper_drc_rs; print('temper_drc_rs loaded OK')"
        env:
          RUST_BACKTRACE: full

      - name: Build and install temper-constraints
        run: >
          uv run maturin develop --release
          --manifest-path packages/temper-placer/temper-constraints/Cargo.toml
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

      - name: Verify temper-constraints loads
        run: uv run python3 -c "import temper_constraints; print('temper_constraints loaded OK, version', temper_constraints.version_py())"
        env:
          RUST_BACKTRACE: full

      # `uv sync` defaults to an *exact* sync: anything installed in the venv
      # that is not part of this invocation's resolved target set gets
      # uninstalled as "extraneous". `--no-install-package X` excludes X from
      # that target set -- it does NOT mean "leave X alone". Without
      # `--inexact`, the three flags below were therefore silently
      # UNINSTALLING the release wheels that "Build and install ..." just
      # built and "Verify ... loads" just confirmed importable, minutes
      # earlier in this same job. Reproduced locally: `uv sync --all-packages
      # --no-install-package temper-rust-router ...` (no --inexact) prints
      # "Uninstalled 2 packages" and `- temper-rust-router==0.1.0` in its
      # diff, and a subsequent bare import fails with ModuleNotFoundError.
      # `--inexact` disables the extraneous-package removal, so these three
      # packages are truly left untouched (mtimes unchanged, no rebuild)
      # instead of evicted -- confirmed locally: with --inexact added, the
      # same command reports "Audited N packages" (no install/uninstall) and
      # the modules remain importable afterward.
      - name: Install dependencies
        run: >
          uv sync --all-packages --inexact
          --no-install-package temper-rust-router
          --no-install-package temper-drc-rs
          --no-install-package temper-constraints

      - name: Cache netlist
        id: cache-netlist
        uses: actions/cache@v6
        with:
          path: elec/build
          key: netlist-${{ hashFiles('elec/src/**', 'elec/ato.yaml', 'Makefile') }}

      - name: Build electronics netlist
        if: steps.cache-netlist.outputs.cache-hit != 'true'
        run: make netlist

      # ---- SETUP / GATE BOUNDARY -------------------------------------------
      # Everything ABOVE is setup and stays fail-fast: it has no `if:`, so if
      # any of it fails (maturin, uv sync, make netlist) this step never runs,
      # `steps.setup.outcome` is not `success`, and every gate below is SKIPPED
      # rather than run against a half-built environment and reported as a gate
      # verdict. Everything BELOW is a gate: each carries
      # `if: !cancelled() && steps.setup.outcome == 'success'` so a red gate no
      # longer deletes the verdict of the gates behind it. None of them is
      # `continue-on-error`, so the job still concludes `failure` if any fails.
      - name: Setup barrier -- environment ready
        id: setup
        run: echo "setup complete; gates below report independently"

      # ---- from requirements-tests ----
      # Plan 2026-07-25-001 R2. `tests/requirements/` holds the encoded
      # IEC 60335 / EMC / design-review checks and was named in NO workflow --
      # 240 test functions with zero CI execution path on a mains-connected
      # design. Measured on wiring: safety 53 passed, emc 57 passed,
      # review 27 passed.
      #
      # `dfm/` joined 2026-07-28 once green. It had one real failure
      # (DFM001-ANT-002, a copper pour inside the ESP32 antenna keepout on a
      # fixture whose purpose is to represent adequate keepout), three tests
      # requesting an `accessible_components` fixture that does not exist, and
      # four assertion bugs. Wiring it now would add noise, not signal. It goes
      # in once green -- not behind continue-on-error.
      #
      # Guarded so this cannot quietly regress to zero the way the extended
      # suite did via a phantom path.
      - name: Requirements tests (safety / EMC / review / DFM)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: >
          cd packages/temper-placer &&
          uv run python ../../scripts/pytest_guard.py --min-tests 240 --
          tests/requirements/safety/ tests/requirements/emc/
          tests/requirements/review/ tests/requirements/dfm/
          -v --tb=short -p no:cacheprovider

      # ---- from provenance-gates ----
      - name: Physics parameter provenance gate
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: packages/temper-placer
        run: |
          uv run python ../../scripts/check_physics_provenance.py --allowlist ../../.physics-provenance-allowlist --physics-dir src/temper_placer/physics/
          uv run python ../../scripts/check_physics_provenance.py --check-shrink --allowlist ../../.physics-provenance-allowlist --physics-dir src/temper_placer/physics/

      - name: Evidence provenance gate (docs/evidence/)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          uv run python scripts/check_evidence_provenance.py
          uv run python scripts/check_evidence_provenance.py --check-shrink

      - name: Anti-vacuous-truth gate (gates/validators)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_vacuous_gates.py

      - name: Measurement-provenance gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_measurement_provenance.py scripts/tests/_lib/test_lib_measurement_provenance.py -v --tb=short

      # Fail-closed, not soft-launched: catches a measurement artifact
      # (power_pcb_dataset/drc_ceiling.json today) whose recorded input
      # content hash no longer matches the file on disk -- the DRC ceiling
      # incident this closes recorded 91 errors for a board that three
      # later commits (c6b1b463, 556ccf4f, 65bd0159) changed to ~710
      # errors' worth, with the ceiling file itself byte-identical
      # throughout. STALE is a GATE ERROR here, not a violation --
      # generalizing the same "netlist is STALE ... not PASSED, not a
      # violation" semantic check_domain_partition.py already uses. See
      # docs/evidence/2026-07-28-measurement-provenance.md.
      #
      # Placed last in its job, and never continue-on-error: this step is
      # expected to fail right now, because the real drc_ceiling.json
      # genuinely is stale and has not been re-measured/re-approved. Every
      # other required gate used to be in this same job and had to be
      # ordered ahead of it for that reason; since the 2026-07-28 split
      # they are in sibling jobs and cannot be affected by this gate at
      # all, and since the same day's independent-gate-reporting change
      # every gate step in this job runs under
      # `if: !cancelled() && steps.setup.outcome == 'success'` -- so this
      # gate masks nothing regardless of where it sits, and a step added
      # after it will run and report on its own.
      - name: Measurement-provenance gate (drc_ceiling.json input freshness)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          uv run python scripts/check_measurement_provenance.py
          uv run python scripts/check_measurement_provenance.py --check-shrink

      - name: DRC ceiling approval gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_drc_ceiling_approval.py packages/temper-placer/tests/regression/test_drc_ratchet.py -v --tb=short

      # drc_ceiling.json's own header states the policy: "Ceilings may only
      # decrease; raising one requires a 'Ceiling-Approval:' commit trailer
      # (drc_ratchet.detect_ceiling_raise)." That detection logic has
      # existed -- and been unit-tested -- since it was written, but no CI
      # workflow ever called it (scripts/ci_check_drc.py only calls
      # DrcRatchet.check(), never detect_ceiling_raise()). A documented,
      # implemented, unit-tested policy with no caller is exactly the
      # vacuous-gate failure class this job exists to catch; this step is
      # the missing caller. Compares drc_ceiling.json at HEAD against
      # origin/main's merge-base and fails if any ceiling value (aggregate
      # or per-type, errors or warnings) increased without a
      # Ceiling-Approval: trailer on a commit in this PR. See
      # scripts/check_drc_ceiling_approval.py's module docstring.
      - name: "DRC ceiling approval gate (Ceiling-Approval: trailer required on any raise)"
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_drc_ceiling_approval.py

      # ---- from board-gates ----
      - name: Run electronics validation tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest elec/validation/ -v --tb=short

      - name: Domain-partition gate unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_domain_partition.py -v --tb=short

      - name: Netlist domain-partition gate (galvanic isolation)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # Fail-closed: reads the compiled netlist against
        # elec/domain_manifest.yaml and asserts the declared HV/SELV
        # domains land in disjoint connected components, and that every
        # declared isolator's own pin groups are mutually unreachable. This
        # is the check that would have caught the aux_supply.psu star-join
        # short (docs/hardware/IEC60335_CRITICAL_COMPONENTS.md Sec 2) --
        # see docs/evidence/2026-07-26-domain-partition-check.md. Never
        # `continue-on-error`: a gate that cannot run must exit non-zero.
        run: uv run python scripts/check_domain_partition.py

      - name: HV netclass coverage gate unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_hv_netclass_coverage.py -v --tb=short

      - name: HV netclass coverage gate (net assignment + rule-emission)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # Fail-closed: asserts every elec/domain_manifest.yaml HV-domain
        # net has a TEMPER_NET_ASSIGNMENTS entry, and every declared
        # netclass (TEMPER_NET_CLASSES union pcb/temper.kicad_pro-described
        # classes) emits at least one real rule from
        # scripts/generate_kicad_dru.py. This is the check that would have
        # caught +170V_BUS resolving to no netclass at all and
        # HighVoltageIsolated existing with zero DRC rules (docs/evidence/
        # 2026-07-29-hv-netclass-coverage-gate.md). Never
        # `continue-on-error`: a gate that cannot run must exit non-zero.
        run: uv run python scripts/check_hv_netclass_coverage.py

      - name: Copper-net consistency gate unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_copper_net_consistency.py -v --tb=short

      - name: Board-copper / netlist consistency gate (designator + net drift)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # Fail-closed: reads pcb/temper.kicad_pcb directly (the only gate in
        # this job that does) and cross-checks it against the freshly
        # compiled netlist -- dangling net-table ordinals, copper orphaned
        # off a deleted net, and per-pad (Reference, pad number) exact
        # identity agreement. This is the check that would have caught (and
        # on 2026-07-30 did catch, see docs/evidence/
        # 2026-07-30-copper-net-consistency-drift.md) the board never being
        # resynced after tank.c_tank3 was added (commit 3ae26dfe): C27 on
        # the board is still the OLD ct_sense.c_filter footprint while the
        # netlist now assigns C27 to the HV tank capacitor. Registered
        # `disposition: ci-gate` in scripts/manifest.yaml since 2026-07-28
        # but never actually wired into a workflow until this step -- a
        # silent-skip hole of the same class as commit db779c81. Never
        # `continue-on-error`: a gate that cannot run must exit non-zero.
        run: uv run python scripts/check_copper_net_consistency.py

      - name: Footprint-drift gate unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_footprint_drift.py -v --tb=short

      - name: Footprint-drift gate (source-corrected footprint never reached the board)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # Fail-closed: reads pcb/temper.kicad_pcb directly and cross-checks
        # every component's footprint string against the freshly compiled
        # netlist, matched by SHEETPATH (not reference designator -- refdes
        # renumbers, see docs/solutions/logic-errors/
        # fixed-positions-ref-fragility-across-renumbering.md). This is the
        # gate that would have caught (and on this repo's `main`, as of
        # this change, DOES catch) a footprint corrected in elec/src/*.ato
        # that never got propagated into the board: C6/U3 (corrected
        # per-part in .ato, board still on the old land pattern -- docs/
        # hardware/2026-07-29-open-safety-gate-actions.md) and C25/C26
        # (tank.c_tank1/c_tank2, docs/evidence/
        # 2026-07-28-tank-cap-and-isolator-footprints.md). Distinct from
        # check_copper_net_consistency.py above: that gate reads electrical
        # NET identity per pad and cannot see a pad-compatible footprint
        # substitution with different creepage/clearance geometry at all --
        # this gate compares the footprint string itself, which is what
        # REQ-SAFE-01 reinforced-creepage margin actually depends on. Never
        # `continue-on-error`, no allowlist: a footprint mismatch on a
        # mains-connected board has no legitimate "expected" case to
        # suppress -- the fix is to resync the board, not to silence this
        # gate.
        run: uv run python scripts/check_footprint_drift.py

      - name: Pad-orientation gate unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_pad_orientation.py -v --tb=short

      - name: Pad-orientation gate (intra-footprint copper shorts)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # Fail-closed. Catches the two mechanisms behind the 60 intra-
        # component copper shorts fixed in #412/#420/#426: a writer that
        # rotated pad positions but not pad bodies (a .kicad_pcb pad angle
        # is ABSOLUTE, unlike .kicad_mod), and library footprints whose
        # pads overlap in their own local frame. Both produced solid copper
        # between different nets inside one footprint -- a fatal defect on
        # a mains-connected board (docs/STRATEGY.md). Verified to fail on
        # the pre-fix board (c369bc72) and to pass on both the corrected
        # board and the KiCad-authored bitaxeUltra control, so it
        # discriminates rather than merely firing. Never
        # `continue-on-error`: a gate that cannot run must exit non-zero.
        run: uv run python scripts/check_pad_orientation.py pcb/temper.kicad_pcb
      - name: Design capacity budget gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_capacity_budget_gate.py -v --tb=short

      - name: Design capacity budget gate (fault-tree fan-in)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/capacity_budget_gate.py

      - name: Verify board identity gate (plan 2026-07-15-001, U7)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python3 scripts/ci_identity_check.py

      - name: Isolation-keepout gate unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_isolation_keepout.py -v --tb=short

      - name: Physical mains<->SELV isolation-barrier gate
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # Fail-closed: verifies a dedicated keepout region (not just
        # declarations/after-the-fact clearance checks) spans every copper
        # layer, is >=8.0mm wide throughout, bisects the board into HV/SELV
        # sides, and that no real copper intrudes -- pcb/temper.kicad_pcb
        # has zero keepout zones today (docs/evidence/
        # 2026-07-28-isolation-keepout.md). Never `continue-on-error`: a
        # gate that cannot run, or that finds the barrier missing, must
        # exit non-zero.
        run: uv run python scripts/check_isolation_keepout.py

      # ---- MUTATING: writes pcb/*.kicad_sch, must stay last ----
      - name: Regenerate schematics and check drift
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        continue-on-error: true  # TODO: temper-NNN -- make netlist (atopile) invokes kicad-cli in container; hard-fail after 2026-09-01
        run: |
          uv run python3 scripts/gen_schematics.py --check --no-oracle
          git diff --exit-code pcb/*.kicad_sch

  # Split out of Core Tests 2026-07-28. Gates that compare two representations
  # of the same fact and fail on drift: generated code vs its manifest, a
  # derived doc vs its source doc, firmware constants vs elec/src/main.ato,
  # BOM/MPN vs the .ato sources, net-name classifiers vs
  # elec/domain_manifest.yaml. Each `*-gate tests` step is the unit-test suite
  # for the gate immediately below it and stays adjacent to it.
  consistency-gates:
    name: Cross-Source Consistency Gates
    needs: [changes]
    if: ${{ github.event_name == 'push' || needs.changes.outputs.consistency-gates == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bennetleff/temper-ci:latest
      options: --user root
    timeout-minutes: 20
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
      TEMPER_REQUIRE_RUST_DRC: "1"
    steps:
      - uses: actions/checkout@v7

      # Container runs as root; workspace is owned by the runner user. Without
      # this, every `git` call in a later `run:` step exits 128 on "dubious
      # ownership" rather than doing its job.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache virtualenv
        uses: actions/cache@v6
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: Create virtualenv (cache miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: uv venv

      - name: Install maturin
        run: uv pip install maturin

      - name: Build and install Rust crate
        run: uv run maturin develop --release --manifest-path packages/temper-rust-router/Cargo.toml

      - name: Verify Rust module loads
        run: uv run python3 -c "import temper_rust_router; print('temper_rust_router loaded OK')"
        env:
          RUST_BACKTRACE: full

      - name: Build and install temper-drc-rs
        run: uv run maturin develop --release --manifest-path packages/temper-drc-rs/Cargo.toml

      - name: Verify temper-drc-rs loads
        run: uv run python3 -c "import temper_drc_rs; print('temper_drc_rs loaded OK')"
        env:
          RUST_BACKTRACE: full

      - name: Build and install temper-constraints
        run: >
          uv run maturin develop --release
          --manifest-path packages/temper-placer/temper-constraints/Cargo.toml
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

      - name: Verify temper-constraints loads
        run: uv run python3 -c "import temper_constraints; print('temper_constraints loaded OK, version', temper_constraints.version_py())"
        env:
          RUST_BACKTRACE: full

      # `uv sync` defaults to an *exact* sync: anything installed in the venv
      # that is not part of this invocation's resolved target set gets
      # uninstalled as "extraneous". `--no-install-package X` excludes X from
      # that target set -- it does NOT mean "leave X alone". Without
      # `--inexact`, the three flags below were therefore silently
      # UNINSTALLING the release wheels that "Build and install ..." just
      # built and "Verify ... loads" just confirmed importable, minutes
      # earlier in this same job. Reproduced locally: `uv sync --all-packages
      # --no-install-package temper-rust-router ...` (no --inexact) prints
      # "Uninstalled 2 packages" and `- temper-rust-router==0.1.0` in its
      # diff, and a subsequent bare import fails with ModuleNotFoundError.
      # `--inexact` disables the extraneous-package removal, so these three
      # packages are truly left untouched (mtimes unchanged, no rebuild)
      # instead of evicted -- confirmed locally: with --inexact added, the
      # same command reports "Audited N packages" (no install/uninstall) and
      # the modules remain importable afterward.
      - name: Install dependencies
        run: >
          uv sync --all-packages --inexact
          --no-install-package temper-rust-router
          --no-install-package temper-drc-rs
          --no-install-package temper-constraints

      - name: Cache netlist
        id: cache-netlist
        uses: actions/cache@v6
        with:
          path: elec/build
          key: netlist-${{ hashFiles('elec/src/**', 'elec/ato.yaml', 'Makefile') }}

      - name: Build electronics netlist
        if: steps.cache-netlist.outputs.cache-hit != 'true'
        run: make netlist

      # ---- SETUP / GATE BOUNDARY -------------------------------------------
      # Everything ABOVE is setup and stays fail-fast: it has no `if:`, so if
      # any of it fails (maturin, uv sync, make netlist) this step never runs,
      # `steps.setup.outcome` is not `success`, and every gate below is SKIPPED
      # rather than run against a half-built environment and reported as a gate
      # verdict. Everything BELOW is a gate: each carries
      # `if: !cancelled() && steps.setup.outcome == 'success'` so a red gate no
      # longer deletes the verdict of the gates behind it. None of them is
      # `continue-on-error`, so the job still concludes `failure` if any fails.
      - name: Setup barrier -- environment ready
        id: setup
        run: echo "setup complete; gates below report independently"

      - name: Check domain model codegen drift
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python3 scripts/gen_domain_models.py --check

      - name: Verify config reference doc is up-to-date (plan 2026-07-22-005, U7)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          uv run python packages/temper-placer/scripts/gen_config_reference.py --check

      - name: MPN fabrication gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_mpn_fabrication_gate.py -v --tb=short

      - name: MPN fabrication gate (elec/src/*.ato non-standard values and MPN/value drift)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/mpn_fabrication_gate.py

      - name: Derived-document drift gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_derived_doc_drift.py -v --tb=short

      - name: Derived-document drift gate (docs/STRATEGY.md vs FUNCTIONAL_TEST_CRITERIA.md)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_derived_doc_drift.py

      - name: Net-classification-by-substring gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_net_classification.py -v --tb=short

      # Fail-closed, not soft-launched: catches the "safety-relevant net
      # classification by plain substring match, in parallel to
      # elec/domain_manifest.yaml" defect class confirmed three times in
      # this repo (creepage_check.py false positives, clearance_check.py
      # false negatives, clearance_engine.py's still-live bare "HV"/"AC"
      # substrings) -- and nine total once every net-name classifier in
      # the codebase was audited for the same shape. See
      # docs/evidence/2026-07-27-net-classification-gate.md.
      - name: Net-classification-by-substring gate (placer/router net-name classifiers)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_net_classification.py

      - name: PLL range consistency gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_pll_range_consistency.py -v --tb=short

      # Fail-closed: catches firmware/components/control/pll_control.h's
      # PLL frequency bounds/default drifting away from elec/src/main.ato's
      # declared f_switching/f_pll_tracking_min/max -- the exact shape that
      # let main.ato assert a 20-100kHz tracking range 5x wider than the
      # firmware's real 30-50kHz clamp, and let PLL_DEFAULT_FREQ_HZ stay at
      # 35000 (a frequency later shown to lose 100.7% of ZVS margin) after
      # main.ato had already moved to 47kHz. See
      # docs/evidence/2026-07-28-pll-defaults-and-range-gate.md.
      - name: PLL range consistency gate (firmware vs elec/src/main.ato)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_pll_range_consistency.py

  # Split out of Core Tests 2026-07-28. Gates that check a claim can be traced
  # to a measurement, plus the anti-vacuous-truth gate that checks a gate
  # actually measured something.
  #
  # "Measurement-provenance gate" is LAST, for the reason its own comment gives
  # -- drc_ceiling.json genuinely is stale, so the gate is expected to fail until
  # it is re-measured and re-approved. In the old single job it was "last among
  # the required gates" but still masked "Rebuild script invocation graph"; that
  # step now lives in `hygiene-gates`. Its position is no longer load-bearing
  # either: the `!cancelled() && steps.setup.outcome == 'success'` guard on every
  # gate step below the setup barrier means it masks nothing wherever it sits.
  # Split out of Core Tests 2026-07-28. Whole-repo hygiene: dead code, script
  # inventory, root-directory litter, import boundaries, undeclared imports.
  # "Script manifest gate" stays ahead of "Rebuild script invocation graph",
  # the same relative order they had in the old job and not an arbitrary one:
  # trace_invocations.py rewrites scripts/manifest.yaml (the `imports` field)
  # and scripts/invocation_graph.json in place, so the gate that reads the
  # committed manifest has to run before the step that regenerates it.
  hygiene-gates:
    name: Repo Hygiene & Import Gates
    needs: [changes]
    if: ${{ github.event_name == 'push' || needs.changes.outputs.hygiene-gates == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bennetleff/temper-ci:latest
      options: --user root
    timeout-minutes: 20
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
      TEMPER_REQUIRE_RUST_DRC: "1"
    steps:
      - uses: actions/checkout@v7

      # Container runs as root; workspace is owned by the runner user. Without
      # this, every `git` call in a later `run:` step exits 128 on "dubious
      # ownership" rather than doing its job.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache virtualenv
        uses: actions/cache@v6
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: Create virtualenv (cache miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: uv venv

      - name: Install maturin
        run: uv pip install maturin

      - name: Build and install Rust crate
        run: uv run maturin develop --release --manifest-path packages/temper-rust-router/Cargo.toml

      - name: Verify Rust module loads
        run: uv run python3 -c "import temper_rust_router; print('temper_rust_router loaded OK')"
        env:
          RUST_BACKTRACE: full

      - name: Build and install temper-drc-rs
        run: uv run maturin develop --release --manifest-path packages/temper-drc-rs/Cargo.toml

      - name: Verify temper-drc-rs loads
        run: uv run python3 -c "import temper_drc_rs; print('temper_drc_rs loaded OK')"
        env:
          RUST_BACKTRACE: full

      - name: Build and install temper-constraints
        run: >
          uv run maturin develop --release
          --manifest-path packages/temper-placer/temper-constraints/Cargo.toml
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

      - name: Verify temper-constraints loads
        run: uv run python3 -c "import temper_constraints; print('temper_constraints loaded OK, version', temper_constraints.version_py())"
        env:
          RUST_BACKTRACE: full

      # `uv sync` defaults to an *exact* sync: anything installed in the venv
      # that is not part of this invocation's resolved target set gets
      # uninstalled as "extraneous". `--no-install-package X` excludes X from
      # that target set -- it does NOT mean "leave X alone". Without
      # `--inexact`, the three flags below were therefore silently
      # UNINSTALLING the release wheels that "Build and install ..." just
      # built and "Verify ... loads" just confirmed importable, minutes
      # earlier in this same job. Reproduced locally: `uv sync --all-packages
      # --no-install-package temper-rust-router ...` (no --inexact) prints
      # "Uninstalled 2 packages" and `- temper-rust-router==0.1.0` in its
      # diff, and a subsequent bare import fails with ModuleNotFoundError.
      # `--inexact` disables the extraneous-package removal, so these three
      # packages are truly left untouched (mtimes unchanged, no rebuild)
      # instead of evicted -- confirmed locally: with --inexact added, the
      # same command reports "Audited N packages" (no install/uninstall) and
      # the modules remain importable afterward.
      - name: Install dependencies
        run: >
          uv sync --all-packages --inexact
          --no-install-package temper-rust-router
          --no-install-package temper-drc-rs
          --no-install-package temper-constraints

      - name: Cache netlist
        id: cache-netlist
        uses: actions/cache@v6
        with:
          path: elec/build
          key: netlist-${{ hashFiles('elec/src/**', 'elec/ato.yaml', 'Makefile') }}

      - name: Build electronics netlist
        if: steps.cache-netlist.outputs.cache-hit != 'true'
        run: make netlist

      # ---- SETUP / GATE BOUNDARY -------------------------------------------
      # Everything ABOVE is setup and stays fail-fast: it has no `if:`, so if
      # any of it fails (maturin, uv sync, make netlist) this step never runs,
      # `steps.setup.outcome` is not `success`, and every gate below is SKIPPED
      # rather than run against a half-built environment and reported as a gate
      # verdict. Everything BELOW is a gate: each carries
      # `if: !cancelled() && steps.setup.outcome == 'success'` so a red gate no
      # longer deletes the verdict of the gates behind it. None of them is
      # `continue-on-error`, so the job still concludes `failure` if any fails.
      - name: Setup barrier -- environment ready
        id: setup
        run: echo "setup complete; gates below report independently"

      - name: Lint with ruff
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        continue-on-error: true  # TODO: temper-NNN -- 594 pre-existing ruff errors; hard-fail after 2026-09-01
        run: uv run ruff check packages/

      - name: Vulture dead-code gate
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/vulture_gate.py

      - name: Script manifest gate
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_manifest_gate.py

      - name: Script sunset check (warnings only)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_script_sunset.py
        continue-on-error: true  # TODO: temper-NNN -- sunset is informational; hard-fail after 2026-09-01

      - name: Root artifact hygiene check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/test_root_hygiene.py -v --tb=short
        continue-on-error: true  # TODO: temper-NNN -- hard-fail after 2026-09-01

      - name: Import boundary enforcement
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/import_linter_gate.py

      - name: Undeclared-import gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_undeclared_imports.py -v --tb=short

      # Fail-closed, not soft-launched: catches the jinja2/sympy class of
      # incident (a third-party module imported by first-party code but
      # declared nowhere, silently dying inside a continue-on-error step).
      # Must run after `uv sync --all-packages` above (never a plain
      # `uv sync`, which prunes workspace packages) so resolvability
      # reflects the same environment the rest of this job runs under. See
      # docs/evidence/2026-07-27-undeclared-import-gate.md.
      - name: Undeclared-import gate (scripts/ and Python test trees)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_undeclared_imports.py

      - name: Rebuild script invocation graph
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/trace_invocations.py

      - name: No-raw-rotation-trig gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_no_raw_rotation_trig.py -v --tb=short

      # KiCad's footprint-child rotation formula (R(-theta)) was
      # independently reimplemented, wrongly, in 12 places -- see
      # docs/evidence/2026-07-29-cross-domain-creepage-rotation-convention.md
      # -- and concealed real clearance hazards on 18 production
      # components. The 12 are now consolidated into one implementation,
      # temper_placer.geometry.kicad_transform; this gate fails if any of
      # the files that have already proven capable of hosting that bug
      # regresses back to a raw, locally-typed copy of the formula.
      - name: No raw rotation trig outside kicad_transform
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_no_raw_rotation_trig.py

      # Constraint mutation suite (plan 2026-08-02-006, R32): every CP-SAT
      # constraint encoding must carry a non-empty, triaged kill set in
      # power_pcb_dataset/constraint_kill_sets.yaml. The gate is an AST +
      # YAML check (no solves), so it is fast enough for every commit; the
      # runner that regenerates the register is invoked manually/periodically.
      - name: Constraint mutation gate (kill-set register)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/constraint_mutation_gate.py

      # The mutation suite's own unit tests (runner, register, gate) plus the
      # U4 fail-capable defense tests. The full 32-mutation run is ~2s (per-
      # mutation defense subset, pinned single-worker solver) — the KTD2 CI
      # cost model.
      - name: Constraint mutation suite tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: packages/temper-placer
        run: >
          uv run pytest
          tests/pcl/test_mutation_runner.py
          tests/pcl/test_mutation_register.py
          tests/pcl/test_mutation_gate.py
          tests/pcl/test_keepout_mutation_defense.py
          tests/pcl/test_loop_area_mutation_defense.py
          -v --tb=short -p no:cacheprovider

  # Split out of Core Tests 2026-07-28. The encoded IEC 60335 / EMC / design
  # review / DFM requirement suites -- 240+ tests on a mains-connected design,
  # guarded by --min-tests so the suite cannot silently shrink to zero. In the
  # old job these sat at step 49 of 58 and had not executed on main since the
  # isolation gate went red. They get their own verdict.
  # Split out of Core Tests 2026-07-28, then split again 2026-07-29. The four
  # suites below (bundle / cp-sat / workflow / checks) used to share one
  # `extended-suites` job as four backgrounded processes racing for one
  # container's CPU, with a combined 25-minute budget. Measured bimodal
  # around that budget: 18m05s on run 30429718944 (main), 25m03s -- killed by
  # `timeout-minutes`, GitHub reporting it as "The operation was canceled" --
  # on a PR re-running the identical commit, then 24m31s (29s of headroom) on
  # a second re-run of that same commit. Every test in every one of those
  # runs had PASSED; the job was failing on its own clock, not on defects.
  #
  # `--durations`/log-timestamp analysis of the 18m05s run (see
  # docs/evidence/2026-07-29-extended-suites-timeout-split.md) attributes
  # essentially the entire wall-clock to three cp-sat tests:
  #   tests/placer/cp_sat/test_hybrid_pour_stitch_measurement.py
  #     ::test_hybrid_pour_reduces_unconnected_without_shorting_regression  ~665s
  #   tests/placer/cp_sat/test_zone_pour_production_measurement.py
  #     ::test_zone_pours_reduce_unconnected_items                          ~163s
  #   tests/placer/cp_sat/test_regression_drc.py
  #     ::test_production_board_routing_drc_regression                      ~74s
  # (~902s of the ~15m20s the cp-sat pytest invocation ran, out of an 18m05s
  # job). bundle/workflow/checks together account for well under a minute.
  # These three all shell out to kicad-cli for DRC sampling ("median of 3 DRC
  # samples each"), so their wall-clock varies with whatever else is
  # contending for CPU on the runner -- including the other three suites this
  # job used to background alongside them. That shared contention, not a
  # defect in any test, is what pushed the same commit from 18m05s to 25m03s
  # between re-runs.
  #
  # Fix: give cp-sat its own job on its own runner, so its DRC-subprocess
  # tests are no longer competing with bundle/workflow/checks for the same
  # container's CPU, and so a slow cp-sat run no longer puts the fast suites
  # at risk of the same shared clock (or vice versa). bundle/workflow/checks
  # keep a combined budget since together they cost under a minute; cp-sat
  # gets the old job's full 25-minute budget to itself. Per-test outcomes are
  # unchanged -- each suite runs the exact same pytest/cargo invocation it did
  # as a backgrounded process before, `continue-on-error: true` preserved
  # exactly as it was on the old combined step (TODO: temper-NNN -- parallel
  # test suite flakiness; hard-fail after 2026-09-01).
  extended-bundle-workflow-checks:
    name: Extended Test Suites (bundle / workflow / checks)
    # Trunk-only. This job's sole substantive step carries continue-on-error,
    # so on a PR it consumes a runner slot (~4 min + ~4 min of setup) while
    # being structurally incapable of failing the build. Capacity is the
    # binding constraint -- measured 2026-08-03: ~24 concurrent jobs available,
    # ~40 requested per push, 8-13 min per-job queue waits. It still runs on
    # every push to main and nightly, so trunk coverage is unchanged.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bennetleff/temper-ci:latest
      options: --user root
    timeout-minutes: 15
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
      TEMPER_REQUIRE_RUST_DRC: "1"
    steps:
      - uses: actions/checkout@v7

      # Container runs as root; workspace is owned by the runner user. Without
      # this, every `git` call in a later `run:` step exits 128 on "dubious
      # ownership" rather than doing its job.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache virtualenv
        uses: actions/cache@v6
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: Create virtualenv (cache miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: uv venv

      - name: Install maturin
        run: uv pip install maturin

      - name: Build and install Rust crate
        run: uv run maturin develop --release --manifest-path packages/temper-rust-router/Cargo.toml

      - name: Verify Rust module loads
        run: uv run python3 -c "import temper_rust_router; print('temper_rust_router loaded OK')"
        env:
          RUST_BACKTRACE: full

      - name: Build and install temper-drc-rs
        run: uv run maturin develop --release --manifest-path packages/temper-drc-rs/Cargo.toml

      - name: Verify temper-drc-rs loads
        run: uv run python3 -c "import temper_drc_rs; print('temper_drc_rs loaded OK')"
        env:
          RUST_BACKTRACE: full

      - name: Build and install temper-constraints
        run: >
          uv run maturin develop --release
          --manifest-path packages/temper-placer/temper-constraints/Cargo.toml
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

      - name: Verify temper-constraints loads
        run: uv run python3 -c "import temper_constraints; print('temper_constraints loaded OK, version', temper_constraints.version_py())"
        env:
          RUST_BACKTRACE: full

      # `uv sync` defaults to an *exact* sync: anything installed in the venv
      # that is not part of this invocation's resolved target set gets
      # uninstalled as "extraneous". `--no-install-package X` excludes X from
      # that target set -- it does NOT mean "leave X alone". Without
      # `--inexact`, the three flags below were therefore silently
      # UNINSTALLING the release wheels that "Build and install ..." just
      # built and "Verify ... loads" just confirmed importable, minutes
      # earlier in this same job. Reproduced locally: `uv sync --all-packages
      # --no-install-package temper-rust-router ...` (no --inexact) prints
      # "Uninstalled 2 packages" and `- temper-rust-router==0.1.0` in its
      # diff, and a subsequent bare import fails with ModuleNotFoundError.
      # `--inexact` disables the extraneous-package removal, so these three
      # packages are truly left untouched (mtimes unchanged, no rebuild)
      # instead of evicted -- confirmed locally: with --inexact added, the
      # same command reports "Audited N packages" (no install/uninstall) and
      # the modules remain importable afterward.
