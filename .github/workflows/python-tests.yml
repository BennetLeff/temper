name: Python Tests

# Grouped per COMMIT, not per ref, so a push never cancels the run for the
# commit before it.
#
# With `${{ github.ref }}`, every pull_request event on a branch shares one
# group -- so on a branch with several agents pushing, each push killed the
# previous run mid-flight. Measured 2026-07-28: five consecutive runs on
# docs/methodology-loop-discipline cancelled inside ~20 minutes, none reaching
# a verdict; and 16 of 24 runs cancelled over the preceding 15 hours. The
# pipeline was not slow so much as unable to finish, which is why "is CI green"
# had no answer -- the invariant shards were being killed at 2.7-3.7min against
# 13-18min budgets, and the one shard that did survive only did so by finishing
# before the next push landed.
#
# CORRECTION (2026-07-28, same day): grouping on the head SHA fixed the
# cancellation but overcorrected. It preserves a run for EVERY pushed commit,
# on a PR branch as well as on main -- and on a PR branch only the tip commit's
# verdict is wanted. Observed cost within hours: PR #392 accumulated six full
# 32-job runs from one branch (`b1935de3`, `9850be4f`, `86967af6`, `f5c28851`,
# `03fb1093`, plus a rebase), none cancelled, all queued against the same
# runner pool, delaying the verdict the change existed to deliver.
#
# The two branches want opposite behaviour, so they now get it:
#
#   pull_request  -> group by PR NUMBER, cancel-in-progress TRUE.
#                    A new push supersedes the old run. Only the tip matters;
#                    an intermediate commit on a PR is not a thing anyone
#                    bisects to.
#   push (main)   -> group by SHA (unique), cancel-in-progress irrelevant.
#                    Every trunk commit keeps its own run to completion,
#                    because trunk commits ARE bisected to.
#
# This keeps what #362 established -- main must never have its runs cancelled,
# evidenced there by 8 consecutive cancelled trunk runs -- and adds the PR-side
# fix that motivated the head-SHA grouping, without the queue cost. #362's Core
# Tests timeout raise (30 -> 45) is untouched.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

