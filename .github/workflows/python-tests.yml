      - name: Derived-document drift gate (docs/STRATEGY.md vs FUNCTIONAL_TEST_CRITERIA.md)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_derived_doc_drift.py

      # Component-inventory guard (plan 2026-08-04-003, Option A step 2).
      #
      # The DRC ceiling is a count ratchet, and a count falls when a component
      # is DELETED as readily as when a defect is fixed. Measured over all 169
      # footprints (507 kicad-cli runs): 66 deletions reduce the total with zero
      # penalised above the nondeterminism floor, the most profitable being C4
      # at -46; deleting a component and moving it off-board produce
      # byte-identical DRC signatures. A deletion also needs no
      # `Ceiling-Approval:` trailer, because detect_ceiling_raise only reacts to
      # increases.
      #
      # Both checks below already existed and already passed -- they detect a
      # deletion outright by comparing the board's footprint inventory against
      # the netlist. They lived only in `Board, Provenance & Requirements
      # Gates`, which is not a required context, so the detection could never
      # block anything. That is the same failure the goal set's AE1/AE2 condemn,
      # in a different costume: the gate works, it just cannot stop a merge.
      #
      # Hosted here rather than in a new job: this job is already a required
      # context, already triggers on pcb/**, and already builds the netlist
      # these checks need -- so the marginal cost is two Python invocations and
      # zero new jobs, against a measured ~24-slot concurrency ceiling.
      - name: Footprint-drift gate (component inventory vs source)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_footprint_drift.py

      - name: Netlist<->board reconciliation gate (component inventory)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_netlist_board_reconciliation.py

      - name: Board-sync-stamp gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_board_sync_stamp.py -v --tb=short

      # Complements the reconciliation gate immediately above with a cheap,
      # git-diff-visible provenance check (2026-08-13 desync postmortem,
      # plan gap C): the reconciliation gate is authoritative but its
      # verdict only exists for the duration of the run that computed it --
      # nothing previously recorded which netlist pcb/temper.kicad_pcb was
      # last actually verified against, which is how the U6/U7 + 4-missing-
      # footprint + dozens-of-renumbers desync went five days without
      # anyone noticing. This gate fails closed whenever the committed
      # `pcb/temper.kicad_pcb.source-digest` stamp (written by
      # write_board_sync_stamp.py, which itself refuses to run unless the
      # reconciliation gate above just passed) does not match the board's
      # and the netlist's CURRENT content -- catching drift the moment a PR
      # touches either side without a matching resync+restamp, visible in
      # the diff, rather than whenever someone next reads the comprehensive
      # gate's log. Never `continue-on-error`: a gate that cannot run
      # (missing board/netlist, or a netlist not proven fresh against
      # elec/src/**) exits non-zero, same fail-closed contract as every
      # other gate in this job.
      # Regen-and-diff (2026-08-23, #1445): the stamp folds in the netlist's
      # bytes, and atopile's output embeds the build environment (absolute
      # sheetpath prefixes; residual toolchain variance even after the
      # 0.2.69 pin) -- so a stamp committed from a developer machine is not
      # byte-reproducible by CI. CI is the canonical environment for every
      # other generated artifact in this repo (gen_config, gen_schematics,
      # wasm registry -- same write+diff pattern); this gate now follows it:
      # reconcile, write the stamp against THIS run's netlist, then fail the
      # diff if the committed sidecar differs. A PR that moves the board or
      # the netlist without restamping still fails here -- visibly, with the
      # exact new digest in the log -- and the fix is committing the
      # regenerated sidecar. Never continue-on-error: same fail-closed
      # contract as every other gate in this job.
      - name: Board-sync-stamp write + diff (pcb/temper.kicad_pcb provenance)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          uv run python scripts/check_netlist_board_reconciliation.py
          uv run python scripts/write_board_sync_stamp.py
          git diff --exit-code pcb/temper.kicad_pcb.source-digest

      - name: Net-classification-by-substring gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_net_classification.py -v --tb=short

      # Fail-closed, not soft-launched: catches the "safety-relevant net
      # classification by plain substring match, in parallel to
      # elec/domain_manifest.yaml" defect class confirmed three times in
      # this repo (creepage_check.py false positives, clearance_check.py
      # false negatives, clearance_engine.py's still-live bare "HV"/"AC"
      # substrings) -- and nine total once every net-name classifier in
      # the codebase was audited for the same shape. See
      # docs/evidence/2026-07-27-net-classification-gate.md.
      - name: Net-classification-by-substring gate (placer/router net-name classifiers)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_net_classification.py

      - name: PLL range consistency gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_pll_range_consistency.py -v --tb=short

      # Unit tests for the firmware-assumption contract oracle and its
      # shared formula library / board extractor / drift guard (plan
      # 2026-08-02-027). The oracle RUN step is advisory in
      # firmware-tests.yml until the off-outline tank cap is placed; the
      # unit tests below are hard -- they pin the defect-class detection,
      # the shared formulas and the registry/coverage validation.
      - name: Firmware-board contract oracle tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: >
          uv run pytest
          firmware/tools/test_board_derivation_lib.py
          firmware/tools/test_board_component_extractor.py
          firmware/tools/test_check_board_derivation_coverage.py
          scripts/tests/test_check_firmware_board_contract.py
          -v --tb=short

      # Fail-closed: catches firmware/components/control/pll_control.h's
      # PLL frequency bounds/default drifting away from elec/src/main.ato's
      # declared f_switching/f_pll_tracking_min/max -- the exact shape that
      # let main.ato assert a 20-100kHz tracking range 5x wider than the
      # firmware's real 30-50kHz clamp, and let PLL_DEFAULT_FREQ_HZ stay at
      # 35000 (a frequency later shown to lose 100.7% of ZVS margin) after
      # main.ato had already moved to 47kHz. See
      # docs/evidence/2026-07-28-pll-defaults-and-range-gate.md.
      - name: PLL range consistency gate (firmware vs elec/src/main.ato)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_pll_range_consistency.py

      # Plane-condemnation quantifier gate (docs/solutions/logic-errors/
      # single-zone-condemns-whole-copper-layer-plane-2026-07-29.md): catches
      # a MINORITY of a copper layer's zones (fraction < 0.5) silently
      # condemning the whole physical layer via _extract_stackup's
      # any()-quantifier classification. Every currently-condemned layer must
      # be on the dated plane-condemnation-allowlist.yaml or the gate fails,
      # so a NEW layer joining the condemned set is caught.
      - name: Plane-condemnation quantifier gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_plane_condemnation_quantifier.py -v --tb=short

      - name: Plane-condemnation quantifier gate (pcb/temper.kicad_pcb minority-zone layer exclusion)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_plane_condemnation_quantifier.py

      # Netlist-stage checks gate (docs/STRATEGY.md "Checks by stage"):
      # single-pin nets, unconnected power pins, and voltage-domain
      # compatibility against elec/build/default.net + elec/src/*.ato. 27
      # real, open single-pin-net findings are a dated backlog
      # (netlist-stage-checks-allowlist.yaml, seeded 2026-08-07, see that
      # file's header) -- not fixed here, deferred to a hardware maintainer;
      # a NEW finding still fails this step immediately.
      - name: Netlist-stage checks gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_netlist_stage_checks.py -v --tb=short

      - name: Netlist-stage checks gate (single-pin nets, unconnected power pins, voltage-domain compatibility)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_netlist_stage_checks.py

      # Part-stress gate (docs/hardware/PART_STRESS_AUDIT.md): applied stress
      # vs. absolute-maximum rating per part, data-driven against
      # scripts/part_stress_limits.yaml. 3 real over-rating findings are a
      # dated backlog (seeded 2026-08-07, see that file's header) -- board
      # redesign decisions for a hardware maintainer, not fixed here; a NEW
      # over-rating finding still fails this step immediately.
      - name: Part-stress gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_part_stress_gate.py -v --tb=short

      - name: Part-stress gate (applied stress vs. abs-max rating, scripts/part_stress_limits.yaml)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/part_stress_gate.py

      # ERC endpoint_off_grid consequence gate
      # (docs/evidence/2026-08-07-erc-off-grid-endpoint-analysis.md): cross-
      # checks every endpoint_off_grid-flagged pin's actual schematic net
      # (kicad-cli-exported, exact-coordinate connectivity) against its
      # atopile-compiled net member-for-member, so a merely-cosmetic ERC
      # warning class cannot hide a real "looks connected, isn't" defect.
      # `kicad-cli sch erc` intentionally exits non-zero whenever the
      # schematic has ANY warning/error (the normal case here) even though
      # the JSON report was written successfully -- same non-fatal-exit-code
      # convention the ERC ratchet gate (erc-gate.yml) already documents and
      # relies on -- so this step checks the report file was produced, not
      # the CLI's own exit code.
      - name: ERC endpoint_off_grid consequence gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_erc_off_grid_consequence.py -v --tb=short

      - name: Regenerate ERC JSON + schematic netlist XML (for endpoint_off_grid consequence gate)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          mkdir -p /tmp/erc_off_grid
          kicad-cli sch erc --format json --severity-all \
            -o /tmp/erc_off_grid/temper_erc.json pcb/temper.kicad_sch || true
          test -s /tmp/erc_off_grid/temper_erc.json
          kicad-cli sch export netlist --format kicadxml \
            -o /tmp/erc_off_grid/temper_netlist.xml pcb/temper.kicad_sch

      - name: ERC endpoint_off_grid consequence gate (pcb/temper.kicad_sch)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: >
          uv run python scripts/check_erc_off_grid_consequence.py
          --erc-json /tmp/erc_off_grid/temper_erc.json
          --sch-netlist-xml /tmp/erc_off_grid/temper_netlist.xml

  # Split out of Core Tests 2026-07-28. Gates that check a claim can be traced
  # to a measurement, plus the anti-vacuous-truth gate that checks a gate
  # actually measured something.
  #
  # "Measurement-provenance gate" is LAST, for the reason its own comment gives
  # -- drc_ceiling.json genuinely is stale, so the gate is expected to fail until
  # it is re-measured and re-approved. In the old single job it was "last among
  # the required gates" but still masked "Rebuild script invocation graph"; that
  # step now lives in `hygiene-gates`. Its position is no longer load-bearing
  # either: the `!cancelled() && steps.setup.outcome == 'success'` guard on every
  # gate step below the setup barrier means it masks nothing wherever it sits.
  # Split out of Core Tests 2026-07-28. Whole-repo hygiene: dead code, script
  # inventory, root-directory litter, import boundaries, undeclared imports.
  # "Script manifest gate" stays ahead of "Rebuild script invocation graph",
  # the same relative order they had in the old job and not an arbitrary one:
  # trace_invocations.py rewrites scripts/manifest.yaml (the `imports` field)
  # and scripts/invocation_graph.json in place, so the gate that reads the
  # committed manifest has to run before the step that regenerates it.
  hygiene-gates:
    name: Repo Hygiene & Import Gates
    needs: [changes]
    if: ${{ github.event_name == 'push' || needs.changes.outputs.hygiene-gates == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bennetleff/temper-ci:latest
      options: --user root
    timeout-minutes: 20
    env:
      VIRTUAL_ENV: /_temper-venv
      UV_PROJECT_ENVIRONMENT: /_temper-venv
      TEMPER_REQUIRE_RUST_DRC: "1"
    steps:
      - uses: actions/checkout@v7

      # Container runs as root; workspace is owned by the runner user. Without
      # this, every `git` call in a later `run:` step exits 128 on "dubious
      # ownership" rather than doing its job.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Install maturin
        run: uv pip install maturin

      - name: Build and install Rust crate
        run: uv run maturin develop --release --manifest-path packages/temper-rust-router/Cargo.toml

      - name: Verify Rust module loads
        run: uv run python3 -c "import temper_rust_router; print('temper_rust_router loaded OK')"
        env:
          RUST_BACKTRACE: full

      - name: Build and install temper-drc-rs
        run: uv run maturin develop --release --manifest-path packages/temper-drc-rs/Cargo.toml

      - name: Verify temper-drc-rs loads
        run: uv run python3 -c "import temper_drc_rs; print('temper_drc_rs loaded OK')"
        env:
          RUST_BACKTRACE: full

      - name: Build and install temper-constraints
        run: >
          uv run maturin develop --release
          --manifest-path packages/temper-placer/temper-constraints/Cargo.toml
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

      - name: Verify temper-constraints loads
        run: uv run python3 -c "import temper_constraints; print('temper_constraints loaded OK, version', temper_constraints.version_py())"
        env:
          RUST_BACKTRACE: full

      # `uv sync` defaults to an *exact* sync: anything installed in the venv
      # that is not part of this invocation's resolved target set gets
      # uninstalled as "extraneous". `--no-install-package X` excludes X from
      # that target set -- it does NOT mean "leave X alone". Without
      # `--inexact`, the three flags below were therefore silently
      # UNINSTALLING the release wheels that "Build and install ..." just
      # built and "Verify ... loads" just confirmed importable, minutes
      # earlier in this same job. Reproduced locally: `uv sync --all-packages
      # --no-install-package temper-rust-router ...` (no --inexact) prints
      # "Uninstalled 2 packages" and `- temper-rust-router==0.1.0` in its
      # diff, and a subsequent bare import fails with ModuleNotFoundError.
      # `--inexact` disables the extraneous-package removal, so these three
      # packages are truly left untouched (mtimes unchanged, no rebuild)
      # instead of evicted -- confirmed locally: with --inexact added, the
      # same command reports "Audited N packages" (no install/uninstall) and
      # the modules remain importable afterward.
      - name: Install dependencies
        run: >
          uv sync --all-packages --inexact
          --no-install-package temper-rust-router
          --no-install-package temper-drc-rs
          --no-install-package temper-constraints

      - name: Cache netlist
        id: cache-netlist
        uses: actions/cache@v6
        with:
          path: elec/build
          key: netlist-${{ hashFiles('elec/src/**', 'elec/ato.yaml', 'Makefile') }}

      - name: Build electronics netlist
        if: steps.cache-netlist.outputs.cache-hit != 'true'
        run: make netlist

      # ---- SETUP / GATE BOUNDARY -------------------------------------------
      # Everything ABOVE is setup and stays fail-fast: it has no `if:`, so if
      # any of it fails (maturin, uv sync, make netlist) this step never runs,
      # `steps.setup.outcome` is not `success`, and every gate below is SKIPPED
      # rather than run against a half-built environment and reported as a gate
      # verdict. Everything BELOW is a gate: each carries
      # `if: !cancelled() && steps.setup.outcome == 'success'` so a red gate no
      # longer deletes the verdict of the gates behind it. None of them is
      # `continue-on-error`, so the job still concludes `failure` if any fails.
      - name: Setup barrier -- environment ready
        id: setup
        run: echo "setup complete; gates below report independently"

      # Still genuinely failing, but the debt is being paid down: `uv run
      # ruff check packages/` -> 45 errors, exit 1, verified 2026-08-07 (29
      # auto-fixable with --fix). This is down from the "594 pre-existing"
      # this mask originally cited -- the placeholder count was stale, not
      # the mask itself. Tolerated because 45 pre-existing errors would
      # otherwise block every unrelated PR touching packages/ until they're
      # individually triaged; removable once ruff check exits 0 (or the
      # remainder is captured in a per-file ignore list instead of a
      # blanket job-level mask).
      - name: Lint with ruff
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        continue-on-error: true
        run: uv run ruff check packages/

      - name: Vulture dead-code gate
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/vulture_gate.py

      - name: Script manifest gate
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_manifest_gate.py

      # Wave 4 R7: "the program is complete only when every surface has a
      # recorded verdict". docs/wave4-verdicts.yaml records one per surface and
      # this asserts the ledger stays well-formed and covers every Python file
      # under its roots -- a new module in an undecided surface, or a
      # JUSTIFIED-KEEP with no named blocker (D6), fails here rather than
      # drifting silently. The instrument shipped in #682 without being wired
      # to anything, which is the ungated-gate class this job exists to close.
      - name: Wave 4 verdict coverage gate (R7)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_verdict_coverage.py

      # 2026-08-11: this gate (scripts/check_unwired_kernels.py) previously
      # ran ONLY in trunk-health.yml -- a post-merge/hourly canary that, by
      # its own module docstring, "deliberately gates nothing... must not
      # become a required context... it reports on main, it does not judge
      # pull requests." That is precisely why a Rust kernel could land fully
      # verified (registered, differential green) and never get wired to a
      # production call site without any PR ever seeing red for it: the one
      # check built to catch exactly that state only spoke up after the
      # merge, on a workflow explicitly barred from blocking anything. See
      # docs/evidence/2026-08-06-router-v6-status-reconciliation.md for the
      # 4,096-LOC backlog that accumulated behind this gap. Running the same
      # AST/regex scan here, in a required context, closes it: a PR that
      # ships a new unwired kernel (or leaves a paid-down one stale in the
      # ledger) now fails before merge instead of after. The scan itself
      # needs no built extensions -- it parses .rs/.py source text -- so it
      # is safe to run unconditionally alongside the verdict-coverage gate
      # above rather than gated on the maturin builds earlier in this job.
      - name: No unwired Rust kernels (shim-rewiring gate)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_unwired_kernels.py

      # 2026-08-17: the mirror-image gap to the gate just above. That one
      # catches a Rust kernel with no Python caller; this one catches a whole
      # Python MODULE with no caller at all -- a shim whose last production
      # importer was deleted, a stage that lost its wiring, a spike that was
      # never adopted. docs/evidence/2026-08-17-python-deprecation-spike.md
      # (PR #1302) found this shape by hand across several package trees in
      # one pass (metrics/physics.py orphaned since 2026-07-10 when its sole
      # caller was deleted; a 1,984 LOC router_v6/constraints_* cluster; more)
      # with no gate watching for it. Parses only .py/.rs source text -- no
      # built extensions needed -- so it runs unconditionally here too.
      - name: No orphaned Python modules (dead-module gate)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_orphaned_python_modules.py

      # 2026-08-18: the two gates above are each half of a question neither
      # of them asks. `check_unwired_kernels.py` asks "does anything call
      # this Rust symbol?"; `check_orphaned_python_modules.py` asks "does
      # anything import this Python module?". Both answer YES for a Rust
      # file that shares a Python module's NAME while implementing a
      # different one -- and that exact confusion happened four times in one
      # session on 2026-08-18: `astar_kernel_3d` (a 2D kernel) read as
      # covering the N-layer Python; `courtyard_check_stage.rs` read as
      # covering `core/courtyard.py` when it ports
      # `deterministic/stages/courtyard_check.py`; `hypergraph_factory.rs`
      # read as covering `core/hypergraph.py` when it ports
      # `extraction/hypergraph_factory.py`; `net_ordering.rs` read as
      # covering the router's ordering when the live A* path runs
      # pure-Python `_astar_ordering.py`. In every case a Python module
      # everyone believed was ported kept running, and no gate said
      # anything. This one asks about the PAIRING, decided by call-path
      # reachability rather than filenames, and carries a `--self-test` that
      # fails if it ever stops flagging those four. Source-text scan only --
      # no built extensions needed.
      - name: Rust coverage illusions (name-is-not-coverage gate)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          uv run python scripts/check_rust_coverage_illusions.py --self-test
          uv run python scripts/check_rust_coverage_illusions.py
          # The gate's own anti-vacuity suite, run here rather than left to a
          # directory sweep: its mutation test (seed a real call from the
          # Python module to the namesake, the finding must vanish) is what
          # proves the verdict comes from the call graph and not from
          # filenames. A gate whose only evidence is "it ran" is the thing
          # this repo keeps getting burned by.
          uv run python -m pytest -q \
            packages/temper-placer/tests/scripts/test_rust_coverage_illusion_gate.py

      # 2026-08-13: `temper-geometry` had two independent `#[pyfunction] pub
      # fn kw_boundary_match_py` definitions (via_clearance.rs and
      # trace_width_assignment.rs) both wrap_pyfunction!'d into the same
      # temper_geometry pymodule -- pyo3's PyModule::add_function is a plain
      # setattr, so the later registration silently won and the earlier
      # implementation became unreachable dead code with its own passing
      # unit tests. Invisible to cargo build/test, to
      # check_stale_extensions.py (certifies freshness, not per-symbol
      # implementation-uniqueness), and specifically to
      # check_unwired_kernels.py just above (its registered_symbols() scan
      # uses dict.setdefault(), so it silently keeps the first registration
      # and never notices a second one exists). This gate parses only .rs
      # source text -- no built extensions needed -- so it runs
      # unconditionally alongside the other two source-tree scans above.
      - name: No duplicate pyo3 function/class registration
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_pyo3_duplicate_registration.py
      # 2026-08-13: `point_to_segment_distance` had 5 independent Rust bodies
      # across temper-geometry and temper-constraint-compiler, each pinned to
      # its own Python oracle with its own degenerate-length epsilon (1e-12,
      # 1e-10, exact-zero, exact-zero-or-non-finite) -- one of them directly
      # on the HV creepage/clearance safety path. None was caught by any
      # existing gate: each differential proves internal consistency against
      # its own oracle, not that the copy should exist, and a name-based
      # search undercounts (fixed_copper.rs's copy was renamed to
      # `point_segment_distance`). This gate scans Rust source structurally
      # (a degenerate-length branch + a [0,1] clamp + a Euclidean close, not
      # a specific function name) so the next accidental copy -- renamed or
      # not -- fails a PR before merge instead of quietly acquiring its own
      # pinned oracle. See docs/evidence/2026-08-13-point-to-segment-distance-
      # epsilon-consolidation.md. Needs no built extensions -- parses .rs
      # source text -- so it runs unconditionally like the gate above.
      - name: No new point-to-segment-distance-shaped Rust copies (geometry-primitive-duplication gate)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_geometry_primitive_duplication.py

      # requirements-ci.txt is baked into the CI image's pre-installed venv
      # (.github/docker/ci.Dockerfile). If it drifts from uv.lock, the image
      # ships a different dependency set than the lockfile declares and jobs
      # silently test against the wrong versions -- exactly the two-
      # representations-of-one-fact drift class the consistency gates exist
      # for. Fail closed on any difference; regenerate with the command in the
      # file's own header.
      - name: requirements-ci.txt matches uv.lock
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          uv export --all-packages --no-emit-workspace --format requirements-txt \
            --no-hashes > /tmp/requirements-ci.expected
          diff -u requirements-ci.txt /tmp/requirements-ci.expected

      # Removed 2026-08-07: dead weight. check_script_sunset.py's main()
      # ends in an unconditional `sys.exit(0)` with the comment "Sunset
      # never blocks PR merge" -- warnings/escalations are printed but
      # never change the exit code, verified by running it locally (13
      # warnings, 0 escalations, exit 0). The only non-zero exits
      # (sys.exit(5), lines ~130-144) are fail-closed "gate cannot run"
      # cases (manifest or invocation-graph file missing/malformed) -- this
      # mask was hiding those too, inconsistently with the rest of this
      # job's "a gate that cannot run must exit non-zero" discipline
      # (see e.g. the isolation-barrier and board-containment gates below).
      # Unmasked so that residual case hard-fails as it should; the
      # genuinely-informational sunset warnings still can't fail the step.
      - name: Script sunset check (warnings only)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_script_sunset.py

      # Fixed 2026-08-17 (was tolerated via continue-on-error since
      # 2026-08-07): root-level `conftest.py` (added by #726, a56390f6)
      # tripped the `*.py` category's empty-by-design allowlist even though
      # it is the standard pytest convention, not a stray script --
      # pytest auto-discovers conftest.py by directory position, so it
      # cannot be moved to scripts/ (the category's usual remedy) without
      # silently changing which tests see its fixtures.
      # scripts/test_root_hygiene.py's _PER_GLOB_ALLOWLIST["*.py"] now
      # allows it explicitly, so this step hard-gates again.
      - name: Root artifact hygiene check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/test_root_hygiene.py -v --tb=short

      - name: Import boundary enforcement
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/import_linter_gate.py

      - name: Physics soundness-proof register gate (R20)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/physics_soundness_register_gate.py

      - name: Undeclared-import gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_undeclared_imports.py -v --tb=short

      # Fail-closed, not soft-launched: catches the jinja2/sympy class of
      # incident (a third-party module imported by first-party code but
      # declared nowhere, silently dying inside a continue-on-error step).
      # Must run after `uv sync --all-packages` above (never a plain
      # `uv sync`, which prunes workspace packages) so resolvability
      # reflects the same environment the rest of this job runs under. See
      # docs/evidence/2026-07-27-undeclared-import-gate.md.
      - name: Undeclared-import gate (scripts/ and Python test trees)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_undeclared_imports.py

      - name: Rebuild script invocation graph
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/trace_invocations.py

      - name: Salted-hash order gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_hash_order_determinism.py -v --tb=short

      # CPython randomises the string hash salt per process (PEP 456), so a
      # set/frozenset iteration order -- or a hash() value -- differs between
      # two runs of identical code on identical input. Six sites in four
      # modules derived component coordinates, a geometric waypoint, and an
      # emitted report's order from exactly that; see issue #752 (6 and 7),
      # PR #730, and this script's docstring. The gate fails on any NEW site;
      # the known ones are ratcheted in .hash-order-inventory. Its runtime
      # counterpart runs inside the placer package
      # (tests/deterministic/test_hash_order_determinism.py) so it is present
      # under the `cd packages/temper-placer && pytest` invocation too.
      - name: No new salted-hash order dependencies
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_hash_order_determinism.py

      - name: No-raw-rotation-trig gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_no_raw_rotation_trig.py -v --tb=short

      # KiCad's footprint-child rotation formula (R(-theta)) was
      # independently reimplemented, wrongly, in 12 places -- see
      # docs/evidence/2026-07-29-cross-domain-creepage-rotation-convention.md
      # -- and concealed real clearance hazards on 18 production
      # components. The 12 are now consolidated into one implementation,
      # temper_placer.geometry.kicad_transform; this gate fails if any of
      # the files that have already proven capable of hosting that bug
      # regresses back to a raw, locally-typed copy of the formula.
      - name: No raw rotation trig outside kicad_transform
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_no_raw_rotation_trig.py

      - name: Pad-world-position oracle gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_pad_world_position_oracle.py -v --tb=short

      # The behavioural half of the rotation-convention defence. The lint
      # above is syntactic and therefore cannot see a correctly-typed
      # R(+theta): scripts/measure_cross_domain_creepage.py carried exactly
      # that for three weeks, reporting the WRONG VIOLATION SET (a K1/C6
      # evaluation read 155 -> 235 violations under R(+theta) versus
      # 122 -> 92 under KiCad's real convention, i.e. it argued against a
      # correct change). This gate resolves every registered pad-placement
      # implementation by import and CALLS it, comparing the answer to
      # pcbnew's own placement engine via a pinned corpus. Needs no pcbnew
      # on the runner -- the corpus is pinned to the oracle's sha256 and
      # the gate fails closed if that drifts. See AGENTS.md, "Measurement
      # Instruments That Lie".
      - name: Pad world positions agree with pcbnew (rotation convention)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_pad_world_position_oracle.py
      - name: Pad-core-polygon oracle gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_pad_core_polygon_oracle.py -v --tb=short

      # The second, independent half of the same convention: not where a
      # pad's CENTRE lands (check_pad_world_position_oracle.py) but which
      # way its copper RECTANGLE is turned about that centre.
      # pad_core_polygon / pad_polygon and their bit-exact Rust twin
      # clearance_geometry.rs::pad_core rotated R(+theta) -- the mirror of
      # KiCad's rule -- and nothing noticed, because all 527 pads on this
      # board sit at multiples of 90 degrees where the two conventions
      # produce the same corner set. Correct by coincidence of placement,
      # not by construction. This gate resolves every such implementation
      # by import, calls it, and compares against corners pcbnew itself
      # produced at angles where the conventions differ.
      - name: Pad copper rectangle matches pcbnew at non-90-degree angles
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_pad_core_polygon_oracle.py

      - name: Duplicate-predicate consolidation gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_duplicate_predicates.py -v --tb=short

      # 2026-08-13 defect-multiplier audit (docs/evidence/2026-08-13-defect-
      # multiplier-duplication-audit.md): the same-shape defect across pad
      # resolution, net-name boundary matching, footprint bounds and rotation
      # units was the same logic independently reimplemented in several
      # places, so one defect became N. The registry module (see
      # duplicate_predicate_registry.py, alongside this gate under scripts/)
      # registers each family that has since been consolidated onto one SSOT
      # (net_pad_positions; thermal_fdm's dead point_to_segment_distance
      # copy); this gate fails if a NEW independent copy of a registered
      # family's def name reappears, named per offending site.
      - name: Duplicate-predicate consolidation gate
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_duplicate_predicates.py

      # Constraint mutation suite (plan 2026-08-02-006, R32): every CP-SAT
      # constraint encoding must carry a non-empty, triaged kill set in
      # power_pcb_dataset/constraint_kill_sets.yaml. Fixed 2026-08-11
      # (gate-vacuity audit, finding 8): the gate used to be a pure AST + YAML
      # check with no solves, which meant it could never fail on a gutted
      # encoder -- it only re-read whatever a past, disconnected run of
      # constraint_mutation_runner.py had written to the register, forever.
      # It now also re-runs constraint_mutation_runner.run_suite() live (the
      # same pinned-solve harness the runner uses, ~1s for all 32 registered
      # mutations) and requires every registered outcome to still match a
      # fresh run against current encoder source -- see
      # scripts/constraint_mutation_gate.py's check_live_kill_sets docstring
      # and docs/evidence/2026-08-11-gate-vacuity-audit.md.
      - name: Constraint mutation gate (kill-set register)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/constraint_mutation_gate.py

      # The mutation suite's own unit tests (runner, register, gate) plus the
      # U4 fail-capable defense tests. The full 32-mutation run is ~2s (per-
      # mutation defense subset, pinned single-worker solver) — the KTD2 CI
      # cost model.
      - name: Constraint mutation suite tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: packages/temper-placer
        run: >
          uv run pytest
          tests/pcl/test_mutation_runner.py
          tests/pcl/test_mutation_register.py
          tests/pcl/test_mutation_gate.py
          tests/pcl/test_keepout_mutation_defense.py
          tests/pcl/test_loop_area_mutation_defense.py
          -v --tb=short -p no:cacheprovider

  # Split out of Core Tests 2026-07-28. The encoded IEC 60335 / EMC / design
  # review / DFM requirement suites -- 240+ tests on a mains-connected design,
  # guarded by --min-tests so the suite cannot silently shrink to zero. In the
  # old job these sat at step 49 of 58 and had not executed on main since the
  # isolation gate went red. They get their own verdict.
  # Split out of Core Tests 2026-07-28, then split again 2026-07-29. The four
  # suites below (bundle / cp-sat / workflow / checks) used to share one
  # `extended-suites` job as four backgrounded processes racing for one
  # container's CPU, with a combined 25-minute budget. Measured bimodal
  # around that budget: 18m05s on run 30429718944 (main), 25m03s -- killed by
  # `timeout-minutes`, GitHub reporting it as "The operation was canceled" --
  # on a PR re-running the identical commit, then 24m31s (29s of headroom) on
  # a second re-run of that same commit. Every test in every one of those
  # runs had PASSED; the job was failing on its own clock, not on defects.
  #
  # `--durations`/log-timestamp analysis of the 18m05s run (see
  # docs/evidence/2026-07-29-extended-suites-timeout-split.md) attributes
  # essentially the entire wall-clock to three cp-sat tests:
  #   tests/placer/cp_sat/test_hybrid_pour_stitch_measurement.py
  #     ::test_hybrid_pour_reduces_unconnected_without_shorting_regression  ~665s
  #   tests/placer/cp_sat/test_zone_pour_production_measurement.py
  #     ::test_zone_pours_reduce_unconnected_items                          ~163s
  #   tests/placer/cp_sat/test_regression_drc.py
  #     ::test_production_board_routing_drc_regression                      ~74s
  # (~902s of the ~15m20s the cp-sat pytest invocation ran, out of an 18m05s
  # job). bundle/workflow/checks together account for well under a minute.
  # These three all shell out to kicad-cli for DRC sampling ("median of 3 DRC
  # samples each"), so their wall-clock varies with whatever else is
  # contending for CPU on the runner -- including the other three suites this
  # job used to background alongside them. That shared contention, not a
  # defect in any test, is what pushed the same commit from 18m05s to 25m03s
  # between re-runs.
  #
  # Fix: give cp-sat its own job on its own runner, so its DRC-subprocess
  # tests are no longer competing with bundle/workflow/checks for the same
  # container's CPU, and so a slow cp-sat run no longer puts the fast suites
  # at risk of the same shared clock (or vice versa). bundle/workflow/checks
  # keep a combined budget since together they cost under a minute; cp-sat
  # gets the old job's full 25-minute budget to itself. Per-test outcomes are
  # unchanged -- each suite runs the exact same pytest/cargo invocation it did
  # as a backgrounded process before, `continue-on-error: true` preserved
  # exactly as it was on the old combined step (TODO: temper-NNN -- parallel
  # test suite flakiness; hard-fail after 2026-09-01).
  extended-bundle-workflow-checks:
    name: Extended Test Suites (bundle / workflow / checks)
    # Trunk-only. This job's sole substantive step carries continue-on-error,
    # so it is structurally incapable of failing the build on ANY trigger --
    # not just a PR. It is not in .github/required-checks.json's
    # required_contexts, so nothing polls it and nothing merges on its verdict.
    #
    # NARROWED 2026-08-11 (docs/evidence/2026-08-11-python-ci-load-inventory.md):
    # was `if: github.event_name != 'pull_request'`, so it ran on every push to
    # main IN ADDITION to nightly/workflow_dispatch -- measured ~159
    # jobs-that-actually-execute/week at this repo's push rate (many concurrent
    # agent worktrees push to main directly), ~5.4 min each, for a step whose
    # result nothing can ever act on. Nightly (cron `0 3 * * *` in this
    # workflow's `on:`) already gives this the same informational cadence a
    # human would want from a masked suite; workflow_dispatch covers on-demand.
    # Removing the push trigger removes ~860 job-minutes/week and changes zero
    # gating behavior (there was none to change).
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bennetleff/temper-ci:latest
      options: --user root
    timeout-minutes: 15
    env:
      VIRTUAL_ENV: /_temper-venv
      UV_PROJECT_ENVIRONMENT: /_temper-venv
      TEMPER_REQUIRE_RUST_DRC: "1"
    steps:
      - uses: actions/checkout@v7

      # Container runs as root; workspace is owned by the runner user. Without
      # this, every `git` call in a later `run:` step exits 128 on "dubious
      # ownership" rather than doing its job.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Install maturin
        run: uv pip install maturin

      - name: Build and install Rust crate
        run: uv run maturin develop --release --manifest-path packages/temper-rust-router/Cargo.toml

      - name: Verify Rust module loads
        run: uv run python3 -c "import temper_rust_router; print('temper_rust_router loaded OK')"
        env:
          RUST_BACKTRACE: full

      - name: Build and install temper-drc-rs
        run: uv run maturin develop --release --manifest-path packages/temper-drc-rs/Cargo.toml

      - name: Verify temper-drc-rs loads
        run: uv run python3 -c "import temper_drc_rs; print('temper_drc_rs loaded OK')"
        env:
          RUST_BACKTRACE: full

      - name: Build and install temper-constraints
        run: >
          uv run maturin develop --release
          --manifest-path packages/temper-placer/temper-constraints/Cargo.toml
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

      - name: Verify temper-constraints loads
        run: uv run python3 -c "import temper_constraints; print('temper_constraints loaded OK, version', temper_constraints.version_py())"
        env:
          RUST_BACKTRACE: full

      # `uv sync` defaults to an *exact* sync: anything installed in the venv
      # that is not part of this invocation's resolved target set gets
      # uninstalled as "extraneous". `--no-install-package X` excludes X from
      # that target set -- it does NOT mean "leave X alone". Without
      # `--inexact`, the three flags below were therefore silently
      # UNINSTALLING the release wheels that "Build and install ..." just
      # built and "Verify ... loads" just confirmed importable, minutes
      # earlier in this same job. Reproduced locally: `uv sync --all-packages
      # --no-install-package temper-rust-router ...` (no --inexact) prints
      # "Uninstalled 2 packages" and `- temper-rust-router==0.1.0` in its
      # diff, and a subsequent bare import fails with ModuleNotFoundError.
      # `--inexact` disables the extraneous-package removal, so these three
      # packages are truly left untouched (mtimes unchanged, no rebuild)
      # instead of evicted -- confirmed locally: with --inexact added, the
      # same command reports "Audited N packages" (no install/uninstall) and
      # the modules remain importable afterward.
      - name: Install dependencies
        run: >
          uv sync --all-packages --inexact
          --no-install-package temper-rust-router
          --no-install-package temper-drc-rs
          --no-install-package temper-constraints

      - name: Cache netlist
        id: cache-netlist
        uses: actions/cache@v6
        with:
          path: elec/build
          key: netlist-${{ hashFiles('elec/src/**', 'elec/ato.yaml', 'Makefile') }}

      - name: Build electronics netlist
        if: steps.cache-netlist.outputs.cache-hit != 'true'
        run: make netlist

      # ---- SETUP / GATE BOUNDARY -------------------------------------------
      # Everything ABOVE is setup and stays fail-fast: it has no `if:`, so if
      # any of it fails (maturin, uv sync, make netlist) this step never runs,
      # `steps.setup.outcome` is not `success`, and every gate below is SKIPPED
      # rather than run against a half-built environment and reported as a gate
      # verdict. Everything BELOW is a gate: each carries
      # `if: !cancelled() && steps.setup.outcome == 'success'` so a red gate no
      # longer deletes the verdict of the gates behind it. None of them is
      # `continue-on-error`, so the job still concludes `failure` if any fails.
      - name: Setup barrier -- environment ready
        id: setup
        run: echo "setup complete; gates below report independently"

      - name: Run bundle / workflow / checks suites in parallel
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # cp-sat split into its own job (extended-cpsat, below) 2026-07-29 --
        # see the comment above this job for why. What remains here is the
        # same three backgrounded suites, unchanged, still racing each other
        # for this container's CPU (that contention is fine: together they
        # cost well under a minute, so it was never the source of the
        # timeout risk cp-sat was).
        #
        # `cargo test --manifest-path packages/temper-design-bundle/Cargo.toml`
        # REMOVED from BUNDLE_PID's chain 2026-08-11 (cost policy: the
        # deployed WASM tier should run ONLY there, not also in GitHub
        # Actions). This job runs on every push to main / nightly / manual
        # dispatch (`if: github.event_name != 'pull_request'` on the job
        # itself, above) -- not on PRs -- but it still re-ran the crate's
        # FULL native suite on every one of those trunk events, duplicating
        # what the deployed tier already covers: docs/evidence/2026-08-11-
        # native-only-classification-all-crates.md measured the tier
        # covering 24 of temper-design-bundle's 26 registered tests, with 2
        # native-only (both `tests/temper_bundle.rs` integration targets).
        # Those 2 now execute natively only when temper-design-bundle comes
        # up in wasm-tier-nightly.yml's R19 rotation (full cycle every 9
        # nights -- see that file's header). The python-import check below
        # is UNCHANGED and does not depend on `cargo test` having run --
        # `temper_design_bundle_python` is built by the earlier `uv sync
        # --all-packages` step in this job's setup, not by this suite.
        run: |
          set +e
          (uv run python3 -c "import temper_design_bundle_python; print('temper_design_bundle_python loaded OK')") &
          BUNDLE_PID=$!

          (cd packages/temper-workflow && uv run pytest tests/ -v --tb=short) &
          WORKFLOW_PID=$!

          (uv run python tools/check_kicad_layers.py && \
           cd packages/temper-placer && \
           uv run pytest tests/io/test_4layer_output_properties.py -v --tb=short && \
           uv run python3 firmware/test/gen_transition_table.py --generate && \
           git diff --exit-code firmware/test/test_transition_table_generated.c) &
          CHECKS_PID=$!

          FAIL=0
          for pid in $BUNDLE_PID $WORKFLOW_PID $CHECKS_PID; do
            wait $pid || FAIL=1
          done
          exit $FAIL
        # Still genuinely failing, but NOT flakiness -- verified 2026-08-07
        # by running all three backgrounded suites locally: CHECKS_PID fails
        # deterministically, every time, at a broken relative path. The
        # subshell does `cd packages/temper-placer` then references
        # `firmware/test/gen_transition_table.py`, but that script only
        # exists at the repo root (firmware/test/gen_transition_table.py),
        # not under packages/temper-placer/firmware/ -- `python3: can't open
        # file '.../packages/temper-placer/firmware/test/
        # gen_transition_table.py'`. Introduced in 6be2e82c (2026-06-22) and
        # unchanged since. This is a one-line path bug (missing `../../` or
        # equivalent), not test-suite flakiness -- the stated reason is
        # wrong, not just the ticket placeholder. Not fixed here (out of
        # scope for a continue-on-error-only pass on this file); flagged for
        # a follow-up PR that corrects the path and can then remove this
        # mask entirely.
        continue-on-error: true

  # 2026-07-30: the 2026-07-29 split (see the comment above
  # extended-bundle-workflow-checks) gave `extended-cpsat` the old combined
  # job's full 25-minute budget on the theory that setup duplication plus
  # losing shared-container contention would buy enough headroom. It did not:
  # measured on five real runs the same day (`gh api .../actions/jobs/<id>`
  # for step timestamps, jobs 90792612424/90792213660/90768065686/
  # 90767711657/90767518154 -- runs on PRs #478 and #480-adjacent commits),
  # setup (checkout through the netlist-cache step) is a consistent
  # 2m19s-2m45s (~10% of the 25-minute budget) and the `Run cp-sat suite` step
  # itself is 20m45s-22m38s -- i.e. setup was never the dominant cost the
  # duplication hypothesis needed it to be. Two runs were cancelled at exactly
  # the 25:00 mark (90792213660, 90768065686, 90767518154); two finished at
  # 23m22s/24m26s -- 1-2 minutes of headroom, not a comfortable margin.
  #
  # Re-ran the same `--durations`/timestamp-gap analysis the 2026-07-29 doc
  # used, on two full job logs (`gh api .../actions/jobs/<id>/logs`,
  # 411 collected tests each). The same three tests still dominate, but they
  # got slower since the 2026-07-29 measurement (902s combined then):
  #
  #   tests/placer/cp_sat/test_hybrid_pour_stitch_measurement.py
  #     ::TestHybridPourStitchVerification
  #     ::test_hybrid_pour_reduces_unconnected_without_shorting_regression
  #                                                    877.7s / 986.9s
  #   tests/placer/cp_sat/test_zone_pour_production_measurement.py
  #     ::TestZonePourProductionMeasurement::test_zone_pours_reduce_unconnected_items
  #                                                    233.9s / 211.3s  (XFAIL)
  #   tests/placer/cp_sat/test_regression_drc.py
  #     ::test_production_board_routing_drc_regression 114.2s / 102.2s
  #     (flaky between the two runs -- FAILED once, PASSED once; masked by
  #     this step's own `continue-on-error`, unrelated to timing and NOT
  #     addressed here -- out of scope for a CI-timing fix)
  #
  # 1225.8s / 1300.4s combined, out of a ~1245s/~1320s pytest span -- still
  # >98% of the suite's own wall-clock, same as 2026-07-29, just ~35% larger
  # in absolute terms. So the 2026-07-29 fix's diagnosis (three DRC-subprocess
  # tests dominate) held; its conclusion (giving them the old 25-minute budget
  # alone would fix it) did not, because the three tests' own cost grew to
  # consume the budget the split was meant to free up.
  #
  # Fix, per the task's stated preference order:
  #
  #   1. Split the three slow tests into their own job (`extended-cpsat-slow`,
  #      below) -- attacks the actual cost instead of working around it.
  #      Moved by exact pytest node ID (not by file: test_regression_drc.py's
  #      other three tests -- test_golden_board_drc_regression 1.0s,
  #      test_golden_board_routing_drc_regression <1s,
  #      test_production_board_drc_regression 10.7s -- are fast and stay in
  #      this job). `--deselect` on this job's invocation and an explicit
  #      node-ID list on the new job's invocation are the same three IDs,
  #      verified against each other below and against the 411-test collected
  #      count from the pre-split logs (408 remain here + 3 move =  411, none
  #      dropped). Both jobs run `pytest_guard.py` so a silent collection
  #      shrink fails the build instead of reporting green having run less
  #      (see scripts/pytest_guard.py's own docstring for why that check
  #      exists).
  #   2. `-n auto --dist loadgroup` on the new slow job. Rejected for this
  #      exact purpose by the 2026-07-29 doc on the reasoning that xdist
  #      "parallelizes *other* tests around" the three slow ones and doesn't
  #      touch their own floor -- true when they shared a job with
  #      bundle/workflow/checks-sized fast suites, but no longer the shape of
  #      the problem once the three ARE the whole job: none of them carries an
  #      `xdist_group` mark (checked packages/temper-placer/tests/conftest.py's
  #      `_XDIST_GROUPS` -- only "induction" and "sat" are pinned, this trio
  #      isn't in it), so `--dist loadgroup` schedules each of the three to
  #      whichever worker is free, same as plain `--dist load` would for
  #      ungrouped items -- `loadgroup` is still the required flag per this
  #      job's own instructions, it just isn't doing anything materially
  #      different from `load` for exactly these three items. Measured
  #      worker count on this container via a same-day `invariant-router-v6-1`
  #      log: "created: 2/2 workers" -- only 2 CPUs, so the realistic gain is
  #      running the biggest test (~880-990s) alongside the second (~210-235s)
  #      instead of after it, then picking up the third (~100-115s) on
  #      whichever worker frees first. Expected wall-clock floor is therefore
  #      close to the single largest test's own duration (~900-1000s) rather
  #      than the sum (~1225-1300s) -- a real reduction, not a full 3x, and
  #      the actual number is measured post-merge (see PR) rather than
  #      assumed, because CPU-bound subprocess tests sharing 2 cores may not
  #      scale linearly.
  #   3. Setup is not duplicated beyond what already existed after the
  #      2026-07-29 split -- both new jobs still need the full maturin/uv
  #      chain, same as every other split-out job in this file. Not attacked
  #      here since (per point above) it was never the dominant cost.
  #   4. The two remaining production tests now run as independent matrix
  #      jobs below. This is important after the memory fix: a completed
  #      zone-pour route can take ~45 minutes on main, and the documented
  #      production route can approach 1193s before runner contention and
  #      setup variance. Give the zone-pour lane 75 minutes (a ~70-minute
  #      test allowance plus ~3 minutes measured setup and margin). The
  #      routing-DRC lane is also 75 minutes: run 33262575088/job 99126939400
  #      spent ~6 minutes in setup and ~44 minutes in the test before the
  #      original 50-minute cap cancelled it without a result. Each matrix
  #      expansion is a separate trunk-only job,
  #      so one test cannot consume the other's timeout or hide its traceback.
  #   `extended-cpsat` (this job, now just the fast remainder) drops to
  #   `timeout-minutes: 15`, matching `extended-bundle-workflow-checks`'s
  #   budget for a suite of the same "well under a minute" shape.
  extended-cpsat:
    name: Extended Test Suites (cp-sat, fast)
    # Masked test step (continue-on-error below), cannot fail any build --
    # not in required-checks.json's required_contexts. This was the longest
    # job in the run (6.9 min) and gated nothing.
    #
    # NARROWED 2026-08-11 (docs/evidence/2026-08-11-python-ci-load-inventory.md):
    # was `if: github.event_name != 'pull_request'` (every push to main, not
    # just PRs). Moved to schedule/workflow_dispatch only -- see the identical
    # reasoning on extended-bundle-workflow-checks, above. ~159 executing
    # pushes/week x ~6.2 min removed; nightly cadence unchanged.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bennetleff/temper-ci:latest
      options: --user root
    timeout-minutes: 15
    env:
      VIRTUAL_ENV: /_temper-venv
      UV_PROJECT_ENVIRONMENT: /_temper-venv
      TEMPER_REQUIRE_RUST_DRC: "1"
    steps:
      - uses: actions/checkout@v7

      # Container runs as root; workspace is owned by the runner user. Without
      # this, every `git` call in a later `run:` step exits 128 on "dubious
      # ownership" rather than doing its job.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Install maturin
        run: uv pip install maturin

      - name: Build and install Rust crate
        run: uv run maturin develop --release --manifest-path packages/temper-rust-router/Cargo.toml

      - name: Verify Rust module loads
        run: uv run python3 -c "import temper_rust_router; print('temper_rust_router loaded OK')"
        env:
          RUST_BACKTRACE: full

      - name: Build and install temper-drc-rs
        run: uv run maturin develop --release --manifest-path packages/temper-drc-rs/Cargo.toml

      - name: Verify temper-drc-rs loads
        run: uv run python3 -c "import temper_drc_rs; print('temper_drc_rs loaded OK')"
        env:
          RUST_BACKTRACE: full

      - name: Build and install temper-constraints
        run: >
          uv run maturin develop --release
          --manifest-path packages/temper-placer/temper-constraints/Cargo.toml
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

      - name: Verify temper-constraints loads
        run: uv run python3 -c "import temper_constraints; print('temper_constraints loaded OK, version', temper_constraints.version_py())"
        env:
          RUST_BACKTRACE: full

      # `uv sync` defaults to an *exact* sync: anything installed in the venv
      # that is not part of this invocation's resolved target set gets
      # uninstalled as "extraneous". `--no-install-package X` excludes X from
      # that target set -- it does NOT mean "leave X alone". Without
      # `--inexact`, the three flags below were therefore silently
      # UNINSTALLING the release wheels that "Build and install ..." just
      # built and "Verify ... loads" just confirmed importable, minutes
      # earlier in this same job. Reproduced locally: `uv sync --all-packages
      # --no-install-package temper-rust-router ...` (no --inexact) prints
      # "Uninstalled 2 packages" and `- temper-rust-router==0.1.0` in its
      # diff, and a subsequent bare import fails with ModuleNotFoundError.
      # `--inexact` disables the extraneous-package removal, so these three
      # packages are truly left untouched (mtimes unchanged, no rebuild)
      # instead of evicted -- confirmed locally: with --inexact added, the
      # same command reports "Audited N packages" (no install/uninstall) and
      # the modules remain importable afterward.
      - name: Install dependencies
        run: >
          uv sync --all-packages --inexact
          --no-install-package temper-rust-router
          --no-install-package temper-drc-rs
          --no-install-package temper-constraints

      - name: Cache netlist
        id: cache-netlist
        uses: actions/cache@v6
        with:
          path: elec/build
          key: netlist-${{ hashFiles('elec/src/**', 'elec/ato.yaml', 'Makefile') }}

      - name: Build electronics netlist
        if: steps.cache-netlist.outputs.cache-hit != 'true'
        run: make netlist

      # ---- SETUP / GATE BOUNDARY -------------------------------------------
      # Everything ABOVE is setup and stays fail-fast: it has no `if:`, so if
      # any of it fails (maturin, uv sync, make netlist) this step never runs,
      # `steps.setup.outcome` is not `success`, and every gate below is SKIPPED
      # rather than run against a half-built environment and reported as a gate
      # verdict. Everything BELOW is a gate: each carries
      # `if: !cancelled() && steps.setup.outcome == 'success'` so a red gate no
      # longer deletes the verdict of the gates behind it. None of them is
      # `continue-on-error`, so the job still concludes `failure` if any fails.
      - name: Setup barrier -- environment ready
        id: setup
        run: echo "setup complete; gates below report independently"

      - name: Run cp-sat suite (fast remainder)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # 2026-07-30: the three tests that used to dominate this job's
        # wall-clock moved out to extended-cpsat-slow (--deselect'd here by
        # exact node ID, selected there by the same IDs -- see the
        # comment above this job for the measurement and the full list).
        # 2026-08-01: the hybrid test of that trio moved again, from
        # extended-cpsat-slow to the nightly r9-evidence.yml workflow (it is
        # evidence for the pending R9 promotion decision, not a gate). The
        # deselect below stays so this job never re-absorbs it silently.
        # Everything else in tests/placer/cp_sat/ + test_external_oracle.py +
        # test_cp_sat_flag.py combined cost well under a minute in both
        # 2026-07-30 reference runs, so this job keeps the directory-level
        # selection (new tests added under tests/placer/cp_sat/ land here
        # automatically) rather than an explicit include-list that could
        # silently miss them. pytest_guard enforces a floor so a bad
        # --deselect ID (typo, renamed test) that silently drops a test
        # instead of erroring is caught here rather than passing quietly.
        # Same `-v --tb=short -p no:cacheprovider --maxfail=10` flags as
        # before this split. Re-measured to COMPLETION 2026-08-07 on this
        # exact invocation: 721 passed, 7 failed, 3 skipped, 3 deselected in
        # 314.8s; pytest_guard floor satisfied at 728 executed. All 7
        # failures are in ONE file, tests/placer/cp_sat/test_erc_gate.py,
        # and all 7 are this host having no KiCad -- "FileNotFoundError:
        # 'kicad-cli'" and "KiCad footprint library directory not found".
        # The pinned CI container (.github/docker/ci.Dockerfile) ships
        # kicad 10.0.5 and its footprint library, so these pass there.
        # Nothing flaky was observed: zero run-to-run variance, and the
        # failures are a deterministic function of an absent binary.
        # Kept masked only because that claim rests on a local run without
        # kicad-cli rather than on a container run; removable as soon as one
        # green run of this step is observed in CI, which the evidence says
        # it should already be producing.
        run: >
          cd packages/temper-placer &&
          uv run python ../../scripts/pytest_guard.py --min-tests 400 --
          tests/placer/cp_sat/ tests/metrics/test_external_oracle.py
          tests/cli/test_cp_sat_flag.py
          --deselect "tests/placer/cp_sat/test_hybrid_pour_stitch_measurement.py::TestHybridPourStitchVerification::test_hybrid_pour_reduces_unconnected_without_shorting_regression"
          --deselect "tests/placer/cp_sat/test_zone_pour_production_measurement.py::TestZonePourProductionMeasurement::test_zone_pours_reduce_unconnected_items"
          --deselect "tests/placer/cp_sat/test_regression_drc.py::test_production_board_routing_drc_regression"
          -v --tb=short -p no:cacheprovider --maxfail=10
        continue-on-error: true

  extended-cpsat-slow:
    name: Extended Test Suites (cp-sat, slow ${{ matrix.suite }})
    # Trunk-only. The routing DRC regression gate in this job was unmasked
    # 2026-08-05 (fix(netclass): _mm read aliases landed; gate can now bite).
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bennetleff/temper-ci:latest
      options: --user root
    # Each matrix expansion below is a separate trunk-only job. The tests run
    # true in-process serially (no xdist/process worker): the xdist worker
    # previously died during the first production route and left its parent
    # waiting until cancellation. Splitting the tests also means a long zone
    # route cannot consume the routing-DRC lane's timeout.
    # 2026-08-01: the hybrid test (877.7-986.9s of the trio) moved out to the
    # nightly r9-evidence.yml workflow -- it is explicit evidence-gathering
    # for the R9 promotion decision (continue-on-error, "Not a CI gate" in
    # its own docstring), so per-PR sampling of a pending decision was paying
    # 16+ min of wall-clock on the critical path. This job retains the
    # zone-pour + routing DRC pair, but now runs it in-process to survive the
    # production route's memory pressure; each timeout below is intentionally
    # sized for that test's serial execution and setup overhead. The
    # routing-DRC budget was raised to 75 minutes after run 33262575088
    # (job 99126939400) used ~6 minutes for setup and ~44 minutes for the
    # test before the 50-minute cap cancelled it without a result.
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: zone-pour
            timeout: 75
            test: >-
              tests/placer/cp_sat/test_zone_pour_production_measurement.py::TestZonePourProductionMeasurement::test_zone_pours_reduce_unconnected_items
          - suite: routing-drc
            timeout: 75
            test: >-
              tests/placer/cp_sat/test_regression_drc.py::test_production_board_routing_drc_regression
    timeout-minutes: ${{ matrix.timeout }}
    env:
      VIRTUAL_ENV: /_temper-venv
      UV_PROJECT_ENVIRONMENT: /_temper-venv
      TEMPER_REQUIRE_RUST_DRC: "1"
    steps:
      - uses: actions/checkout@v7

      # Container runs as root; workspace is owned by the runner user. Without
      # this, every `git` call in a later `run:` step exits 128 on "dubious
      # ownership" rather than doing its job.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Install maturin
        run: uv pip install maturin

      - name: Build and install Rust crate
        run: uv run maturin develop --release --manifest-path packages/temper-rust-router/Cargo.toml

      - name: Verify Rust module loads
        run: uv run python3 -c "import temper_rust_router; print('temper_rust_router loaded OK')"
        env:
          RUST_BACKTRACE: full

      - name: Build and install temper-drc-rs
        run: uv run maturin develop --release --manifest-path packages/temper-drc-rs/Cargo.toml

      - name: Verify temper-drc-rs loads
        run: uv run python3 -c "import temper_drc_rs; print('temper_drc_rs loaded OK')"
        env:
          RUST_BACKTRACE: full

      - name: Build and install temper-constraints
        run: >
          uv run maturin develop --release
          --manifest-path packages/temper-placer/temper-constraints/Cargo.toml
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

      - name: Verify temper-constraints loads
        run: uv run python3 -c "import temper_constraints; print('temper_constraints loaded OK, version', temper_constraints.version_py())"
        env:
          RUST_BACKTRACE: full

      # `uv sync` defaults to an *exact* sync: anything installed in the venv
      # that is not part of this invocation's resolved target set gets
      # uninstalled as "extraneous". `--no-install-package X` excludes X from
      # that target set -- it does NOT mean "leave X alone". Without
      # `--inexact`, the three flags below were therefore silently
      # UNINSTALLING the release wheels that "Build and install ..." just
      # built and "Verify ... loads" just confirmed importable, minutes
      # earlier in this same job. Reproduced locally: `uv sync --all-packages
      # --no-install-package temper-rust-router ...` (no --inexact) prints
      # "Uninstalled 2 packages" and `- temper-rust-router==0.1.0` in its
      # diff, and a subsequent bare import fails with ModuleNotFoundError.
      # `--inexact` disables the extraneous-package removal, so these three
      # packages are truly left untouched (mtimes unchanged, no rebuild)
      # instead of evicted -- confirmed locally: with --inexact added, the
      # same command reports "Audited N packages" (no install/uninstall) and
      # the modules remain importable afterward.
      - name: Install dependencies
        run: >
          uv sync --all-packages --inexact
          --no-install-package temper-rust-router
          --no-install-package temper-drc-rs
          --no-install-package temper-constraints

      - name: Cache netlist
        id: cache-netlist
        uses: actions/cache@v6
        with:
          path: elec/build
          key: netlist-${{ hashFiles('elec/src/**', 'elec/ato.yaml', 'Makefile') }}

      - name: Build electronics netlist
        if: steps.cache-netlist.outputs.cache-hit != 'true'
        run: make netlist

      # ---- SETUP / GATE BOUNDARY -------------------------------------------
      # Everything ABOVE is setup and stays fail-fast: it has no `if:`, so if
      # any of it fails (maturin, uv sync, make netlist) this step never runs,
      # `steps.setup.outcome` is not `success`, and every gate below is SKIPPED
      # rather than run against a half-built environment and reported as a gate
      # verdict. Everything BELOW is a gate: each carries
      # `if: !cancelled() && steps.setup.outcome == 'success'` so a red gate no
      # longer deletes the verdict of the gates behind it. None of them is
      # `continue-on-error`, so the job still concludes `failure` if any fails.
      - name: Setup barrier -- environment ready
        id: setup
        run: echo "setup complete; gates below report independently"

      - name: Run cp-sat suite (${{ matrix.suite }}, in-process serial)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # The two tests that own >98% of the old combined job's pytest
        # wall-clock (see the comment above extended-cpsat for the
        # 2026-07-30 measurement: 233.9s/211.3s and 114.2s/102.2s across two
        # reference runs). The third member of the original trio
        # (test_hybrid_pour_reduces_unconnected_without_shorting_regression,
        # 877.7s/986.9s) moved to the nightly r9-evidence.yml workflow on
        # 2026-08-01: it is evidence for the pending R9 promotion decision,
        # not a gate (continue-on-error, docstring: "Not a CI gate"), and its
        # ~16 min made it the per-PR critical path. Each production-board
        # route now runs alone in its own matrix job, in-process: the xdist
        # worker died during the first route in CI and left the parent waiting
        # until job cancellation, even when constrained to one worker. A
        # single current-board route reaches ~18 GB RSS, so keep the process
        # boundary out of these lanes entirely. Same
        # `-v --tb=short -p no:cacheprovider --maxfail=10` flags, minus
        # `continue-on-error` (removed 2026-08-05: the routing gate is now
        # a real trunk-blocking gate, not a masked observer).
        # Floor is 1, not 2, deliberately (plan 2026-08-03-001, U5): the zone
        # test is xfail(strict) -- a known, measured, accepted negative -- and
        # pytest reports XFAIL as JUnit <skipped>, so pytest_guard's executed
        # count for this lane is the routing test alone.
        run: >
          cd packages/temper-placer &&
          uv run python ../../scripts/pytest_guard.py --min-tests 1 --
          "${{ matrix.test }}"
          -v --tb=short -p no:cacheprovider --maxfail=10
        # continue-on-error removed 2026-08-05: the _mm-aliases fix (#671)
        # landed on main, so this gate's failure is a real signal, not masked
        # flakiness. If flakiness re-emerges in this step, triage it as a bug,
        # not a mask target.

  invariant-router-v6-1:
    name: Invariant tests (router_v6 group 1)
    # Masked test step (continue-on-error below, kept for a real, tracked
    # occupancy_grid.py bug -- see that step's comment), cannot fail any
    # build. Group 3 stays on the PR path: it is the only unmasked shard,
    # i.e. the only real gate; groups 2 and 4 were unmasked separately
    # (2026-08-07) and are NOT touched by this change.
    #
    # NARROWED 2026-08-11 (docs/evidence/2026-08-11-python-ci-load-inventory.md):
    # was `if: github.event_name != 'pull_request'` (every push to main, not
    # just PRs, ~159 executing pushes/week x ~6.5 min for a step nothing can
    # act on). Moved to schedule/workflow_dispatch only; nightly cadence
    # unchanged.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bennetleff/temper-ci:latest
      options: --user root
    timeout-minutes: 30
    env:
      VIRTUAL_ENV: /_temper-venv
      UV_PROJECT_ENVIRONMENT: /_temper-venv
      TEMPER_REQUIRE_RUST_DRC: "1"
    steps:
      # fetch-depth: 0 -- see the Core Tests job for the measured incident.
      # 12 of the 16 oracle-freeze tests that resolve a PINNED COMMIT via
      # `git cat-file -e <sha>` live under tests/router_v6/, which these jobs
      # own. Under a shallow clone each takes its
      # `pytest.skip("pinned commit ... not present in this clone")` branch, so
      # the byte-identity guarantee is unenforced whenever these jobs do run.
      # Their floors (500 against 683-789 collected) are slack enough that the
      # missing executions never show up as a failure.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Install maturin
        run: uv pip install maturin

      - name: Build and install Rust crate
        run: uv run maturin develop --release --manifest-path packages/temper-rust-router/Cargo.toml

      - name: Verify Rust module loads
        run: uv run python3 -c "import temper_rust_router"
        env:
          RUST_BACKTRACE: full

      - name: Build and install temper-drc-rs
        run: uv run maturin develop --release --manifest-path packages/temper-drc-rs/Cargo.toml

      - name: Verify temper-drc-rs loads
        run: uv run python3 -c "import temper_drc_rs"
        env:
          RUST_BACKTRACE: full

      - name: Build and install temper-constraints
        run: >
          uv run maturin develop --release
          --manifest-path packages/temper-placer/temper-constraints/Cargo.toml
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

      - name: Verify temper-constraints loads
        run: uv run python3 -c "import temper_constraints"
        env:
          RUST_BACKTRACE: full

      - name: Install dependencies
        run: >
          uv sync --all-packages --inexact
          --no-install-package temper-rust-router
          --no-install-package temper-drc-rs
          --no-install-package temper-constraints

      - name: Cache netlist
        id: cache-netlist
        uses: actions/cache@v6
        with:
          path: elec/build
          key: netlist-${{ hashFiles('elec/src/**', 'elec/ato.yaml', 'Makefile') }}

      - name: Build electronics netlist
        if: steps.cache-netlist.outputs.cache-hit != 'true'
        run: make netlist

      - name: Run invariant tests (router_v6 group 1)
        working-directory: packages/temper-placer
        run: >
          uv run python ../../scripts/pytest_guard.py --min-tests 500 --
          tests/router_v6/test_acid_trap_boundary.py tests/router_v6/test_acid_trap_detection.py tests/router_v6/test_acid_trap_induction.py tests/router_v6/test_acid_trap_properties.py tests/router_v6/test_adapter.py tests/router_v6/test_annular_ring_induction.py tests/router_v6/test_astar_cost_field.py tests/router_v6/test_astar_inductive_ladder.py tests/router_v6/test_astar_pathfinding.py tests/router_v6/test_astar_perf_regression.py tests/router_v6/test_bundle_analyzer.py tests/router_v6/test_bundled_model_builder.py tests/router_v6/test_channel_skeleton.py tests/router_v6/test_channel_skeleton_pbt.py tests/router_v6/test_ci_bug_regressions.py tests/router_v6/test_clearance_segment_dist.py tests/router_v6/test_copper_balance.py tests/router_v6/test_copper_balance_boundary.py tests/router_v6/test_copper_balance_induction.py tests/router_v6/test_creepage_boundary.py tests/router_v6/test_creepage_properties.py tests/router_v6/test_dfm_interaction.py tests/router_v6/test_finish_board_gate.py tests/router_v6/test_forced_segment_fail_closed_pbt.py tests/router_v6/test_grid_prep_pbt.py tests/router_v6/test_layer_capacity.py tests/router_v6/test_los_bb_shortcut.py tests/router_v6/test_manufacturing_report.py tests/router_v6/test_manufacturing_report_properties.py tests/router_v6/test_net_class_parser.py tests/router_v6/test_net_ordering_proof.py tests/router_v6/test_occupancy_grid_pbt.py tests/router_v6/test_phase1_anti_false_zero.py tests/router_v6/test_resource_bound.py tests/router_v6/test_routing_demand_pbt.py tests/router_v6/test_routing_space.py tests/router_v6/test_stage3_monolith_parity.py tests/router_v6/test_stage4_result_pbt.py tests/router_v6/test_stage_ledger.py tests/router_v6/test_teardrop_properties.py tests/router_v6/test_temper_production_board_routing.py tests/router_v6/test_terminal_extraction.py tests/router_v6/test_topology_solver.py tests/router_v6/test_trace_width_assignment.py tests/router_v6/test_tree_route_geometry.py tests/router_v6/test_zone_stitch_netclass_width.py tests/router_v6/test_truthful_completion.py tests/router_v6/test_via_layer_properties_pbt.py tests/router_v6/test_via_placement.py tests/router_v6/test_wave3_skip_sat.py tests/router_v6/test_wave4_pathfinder.py
          -v --tb=short -p no:cacheprovider --maxfail=10 -m "not slow"
          --continue-on-collection-errors -n auto --dist loadgroup
        # Re-masked 2026-07-28 citing "1 failed / 716 passed". Re-checked
        # 2026-08-07 (full local run, 336s, 692 selected): now 6 failed / 672
        # passed / 10 skipped / 4 xfailed -- worse than the 2026-07-28 count,
        # and NOT simple flakiness. Breaking down the 6:
        #   - 3 are local-environment artifacts, not real CI failures --
        #     test_kicad7_footprint_dir_resolves, test_kicad_cli_available_for_drc,
        #     test_u4_erc_finding_traceable all fail on a plain
        #     `FileNotFoundError: kicad-cli` / unresolved footprint dir in
        #     THIS sandbox, which has no kicad-cli installed; the pinned CI
        #     container (.github/docker/ci.Dockerfile) has kicad-cli 10.0.5
