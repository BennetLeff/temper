name: Python Tests

# Grouped per COMMIT, not per ref, so a push never cancels the run for the
# commit before it.
#
# With `${{ github.ref }}`, every pull_request event on a branch shares one
# group -- so on a branch with several agents pushing, each push killed the
# previous run mid-flight. Measured 2026-07-28: five consecutive runs on
# docs/methodology-loop-discipline cancelled inside ~20 minutes, none reaching
# a verdict; and 16 of 24 runs cancelled over the preceding 15 hours. The
# pipeline was not slow so much as unable to finish, which is why "is CI green"
# had no answer -- the invariant shards were being killed at 2.7-3.7min against
# 13-18min budgets, and the one shard that did survive only did so by finishing
# before the next push landed.
#
# CORRECTION (2026-07-28, same day): grouping on the head SHA fixed the
# cancellation but overcorrected. It preserves a run for EVERY pushed commit,
# on a PR branch as well as on main -- and on a PR branch only the tip commit's
# verdict is wanted. Observed cost within hours: PR #392 accumulated six full
# 32-job runs from one branch (`b1935de3`, `9850be4f`, `86967af6`, `f5c28851`,
# `03fb1093`, plus a rebase), none cancelled, all queued against the same
# runner pool, delaying the verdict the change existed to deliver.
#
# The two branches want opposite behaviour, so they now get it:
#
#   pull_request  -> group by PR NUMBER, cancel-in-progress TRUE.
#                    A new push supersedes the old run. Only the tip matters;
#                    an intermediate commit on a PR is not a thing anyone
#                    bisects to.
#   push (main)   -> group by SHA (unique), cancel-in-progress irrelevant.
#                    Every trunk commit keeps its own run to completion,
#                    because trunk commits ARE bisected to.
#
# This keeps what #362 established -- main must never have its runs cancelled,
# evidenced there by 8 consecutive cancelled trunk runs -- and adds the PR-side
# fix that motivated the head-SHA grouping, without the queue cost. #362's Core
# Tests timeout raise (30 -> 45) is untouched.
#
# SUPERSEDED 2026-08-06 -- the `push -> group by SHA` half above is no longer
# what the code does, and is kept only as the record of why it was tried.
#
# Per-commit trunk runs do not survive this repo's merge rate. Trunk took 169
# commits on 2026-08-05 and 124 on 2026-08-04; one unique group per commit is
# one full run set per commit, against a measured ~24-job concurrency ceiling.
# #798 hit exactly that: a 29-PR merge run left 88 concurrent runs on main, 83
# of them for commits already superseded, and jobs sat queued 19.6 minutes with
# none starting.
#
# #798 then overcorrected in the other direction -- it moved the push key to
# `github.ref` AND set cancel-in-progress unconditionally true, which
# reproduced #362's original failure exactly: 6 of 8 consecutive trunk runs
# `cancelled`, zero successes, and a newly added `cargo test` step that never
# executed once.
#
# What the code does now (#823), and why it is the synthesis rather than a
# third swing:
#
#   push (main)   -> group by `github.ref`, cancel-in-progress FALSE.
#                    Trunk pushes share ONE group, so they queue instead of
#                    stacking -- that is the #798 fix, and it is in the group
#                    key, not the cancel flag. A run that is already EXECUTING
#                    is never killed, which is #362's requirement. GitHub keeps
#                    only the newest PENDING run per group, so intermediate
#                    trunk commits are still superseded while waiting.
#
# The cost, stated plainly: not every trunk commit gets its own verdict during
# a burst, so bisecting to a specific commit may find no run. That is a real
# loss against #362's intent, accepted because the alternative measured worse
# -- 88 stacked runs verify nothing either, they just do it more expensively.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # PRs: cancel in progress -- a superseded PR run is worthless.
  # push (i.e. main): DO NOT cancel. A run already executing is main's
  # only verification; killing it mid-flight is how 6 of 8 consecutive
  # main runs ended up `cancelled` on 2026-08-06, with zero successes,
  # so `cargo test`/clippy results never landed during a merge burst.
  # Sharing one group by `github.ref` still prevents the 88-run pileup
  # the sha-keyed group allowed: later pushes queue, and GitHub keeps
  # only the newest PENDING run, so intermediate commits are still
  # superseded -- just not the one actually running.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

