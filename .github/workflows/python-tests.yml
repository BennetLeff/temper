jobs:
  # ---------------------------------------------------------------------------
  # Change-driven CI (plan 2026-08-02-001). The path-conditional jobs below
  # carry job-level `if:` path predicates: they run only when the PR's
  # changed files map to their manifest trigger sets (job_triggers in
  # .github/required-checks.json), the catch-all paths, or any residual
  # (unmapped) path; docs/** and **/TRACEABILITY map to nothing. This job
  # computes those decisions on every event -- on push to main, schedule and
  # workflow_dispatch it reports every job as should-run, preserving the
  # pre-conditions behavior.
  #
  # The classification script and the required-checks checker derive from the
  # SAME manifest and the SAME path_matches implementation
  # (check_required_checks.job_should_run), so a job skipped here is exactly
  # a skip the checker verifies -- an unverifiable skip fails the "Required
  # Python Tests" aggregate (fail-closed). The conditions are structurally
  # cross-checked against the manifest by validate_job_conditions in
  # scripts/check_required_checks.py, so a condition that is not a pure path
  # predicate, or a trigger set that drifted from the workflow, fails that
  # check. This job is deliberately cheap: stdlib python + `git diff` only --
  # no container, no uv, no venv.
  changes:
    name: Change Classification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # These outputs must match the manifest's job_triggers ids EXACTLY --
    # validate_job_conditions fails closed on any drift. router_v6 group 3 is
    # the only invariant shard listed because it is the only one whose test
    # step is not masked by continue-on-error, i.e. the only real gate. Groups
    # 1/2/4, invariant-rest and the extended suites are trunk-only now (see
    # their `if:` conditions), so they are deliberately absent.
    #
    # Keep this block free of interleaved comments: load_job_blocks parses it
    # line-by-line and stops at the first non-output line.
    outputs:
      cargo-smoke: ${{ steps.classify.outputs.cargo-smoke }}
      test: ${{ steps.classify.outputs.test }}
      rust-checks: ${{ steps.classify.outputs.rust-checks }}
      board-provenance-requirements-gates: ${{ steps.classify.outputs.board-provenance-requirements-gates }}
      consistency-gates: ${{ steps.classify.outputs.consistency-gates }}
      hygiene-gates: ${{ steps.classify.outputs.hygiene-gates }}
      invariant-router-v6-3: ${{ steps.classify.outputs.invariant-router-v6-3 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changed paths against manifest trigger sets
        id: classify
        run: python3 scripts/classify_changed_paths.py

  cargo-smoke:
    name: Cargo / Rustc Smoke Check
    needs: [changes]
    if: ${{ github.event_name == 'push' || needs.changes.outputs.cargo-smoke == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bennetleff/temper-ci:latest
      options: --user root
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain smoke
        run: |
          rustc --version
          cargo --version

  # ---------------------------------------------------------------------------
  # 2026-07-28: this job used to hold every gate in the pipeline -- 58 workflow
  # steps in one sequential job, most of them fail-closed gates. Because a
  # non-`continue-on-error` step failure aborts the rest of the job, ONE red gate
  # deleted the verdict of every gate behind it. Measured on main, run
  # 30390466165: "Physical mains<->SELV isolation-barrier gate" failed at step
  # 27 of 66 and steps 28-60 (33 real gate/test steps) never ran -- vulture, MPN
  # fabrication, PLL range, net classification, undeclared imports, evidence
  # provenance, capacity budget, derived-doc drift, board identity, coverage,
  # script manifest, import-linter, requirements (safety/EMC/review/DFM), the
  # extended suites. Earlier the same day a single clippy lint masked 43 steps
  # including two safety gates. The isolation gate cannot be fixed in CI at all
  # -- it reports that a physical keepout zone does not exist on the board -- so
  # it stays red until hardware work lands, masking everything behind it the
  # whole time.
  #
  # The gates are now split across independent jobs, grouped by the setup they
  # share (container + three `maturin develop` builds + `uv sync` + netlist,
  # ~130s) rather than one job per gate. No gate's command line, env, or
  # pass/fail logic changed, and no `continue-on-error` was added: the split is
  # purely about which gates can hide which.
  #
  # SECOND-ORDER FIX, same day: the split fixed masking ACROSS jobs but each job
  # was still internally sequential, so the pipeline reported at most one failure
  # per job per run. Demonstrated within hours -- three gates were fixed and each
  # fix immediately revealed a DIFFERENT failure in the same job (board-gates:
  # capacity budget #385 -> isolation barrier; provenance-gates: evidence
  # provenance #383 -> measurement provenance; hygiene-gates: vulture #387 ->
  # undeclared-import tests). Each of those was a gate that had been red all
  # along and could not be seen.
  #
  # Every gate step in the 8 split jobs now carries
  #     if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
  # An `if:` containing a status-check function suppresses the implicit
  # `success()` GitHub prepends, so the step runs even though an earlier step in
  # the job failed -- and because none of these steps is `continue-on-error`, a
  # failed gate still sets the JOB conclusion to `failure`. Independence here is
  # about reporting, never about tolerance.
  #
  # `steps.setup` is an explicit no-op barrier step placed at the end of each
  # job's setup region, and it deliberately has NO `if:` of its own. That is what
  # keeps setup fail-fast: if `maturin develop`, `uv sync` or `make netlist`
  # fails, the barrier never runs, `steps.setup.outcome` is not `success`, and
  # every gate below is SKIPPED rather than executed against a half-built
  # environment and reported as a gate verdict. The barrier must assert success
  # affirmatively -- `outcome != 'failure'` would be wrong, because a step the
  # runner never reached has an EMPTY outcome, which also satisfies
  # `!= 'failure'`.
  #
  # Consequence for ordering: putting a known-red gate last is no longer
  # load-bearing (it masks nothing wherever it sits). The existing orderings are
  # kept as-is anyway, because reordering them would be churn with no verdict
  # attached, and because two of them encode a real data dependency
  # (`Script manifest gate` before `Rebuild script invocation graph`).
  #
  # What stays in this job: the Rust extension build chain and the suites that
  # can only run once those wheels are installed.
  # ---------------------------------------------------------------------------
  test:
    name: Core Tests
    needs: [changes]
    if: ${{ github.event_name == 'push' || needs.changes.outputs.test == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bennetleff/temper-ci:latest
      options: --user root
    # Raised 15 -> 30. The 15-minute budget was only ever sufficient because
    # tests were failing fast: runs that errored early finished in 4-7 min,
    # while any run that got past them hit the wall (15.1 min here, 13.7 min on
    # followup/post-344) and was killed mid-suite. With the ON_SIDE registry
    # pollution and the uv-sync extension eviction fixed, the suite actually
    # executes end-to-end and needs the headroom. Evidence: run 30291488317
    # completed every step through "Coverage gate (temper-placer)" and was
    # cancelled inside "Run extended test suites in parallel" -- real progress,
    # not a hang.
    # Raised 30 -> 45. Run 30314210438 on main was killed at exactly
    # 30m04s (23:27:49Z -> 23:57:53Z) with no failing step -- the timeout, not a
    # defect. The job grew twice in one day: the extended suite it had been
    # skipping via a phantom path is ~14 min on its own, and the newly wired
    # safety/EMC/review requirement tests added 137 more. 45 leaves real
    # headroom rather than another 4-second miss.
    # Lowered 45 -> 35 with the 2026-07-28 gate split: the two items that drove
    # the 30 -> 45 raise (the extended suites at ~14 min, the 240 requirements
    # tests) both left this job for `extended-suites` and `requirements-tests`.
    # What remains is setup + the constraints/placer-core suites. 35 keeps the
    # same kind of headroom against a smaller job rather than trimming to fit.
    timeout-minutes: 35
    env:
      VIRTUAL_ENV: /_temper-venv
      UV_PROJECT_ENVIRONMENT: /_temper-venv
      # CI is the environment where the Rust DRC/clearance accelerator and
      # its Python-equivalence proof are themselves under test, so a skip
      # here must not be silent -- see the presence-gate step below and
      # docs/evidence/2026-07-26-rust-backend-presence-gate.md.
      TEMPER_REQUIRE_RUST_DRC: "1"

    steps:
      # fetch-depth: 0 is load-bearing here, not hygiene. Several oracle-freeze
      # tests assert a live oracle is byte-identical to a PINNED COMMIT and
      # reach for it with `git cat-file -e <sha>`. Under the default shallow
      # clone that object is absent, so the test takes its
      # `pytest.skip("pinned commit ... not present in this clone")` branch --
      # in CI, silently, on every run. Measured on run 32493295419: the Wave-4
      # round-2 gate COLLECTED 1029 but EXECUTED 1024, with all four
      # `test_oracle_is_verbatim_copy[...]` params skipped. A guard that always
      # skips is a guard that never runs -- the same vacuity the pytest_guard
      # floors exist to catch, one level further down. The
      # `board-provenance-requirements-gates`, `changes` and `fast-gates` jobs
      # already set this.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Container runs as root; workspace is owned by the runner user. Without
      # this, every `git` call in a later `run:` step exits 128 on "dubious
      # ownership" rather than doing its job.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
      
      - name: Install maturin
        run: uv pip install maturin

      - name: Build and install Rust crate
        run: uv run maturin develop --release --manifest-path packages/temper-rust-router/Cargo.toml

      - name: Verify Rust module loads
        run: uv run python3 -c "import temper_rust_router; print('temper_rust_router loaded OK')"
        env:
          RUST_BACKTRACE: full

      - name: Build and install temper-drc-rs
        run: uv run maturin develop --release --manifest-path packages/temper-drc-rs/Cargo.toml

      - name: Verify temper-drc-rs loads
        run: uv run python3 -c "import temper_drc_rs; print('temper_drc_rs loaded OK')"
        env:
          RUST_BACKTRACE: full

      # A bare import (above) cannot detect a *stale* wheel -- one built
      # from an older revision of the crate that is missing a symbol the
      # current source registers (e.g. verify_route_clearance, added
      # 2026-07-26). This happened once already in the primary checkout:
      # the module imported fine, but the differential proof that depends
      # on the missing symbol silently skipped instead of failing. See
      # docs/evidence/2026-07-26-rust-backend-presence-gate.md.
      # TEMPER_REQUIRE_RUST_DRC=1 makes this step -- and the differential
      # test itself -- fail loudly instead of skipping, because CI is
      # exactly where the accelerator and its equivalence proof are the
      # thing under test.
      - name: Verify temper-drc-rs is fresh (presence + symbol gate)
        run: uv run python3 scripts/check_rust_drc_presence.py
        env:
          TEMPER_REQUIRE_RUST_DRC: "1"

      - name: Build and install temper-constraints
        run: >
          uv run maturin develop --release
          --manifest-path packages/temper-placer/temper-constraints/Cargo.toml
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

      - name: Verify temper-constraints loads
        run: uv run python3 -c "import temper_constraints; print('temper_constraints loaded OK, version', temper_constraints.version_py())"
        env:
          RUST_BACKTRACE: full

      # `uv sync` defaults to an *exact* sync: anything installed in the venv
      # that is not part of this invocation's resolved target set gets
      # uninstalled as "extraneous". `--no-install-package X` excludes X from
      # that target set -- it does NOT mean "leave X alone". Without
      # `--inexact`, the three flags below were therefore silently
      # UNINSTALLING the release wheels that "Build and install ..." just
      # built and "Verify ... loads" just confirmed importable, minutes
      # earlier in this same job. Reproduced locally: `uv sync --all-packages
      # --no-install-package temper-rust-router ...` (no --inexact) prints
      # "Uninstalled 2 packages" and `- temper-rust-router==0.1.0` in its
      # diff, and a subsequent bare import fails with ModuleNotFoundError.
      # `--inexact` disables the extraneous-package removal, so these three
      # packages are truly left untouched (mtimes unchanged, no rebuild)
      # instead of evicted -- confirmed locally: with --inexact added, the
      # same command reports "Audited N packages" (no install/uninstall) and
      # the modules remain importable afterward.
      - name: Install dependencies
        run: >
          uv sync --all-packages --inexact
          --no-install-package temper-rust-router
          --no-install-package temper-drc-rs
          --no-install-package temper-constraints

      # ---- SETUP / GATE BOUNDARY -------------------------------------------
      # Everything ABOVE is setup and stays fail-fast: it has no `if:`, so if
      # any of it fails this step never runs, `steps.setup_env.outcome` is not
      # `success`, and every gate below is SKIPPED rather than run against a
      # half-built environment. Everything BELOW is a gate and reports
      # independently.
      - name: Setup barrier -- extension build chain complete
        id: setup_env
        run: echo "extensions built and installed; gates below report independently"

      - name: Stale-extension gate tests
        if: ${{ !cancelled() && steps.setup_env.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_stale_extensions.py -v --tb=short

      - name: Venv-integrity gate tests
        if: ${{ !cancelled() && steps.setup_env.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_venv_integrity.py -v --tb=short

      - name: No-private-target-shared gate tests
        if: ${{ !cancelled() && steps.setup_env.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_no_worktree_target_dirs.py -v --tb=short

      # Runs BEFORE the staleness gate below on purpose: staleness compares
      # an installed artifact's content/mtime against "this checkout"'s
      # sources, which is only a coherent question once we know the venv's
      # editable installs actually point AT this checkout. A CI runner
      # never has the multi-worktree topology that motivated this gate
      # (2026-08-11: `maturin develop --active` run from an agent's git
      # worktree rewrote a SHARED venv's editable pointers to that
      # worktree, so every measurement in that window silently ran against
      # the wrong code -- see AGENTS.md "Worktree .venv"), but it is cheap
      # defense in depth against the same shape arriving via a restored
      # `.venv` cache or an image layer built somewhere else, and it is
      # the check a developer/agent should actually run by hand against
      # the shared checkout's `.venv` when in doubt.
      - name: Venv-integrity gate (editable installs point at this checkout)
        if: ${{ !cancelled() && steps.setup_env.outcome == 'success' }}
        run: uv run --no-sync python scripts/check_venv_integrity.py

      # No per-worktree `target-shared/` (2026-08-11/12 incident: 99
      # worktrees, ~74 GB of private cargo caches -- see
      # scripts/install_cargo_target_dir_guard.py for the structural fix
      # and scripts/check_no_worktree_target_dirs.py for this gate's
      # implementation). A CI runner never has the multi-worktree fleet
      # that motivates this -- it will just report clean -- but it is the
      # standing check a developer/agent runs by hand against the real
      # workstation's `.claude/worktrees/*` and sibling worktree dirs.
      - name: No private per-worktree target-shared/ gate
        if: ${{ !cancelled() && steps.setup_env.outcome == 'success' }}
        run: uv run --no-sync python scripts/check_no_worktree_target_dirs.py

      # Build side of content-hash freshness (scripts/_lib/freshness.py).
      # Every pyo3 crate has just been built or installed from THIS
      # checkout, so the mtime comparison is correct right here and now --
      # this records that verdict as a SHA-256 of each crate's sources,
      # beside the installed .so, so it survives into a context where
      # mtimes are not correct: a restored .venv cache, or a wheel baked
      # into the CI image (~77s of `maturin develop` per job, 5-6 jobs).
      # It stamps only crates the gate below already considers fresh, so
      # it can never launder a stale artifact -- and it must therefore run
      # AFTER every build step, never alongside one.
      #
      # `--no-sync`: a bare `uv run` may auto-sync and reinstall a package,
      # which would replace the .so out from under the stamp just written
      # for it (that exact auto-sync reinstalled a stale cached wheel over
      # a freshly-built extension once already -- see
      # docs/evidence/2026-07-27-stale-extension-gate.md).
      - name: Record extension build stamps (content-hash freshness)
        if: ${{ !cancelled() && steps.setup_env.outcome == 'success' }}
        run: uv run --no-sync python scripts/write_extension_stamps.py

      # Every pyo3/maturin crate under packages/ is built by this point (the
      # three `maturin develop` steps above, plus everything `uv sync
      # --all-packages` just built/installed). TEMPER_REQUIRE_FRESH_EXTENSIONS=1
      # makes both STALE (always fatal regardless of this flag) and MISSING
      # (fatal only under this flag) hard-block CI -- see
      # scripts/check_stale_extensions.py and
      # docs/evidence/2026-07-27-stale-extension-gate.md for the incident this
      # closes: a missing .cargo/config.toml silently froze every installed
      # .so on macOS while `cargo test` stayed green.
      - name: Stale-compiled-extension gate (all pyo3 crates)
        if: ${{ !cancelled() && steps.setup_env.outcome == 'success' }}
        run: uv run python scripts/check_stale_extensions.py
        env:
          TEMPER_REQUIRE_FRESH_EXTENSIONS: "1"

      - name: Cache netlist
        id: cache-netlist
        if: ${{ !cancelled() && steps.setup_env.outcome == 'success' }}
        uses: actions/cache@v6
        with:
          path: elec/build
          key: netlist-${{ hashFiles('elec/src/**', 'elec/ato.yaml', 'Makefile') }}

      - name: Build electronics netlist
        id: netlist
        if: ${{ !cancelled() && steps.setup_env.outcome == 'success' && steps.cache-netlist.outputs.cache-hit != 'true' }}
        run: make netlist

      # Second barrier: the netlist steps above are SETUP, but they sit after
      # three gate steps, so they carry the same `!cancelled()` guard to reach
      # them at all. `steps.netlist.outcome != 'failure'` is safe only because
      # the first conjunct already establishes that `netlist` was reached: on a
      # cache hit its outcome is `skipped`, never the empty string a
      # never-evaluated step would give.
      - name: Setup barrier -- netlist available
        id: setup
        if: ${{ !cancelled() && steps.setup_env.outcome == 'success' && steps.netlist.outcome != 'failure' }}
        run: echo "netlist available; gates below report independently"

      - name: Run temper-constraints integration tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: packages/temper-placer
        run: uv run pytest tests/rust_integration/ -v --tb=short -p no:cacheprovider -m "not benchmark"
        env:
          RUST_BACKTRACE: full

      - name: Run temper-placer tests (core only for CI speed)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: packages/temper-placer
        # tests/validation/test_gate_input_registry.py and
        # tests/validation/test_dead_parameter_probe.py are included so the
        # dead-parameter registry/probe (plan 2026-08-02-019) public surface
        # carries executed-line coverage in the same coverage.json the
        # coverage gate reads.
        run: uv run pytest tests/core/ tests/validation/test_gate_input_registry.py tests/validation/test_dead_parameter_probe.py tests/cli/test_repair_unplaced.py -v --tb=short -p no:cacheprovider --maxfail=10 --cov=temper_placer --cov-report=json --cov-report=term --cov-config=../../pyproject.toml
        env:
          RUST_BACKTRACE: full
          PYTHONFAULTHANDLER: 1

      # Wave 4 Phase 4 anti-vacuity gate (PR merge path): the validation
      # DRC-check differential/PBT suites are the ONLY tests that pin the
      # migrated Rust kernels (temper_drc_rs.validation, and the Phase-5
      # deterministic grid_utils/via_placement + slot_generation/
      # zone_geometry/zone_assignment kernels) bit-exactly against the
      # verbatim Python oracles. They previously ran in NO
      # PR-time job (invariant-rest is trunk-only and masked), so a kernel
      # regression would merge silently. This step runs them hard on every
      # PR and on every push to main (this job runs on both events), with a
      # pytest_guard floor so a silently-shrunk collection fails instead of
      # passing vacuously. The 17 files are the PR's differential surface;
      # the full tests/validation directory is NOT added here because it
      # carries pre-existing CI-environment failures unrelated to this PR
      # (test_mfem_runner.py::test_check_mfem_binary_present needs an MFEM
      # binary the CI image does not build; test_ucc21550_contract_pbt.py's
      # wiring contract lags a board redesign) — see the invariant-rest
      # split below for the trunk-side hard gate.
      #
      # FLOOR RE-ANCHORED 2026-08-21: 176 -> 172. This step executed ZERO
      # tests (pytest exit 4, a usage error) because it named test files that
      # #1314/#1411 deleted along with the kernels they pinned -- so the gate
      # ran vacuously in the exact way it exists to prevent. Removing the dead
      # paths restores collection; the surviving files collect 167, so 176 was
      # unreachable. 167 is the exact measured count, deliberately with no
      # slack margin, so a future shrink fails instead of passing.
      #
      # CORRECTED 2026-08-24: this said 172, and 172 was never reachable
      # either -- the floor #1423 wrote was 5 above the count its own commit
      # produced, so this gate has failed on every run since it landed
      # WITHOUT a single test failing or disappearing. Measured three ways
      # before changing the number: the 15 surviving paths collect 167 at
      # HEAD, 167 at 494385928 (#1423's own tree, in a worktree at that
      # commit), and CI's own log for run 32763303080 reports
      # "167 passed ... expected at least 172". The collected node-ID sets at
      # HEAD and at #1423 are IDENTICAL -- no test was added, removed or
      # deselected in between, which is what rules out the failure modes the
      # guard's message lists and leaves only a miscount.
      #
      # Lowering a floor is exactly what the guard tells you to do "deliberately
      # with a reason", and this is that reason. The no-slack intent above is
      # preserved. RE-ANCHORED 2026-08-27: 167 -> 133 after the two retired
      # via-placement differential/PBT files were removed from this command;
      # 133 is the exact surviving collection count measured with the command
      # below, not a buffered floor.
      - name: Run validation DRC differentials (anti-vacuity gate)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: packages/temper-placer
        run: >
          uv run python ../../scripts/pytest_guard.py --min-tests 133 --
          tests/validation/test_drc_rust_differential.py
          tests/validation/test_drc_oracle_rust_differential.py
          tests/validation/test_drc_runner_rust_differential.py
          tests/validation/test_drc_fence_rust_differential.py
          tests/validation/test_geometric_rust_differential.py
          tests/validation/test_trace_analyzer_rust_differential.py
          tests/deterministic/stages/test_slot_generation_rust_differential.py
          tests/deterministic/stages/test_zone_geometry_rust_differential.py
          tests/deterministic/stages/test_zone_assignment_rust_differential.py
          tests/deterministic/stages/test_slot_generation_pbt.py
          tests/deterministic/stages/test_zone_geometry_pbt.py
          tests/deterministic/stages/test_zone_assignment_pbt.py
          -v --tb=short -p no:cacheprovider --maxfail=10
        env:
          RUST_BACKTRACE: full
          PYTHONFAULTHANDLER: 1

      # Wave 4 Phase 5 anti-vacuity gate (PR merge path): the report /
      # explainability / requirements differential+PBT suites are the ONLY
      # tests that pin the migrated Phase-5 Rust kernels
      # (temper_io_types.report/explain, temper_drc_rs.req_safe_01)
      # bit-exactly against the verbatim Python oracles
      # (tests/report/_*_py_oracle.py, tests/explainability/explain_oracle/,
      # tests/requirements/clearance_oracle/). They run in no other PR-time
      # job, so without this step a Phase-5 kernel regression would merge
      # silently — mirroring the Phase-4 validation gate above. pytest_guard
      # floors the collection at the 131 tests counted on the migration
      # branch (126 at Phase-5 landing, +3 from the pass-2 parity-break
      # fixtures, +2 from the list-position/truncate review pins), so a
      # silently-shrunk suite fails instead of passing vacuously. The oracle
      # packages are exercised only through these suites.
      #
      # FLOOR RE-ANCHORED 2026-08-21: 131 -> 105. The 4 tests/report/* files
      # named here were deleted by #1314 and #1411 (the report oracles they
      # pinned were retired with them), which made pytest exit 4 and collect
      # NOTHING -- this gate had been running vacuously. The 26 absent tests
      # are genuinely retired, not lost; 105 is the exact count of what
      # remains. RE-ANCHORED 2026-08-27: 105 -> 85 after the retired Markdown
      # and serialization differential files were removed from this command;
      # 85 is the exact surviving collection count.
      - name: Run Phase-5 report/explainability/clearance differentials (anti-vacuity gate)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: packages/temper-placer
        run: >
          uv run python ../../scripts/pytest_guard.py --min-tests 85 --
          tests/explainability/test_trace_rust_differential.py
          tests/explainability/test_decision_rust_differential.py
          tests/explainability/test_explainability_pbt.py
          tests/requirements/test_clearance_validator_rust_differential.py
          tests/requirements/test_clearance_validator_pbt.py
          tests/pcl/test_netclass_constraints_rust_differential.py
          tests/requirements/test_iec60335_requirements_rust_differential.py
          tests/router_v6/test_astar_nlayer_rust_differential.py
          -v --tb=short -p no:cacheprovider --maxfail=10
        env:
          RUST_BACKTRACE: full
          PYTHONFAULTHANDLER: 1

      # Wave 4 Phase 5 anti-vacuity gate (PR merge path): the cli/adapters/
      # temper-workflow differential/PBT suites are the ONLY tests that pin
      # the migrated orchestration compute (temper_orchestration) bit-exactly
      # against the verbatim pre-migration oracles. They must run hard on
      # every PR with a pytest_guard floor so a silently-shrunk collection
      # fails instead of passing vacuously. The floors are the EXACT
      # collection counts (63 / 32 — measured 2026-08-05), and
      # test_discriminator_tests_are_collectable (workflow suite) pins the
      # two load-bearing discriminator tests by symbol so a deletion paired
      # with a matching floor lowering also fails loudly. The temper-workflow
      # package's own differential/PBT (route_and_measure) runs from its own
      # test tree below.
      # wasm-covered: timing compare_stage T1-T4  <- orchestration::timing::tests
      #   p7_compare_stage_zero_delta_at_parity_seed_000.._019 (20)
      #   p8_compare_stage_positive_delta_pct_for_regression_seed_000.._019 (20)
      #   p9_compare_stage_effective_baseline_at_least_floor_seed_000.._019 (20)
      #   p10_compare_stage_zero_margin_exact_threshold_seed_000.._019 (20)
      #   + compare_stage_guards_zero_baseline (1)
      # Coverage authority: registry at THIS commit (gen_wasm_test_registry.py
      # --check, fast-gates job) + nightly local-sweep-r19 (built from the same
      # commit, no deployed-Worker staleness possible). Do NOT key the skip off
      # the deployed Workers' census: that is the advisory arm.
      # scripts/check_wasm_covered.py resolves the annotation against the
      # registry-at-commit: on success the pytest plugin (-p check_wasm_covered)
      # drops the four T1-T4 properties to a token 5 hypothesis examples; on
      # failure WASM_COVERED_TIMING stays unset, the plugin reduces nothing and
      # the full-strength suite runs -- a deleted/renamed mirror can never
      # silently shrink Python coverage (fail-closed). Token examples rather
      # than a skip/deselect because pytest_guard counts EXECUTED tests: all 63
      # still execute, so the floor is preserved in both branches. p95 (T5/T7,
      # CPython decimal -- structurally unmirrorable), the MT/MP relations and
      # trace_commands are NOT wasm-covered and keep their full 120 examples;
      # the two differential files remain the bit-exact retained oracles.
      - name: Run Phase-5 cli differentials (anti-vacuity gate)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: packages/temper-placer
        run: |
          # Resolve the wasm-covered annotation against this commit's registry.
          # Fail-closed: on failure WASM_COVERED_TIMING stays unset and the
          # plugin reduces nothing -- all 63 tests run at full strength.
          if python3 ../../scripts/check_wasm_covered.py --cluster timing; then
            echo "wasm-covered: timing T1-T4 confirmed at this commit; T1-T4 run at token examples"
            export WASM_COVERED_TIMING=1
          else
            echo "::warning::wasm-covered resolution FAILED for timing T1-T4; the full-strength Python suite runs (fail-closed). Fix the registry or the annotation."
          fi
          # scripts/ must be importable for `-p check_wasm_covered`.
          export PYTHONPATH="${PYTHONPATH:+${PYTHONPATH}:}$GITHUB_WORKSPACE/scripts"
          uv run python ../../scripts/pytest_guard.py --min-tests 63 -- \
          tests/cli/test_timing_rust_differential.py \
          tests/cli/test_trace_commands_rust_differential.py \
          tests/cli/test_timing_pbt.py \
          tests/cli/test_trace_commands_pbt.py \
          -v --tb=short -p no:cacheprovider --maxfail=10 \
          -p check_wasm_covered
        env:
          RUST_BACKTRACE: full
          PYTHONFAULTHANDLER: 1

      # Wave 4 round-2 anti-vacuity gate (PR merge path): the round-2
      # migration-wave differential/PBT suites (heuristics, spatial-DRC
      # cluster, constraint-model, channel-mapping, requirements geometry
      # validators, core-graph cluster, bus-cohort, aesthetic) are the ONLY
      # tests that pin those migrated Rust kernels bit-exactly against the
      # verbatim Python oracles. They previously ran in no PR-time job --
      # the migration wave landed with the drift this gate records (see
      # tests/validation/test_ci_test_file_registration.py and
      # docs/evidence/2026-08-07-router-v6-ci-name-enumeration-gap.md).
      # pytest_guard floors the collection at the 1092 tests counted on
      # 2026-08-09 with this exact 16-file invocation (`-m "not slow"`,
      # all passing), so a silently-shrunk suite fails instead of passing
      # vacuously. The core/ and metrics/ members are also swept by other
      # jobs' directory arguments; they get the pinned floor here regardless.
      #
      # FLOOR RE-ANCHORED 2026-08-28: 1029 -> 607. The two
      # tests/requirements/validators geometry suites were retired with their
      # Python implementations in the Rust migration and removed from this
      # invocation; 607 is the measured count of the surviving 13-file
      # invocation under the same `-m "not slow"`.
      - name: Run Wave-4 round-2 differentials (anti-vacuity gate)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: packages/temper-placer
        run: >
          uv run python ../../scripts/pytest_guard.py --min-tests 607 --
          tests/heuristics/test_heuristics_rust_differential.py
          tests/heuristics/test_heuristics_pbt.py
          tests/router_v6/test_spatial_drc_cluster_rust_differential.py
          tests/router_v6/test_spatial_drc_cluster_pbt.py
          tests/router_v6/test_constraint_model_rust_differential.py
          tests/router_v6/test_constraint_model_pbt.py
          tests/router_v6/test_channel_mapping_rust_differential.py
          tests/router_v6/test_channel_skeleton_pad_anchor_rust_differential.py
          tests/router_v6/test_channel_mapping_pbt.py
          tests/core/test_bus_cohort_rust_differential.py
          tests/core/test_bus_cohort_pbt.py
          tests/metrics/test_aesthetic_rust_differential.py
          tests/metrics/test_aesthetic_rust_pbt.py
          -v --tb=short -p no:cacheprovider --maxfail=10
        env:
          RUST_BACKTRACE: full
          PYTHONFAULTHANDLER: 1

      # Wave-4 tail-tooling anti-vacuity gate (PR merge path): the quarantine
      # compute differential pins the migrated temper-io-types quarantine
      # kernels (classify_error / compute_stack_hash / compute_fingerprint)
      # bit-exactly against the verbatim pre-migration oracle
      # (tests/testing/_quarantine_py_oracle.py, content-hash registered in
      # scripts/oracle_hashes.json). pytest_guard floors the collection so a
      # silently-shrunk suite fails instead of passing vacuously. Extended
      # with the regression reporter/manifest differentials as those slices
      # land on this branch.
      - name: Run Wave-4 tail-tooling differentials (anti-vacuity gate)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: packages/temper-placer
        run: >
          uv run python ../../scripts/pytest_guard.py --min-tests 76 --
          tests/testing/test_quarantine_rust_differential.py
          tests/regression/test_manifest_rust_differential.py
          tests/regression/test_reporter_rust_differential.py
          -v --tb=short -p no:cacheprovider --maxfail=10
        env:
          RUST_BACKTRACE: full
          PYTHONFAULTHANDLER: 1

      # Tank <-> DC-bus rail creepage gate (PR merge path, added 2026-08-15).
      # The tank<->bus pair is the board's highest-voltage shortfall: 2.0mm
      # enforced vs 6.3mm PD2 / 10.0mm PD3 required (docs/evidence/2026-08-12-
      # hv-hv-creepage-determination.md Sec 4.3; the audit in docs/evidence/
      # 2026-08-15-safety-assertion-audit-resumed.md Part 0 classified the
      # old suite as structurally incapable of seeing it). Until this step
      # existed, test_tank_creepage.py ran ONLY in the nightly extended-cpsat
      # job behind continue-on-error: true -- a shortfall could merge
      # invisibly. This step runs the suite hard on every PR and every push
      # to main (the `test` job is in required-checks.json's required_contexts
      # as "Core Tests").
      #
      # EXPECTED RED until the SafetyValue migration raises the enforced
      # tank<->bus figures: TestTankBusEnforcement asserts the design-rule
      # figures (netclass clearance 2.0mm, DRU-emitted 6.3mm, SSOT declared
      # 6.0/6.3mm) against the governing PD3 functional creepage (10.0mm).
      # A labelled red is the point -- the test must fail until the design is
      # built to the requirement. Do NOT weaken these assertions to green the
      # step (repo rule: never make a check pass by weakening it).
      - name: Run tank<->bus creepage gate (safety shortfall)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: packages/temper-placer
        run: >
          uv run python ../../scripts/pytest_guard.py --min-tests 27 --
          tests/placer/cp_sat/test_tank_creepage.py
          -v --tb=short -p no:cacheprovider --maxfail=10
        env:
          RUST_BACKTRACE: full
          PYTHONFAULTHANDLER: 1

      # Removed 2026-08-07: dead weight. The `run:` command already ends in
      # `|| echo "::warning ..."`, a shell fallback that makes the WHOLE
      # step exit 0 unconditionally (verified: `bash -c 'false || echo x;
      # echo $?'` -> 0) regardless of what check_coverage_gate.py does --
      # continue-on-error had nothing left to guard. The gate is still
      # genuinely warn-only (Phase 1 paydown pending); that policy now lives
      # entirely in the `|| echo` fallback, not in a second masking layer.
      - name: Coverage gate (temper-placer)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: packages/temper-placer
        run: >
          uv run python ../../scripts/check_coverage_gate.py
          --coverage-json coverage.json
          --allowlist ../../.coverage-allowlist
          || echo "::warning title=Coverage Gate::Phase 1 paydown prerequisite not yet met; gate is warn-only."

  # Split out of Core Tests 2026-07-28. These two cargo steps ran at position
  # 16-17 of the old 58-step job, ahead of every Python gate in the pipeline. On
  # 2026-07-28 a single clippy lint error in one crate therefore masked 43
  # downstream steps -- including two safety gates -- for hours; fixing the lint
  # moved the job from 15 to 29 executed steps, which is the measurement that
  # says those 43 steps were hidden by clippy alone. A Rust lint verdict and a
  # Python gate verdict are independent facts and now report independently.
  #
  # No `uv sync` / no maturin here: `cargo check` and `cargo clippy` need only
  # the toolchain. The venv steps are kept because VIRTUAL_ENV is set job-wide
  # and pyo3 build scripts resolve their interpreter through it, exactly as they
  # did when these steps ran inside Core Tests. Note the cargo target dir is
  # cold in this job (the workflow caches no Rust artifacts anywhere), so these
  # steps compile their dependency graph from scratch -- hence the budget.
  # Clippy now runs on all 14 Rust crates (every one carries
  # `[lints.clippy] unwrap_used = "deny", expect_used = "deny"`), so the loop
  # below is the gate that catches production unwraps/expects across the FFI
  # bridges -- including the pyo3 crates that maturin installs.
  rust-checks:
    name: Rust Checks (cargo check + clippy)
    needs: [changes]
    if: ${{ github.event_name == 'push' || needs.changes.outputs.rust-checks == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bennetleff/temper-ci:latest
      options: --user root
    timeout-minutes: 45
    env:
      VIRTUAL_ENV: /_temper-venv
      UV_PROJECT_ENVIRONMENT: /_temper-venv
      TEMPER_REQUIRE_RUST_DRC: "1"
    steps:
      - uses: actions/checkout@v7

      # Container runs as root; workspace is owned by the runner user. Without
      # this, every `git` call in a later `run:` step exits 128 on "dubious
      # ownership" rather than doing its job.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      # ---- SETUP / GATE BOUNDARY -------------------------------------------
      # Everything ABOVE is setup and stays fail-fast: it has no `if:`, so if
      # any of it fails (maturin, uv sync, make netlist) this step never runs,
      # `steps.setup.outcome` is not `success`, and every gate below is SKIPPED
      # rather than run against a half-built environment and reported as a gate
      # verdict. Everything BELOW is a gate: each carries
      # `if: !cancelled() && steps.setup.outcome == 'success'` so a red gate no
      # longer deletes the verdict of the gates behind it. None of them is
      # `continue-on-error`, so the job still concludes `failure` if any fails.
      - name: Setup barrier -- environment ready
        id: setup
        run: echo "setup complete; gates below report independently"

      - name: Check temper-constraint-compiler compiles
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo check --manifest-path packages/temper-constraint-compiler/Cargo.toml

      - name: Clippy (all Rust crates, -D warnings)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          for manifest in \
                       packages/temper-constraint-compiler/Cargo.toml \
                       packages/temper-design-bundle/Cargo.toml \
                       packages/temper-drc-rs/Cargo.toml \
                       packages/temper-geometry/Cargo.toml \
                       packages/temper-io-types/Cargo.toml \
                       packages/temper-orchestration/Cargo.toml \
                       packages/temper-pcl-ir/Cargo.toml \
                       packages/temper-py-bridge/Cargo.toml \
                       packages/temper-py-bridge-derive/Cargo.toml \
                       packages/temper-quality-oracle/Cargo.toml \
                       packages/temper-rust-router-core/Cargo.toml \
                       packages/temper-rust-router/Cargo.toml \
                       packages/temper-thermal/Cargo.toml \
                       packages/temper-placer/temper-constraints/Cargo.toml; do
            echo "=== clippy $manifest ==="
            # temper-constraints is the one abi3 crate; without the forward-compat
            # env it fails to build against a newer CPython than the pinned pyo3
            # knows about (same special-case as the Makefile's `extensions` target).
            if [ "$manifest" = "packages/temper-placer/temper-constraints/Cargo.toml" ]; then
              PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 \
                cargo clippy --manifest-path "$manifest" --all-features --all-targets -- -D warnings
            else
              cargo clippy --manifest-path "$manifest" --all-features --all-targets -- -D warnings
            fi
          done

      # Phase-5 (wave4): the temper-orchestration crate carries Rust unit
      # tests that never ran in CI before (review P2-3, 2026-08-05) — the
      # host_math pow-vs-multiply and libm absolute-value asserts, the NaN
      # py_cmp/py_max semantics, and the copper_length kernels — because only
      # temper-design-bundle got `cargo test`. A pyo3 crate that `maturin
      # develop` builds still needs its `#[cfg(test)]` modules exercised
      # somewhere; this step mirrors the temper-design-bundle entry's
      # structure. NOTE: the host_math absolute-value assert bakes in a
      # specific libm result — the discriminator value in host_math.rs was
      # dual-platform-verified (darwin arm64 AND the Ubuntu CI container,
      # glibc 2.39) to yield the same value on both.
      #
      # NARROWED 2026-08-11 (docs/evidence/2026-08-11-u6-orchestration-sustained-agreement.md,
      # docs/evidence/2026-08-11-native-cargo-test-duplication-inventory.md). This used
      # to be `cargo test --manifest-path packages/temper-orchestration/Cargo.toml`
      # (default features, i.e. pyo3 ON), which ran all 1,046 `#[cfg(test)]` lib
      # tests plus all 51 `tests/*.rs` integration tests -- 1,097 total, ~17s.
      #
      # `python3 scripts/gen_wasm_test_registry.py --crate temper-orchestration --census`
      # now registers 996 of those 1,046 lib tests onto the wasm32 tier, and a
      # 10/10-commit R19 sustained-agreement campaign (the second evidence doc
      # above) found 100% native/wasm32 verdict agreement on the intersection.
      # Those 996 no longer need to run here -- they run on wasm-tier-pr.yml /
      # wasm-tier-nightly.yml instead, under the same exact test name.
      #
      # This step is narrowed to its three structurally wasm32-ineligible
      # residuals (measured, not guessed -- see the duplication-inventory doc
      # for the counting method):
      #
      #   1. The 51 `tests/*.rs` integration tests. All 11 files import
      #      `pyo3`/`Python::` -- genuinely CPython-bound, can never move to
      #      the tier. NOTE: `cargo test --tests` looks like the obvious flag
      #      here and is WRONG -- cargo's own `--help` says `--tests` means
      #      "test all targets that have `test = true` set", which includes
      #      the *library* target, not just `tests/*.rs` (confirmed by
      #      running it: it printed "Running unittests src/lib.rs" and "1046
      #      passed" first, exactly the full lib suite this step exists to
      #      stop re-running). The step below instead discovers each
      #      `tests/*.rs` file's target name at run time and selects each one
      #      explicitly with `--test <name>`, which selects ONLY the named
      #      integration-test binary, never the lib -- verified: this prints
      #      zero "Running unittests" lines and exactly 51 test results.
      #      Deriving the list from the directory listing (rather than
      #      hardcoding the 11 names) means a future new `tests/*.rs` file is
      #      picked up automatically instead of silently going untested.
      #   2. `grid_hv.rs`'s 5-test `tests` module (`--lib "grid_hv::tests::"`).
      #      Found during this narrowing, NOT in the two evidence docs above --
      #      verify before trusting a prior inventory. It carries its own
      #      `#[cfg(feature = "python")]` (not just `#[cfg(test)]`) and calls
      #      `Python::attach`/`Python::initialize()` directly, so it cannot
      #      compile under `--no-default-features` and the wasm registry
      #      excludes it as `[python-gated]` -- confirmed via
      #      `--census`, which lists it under "excluded", never "registered".
      #      It is the only python-gated `tests` module in this crate (checked
      #      every `mod tests` in `src/*.rs` for a `feature = "python"` guard
      #      in its preceding attributes).
      #   3. `host_math::tests::host_libm_symbols_actually_resolve`
      #      (`--no-default-features --lib "host_math::tests::host_libm_symbols_actually_resolve"`).
      #      A dlsym host-facility test asserting a native-host property
      #      wasm32 does not have. Note this one is easy to miscount: the
      #      census's per-module table reports `host_math.rs::tests` as fully
      #      "registered" (143), because census counts source-level test
      #      *declarations*, not what actually executes per target. This one
      #      function individually carries `#[cfg(not(target_arch = "wasm32"))]`
      #      inside host_math.rs's own `WASM_TESTS` array (see that file, the
      #      entry immediately before the closing brace of the array), so it
      #      silently disappears from the array on an actual wasm32 build --
      #      "registered" in the census's source scan, but not present, let
      #      alone executed, on the tier. It does not need default features
      #      (no pyo3 in its cfg chain), so it runs `--no-default-features`,
      #      same config as the wasm32 substrate build below -- and, unlike
      #      residuals 1 and 2, it does not need libpython loadable at
      #      runtime.
      #
      # 51 + 5 + 1 = 57 tests kept native; measured directly (all three
      # commands run and counted, not projected):
      #   `cargo test --manifest-path packages/temper-orchestration/Cargo.toml --test d1_stages_runner --test d2_stages_runner ... (11 --test flags, discovered from tests/*.rs)`
      #     -> "5 passed" x7 (d1-d7) + "4 passed" x4 (e3,e4,e6,stages_runner) = 51, zero "Running unittests" lines
      #   `cargo test --manifest-path packages/temper-orchestration/Cargo.toml --lib "grid_hv::tests::"`
      #     -> "5 passed; ...; 1041 filtered out"
      #   `cargo test --manifest-path packages/temper-orchestration/Cargo.toml --no-default-features --lib "host_math::tests::host_libm_symbols_actually_resolve"`
      #     -> "1 passed; ...; 1033 filtered out"
      #
      # What is dropped from native execution here, and why each part is
      # covered: 1,097 - 57 = 1,040 tests. Of those:
      #   - 995 are `--census`-"registered" tests (996 registered minus the
      #     host_math dlsym test counted above, which the census buckets
      #     under "registered" despite residual 3's wasm32-exclusion) --
      #     these run on the tier today under the SAME module::test_name,
      #     verified by the R19 sustained-agreement campaign (10/10 commits,
      #     agreement_rate 1.0, zero disagreements, on this exact crate).
      #   - 45 are the crate's `*::proptests` modules (dev-dependency-gated,
      #     `proptest` cannot compile into the tier's non-test build --
      #     structural, not a registry gap). These are NOT on the tier under
      #     their own name and r19_compare.py -- which matches by EXACT NAME
      #     -- will report all 45 as `native_only` forever, the same way
      #     `temper-drc-rs` has reported its 31 mirrored proptests as
      #     native-only since long before this change. That is not a
      #     regression here and not a metric this change can zero out.
      #     Per #997, each has a deterministic `SplitMix64`-seeded mirror
      #     living in the SAME file's sibling `tests` module (which IS
      #     registered/tier-covered) -- e.g. host_math.rs::proptests' 7
      #     properties (P1-P7, e.g. "pow(x, 0.0) = 1.0") each get a shared
      #     `pN_..._impl(seed)` body called by 20 registered wrapper tests
      #     `host_math.rs::tests::pN_..._seed_000`..`_seed_019` (7 x 20 = 140
      #     of the 143 registered host_math.rs::tests tests) -- fixed seeds
      #     standing in for proptest's random shrinking search. That is the
      #     honest limit of this relief, stated plainly
      #     per R27: a proptest explores a randomly-sampled input space every
      #     run; a mirror runs the SAME fixed corpus of seeds every time.
      #     They are substantively equivalent regression coverage for the
      #     properties involved, not the same guarantee -- so this narrowing
      #     is justified on substance (deterministic tier equivalents exist
      #     and were sustained-agreement-tested), not on the native_only
      #     count going to zero, because it structurally cannot.
      - name: Test temper-orchestration (cargo test)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          set -eu
          echo "=== residual 1/3: tests/*.rs integration tests (pyo3-bound, 51 tests) ==="
          # `--tests` is NOT used here: it also selects the lib target (see
          # comment above this step). Discover each tests/*.rs file's target
          # name and select it explicitly with its own --test flag instead,
          # so the lib never runs and a new integration-test file is picked
          # up automatically.
          test_args=""
          for f in packages/temper-orchestration/tests/*.rs; do
            name=$(basename "$f" .rs)
            test_args="$test_args --test $name"
          done
          # `-- --nocapture`: this job never installs pyo3 extensions (no
          # maturin/uv sync -- see the comment above this step), so two
          # tests hit ModuleNotFoundError on a real (un-fakeable) extension
          # import and skip themselves with a printed reason instead of
          # panicking: d4_stages_runner.rs's phased_validator_hv_kernel
          # (`temper_drc_rs`) and uh_marshal_runner.rs's two tests
          # (`temper_orchestration`, this crate's own compiled module).
          # Without --nocapture, cargo test hides stdout/stderr for passing
          # tests, which would make those skip reasons invisible in this
          # job's log -- exactly the "swallowed skip" this repo's
          # conventions forbid. No test in this crate's tests/*.rs prints
          # anything otherwise, so this adds no other noise.
          cargo test --manifest-path packages/temper-orchestration/Cargo.toml $test_args -- --nocapture
          echo "=== residual 2/3: grid_hv.rs's python-gated lib tests (pyo3-bound, 5 tests) ==="
          cargo test --manifest-path packages/temper-orchestration/Cargo.toml --lib "grid_hv::tests::"
          echo "=== residual 3/3: host_math dlsym host-facility test (native-host-only, 1 test) ==="
          cargo test --manifest-path packages/temper-orchestration/Cargo.toml --no-default-features --lib "host_math::tests::host_libm_symbols_actually_resolve"

      # `cargo test --doc` was never invoked in CI (handoff 2026-08-15 §5),
      # and that is now a live gap rather than a theoretical one:
      # `agent/layer-identity-type-v2`'s entire structural guarantee is a
      # `compile_fail` doctest on `Layer`'s private fields
      # (packages/temper-geometry/src/layer_identity.rs) -- a hardcoded
      # `Layer { name: "F.Cu".into(), .. }` outside that module must NOT
      # compile. Without this step that guarantee is decorative: the wasm
      # tier's native arm (wasm-tier-nightly.yml) runs plain `cargo test`
      # for exactly ONE rotated crate per night, so temper-geometry's
      # doctests would execute at most once every ~9 nights and never on
      # the PR path, and the steps above select `--lib`/`--test` targets
      # that never build the Doc-tests target at all.
      #
      # `--doc` selects ONLY the Doc-tests target -- no lib or integration
      # tests, so this step neither re-runs nor overlaps with anything
      # above. `--no-default-features` matches the repo's native-arm
      # convention (the wasm tier topology, and the removed
      # temper-geometry step this job used to have): it drops the optional
      # `python` feature, keeping pyo3's `extension-module` (supplied by
      # maturin, never by Cargo) out of the doctest link -- the exact
      # `rust-lld: undefined symbol: PyImport_ImportModule` hazard that
      # killed the previous default-features temper-geometry step. Every
      # doctest in the repo is pure Rust, verified green on main
      # 2026-08-15 across all 14 crates in the same loop as clippy above
      # (doctest counts then: 3 in temper-geometry incl. 1 compile_fail,
      # 2 ignored in temper-py-bridge, 0 elsewhere).
      - name: Doctests (cargo test --doc, --no-default-features)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          set -eu
          for manifest in \
                       packages/temper-constraint-compiler/Cargo.toml \
                       packages/temper-design-bundle/Cargo.toml \
                       packages/temper-drc-rs/Cargo.toml \
                       packages/temper-geometry/Cargo.toml \
                       packages/temper-io-types/Cargo.toml \
                       packages/temper-orchestration/Cargo.toml \
                       packages/temper-pcl-ir/Cargo.toml \
                       packages/temper-py-bridge/Cargo.toml \
                       packages/temper-py-bridge-derive/Cargo.toml \
                       packages/temper-quality-oracle/Cargo.toml \
                       packages/temper-rust-router-core/Cargo.toml \
                       packages/temper-rust-router/Cargo.toml \
                       packages/temper-thermal/Cargo.toml \
                       packages/temper-placer/temper-constraints/Cargo.toml; do
            echo "=== doctests $manifest ==="
            cargo test --doc --no-default-features --manifest-path "$manifest"
          done

      # Same gap, same fix, one crate over: temper-geometry's `#[cfg(test)]`
      # modules ran nowhere. CI tested only temper-design-bundle and
      # temper-orchestration, and on 2026-08-06 the escape_via kernel made
      # `cargo test` abort on macOS (`dyld: symbol not found '_PyBool_Type'`,
      # see docs/evidence/2026-08-06-escape-via-cargo-test-dyld-abort.md), which
      # removed the only place they still ran. That is ~500 unit tests plus every
      # kernel the crate gained that day — congestion, escape_via, heatmap,
      # placement suggestions, routing demand, apply-suggestions.
      #
      # Runs with --no-default-features, which drops the optional `python`
      # feature and with it pyo3's `extension-module`.
      #
      # The earlier note here claimed temper-orchestration was precedent for
      # this linking with default features on Linux. That was wrong: the two
      # crates carry an identical pyo3 setup, but temper-orchestration's test
      # binary never reaches a pyo3 symbol, so the linker never demands one.
      # temper-geometry's does, and `extension-module` deliberately leaves
      # libpython unlinked -- so the step failed on Linux with
      # `rust-lld: undefined symbol: PyImport_ImportModule` (and on macOS with
      # the dyld abort in
      # docs/evidence/2026-08-06-escape-via-cargo-test-dyld-abort.md).
      # It has therefore never executed a single test since it was added.
      #
      # --no-default-features runs the pure-Rust core -- 514 tests, which is
      # the ~500 this step was added to protect -- and is the same
      # configuration the wasm32 build below uses.
      #
      # REMOVED 2026-08-11 (cost policy: the deployed WASM tier should run
      # ONLY there, not also in GitHub Actions). This step ran temper-
      # geometry's FULL native suite on every PR -- duplicating, per test,
      # per push, exactly what the deployed tier already covers:
      # docs/evidence/2026-08-11-native-only-classification-all-crates.md
      # measured the tier covering the large majority of temper-geometry's
      # registered tests, with 89 native-only at that snapshot (proptest,
      # `tests/` integration targets, two `#[cfg(not(target_arch =
      # "wasm32"))]` host-libm guards, one doctest).
      #
      # Where the tier-covered tests now run on the PR path: this repo's
      # own tier PR verdict, .github/workflows/wasm-tier-pr.yml (scoped to
      # the tiers a PR's diff touches -- see that file's header). It is
      # advisory (D5.4), not a required check, same as before this change.
      #
      # Where the 89 native-only tests now run: NOT on the PR path any more
      # -- they lose PR-time native execution, same as the geometry-crate
      # part of this task's remit for wasm-tier-nightly.yml's own native
      # arm. They still execute natively whenever temper-geometry comes up
      # in that workflow's R19 rotation (full cycle every `len(tiers)`
      # nights -- TWELVE as of 2026-08-24, not the 9 / "under 1.5 weeks" this
      # comment claimed when written; see that file's header, "R19 NATIVE-ARM
      # ROTATION", and docs/evidence/2026-08-24-wasm-tier-phase5-verdict.md §3
      # for what that cadence means in practice),
      # because a rotation night runs the crate's ordinary, unfiltered
      # `cargo test`, not a tier-scoped subset.
      #
      # The WASM32 build+clippy guard immediately below (a link/lint check,
      # not a test run) is UNCHANGED and still covers temper-geometry.

      # ---- WASM32 regression guard (plan 2026-08-03-002, U3) --------------
      # These steps verify that the wasm32 substrate (R1) has not silently
      # regressed.  They build with --no-default-features (python OFF) because
      # pyo3 cannot cross-compile to wasm32-unknown-unknown.  The build step
      # uses `cargo build`, not `cargo check`, because `check` cannot see link
      # failures — the crates carry `unsafe extern "C" { fn dlsym }` whose
      # failure mode is a link error, and `cargo check` skips linking.
      # Expected to add runner-minutes but zero new job slots (the plan's
      # binding CI constraint is job count, not duration, and this repo's
      # ~24-job ceiling is already over-subscribed).
      # If the container image ghcr.io/bennetleff/temper-ci:latest could
      # pre-install the wasm32-unknown-unknown target, these steps would
      # save ~30s of `rustup target add` per run.

      - name: Install wasm32 target
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: rustup target add wasm32-unknown-unknown

      - name: WASM32 build + clippy (temper-drc-rs, temper-geometry; --no-default-features)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          # `set -eu`, NOT `set -euo pipefail`: this job's container runs
          # `run:` steps under `sh` (dash), where `-o pipefail` is an illegal
          # option -- the `set` line failed with "Illegal option" BEFORE any
          # cargo command ran, so the guard never actually built the wasm32
          # target (observed on main runs through 2026-08-07). `-u` is enough
          # to catch unset-variable bugs and is portable across sh and bash.
          set -eu
          echo "=== wasm32 build (cargo build, not check — check cannot see link failures) ==="
          cargo build --release --target wasm32-unknown-unknown --no-default-features \
            --manifest-path packages/temper-drc-rs/Cargo.toml
          cargo build --release --target wasm32-unknown-unknown --no-default-features \
            --manifest-path packages/temper-geometry/Cargo.toml
          echo "=== clippy --no-default-features (temper-drc-rs) ==="
          cargo clippy --manifest-path packages/temper-drc-rs/Cargo.toml \
            --no-default-features --all-targets -- -D warnings
          echo "=== clippy --no-default-features (temper-geometry) ==="
          cargo clippy --manifest-path packages/temper-geometry/Cargo.toml \
            --no-default-features --all-targets -- -D warnings

      # ---- WASM32 EXECUTE guard, ALL TWELVE TIERS (added 2026-08-17, the
      # incident this closes) --------------------------------------------
      #
      # THE GAP. The step immediately above only ever covered two of the wasm
      # tier's twelve crates (temper-drc-rs, temper-geometry), and even for
      # those two it only ever ran `cargo build` -- a link check, not an
      # execution. `cargo build` does not compile `#[cfg(test)]` code at all,
      # so it could not have caught the 2026-08-17 incident regardless of
      # which crate it targeted: #1260's direct capacity-aware topology
      # solver added a `#[test]` in
      # packages/temper-rust-router-core/src/direct_topology.rs that calls
      # `std::time::Instant::now()`, which panics at RUNTIME on
      # wasm32-unknown-unknown ("time not implemented on this platform") --
      # only visible once the compiled registry is actually EXECUTED. Ten of
      # the twelve tiers (everything except drc-rs/geometry) got zero
      # wasm32 attention of any kind on the PR path, and temper-rust-router-core
      # was one of them. The break rode two failed
      # `wasm-tier-deploy.yml` runs (31989435749 at 02:54, exit 101 in
      # `scripts/stage_wasm_families.sh`; 31993444375 at 04:08, failing in
      # "Census + smoke-run") before `wasm-tier-nightly.yml` (31997559157,
      # 05:20) finally named it -- see
      # docs/evidence/2026-08-17-deploy-failure-alerting-and-pr-wasm32-coverage.md.
      #
      # THE FIX. Build AND RUN every tier's wasm32 registry here, on every PR
      # that triggers this job -- the exact same
      # "cargo build --features <tier> --manifest-path
      # packages/temper-wasm-test-runner/Cargo.toml" + "node
      # tools/wasm/run_wasm_tests.mjs" pair wasm-tier-nightly.yml's
      # "Build + run every tier's wasm32 registry" step and
      # wasm-tier-deploy.yml's "Census + smoke-run" step already run, moved
      # forward from post-merge (nightly, up to 24h later) and pre-deploy
      # (operator-triggered, no fixed cadence) to pre-merge. TOPOLOGY-DRIVEN,
      # not a hardcoded pair: the matrix comes from
      # tools/wasm/wasm_tier_topology.json via tools/wasm/tier_topology.mjs,
      # the same file every other consumer reads, so a tier added there gets
      # this guard for free -- the exact "hardcoded to two crates while ten
      # others got none" defect this step exists to retire cannot recur one
      # tier at a time.
      #
      # WHY THIS RUNS EVEN THOUGH temper-rust-router-core IS CURRENTLY BROKEN.
      # As of this commit, main's `direct_topology.rs` still panics on
      # wasm32 (PR #1296, `fix/wasm-tier-router-core-instant-panic`, fixes it
      # and is in flight but not yet merged -- this change does not touch
      # that crate or that PR). That means THIS STEP IS EXPECTED TO FAIL on
      # every PR until #1296 lands, for the honest reason that the substrate
      # really is broken. Softening this step (skipping router-core,
      # continue-on-error, or otherwise) to keep it green would be exactly
      # the "make a check pass by weakening it" move this repo's own
      # operating rules forbid, and it would silently recreate the very gap
      # this step exists to close for the one crate that just proved the gap
      # real. `Rust Checks` is already red on main independently of this
      # change (a pre-existing `very complex type` clippy error in
      # temper-rust-router, unrelated to this incident), so this addition
      # does not newly block anything that was not already blocked; it will
      # go green on its own the moment #1296 merges, with no further edit
      # needed here.
      - uses: actions/setup-node@v7
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        with:
          node-version: '22'

      - name: WASM32 build + EXECUTE every wasm-tier registry (topology-driven, all 12 tiers)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          # POSIX sh (dash), same constraint as the step above -- no
          # `set -o pipefail`, no `$'\t'`, no `[[ ]]`.
          set -eu
          node -e '
            import("./tools/wasm/tier_topology.mjs").then(({ loadTopology, tierFlagSuffix }) => {
              for (const t of loadTopology().tiers) {
                console.log([t.crate, tierFlagSuffix(t.crate), t.cargo_features, t.staged_module, t.expected_failures].join("\t"));
              }
            }).catch((e) => { console.error(e.message); process.exit(1); });
          ' > /tmp/pr_wasm_arms.tsv
          # An empty matrix would make the loop below a no-op that reports a
          # green guard having built and run nothing.
          test -s /tmp/pr_wasm_arms.tsv
          echo "wasm32 arms (all tiers, from tools/wasm/wasm_tier_topology.json):"
          cat /tmp/pr_wasm_arms.tsv
          # This job's container (.github/docker/ci.Dockerfile) sets
          # CARGO_TARGET_DIR=/_temper-target unconditionally, which OVERRIDES
          # .cargo/config.toml's relative `target-shared` -- the path every
          # OTHER wasm-tier workflow (wasm-tier-deploy.yml, wasm-tier-
          # nightly.yml) hardcodes, because none of them run inside this
          # container. Hardcoding `target-shared` here would `cp` a
          # nonexistent path on every iteration and this whole guard would
          # fail on its first tier, for a reason unrelated to wasm32 at all --
          # exactly the "looks right, silently never runs" failure mode this
          # repo's own operating rules warn about. Resolved at run time so it
          # is correct in this container AND if this step is ever copied to a
          # bare-runner workflow where CARGO_TARGET_DIR is unset.
          TARGET_DIR="${CARGO_TARGET_DIR:-target-shared}"
          echo "cargo target dir: ${TARGET_DIR}"
          failed=""
          ran=0
          while IFS=$(printf '\t') read -r crate suffix features staged manifest; do
            echo "=== wasm32 build+run: ${crate} (--features ${features}) ==="
            # Same failure-isolation shape as the two nightly/deploy loops
            # this step mirrors: every tier writes the SAME output filename,
            # so a failed build must not fall through to the copy (it would
            # stage the PREVIOUS tier's module under this tier's name and run
            # it against this tier's manifest -- a page of orphan exclusions
            # whose stated cause is the wrong crate). `< /dev/null` on every
            # child so nothing in the loop can consume the rest of
            # /tmp/pr_wasm_arms.tsv and end the loop early after one tier.
            if cargo build --release --target wasm32-unknown-unknown --no-default-features \
                 --features "${features}" \
                 --manifest-path packages/temper-wasm-test-runner/Cargo.toml < /dev/null; then
              cp "${TARGET_DIR}/wasm32-unknown-unknown/release/temper_wasm_test_runner.wasm" \
                 "/tmp/${staged}"
              # run_wasm_tests.mjs EXECUTES every test under Node and exits
              # non-zero on an unexpected failure, an unexpected PASS, an
              # orphan exclusion, or a vacuous registry -- not a census, a
              # real run. This is the step that would have caught the
              # 2026-08-17 Instant::now() panic before merge: `cargo build`
              # alone cannot, because it never compiles `#[cfg(test)]` code.
              node tools/wasm/run_wasm_tests.mjs "/tmp/${staged}" \
                --expected-failures "${manifest}" \
                --json "/tmp/pr_wasm_local_${suffix}.json" < /dev/null \
                || failed="${failed} ${crate}(run)"
            else
              failed="${failed} ${crate}(build)"
            fi
            ran=$((ran + 1))
          done < /tmp/pr_wasm_arms.tsv
          expected="$(wc -l < /tmp/pr_wasm_arms.tsv)"
          if [ "${ran}" != "${expected}" ]; then
            echo "::error::Built/ran ${ran} of ${expected} wasm32 tiers — the loop ended early, so some tier got neither a build nor an execute verdict here."
            exit 1
          fi
          if [ -n "${failed}" ]; then
            echo "::error::wasm32 build or execution failed for:${failed}. run_wasm_tests.mjs exits non-zero on an unexpected failure, an unexpected PASS, an orphan exclusion, or a vacuous registry -- see its output above for which. A failure here is the wasm32 substrate genuinely broken for this commit, the same class of break that reached wasm-tier-deploy.yml silently on 2026-08-17 (docs/evidence/2026-08-17-deploy-failure-alerting-and-pr-wasm32-coverage.md)."
            exit 1
          fi
          echo "all ${ran} wasm32 tiers build AND execute cleanly"

  # Split out of Core Tests 2026-07-28. Everything here reads the compiled
  # netlist (elec/build/default.net, default.csv) or pcb/temper.kicad_pcb, so
  # they share the `make netlist` setup and belong together.
  #
  # "Physical mains<->SELV isolation-barrier gate" is LAST. It is the gate that
  # is red on main right now (run 30390466165) and it cannot be fixed from CI --
  # pcb/temper.kicad_pcb has zero keepout zones and the fix is hardware work.
  # Its position is no longer load-bearing: since every gate step below the
  # setup barrier carries `if: !cancelled() && steps.setup.outcome == 'success'`,
  # this gate masks nothing wherever it sits, and a step added after it will run
  # and report on its own. Kept last because that is where it reads best.
  # MERGED 2026-08-03 from board-gates + provenance-gates + requirements-tests.
  # Each paid the same ~225s prologue (container init, 3x maturin, uv sync,
  # make netlist) for well under a minute of actual gate work -- measured
  # 2026-08-03: 79% of this workflow's job-time was setup, and a single push
  # requested ~40 jobs against a ~24-job account concurrency ceiling. Sharing
  # one prologue collapses 3 runners into 1 and drops ~7.5 job-minutes/run.
  #
  # None of the three was a required context, so merging needed no rename
  # migration -- unlike the remaining gate jobs, whose names branch protection
  # and .github/required-checks.json still match exactly.
  #
  # Gate independence is preserved verbatim: every gate keeps
  # `if: !cancelled() && steps.setup.outcome == 'success'`, so one red gate
  # still cannot delete the verdict of the gates behind it, and none of them
  # runs against a half-built environment.
  #
  # ORDERING IS LOAD-BEARING: 'Regenerate schematics and check drift' writes
  # pcb/*.kicad_sch and is therefore placed LAST, after every gate that reads
  # committed board state (copper-net drift, footprint drift, identity,
  # measurement provenance). Job isolation used to guarantee this for free.
  board-provenance-requirements-gates:
    name: Board, Provenance & Requirements Gates
    needs: [changes]
    if: ${{ github.event_name == 'push' || needs.changes.outputs.board-provenance-requirements-gates == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bennetleff/temper-ci:latest
      options: --user root
    # Sum of the three former budgets (25+20+25) less the two prologues no
    # longer paid; the gates themselves totalled well under a minute.
    timeout-minutes: 40
    env:
      VIRTUAL_ENV: /_temper-venv
      UV_PROJECT_ENVIRONMENT: /_temper-venv
      TEMPER_REQUIRE_RUST_DRC: "1"
    steps:
      # fetch-depth: 0 (full history, not the default shallow depth-1 clone):
      # the DRC ceiling approval gate below needs `origin/main` and a real
      # merge-base to diff drc_ceiling.json and enumerate this PR's commits
      # for a Ceiling-Approval: trailer -- a shallow clone would make that
      # merge-base unresolvable and the gate would have to fail closed on
      # every run. Same convention already used by the loc-cap and
      # repo-state jobs below, which have the same need.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Container runs as root; workspace is owned by the runner user. Without
      # this, every `git` call in a later `run:` step exits 128 on "dubious
      # ownership" rather than doing its job.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Install maturin
        run: uv pip install maturin

      - name: Build and install Rust crate
        run: uv run maturin develop --release --manifest-path packages/temper-rust-router/Cargo.toml

      - name: Verify Rust module loads
        run: uv run python3 -c "import temper_rust_router; print('temper_rust_router loaded OK')"
        env:
          RUST_BACKTRACE: full

      - name: Build and install temper-drc-rs
        run: uv run maturin develop --release --manifest-path packages/temper-drc-rs/Cargo.toml

      - name: Verify temper-drc-rs loads
        run: uv run python3 -c "import temper_drc_rs; print('temper_drc_rs loaded OK')"
        env:
          RUST_BACKTRACE: full

      - name: Build and install temper-constraints
        run: >
          uv run maturin develop --release
          --manifest-path packages/temper-placer/temper-constraints/Cargo.toml
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

      - name: Verify temper-constraints loads
        run: uv run python3 -c "import temper_constraints; print('temper_constraints loaded OK, version', temper_constraints.version_py())"
        env:
          RUST_BACKTRACE: full

      # `uv sync` defaults to an *exact* sync: anything installed in the venv
      # that is not part of this invocation's resolved target set gets
      # uninstalled as "extraneous". `--no-install-package X` excludes X from
      # that target set -- it does NOT mean "leave X alone". Without
      # `--inexact`, the three flags below were therefore silently
      # UNINSTALLING the release wheels that "Build and install ..." just
      # built and "Verify ... loads" just confirmed importable, minutes
      # earlier in this same job. Reproduced locally: `uv sync --all-packages
      # --no-install-package temper-rust-router ...` (no --inexact) prints
      # "Uninstalled 2 packages" and `- temper-rust-router==0.1.0` in its
      # diff, and a subsequent bare import fails with ModuleNotFoundError.
      # `--inexact` disables the extraneous-package removal, so these three
      # packages are truly left untouched (mtimes unchanged, no rebuild)
      # instead of evicted -- confirmed locally: with --inexact added, the
      # same command reports "Audited N packages" (no install/uninstall) and
      # the modules remain importable afterward.
      - name: Install dependencies
        run: >
          uv sync --all-packages --inexact
          --no-install-package temper-rust-router
          --no-install-package temper-drc-rs
          --no-install-package temper-constraints

      - name: Cache netlist
        id: cache-netlist
        uses: actions/cache@v6
        with:
          path: elec/build
          key: netlist-${{ hashFiles('elec/src/**', 'elec/ato.yaml', 'Makefile') }}

      - name: Build electronics netlist
        if: steps.cache-netlist.outputs.cache-hit != 'true'
        run: make netlist

      # ---- SETUP / GATE BOUNDARY -------------------------------------------
      # Everything ABOVE is setup and stays fail-fast: it has no `if:`, so if
      # any of it fails (maturin, uv sync, make netlist) this step never runs,
      # `steps.setup.outcome` is not `success`, and every gate below is SKIPPED
      # rather than run against a half-built environment and reported as a gate
      # verdict. Everything BELOW is a gate: each carries
      # `if: !cancelled() && steps.setup.outcome == 'success'` so a red gate no
      # longer deletes the verdict of the gates behind it. None of them is
      # `continue-on-error`, so the job still concludes `failure` if any fails.
      - name: Setup barrier -- environment ready
        id: setup
        run: echo "setup complete; gates below report independently"

      # ---- from requirements-tests ----
      # Plan 2026-07-25-001 R2. `tests/requirements/` holds the encoded
      # IEC 60335 / EMC / design-review checks and was named in NO workflow --
      # 240 test functions with zero CI execution path on a mains-connected
      # design. Measured on wiring: safety 53 passed, emc 57 passed,
      # review 27 passed.
      #
      # `dfm/` joined 2026-07-28 once green. It had one real failure
      # (DFM001-ANT-002, a copper pour inside the ESP32 antenna keepout on a
      # fixture whose purpose is to represent adequate keepout), three tests
      # requesting an `accessible_components` fixture that does not exist, and
      # four assertion bugs. Wiring it now would add noise, not signal. It goes
      # in once green -- not behind continue-on-error.
      #
      # Guarded so this cannot quietly regress to zero the way the extended
      # suite did via a phantom path.
      - name: Requirements tests (safety / EMC / review / DFM)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: >
          cd packages/temper-placer &&
          uv run python ../../scripts/pytest_guard.py --min-tests 240 --
          tests/requirements/safety/ tests/requirements/emc/
          tests/requirements/review/ tests/requirements/dfm/
          -v --tb=short -p no:cacheprovider

      # ---- from provenance-gates ----
      - name: Physics parameter provenance gate
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: packages/temper-placer
        run: |
          uv run python ../../scripts/check_physics_provenance.py --allowlist ../../.physics-provenance-allowlist --physics-dir src/temper_placer/physics/
          uv run python ../../scripts/check_physics_provenance.py --check-shrink --allowlist ../../.physics-provenance-allowlist --physics-dir src/temper_placer/physics/

      # Dead-parameter & physics-input standing check (plan 2026-08-02-019,
      # U3): wires then unwires every declared live gate input (acceptance-gate
      # inner surface) and every registered physics parameter and requires the
      # output to change — verdict flip for gate consumers, delta-over-noise-
      # floor for threshold-less consumers. Fails on a dead input, an
      # unregistered physics parameter, or a registry validation error.
      #
      # LANDED WARN-ONLY per the plan's landing contract (U3 step 2): the first
      # run must surface dead inputs / unproven parameters for triage before
      # this can hard-fail. Hard-fail after 2026-09-01 (with the coverage-gate
      # and ruff gates), same horizon as the other warn-only gates.
      # Removed 2026-08-07: dead weight, same pattern as the Coverage gate
      # step above -- the `run:` command already ends in `|| echo
      # "::warning ..."`, which makes the step exit 0 unconditionally no
      # matter what check_dead_parameter_inputs.py reports, so
      # continue-on-error had nothing left to guard. Still genuinely
      # warn-only (U3 landing contract, first-run triage pending); that
      # policy lives entirely in the `|| echo` fallback now.
      - name: Dead-parameter standing check (dead inputs + physics plumbing)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: packages/temper-placer
        run: >
          uv run python ../../scripts/check_dead_parameter_inputs.py
          || echo "::warning title=Dead-Parameter Standing Check::first-run triage pending (plan 2026-08-02-019 U3); gate is warn-only."

      - name: Evidence provenance gate (docs/evidence/)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          uv run python scripts/check_evidence_provenance.py
          uv run python scripts/check_evidence_provenance.py --check-shrink

      - name: Anti-vacuous-truth gate (gates/validators)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_vacuous_gates.py

      # Static half of the protected-measurement-artifact gate. Closes the
      # 2026-08-04 incident: `test_update_baseline_yaml` in
      # tests/router_v6/test_temper_production_board_routing.py was a
      # maintenance routine named `test_*` with no skipif, env guard or opt-in
      # marker, so pytest collected and ran it on ordinary sessions. It
      # rebuilt power_pcb_dataset/baselines/temper_production_baseline.yaml
      # from a plain dict via yaml.safe_dump -- deleting all ~235 comment
      # lines, among them the ~200-line header explaining why
      # component_count/net_count were removed on 2026-07-29 -- and left the
      # rewrite in the working tree for `git add -A` to commit (-292/+91 on
      # one observed run; two agents hit it independently within hours).
      #
      # Its runtime counterpart (scripts/_lib/pytest_artifact_guard.py, an
      # autouse fixture installed from conftest.py) only fires for tests that
      # RUN, and the offending test sits behind `slow`/`routing` marks and a
      # kicad-cli dependency -- so under `-m 'not slow'`, or on a runner
      # without KiCad, a runtime-only gate is green while the defect is still
      # in the tree. This step reads source instead, so deselection cannot
      # satisfy it. Both halves are required; neither subsumes the other.
      - name: Protected measurement artifact gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_test_baseline_writes.py scripts/tests/_lib/test_lib_yaml_block_patch.py -v --tb=short

      - name: No test writes a committed measurement baseline
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_test_baseline_writes.py

      - name: Measurement-provenance gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_measurement_provenance.py scripts/tests/_lib/test_lib_measurement_provenance.py -v --tb=short

      # Fail-closed, not soft-launched: catches a measurement artifact
      # (power_pcb_dataset/drc_ceiling.json today) whose recorded input
      # content hash no longer matches the file on disk -- the DRC ceiling
      # incident this closes recorded 91 errors for a board that three
      # later commits (c6b1b463, 556ccf4f, 65bd0159) changed to ~710
      # errors' worth, with the ceiling file itself byte-identical
      # throughout. STALE is a GATE ERROR here, not a violation --
      # generalizing the same "netlist is STALE ... not PASSED, not a
      # violation" semantic check_domain_partition.py already uses. See
      # docs/evidence/2026-07-28-measurement-provenance.md.
      #
      # Placed last in its job, and never continue-on-error: this step is
      # expected to fail right now, because the real drc_ceiling.json
      # genuinely is stale and has not been re-measured/re-approved. Every
      # other required gate used to be in this same job and had to be
      # ordered ahead of it for that reason; since the 2026-07-28 split
      # they are in sibling jobs and cannot be affected by this gate at
      # all, and since the same day's independent-gate-reporting change
      # every gate step in this job runs under
      # `if: !cancelled() && steps.setup.outcome == 'success'` -- so this
      # gate masks nothing regardless of where it sits, and a step added
      # after it will run and report on its own.
      - name: Measurement-provenance gate (drc_ceiling.json input freshness)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          uv run python scripts/check_measurement_provenance.py
          uv run python scripts/check_measurement_provenance.py --check-shrink

      - name: DRC ceiling approval gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_drc_ceiling_approval.py packages/temper-placer/tests/regression/test_drc_ratchet.py packages/temper-placer/tests/regression/test_drc_ratchet_approval.py -v --tb=short

      # drc_ceiling.json's own header states the policy: "Ceilings may only
      # decrease; raising one requires a 'Ceiling-Approval:' commit trailer
      # (drc_ratchet.detect_ceiling_raise)." That detection logic has
      # existed -- and been unit-tested -- since it was written, but no CI
      # workflow ever called it (scripts/ci_check_drc.py only calls
      # DrcRatchet.check(), never detect_ceiling_raise()). A documented,
      # implemented, unit-tested policy with no caller is exactly the
      # vacuous-gate failure class this job exists to catch; this step is
      # the missing caller. Compares drc_ceiling.json at HEAD against
      # origin/main's merge-base and fails if any ceiling value (aggregate
      # or per-type, errors or warnings) increased without a
      # Ceiling-Approval: trailer on a commit in this PR. See
      # scripts/check_drc_ceiling_approval.py's module docstring.
      - name: "DRC ceiling approval gate (Ceiling-Approval: trailer + measurement evidence required on any raise)"
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_drc_ceiling_approval.py

      # ---- from board-gates ----
      - name: Run electronics validation tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest elec/validation/ -v --tb=short

      - name: Domain-partition gate unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_domain_partition.py -v --tb=short

      - name: Netlist domain-partition gate (galvanic isolation)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # Fail-closed: reads the compiled netlist against
        # elec/domain_manifest.yaml and asserts the declared HV/SELV
        # domains land in disjoint connected components, and that every
        # declared isolator's own pin groups are mutually unreachable. This
        # is the check that would have caught the aux_supply.psu star-join
        # short (docs/hardware/IEC60335_CRITICAL_COMPONENTS.md Sec 2) --
        # see docs/evidence/2026-07-26-domain-partition-check.md. Never
        # `continue-on-error`: a gate that cannot run must exit non-zero.
        run: uv run python scripts/check_domain_partition.py

      - name: HV netclass coverage gate unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_hv_netclass_coverage.py -v --tb=short

      - name: HV netclass coverage gate (net assignment + rule-emission)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # Fail-closed: asserts every elec/domain_manifest.yaml HV-domain
        # net has a TEMPER_NET_ASSIGNMENTS entry, and every declared
        # netclass (TEMPER_NET_CLASSES union pcb/temper.kicad_pro-described
        # classes) emits at least one real rule from
        # scripts/generate_kicad_dru.py. This is the check that would have
        # caught +170V_BUS resolving to no netclass at all and
        # HighVoltageIsolated existing with zero DRC rules (docs/evidence/
        # 2026-07-29-hv-netclass-coverage-gate.md). Never
        # `continue-on-error`: a gate that cannot run must exit non-zero.
        run: uv run python scripts/check_hv_netclass_coverage.py

      # --- net -> netclass two-table drift gate (added 2026-08-19) ---
      # scripts/sync_kicad_netclass_assignments.py DERIVES pcb/temper.
      # kicad_pro's net_settings.netclass_assignments from design_rules.py's
      # TEMPER_NET_ASSIGNMENTS, so the two tables cannot drift. Its own
      # manifest.yaml entry has called it "the CI tripwire against future
      # drift" since PR #1025 -- but it was NEVER actually invoked by any
      # workflow, and from 2026-08-12 its PROTECTED_NETS tripwire made
      # `--check` exit 5 unconditionally, before computing any diff. A
      # generator whose check mode is never run just relocates the drift bug:
      # 13 missing and 1 mismatched entry accumulated undetected, including 7
      # elec/domain_manifest.yaml HV-domain nets left on KiCad's Default
      # 0.2mm/no-creepage class on the fab-authoritative kicad-cli DRC path.
      # `check_hv_netclass_coverage.py` above does NOT subsume this: it only
      # checks nets the domain manifest declares, so any net outside the
      # manifest (e.g. the OVP-01 mid-chain divider nodes) can still drift
      # between the two tables invisibly. Never `continue-on-error`: a gate
      # that cannot run must exit non-zero.
      - name: Net -> netclass two-table sync gate unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_sync_kicad_netclass_assignments.py -v --tb=short

      - name: Net -> netclass two-table sync gate (kicad_pro derives from SSOT)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/sync_kicad_netclass_assignments.py --check

      - name: Copper-net consistency gate unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_copper_net_consistency.py -v --tb=short

      - name: Board-copper / netlist consistency gate (designator + net drift)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # Fail-closed: reads pcb/temper.kicad_pcb directly (the only gate in
        # this job that does) and cross-checks it against the freshly
        # compiled netlist -- dangling net-table ordinals, copper orphaned
        # off a deleted net, and per-pad (Reference, pad number) exact
        # identity agreement. This is the check that would have caught (and
        # on 2026-07-30 did catch, see docs/evidence/
        # 2026-07-30-copper-net-consistency-drift.md) the board never being
        # resynced after tank.c_tank3 was added (commit 3ae26dfe): C27 on
        # the board is still the OLD ct_sense.c_filter footprint while the
        # netlist now assigns C27 to the HV tank capacitor. Registered
        # `disposition: ci-gate` in scripts/manifest.yaml since 2026-07-28
        # but never actually wired into a workflow until this step -- a
        # silent-skip hole of the same class as commit db779c81. Never
        # `continue-on-error`: a gate that cannot run must exit non-zero.
        run: uv run python scripts/check_copper_net_consistency.py

      - name: Net pin-identity / pad-correspondence gate unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_net_pin_identity_pad_correspondence.py -v --tb=short -m "not slow"

      - name: Net pin-identity / pad-correspondence gate (duplicate-pad-number nets)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # Fail-closed: reads pcb/temper.kicad_pcb directly and flags any net
        # whose (component_ref, pin_name) pin-identity view collapses to
        # <=1 distinct pin while its REAL, independently-parsed physical pad
        # count is > 1 -- the invariant that would have caught
        # discharge.k_dis1-no/discharge.k_dis2-no (K2/K3's manufacturer-
        # duplicated relay contact pads) silently looking like trivial,
        # nothing-to-connect nets to the router's own pin-identity model
        # while the real board carried two genuinely distinct, currently-
        # unconnected physical pads. A small, human-reviewed allowlist
        # (KNOWN_DUPLICATE_PAD_NUMBER_NETS in the gate script) covers the
        # two known-and-fixed cases; any other net hitting this shape is
        # unreviewed and fails closed. Never `continue-on-error`.
        run: uv run python scripts/check_net_pin_identity_pad_correspondence.py

      - name: Pad-identity ambiguity gate unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_pad_identity_ambiguity.py -v --tb=short

      - name: Pad-identity ambiguity gate (duplicate-pad-number footprint x unsafe consumer)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # Fail-closed, component-level complement to the net-accounting gate
        # above: fails when a footprint IN USE declares more than one
        # physical pad under the same pad number (K1/K2/K3 today) AND a
        # production Component.get_pin( call site outside the reviewed
        # allowlist (ALLOWED_GET_PIN_CALL_SITES in the gate script) resolves
        # a pin as if (ref, pin_name) were unique -- catches the case the
        # net-accounting gate above cannot: a duplicated pad sitting inside
        # an otherwise multi-pin net never collapses that net's WHOLE
        # pin-identity view to <=1 distinct tuple. Never `continue-on-error`.
        run: uv run python scripts/check_pad_identity_ambiguity.py

      - name: Footprint-drift gate unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_footprint_drift.py -v --tb=short

      - name: Footprint-drift gate (source-corrected footprint never reached the board)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # Fail-closed: reads pcb/temper.kicad_pcb directly and cross-checks
        # every component's footprint string against the freshly compiled
        # netlist, matched by SHEETPATH (not reference designator -- refdes
        # renumbers, see docs/solutions/logic-errors/
        # fixed-positions-ref-fragility-across-renumbering.md). This is the
        # gate that would have caught (and on this repo's `main`, as of
        # this change, DOES catch) a footprint corrected in elec/src/*.ato
        # that never got propagated into the board: C6/U3 (corrected
        # per-part in .ato, board still on the old land pattern -- docs/
        # hardware/2026-07-29-open-safety-gate-actions.md) and C25/C26
        # (tank.c_tank1/c_tank2, docs/evidence/
        # 2026-07-28-tank-cap-and-isolator-footprints.md). Distinct from
        # check_copper_net_consistency.py above: that gate reads electrical
        # NET identity per pad and cannot see a pad-compatible footprint
        # substitution with different creepage/clearance geometry at all --
        # this gate compares the footprint string itself, which is what
        # REQ-SAFE-01 reinforced-creepage margin actually depends on. Never
        # `continue-on-error`, no allowlist: a footprint mismatch on a
        # mains-connected board has no legitimate "expected" case to
        # suppress -- the fix is to resync the board, not to silence this
        # gate.
        run: uv run python scripts/check_footprint_drift.py

      - name: Netlist-board reconciliation gate unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest packages/temper-placer/tests/validation/test_netlist_reconciliation.py packages/temper-placer/tests/validation/test_netlist_reconciliation_mutations.py -v --tb=short

      - name: Netlist<->board reconciliation gate (sheetpath + net membership)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # Fail-closed: compares the netlist extracted from
        # pcb/temper.kicad_pcb against the freshly compiled design netlist
        # keyed by INSTANCE PATH and NET MEMBERSHIP, not refdes -- refdes is
        # positional and reusable, so the 95% overlap check passes a
        # wholesale renumber by construction and is blind to a reused
        # designator (board C27 = tank.c_tank3 vs netlist C27 =
        # ct_sense.c_filter: one ref, two components -- docs/handoffs/
        # 2026-07-31-ci-enforcement-and-board-defects.md). Reports
        # MISSING/EXTRA/RENUMBERED/REUSE/UNKEYABLE and net-level membership
        # findings. On the current board the tank-cap class is PASS-for-
        # missing: tank.c_tank3 IS present in the board file, staged
        # off-outline (the off-board staging is owned by the R26 plan).
        # Never `continue-on-error`: a gate that cannot run exits non-zero.
        run: uv run python scripts/check_netlist_board_reconciliation.py

      - name: Netlist-mutation corpus unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_netlist_mutator.py scripts/tests/test_netlist_mutation_corpus.py -v --tb=short

      - name: Netlist-mutation corpus (identity checks bite on the mutation classes)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # Injects the R39 mutation classes -- wholesale renumbering, dropped
        # nets, reused refdes -- into a copy of the compiled design netlist
        # and proves each fails its owning identity check while the clean
        # netlist passes every check (anti-vacuity). Headline proof: the
        # renumber class PASSES preflight_identity's 95% overlap check (a
        # set-preserving permutation) while the sheetpath oracle reports
        # RENUMBERED findings -- see
        # docs/evidence/2026-08-02-netlist-renumber-proof.md. Never
        # `continue-on-error`: an uncovered class or a failing clean netlist
        # exits non-zero.
        run: uv run python scripts/check_netlist_mutation_corpus.py

      - name: Pad-orientation gate unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_pad_orientation.py -v --tb=short

      - name: Pad-orientation gate (intra-footprint copper shorts)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # Fail-closed. Catches the two mechanisms behind the 60 intra-
        # component copper shorts fixed in #412/#420/#426: a writer that
        # rotated pad positions but not pad bodies (a .kicad_pcb pad angle
        # is ABSOLUTE, unlike .kicad_mod), and library footprints whose
        # pads overlap in their own local frame. Both produced solid copper
        # between different nets inside one footprint -- a fatal defect on
        # a mains-connected board (docs/STRATEGY.md). Verified to fail on
        # the pre-fix board (c369bc72) and to pass on both the corrected
        # board and the KiCad-authored bitaxeUltra control, so it
        # discriminates rather than merely firing. Never
        # `continue-on-error`: a gate that cannot run must exit non-zero.
        run: uv run python scripts/check_pad_orientation.py pcb/temper.kicad_pcb
      - name: Design capacity budget gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_capacity_budget_gate.py -v --tb=short

      - name: Design capacity budget gate (fault-tree fan-in)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/capacity_budget_gate.py

      - name: Verify board identity gate (plan 2026-07-15-001, U7)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python3 scripts/ci_identity_check.py

      - name: Isolation-keepout gate unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_isolation_keepout.py -v --tb=short

      - name: Physical mains<->SELV isolation-barrier gate
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # Fail-closed: verifies a dedicated keepout region (not just
        # declarations/after-the-fact clearance checks) spans every copper
        # layer, is >=8.0mm wide throughout, bisects the board into HV/SELV
        # sides, and that no real copper intrudes -- pcb/temper.kicad_pcb
        # has zero keepout zones today (docs/evidence/
        # 2026-07-28-isolation-keepout.md). Never `continue-on-error`: a
        # gate that cannot run, or that finds the barrier missing, must
        # exit non-zero.
        run: uv run python scripts/check_isolation_keepout.py

      # CREEPAGE/CLEARANCE SSOT-DRIFT GATE -- ENABLED 2026-08-15.
      # (ci/unsilence-checks-batch-2, mechanism 3 of the silent-check
      # census). History: written 2026-08-08 (Task 3 of
      # docs/evidence/2026-08-08-drc-safety-rule-vacuity-audit.md), fully
      # unit-tested (44 tests), CI invocation deliberately commented out
      # pending human approval of the value families it reports. The gate
      # is a discovery-based cross-source SSOT check: every creepage/
      # clearance declaration across elec/*.ato, scripts/*.py,
      # packages/**/*.py|yaml and configs/*.yaml is found by walking the
      # source, and each (metric, tier) family with 2+ members must carry
      # exactly one value. Exit codes: 0 = clean, 3 = family mismatch
      # (VIOLATION), 5 = gate could not run (GATE ERROR).
      #
      # The exit-5 selection-alias blocker on tank_creepage.py's
      # DEFAULT_TANK_CREEPAGE_MM was fixed in #1203 (dict-lookup form),
      # and 'functional' became a real tier in _classify_tier on 2026-08-15
      # (classified last so a text that mentions functional only as context
      # for a reinforced/basic/working figure keeps the more specific
      # tier), so the enforced 10.0mm participates in its
      # [creepage/functional] family and the 6.3mm PD2 fallback is reported
      # as declared-but-not-enforced.
      #
      # The 2026-08-08 drift families were resolved or accepted on
      # 2026-08-15 via the gate's new ACCEPTED_DRIFT registry (still
      # discovered, still printed in full with justification, still
      # self-verifying closed against the reviewed value set):
      #   - [clearance/basic] 3.0 vs 6.0mm -- PERMANENT, investigated
      #     2026-07-29: two different requirements (135V ACMains pair vs
      #     mains_240v-bucket netclass figure) sharing the coarse 'basic'
      #     tier label. Accepted.
      #   - [creepage/basic] 5.0 vs 6.0mm -- same pair, same verdict. Accepted.
      #   - [creepage/reinforced] 6.0 (UNSOURCED legacy TEMPER_NET_CLASSES
      #     figures, re-sourcing deferred) vs 12.6mm (decision-documented
      #     PD3; ato + pcl sites aligned 8.0->12.6mm by the 2026-08-15
      #     changeset). 8.0mm PD2 is explicitly NOT accepted. Accepted.
      #   - [creepage/functional] 6.3 (PD2 fallback) vs 10.0mm (PD3
      #     enforced). Accepted.
      #
      # REMAINING BLOCKER -- one honest red, needs an owner value decision:
      #   [clearance/reinforced] 2.0mm (netclass HighVoltage.clearance,
      #   cited Table 16 + cl.29.1 derivation; what RULE 4/4b actually
      #   emit) vs 6.0mm (ato HV_to_LV.min_clearance + netclass
      #   HighVoltageIsolated.clearance, uncited legacy; 6.0 is in NO
      #   recovered Table 16 value set {0.5,1.5,3.0,5.5,8.0,11.0}). The
      #   correct figure for the HV<->LV barrier is not determinable from
      #   repo evidence (the DRC's own RULE 4 note flags IEC 60664-1 at
      #   400V may require 3.0mm+), so this family is deliberately NOT
      #   registered: lowering the declared 6.0 to match enforcement would
      #   weaken a declared figure, and raising enforcement needs a real
      #   determination. Once an owner decides, either update the stale
      #   6.0 sites or extend ACCEPTED_DRIFT with the decided value.
      #
      # ENABLEMENT STATUS: BOTH steps below are enabled as of 2026-08-15.
      # The [clearance/reinforced] family is role-resolved by the Rust
      # isolation authority as of 2026-08-31, without changing any underlying
      # clearance or creepage value. The gate is expected to exit 0 only while
      # all three production projections bit-match that closed mapping and the
      # required current-edition review remains visible. A return to exit 3 or
      # a GateError is a real regression -- NOT a permission to weaken or
      # re-silence this gate. Per this file's convention the gate is not
      # continue-on-error'd: a gate that can run must fail loudly.
      - name: Creepage/clearance drift gate unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_creepage_clearance_drift.py -v --tb=short

      - name: Creepage/clearance SSOT-drift gate (cross-source figure agreement)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # Expected green only through the exact Rust role mapping described
        # above. Any mismatch, missing projection, or hidden review marker
        # must fail loudly.
        run: uv run python scripts/check_creepage_clearance_drift.py

      # 2026-08-17 fact-deduplication audit (docs/evidence/2026-08-17-fact-
      # dedup-inventory-and-gate.md): scalar facts other than creepage/
      # clearance (the gate directly above) also drift across homes --
      # concretely, this board's mains voltage and pollution degree
      # (SafetySpec). Full investigation in
      # scripts/check_fact_registry_drift.py's module docstring.
      #
      # RED BY DESIGN, same convention and same job as the gate directly
      # above: mains_voltage_v/pollution_degree are unambiguously 120.0/3
      # (REQ-SYS-01, the 2026-08-15 PD2->PD3 decision -- NOT a judgment
      # call), but two of the homes are pinned-oracle-entangled
      # (tests/core/_design_rules_py_oracle.py,
      # tests/core/_specification_py_oracle.py) and a third
      # (test_specification.py::test_safety_spec_defaults) is a live
      # instance of handoff Sec 11 (a passing CI test asserting the wrong
      # value). Fixing requires one coordinated PR with a deliberate oracle
      # re-pin, which this gate must not perform by fiat. Deliberately kept
      # in this job (board-provenance-requirements-gates), not in the
      # required Cross-Source Consistency Gates job -- same reasoning as
      # the sibling gate above: this job is NOT in required_contexts, so
      # the red does not wedge every PR in the repo over an already-decided
      # value blocked only by ceremony, but it still runs on every push/PR
      # touching relevant paths and is NOT continue-on-error'd, so it fails
      # loudly and stays visible. See TestRealRegistryKnownState in
      # scripts/tests/test_check_fact_registry_drift.py for the pinned-red
      # regression proof, and this gate's own module docstring for the
      # exact coordinated fix that would un-red it.
      # 2026-08-17 (session 2): extended with 5 more fact families (via-
      # geometry defaults, per-netclass via diameter/drill, gate-drive net
      # names, gate-drive net-current citations, HV<->LV separation gate
      # threshold). See docs/evidence/2026-08-17-fact-registry-drift-gate-
      # extension.md. Exit state changed VIOLATION(3) -> TOOL ERROR(5): two
      # new facts (gate_hs/ls_net_current_rating_a) are missing citations,
      # not wrong values -- still RED BY DESIGN, same convention as above.
      - name: Fact registry drift gate unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_fact_registry_drift.py -v --tb=short

      - name: Fact registry drift gate (mains_voltage_v / pollution_degree / via-geometry / gate-drive net names / HV-LV separation threshold)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_fact_registry_drift.py

      # ---- MUTATING: writes pcb/*.kicad_sch, must stay last ----
      # Removed 2026-08-07: dead weight. The stated reason ("make netlist
      # (atopile) invokes kicad-cli in container") is stale -- commit
      # bd8bb68e (2026-07-23, "Schematics check: add --no-oracle flag for
      # container") already added `--no-oracle` specifically to avoid the
      # kicad-cli dependency (oracle_verify() is the only caller of
      # _export_netlist(), which is what shells out to `kicad-cli sch
      # export netlist` -- --no-oracle skips it entirely). Verified
      # 2026-08-07 by running the exact two commands locally with NO
      # kicad-cli on PATH: `make netlist` then `uv run python3
      # scripts/gen_schematics.py --check --no-oracle` -> "CHECK PASS: all
      # schematics match netlist", then `git diff --exit-code
      # pcb/*.kicad_sch` -> exit 0. The mask outlived the fix it was
      # waiting for.
      - name: Regenerate schematics and check drift
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          uv run python3 scripts/gen_schematics.py --check --no-oracle
          git diff --exit-code pcb/*.kicad_sch


      - name: Board-defect corpus unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: >
          uv run pytest scripts/tests/test_board_defect_mutator.py
          scripts/tests/test_check_board_defect_corpus.py
          scripts/tests/test_check_board_containment.py -v --tb=short

      - name: Board containment (R26 invariant)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # Fail-closed. Every footprint's pad copper must lie inside the
        # Edge.Cuts outline. This is the owning gate of the board-defect
        # corpus's off-board class, and the only gate that can see that
        # class at all: when a component leaves the board its copper stops
        # colliding with the layout, so DRC counts FALL (measured -9 on
        # this board) and every count-delta assertion is blind to it. See
        # docs/evidence/2026-08-04-board-defect-corpus-uncovered-classes.md.
        # Never `continue-on-error`: exit 2 means the gate could not run.
        run: uv run python scripts/check_board_containment.py

      - name: Board-defect mutation corpus (R38)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # Fail-closed. Plan 2026-08-02-024: for each of the three real
        # defect classes (component off-board, pad short, creepage
        # crossing) the corpus re-derives a mutated copy of the committed
        # pcb/temper.kicad_pcb -- which is never modified, so the DRC
        # ceiling re-measurement convention stays inert -- and asserts the
        # mutated board fails its owning gate (count-delta vs the clean
        # board and the recorded drc_ceiling.json ceilings), while the
        # unmutated board passes the corpus's clean-board control (scoped
        # to the DRC gate categories that are green on the clean board;
        # the REQ-SAFE-01 creepage gate is red on main today and is
        # asserted per-class instead -- see scripts/board_defect_corpus.yaml
        # classes.creepage.baseline_note). Never `continue-on-error`: a
        # gate that cannot run must exit non-zero (exit 2 GATE ERROR
        # without kicad-cli or the compiled netlist).
        run: uv run python scripts/check_board_defect_corpus.py

      - name: Gate-mutation sweep (R42 canary-flip oracle)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # docs/plans/2026-08-02-035-feat-gate-mutation-testing-plan.md. For
        # every (gate, mutation, canary) triple in ci-corpus/mutations.yaml,
        # weakens a fail-closed gate's own committed source (scratch tempfile
        # only -- scripts/gate_mutate.py never touches the checked-out file)
        # and asserts the gate's canary notices: KILLED, or SURVIVED (a real
        # blind spot -- see scripts/check_gate_mutations.py's own docstring).
        # This job already builds/installs everything this sweep needs
        # (temper_placer -> temper_drc_rs) and already runs six of the seven
        # targeted gates individually above, so no extra setup is required.
        # Never `continue-on-error`, matching this file's convention and this
        # gate's own exit-code contract (0 only when every triple is KILLED
        # or a declared EQUIVALENT; any SURVIVED, UNVERIFIED, or NOT_APPLICABLE
        # fails closed). First wired 2026-08-11 at 19/19 KILLED (mutation
        # score 1.0000) -- see docs/evidence/2026-08-11-phase3-mutation-state-of-play.md,
        # which also records a real regression found and fixed the same
        # session: the trailer-check mutation had silently gone SURVIVED
        # between 2026-08-07 and 2026-08-11 because a later, unrelated
        # hardening of DrcRatchet.validate_raise_evidence (real git-commit
        # resolvability, not just SHA shape) made this gate's own canary
        # fixture's placeholder commit hash unresolvable, masking the
        # trailer-check mutant behind a different, unrelated failure --
        # fixed in the canary fixture, not the gate.
        run: uv run python scripts/check_gate_mutations.py

  # Split out of Core Tests 2026-07-28. Gates that compare two representations
  # of the same fact and fail on drift: generated code vs its manifest, a
  # derived doc vs its source doc, firmware constants vs elec/src/main.ato,
  # BOM/MPN vs the .ato sources, net-name classifiers vs
  # elec/domain_manifest.yaml. Each `*-gate tests` step is the unit-test suite
  # for the gate immediately below it and stays adjacent to it.
  consistency-gates:
    name: Cross-Source Consistency Gates
    needs: [changes]
    if: ${{ github.event_name == 'push' || needs.changes.outputs.consistency-gates == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bennetleff/temper-ci:latest
      options: --user root
    timeout-minutes: 20
    env:
      VIRTUAL_ENV: /_temper-venv
      UV_PROJECT_ENVIRONMENT: /_temper-venv
      TEMPER_REQUIRE_RUST_DRC: "1"
    steps:
      - uses: actions/checkout@v7

      # Container runs as root; workspace is owned by the runner user. Without
      # this, every `git` call in a later `run:` step exits 128 on "dubious
      # ownership" rather than doing its job.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Install maturin
        run: uv pip install maturin

      - name: Build and install Rust crate
        run: uv run maturin develop --release --manifest-path packages/temper-rust-router/Cargo.toml

      - name: Verify Rust module loads
        run: uv run python3 -c "import temper_rust_router; print('temper_rust_router loaded OK')"
        env:
          RUST_BACKTRACE: full

      - name: Build and install temper-drc-rs
        run: uv run maturin develop --release --manifest-path packages/temper-drc-rs/Cargo.toml

      - name: Verify temper-drc-rs loads
        run: uv run python3 -c "import temper_drc_rs; print('temper_drc_rs loaded OK')"
        env:
          RUST_BACKTRACE: full

      - name: Build and install temper-constraints
        run: >
          uv run maturin develop --release
          --manifest-path packages/temper-placer/temper-constraints/Cargo.toml
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

      - name: Verify temper-constraints loads
        run: uv run python3 -c "import temper_constraints; print('temper_constraints loaded OK, version', temper_constraints.version_py())"
        env:
          RUST_BACKTRACE: full

      # `uv sync` defaults to an *exact* sync: anything installed in the venv
      # that is not part of this invocation's resolved target set gets
      # uninstalled as "extraneous". `--no-install-package X` excludes X from
      # that target set -- it does NOT mean "leave X alone". Without
      # `--inexact`, the three flags below were therefore silently
      # UNINSTALLING the release wheels that "Build and install ..." just
      # built and "Verify ... loads" just confirmed importable, minutes
      # earlier in this same job. Reproduced locally: `uv sync --all-packages
      # --no-install-package temper-rust-router ...` (no --inexact) prints
      # "Uninstalled 2 packages" and `- temper-rust-router==0.1.0` in its
      # diff, and a subsequent bare import fails with ModuleNotFoundError.
      # `--inexact` disables the extraneous-package removal, so these three
      # packages are truly left untouched (mtimes unchanged, no rebuild)
      # instead of evicted -- confirmed locally: with --inexact added, the
      # same command reports "Audited N packages" (no install/uninstall) and
      # the modules remain importable afterward.
      - name: Install dependencies
        run: >
          uv sync --all-packages --inexact
          --no-install-package temper-rust-router
          --no-install-package temper-drc-rs
          --no-install-package temper-constraints

      - name: Cache netlist
        id: cache-netlist
        uses: actions/cache@v6
        with:
          path: elec/build
          key: netlist-${{ hashFiles('elec/src/**', 'elec/ato.yaml', 'Makefile') }}

      - name: Build electronics netlist
        if: steps.cache-netlist.outputs.cache-hit != 'true'
        run: make netlist

      # ---- SETUP / GATE BOUNDARY -------------------------------------------
      # Everything ABOVE is setup and stays fail-fast: it has no `if:`, so if
      # any of it fails (maturin, uv sync, make netlist) this step never runs,
      # `steps.setup.outcome` is not `success`, and every gate below is SKIPPED
      # rather than run against a half-built environment and reported as a gate
      # verdict. Everything BELOW is a gate: each carries
      # `if: !cancelled() && steps.setup.outcome == 'success'` so a red gate no
      # longer deletes the verdict of the gates behind it. None of them is
      # `continue-on-error`, so the job still concludes `failure` if any fails.
      - name: Setup barrier -- environment ready
        id: setup
        run: echo "setup complete; gates below report independently"

      # --- Correspondence gates (docs/evidence/2026-08-11-correspondence-gates.md) ---
      # Three gates for the same failure shape: an artifact declares something
      # and nothing verifies the rest of the system honours the declaration.
      # All three are advisory (continue-on-error) today because their real
      # motivating inputs on origin/main currently violate them -- see the
      # evidence doc for the exact, named path to blocking for each. The
      # gate scripts themselves are NOT softened: each computes and prints a
      # real violation/clean verdict and a real exit code; only this CI
      # step's `continue-on-error` prevents that verdict from failing the
      # build while the underlying config/source defects remain unfixed.

      - name: PCL config <-> board correspondence gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_pcl_config_board_correspondence.py -v --tb=short

      - name: PCL config <-> board correspondence gate (Gate 1)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # ADVISORY: packages/temper-placer/configs/constraints/temper_induction_cooker.yaml
        # is still broken on origin/main (PR #1026 landed the loader fix, not
        # the config -- 5 component references with no safe mechanical
        # resolution, 3 zones outside the real board outline). Path to
        # blocking: fix the config (drop/re-target J_AC_IN/J_COIL/J_DEBUG/
        # Q1/Q2 references, resize the zones to the real 152x234mm board),
        # confirm this step goes clean, then remove continue-on-error.
        continue-on-error: true
        run: uv run python scripts/check_pcl_config_board_correspondence.py

      - name: PCL config <-> board correspondence gate (Gate 1, thermal_management.yaml)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # ADVISORY, same shape as Gate 1 above, same gate script, different
        # config: packages/temper-placer/configs/constraints/thermal_management.yaml
        # -- this board's IGBT-to-RTD/MCU thermal-clearance declarations --
        # was NEVER checked by this gate at all before this step existed (the
        # gate script required a non-empty `zones:` list to even run, and
        # this config, being component-only, has none -- it errored out
        # before Property 1 ever ran). See
        # docs/evidence/2026-08-12-thermal-emi-declaration-drift.md for the
        # before/after: 21 of 21 checkable references were broken (13/13
        # constraints affected) before packages/temper-placer/configs/
        # temper_constraints.references.yaml was extended with this config's
        # own spelling of already-known aliases (U_RTD, TH_HEATSINK,
        # R_GATE_HIGH, R_GATE_LOW, C_VCC2); 14 remain broken -- all with a
        # documented reason, none "unrecognized". Path to blocking: same
        # Q1/Q2 identity question as Gate 1 above (this config uses the same
        # two names for the same wrong components), plus a hardware-owner
        # decision on R_SNUB/C_SNUB (real components exist but are the wrong
        # circuit -- a relay-contact snubber, not an IGBT switching snubber)
        # and C_VCC1 (no real counterpart exists in this half-bridge
        # topology). Confirm this step goes clean, then remove
        # continue-on-error.
        continue-on-error: true
        run: >-
          uv run python scripts/check_pcl_config_board_correspondence.py
          --config packages/temper-placer/configs/constraints/thermal_management.yaml

      - name: Declared <-> emitted layer gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_layer_plane_emission_coverage.py -v --tb=short

      - name: Declared <-> emitted layer gate (Gate 2)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # ADVISORY: both underlying bugs are still live on origin/main --
        # parse_engine.rs's raw_board_from_tree discards the layer-role
        # token (index 2), and router_v6/_zone_pour_stitch.py's
        # _zone_layers_for_net can only ever emit ["F.Cu", "B.Cu"]. Path to
        # blocking: capture the role token in RawBoard (parse_engine.rs),
        # and give _zone_layers_for_net a real per-net-class layer
        # resolution that can reach In1.Cu/In2.Cu (or wire
        # router_v6/power_plane.py's already-correct plane geometry into
        # route_pcb's emitted content instead of only _pipeline_verify.py's
        # report), then remove continue-on-error.
        continue-on-error: true
        run: uv run python scripts/check_layer_plane_emission_coverage.py

      - name: Net-class map <-> board correspondence gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_netclass_map_board_correspondence.py -v --tb=short

      - name: Net-class map <-> board correspondence gate (Gate 3)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # BLOCKING as of fix/netclass-config-keys: all 31 originally-broken
        # keys across the four hand-maintained net_classes: YAML maps
        # (configs/temper_deterministic_config.yaml,
        # configs/temper_production_config.yaml,
        # packages/temper-placer/configs/temper_constraints.yaml,
        # packages/temper-placer/configs/gate_driver_constraints.yaml) were
        # reconciled: safe renames (case mismatches, documented stale
        # names) were applied, and keys naming a net that genuinely does
        # not exist on the board (PE, CGND, VCC_BOOT, PGND, +5V,
        # TEMP_SENSE, SPI_CLK/SPI_MOSI/SPI_MISO/SPI_CS_TEMP) were deleted
        # rather than mapped onto a guess -- see the reconciliation
        # evidence doc and each file's own net_classes: comments.
        # continue-on-error removed: a future PR that reintroduces drift
        # here must now fail closed like every other clean gate.
        run: uv run python scripts/check_netclass_map_board_correspondence.py

      # --- PD2 compartment-evidence gate (docs/evidence/2026-08-11-pd2-decision-record.md) ---
      # A fourth gate for the same declaration/reality-drift shape as Gates
      # 1-3 above, but for a mechanical rather than electrical claim: the
      # PD2 classification (IEC 60335-2-6 cl. 29.2 Addition) is conditional
      # on a sealed, gasketed PCB compartment (docs/evidence/
      # 2026-08-01-pd2-enclosure-legitimacy.md). As of the 2026-08-15
      # data-driven decision (docs/evidence/2026-08-15-pd2-pd3-data-driven-
      # decision.md), every electrical enforcement point in the tree
      # (generate_kicad_dru.py, the REQ-SAFE-01 validator,
      # MIN_BARRIER_WIDTH_MM, ...) is aligned at the PD3 figure, 12.6mm --
      # this gate checks the one thing nothing else checks: that the tree
      # never claims PD2 without the compartment that earns it. Under PD3
      # it reports NOT_APPLICABLE (pass by design).

      - name: PD2 compartment-evidence gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_pd2_compartment_evidence.py -v --tb=short

      - name: PD2 compartment-evidence gate (Gate 4)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # BLOCKING as of fix/enforce-pd3-creepage: the 2026-08-15 data-driven
        # decision (docs/evidence/2026-08-15-pd2-pd3-data-driven-decision.md)
        # enforces PD3 (12.6mm reinforced) as the governing bar, so this gate
        # reports NOT_APPLICABLE (exit 0) -- the compartment prerequisite is
        # moot while PD3 governs, and the gate's entire purpose (prevent the
        # tree from claiming PD2 without the compartment) is discharged by the
        # enforcement flip. continue-on-error removed: a future PR that flips
        # HV_CREEPAGE_ENFORCED_MM back to PD2 without committing
        # docs/specs/pd2_compartment_evidence.yaml must now fail closed.
        run: uv run python scripts/check_pd2_compartment_evidence.py

      # --- Corpus fixture <-> real-board divergence gate (docs/evidence/
      # 2026-08-11-golden-fixture-regeneration-decision.md) ---
      # A fifth gate for the same declaration/reality-drift shape as Gates
      # 1-4: power_pcb_dataset/corpus/temper/temper.kicad_pcb (33
      # components, frozen 2026-07-11) was mislabeled "the real golden-
      # board corpus" by a CP-SAT evidence harness while pcb/temper.kicad_pcb
      # (the real board) grew to 169 components -- undetected for 27 days.
      # Every manifest board that names a real_board_path must now commit,
      # in writing, to whether it tracks that board (role: real-board-
      # snapshot, checked and BLOCKING on drift) or is deliberately
      # independent of it (role: independent-fixture, divergence reported
      # for information only). `temper` is independent-fixture as of
      # 2026-08-11 (CP-SAT cannot decide feasibility on the real board
      # within the consuming tests' 30s budget -- see the decision doc's
      # solve-time measurement), so this step is clean, not advisory, on
      # origin/main today.

      - name: Corpus fixture <-> real-board divergence gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_corpus_fixture_realboard_divergence.py -v --tb=short

      - name: Corpus fixture <-> real-board divergence gate (Gate 5)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_corpus_fixture_realboard_divergence.py

      # --- Net-class parameter correspondence gate (docs/evidence/
      # 2026-08-12-gate-vacuity-structural-prevention.md) ---
      # A sixth gate for the same declaration/reality-drift shape as Gates
      # 1-5, on the pair Gate 3's own docstring explicitly disclaims
      # touching: pcb/temper.kicad_pro's net_settings.classes[].clearance/
      # track_width/via_diameter/via_drill vs. design_rules.py's
      # TEMPER_NET_CLASSES. PR #1023 and PR #1025 both titled themselves as
      # syncing kicad_pro against design_rules.py, and scripts/
      # sync_kicad_netclass_assignments.py's own manifest.yaml entry claims
      # "the CI tripwire against future drift" -- but every one of those,
      # by diff and by source, only ever compares/writes
      # netclass_assignments (which NET maps to which CLASS). Nothing
      # before this gate ever compared a CLASS's own parameter values
      # between the two tables. This gate does.

      - name: Net-class parameter correspondence gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_netclass_class_param_correspondence.py -v --tb=short

      - name: Net-class parameter correspondence gate (Gate 6)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # BLOCKING as of 2026-08-12 (docs/evidence/
        # 2026-08-12-netclass-param-reconciliation.md): all 5 field
        # mismatches (HighVoltage.clearance, plus Power.clearance/
        # trace_width/via_diameter/via_drill) reconciled by correcting
        # design_rules.py's TEMPER_NET_CLASSES to match pcb/temper.kicad_pro
        # in every case -- grounded in elec/src/constraints.ato (the
        # project's original SSOT), docs/specs/NET_CLASS_SPECIFICATION.md,
        # and HV_INTERNAL_CLEARANCE_MM's cited IEC 60335-1 derivation
        # (scripts/generate_kicad_dru.py:63). Measured: kicad-cli DRC
        # clearance/track_width counts are unchanged (386/199 before and
        # after) -- neither correction touched a value kicad-cli's DRC
        # actually derives a rule from. See the evidence doc for the one
        # item this PR does NOT close (whether 2.0mm is itself IEC-adequate
        # for the same-domain, no-creepage-backstop HighVoltage-to-
        # HighVoltage case -- a value question, not a correspondence one,
        # so it does not block this gate).
        run: uv run python scripts/check_netclass_class_param_correspondence.py


      # --- Stackup <-> trace-width-derivation copper-weight gate (docs/evidence/
      # 2026-08-13-jlcpcb-fab-capability-envelope.md) ---
      # A seventh gate for the same declaration/reality-drift shape as Gates
      # 1-6: pcb/temper.kicad_pcb declared NO stackup at all before
      # 2026-08-13 -- no copper-weight instruction reached the artifact a
      # fabricator actually receives, even though every IPC-2221B
      # current-capacity derivation in docs/hardware/TRACE_WIDTH_CALCULATIONS.md
      # (coil pad sizing, HighVoltage/GateDrive/Power/ACMains net-class
      # widths, the 5V internal-plane width) assumes 2oz outer / 1oz inner
      # copper. A (setup (stackup ...)) block was added declaring exactly
      # that (2oz F.Cu/B.Cu, 1oz In1.Cu/In2.Cu) in the same change that also
      # corrected a genuine doc-vs-doc (and, in PCB_SPECIFICATION.md's case,
      # doc-vs-itself) disagreement about whether B.Cu was 1oz or 2oz --
      # GROUNDING_EMI_STRATEGY.md and POWER_PLANE_DESIGN.md both said 1oz,
      # contradicting TRACE_WIDTH_CALCULATIONS.md's uniform 2oz-outer
      # assumption (which the GateDrive class -- routed on B.Cu -- was
      # already sized against) and JLCPCB's real order form, where "outer
      # copper weight" is one stackup-wide setting covering both outer
      # layers, not a per-side choice. BLOCKING from introduction: this gate
      # is clean against the real repo the moment it lands (both inputs were
      # corrected in the same PR), so there is no reason to land it advisory.

      - name: Stackup copper-weight gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_stackup_copper_weight_gate.py -v --tb=short

      - name: Stackup copper-weight gate (Gate 7)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_stackup_copper_weight_gate.py

      # --- Layer-architecture utilisation gate (docs/evidence/
      # 2026-08-13-layer-architecture-decision.md) ---
      # An eighth gate for the same declaration/reality-drift shape as Gates
      # 1-7: nothing before this connected "the board declares N signal
      # layers" to "the netlist demands M mm^2 of routing channel", so a
      # hard infeasibility bound (utilization 1.31, PROVEN by
      # resource_bound.py's own bin-packing lower bound) went unmeasured
      # until a real router run came back with 40/139 nets carrying zero
      # legal path (docs/evidence/2026-08-13-router-diagnosis-40-nopath-nets.md).
      # This gate computes the same utilisation live, in under a second,
      # before any router runs. BLOCKING from introduction: the real
      # board's 6-layer declaration (landed in the same PR) passes at 0.657.
      - name: Layer utilisation gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_layer_utilization_gate.py -v --tb=short

      - name: Layer utilisation gate (Gate 8)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_layer_utilization_gate.py



      # --- CI-survey advisory/blocking drift gate (2026-08-13 inert-code
      # audit) --- gate_input_registry._CI_SCRIPT_SURVEY bills itself as the
      # single source of truth for this file's gate wiring, and its
      # "advisory (continue-on-error)" / "BLOCKING" reason text is a
      # falsifiable claim about the step below (and every other correspondence
      # gate's step) that nothing checked. It already drifted once: the
      # entry above (Net-class parameter correspondence gate) still read
      # "advisory ... currently VIOLATION" after this exact step went
      # BLOCKING on 2026-08-12. BLOCKING from the start: it is source/prose
      # scanning only, needs no built board, and is green on introduction.

      - name: CI-survey advisory/blocking drift gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_ci_survey_advisory_drift.py -v --tb=short

      - name: CI-survey advisory/blocking drift gate
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/check_ci_survey_advisory_drift.py

      - name: Router clearance floor gate tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest scripts/tests/test_check_router_clearance_floor.py -v --tb=short

      - name: Router-vs-DRC clearance floor gate
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # BLOCKING from the start, deliberately: this gate is green on the
        # tree that introduces it, so it can only ever fail on a
