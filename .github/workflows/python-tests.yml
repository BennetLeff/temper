name: Python Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'elec/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/python-tests.yml'
      - 'deadcode-baseline.py'
      - 'scripts/vulture_gate.py'
      - 'scripts/trace_invocations.py'
      - 'scripts/check_manifest_gate.py'
      - 'scripts/check_script_sunset.py'
      - 'scripts/manifest.yaml'
      - 'scripts/invocation_graph.json'
      - 'pcb/*.kicad_sch'
      - 'scripts/gen_schematics.py'
      - 'elec/build/default.net'
      - '.importlinter'
      - 'import-linter-baseline.yaml'
      - 'import-linter-allowlist.yaml'
      - 'scripts/import_linter_gate.py'
      - '.physics-provenance-allowlist'
      - 'scripts/check_physics_provenance.py'
      - 'docs/plans/**'
      - 'docs/traceability-registry.yaml'
      - '**/TRACEABILITY'
      - 'power_pcb_dataset/timing_baselines.yaml'
      - 'power_pcb_dataset/golden_manifest.yaml'
      - 'scripts/gen_domain_models.py'
      - 'scripts/templates/netclass_rules.py.j2'
      - 'scripts/templates/netclass_rules.rs.j2'
      - 'packages/temper-placer/configs/netclass_rules_manifest.yaml'
      - 'packages/temper-placer/src/temper_placer/core/netclass_rules_gen.py'
      - 'packages/temper-drc-rs/src/board.rs'
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'elec/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/python-tests.yml'
      - 'deadcode-baseline.py'
      - 'scripts/vulture_gate.py'
      - 'scripts/trace_invocations.py'
      - 'scripts/check_manifest_gate.py'
      - 'scripts/check_script_sunset.py'
      - 'scripts/manifest.yaml'
      - 'scripts/invocation_graph.json'
      - 'pcb/*.kicad_sch'
      - 'scripts/gen_schematics.py'
      - 'elec/build/default.net'
      - '.importlinter'
      - 'import-linter-baseline.yaml'
      - 'import-linter-allowlist.yaml'
      - 'scripts/import_linter_gate.py'
      - '.physics-provenance-allowlist'
      - 'scripts/check_physics_provenance.py'
      - 'docs/plans/**'
      - 'docs/traceability-registry.yaml'
      - '**/TRACEABILITY'
      - 'power_pcb_dataset/timing_baselines.yaml'
      - 'power_pcb_dataset/golden_manifest.yaml'
      - 'scripts/gen_domain_models.py'
      - 'scripts/templates/netclass_rules.py.j2'
      - 'scripts/templates/netclass_rules.rs.j2'
      - 'packages/temper-placer/configs/netclass_rules_manifest.yaml'
      - 'packages/temper-placer/src/temper_placer/core/netclass_rules_gen.py'
      - 'packages/temper-drc-rs/src/board.rs'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # nightly at 3am UTC

jobs:
  test:
    name: Core Tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bennetleff/temper-ci:latest
      options: --user root
    timeout-minutes: 15
    env:
      XLA_PYTHON_CLIENT_MEM_FRACTION: 0.35
      JAX_PLATFORM_NAME: cpu
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
      
      - name: Cache virtualenv
        uses: actions/cache@v4
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: Create virtualenv (cache miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: uv venv

      - name: Install maturin
        run: uv pip install maturin

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: packages/temper-rust-router/target
          key: ${{ runner.os }}-rust-router-${{ hashFiles('packages/temper-rust-router/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-router-

      - name: Build and install Rust crate
        run: cd packages/temper-rust-router && uv run maturin develop --release && cd ../..

      - name: Verify Rust module loads
        run: uv run python3 -c "import temper_rust_router; print('temper_rust_router loaded OK')"
        env:
          RUST_BACKTRACE: full

      - name: Cache Rust build (temper-drc-rs)
        uses: actions/cache@v4
        with:
          path: packages/temper-drc-rs/target
          key: ${{ runner.os }}-drc-rs-${{ hashFiles('packages/temper-drc-rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-drc-rs-

      - name: Build and install temper-drc-rs
        run: cd packages/temper-drc-rs && uv run maturin develop --release && cd ../..

      - name: Verify temper-drc-rs loads
        run: uv run python3 -c "import temper_drc_rs; print('temper_drc_rs loaded OK')"
        env:
          RUST_BACKTRACE: full

      - name: Cache Rust build (temper-constraints)
        uses: actions/cache@v4
        with:
          path: packages/temper-placer/temper-constraints/target
          key: ${{ runner.os }}-temper-constraints-${{ hashFiles('packages/temper-placer/temper-constraints/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-temper-constraints-

      - name: Build and install temper-constraints
        run: >
          uv run
          --directory packages/temper-placer/temper-constraints
          maturin develop --release
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

      - name: Verify temper-constraints loads
        run: uv run python3 -c "import temper_constraints; print('temper_constraints loaded OK, version', temper_constraints.version_py())"
        env:
          RUST_BACKTRACE: full

      - name: Cache Rust build (temper-constraint-compiler)
        uses: actions/cache@v4
        with:
          path: packages/temper-constraint-compiler/target
          key: ${{ runner.os }}-constraint-compiler-${{ hashFiles('packages/temper-constraint-compiler/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-constraint-compiler-

      - name: Check temper-constraint-compiler compiles
        run: cargo check --manifest-path packages/temper-constraint-compiler/Cargo.toml

      - name: Install dependencies
        run: >
          uv sync --all-packages
          --no-install-package temper-rust-router
          --no-install-package temper-drc-rs
          --no-install-package temper-constraints

      - name: Cache netlist
        uses: actions/cache@v4
        with:
          path: elec/build
          key: netlist-${{ hashFiles('elec/src/**') }}

      - name: Build electronics netlist
        run: make netlist

      - name: Run electronics validation tests
        run: uv run pytest elec/validation/ -v --tb=short

      - name: Run temper-constraints integration tests
        working-directory: packages/temper-placer
        run: uv run pytest tests/rust_integration/ -v --tb=short -p no:cacheprovider -m "not benchmark"
        env:
          RUST_BACKTRACE: full

      - name: Run temper-placer tests (core only for CI speed)
        working-directory: packages/temper-placer
        run: uv run pytest tests/core/ -v --tb=short -p no:cacheprovider --maxfail=10 --cov=temper_placer --cov-report=json --cov-report=term --cov-config=../../pyproject.toml
        env:
          XLA_PYTHON_CLIENT_MEM_FRACTION: 0.25
          JAX_PLATFORM_NAME: cpu
          RUST_BACKTRACE: full
          PYTHONFAULTHANDLER: 1

      - name: Coverage gate (temper-placer)
        working-directory: packages/temper-placer
        run: >
          uv run python ../../scripts/check_coverage_gate.py
          --coverage-json coverage.json
          --allowlist ../../.coverage-allowlist
          || echo "::warning title=Coverage Gate::Phase 1 paydown prerequisite not yet met; gate is warn-only."
        continue-on-error: true

  checks:
    name: Extended Tests & Gates
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bennetleff/temper-ci:latest
      options: --user root
    timeout-minutes: 15
    env:
      XLA_PYTHON_CLIENT_MEM_FRACTION: 0.35
      JAX_PLATFORM_NAME: cpu
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
      
      - name: Cache virtualenv
        uses: actions/cache@v4
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: Create virtualenv (cache miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: uv venv

      - name: Install maturin
        run: uv pip install maturin

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: packages/temper-rust-router/target
          key: ${{ runner.os }}-rust-router-${{ hashFiles('packages/temper-rust-router/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-router-

      - name: Build and install Rust crate
        run: cd packages/temper-rust-router && uv run maturin develop --release && cd ../..

      - name: Cache Rust build (temper-drc-rs)
        uses: actions/cache@v4
        with:
          path: packages/temper-drc-rs/target
          key: ${{ runner.os }}-drc-rs-${{ hashFiles('packages/temper-drc-rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-drc-rs-

      - name: Build and install temper-drc-rs
        run: cd packages/temper-drc-rs && uv run maturin develop --release && cd ../..

      - name: Verify temper-drc-rs loads
        run: uv run python3 -c "import temper_drc_rs; print('temper_drc_rs loaded OK')"
        env:
          RUST_BACKTRACE: full

      - name: Cache Rust build (temper-constraints)
        uses: actions/cache@v4
        with:
          path: packages/temper-placer/temper-constraints/target
          key: ${{ runner.os }}-temper-constraints-${{ hashFiles('packages/temper-placer/temper-constraints/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-temper-constraints-

      - name: Build and install temper-constraints
        run: >
          uv run
          --directory packages/temper-placer/temper-constraints
          maturin develop --release
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

      - name: Verify temper-constraints loads
        run: uv run python3 -c "import temper_constraints; print('temper_constraints loaded OK, version', temper_constraints.version_py())"

      - name: Cache Rust build (temper-constraint-compiler)
        uses: actions/cache@v4
        with:
          path: packages/temper-constraint-compiler/target
          key: ${{ runner.os }}-constraint-compiler-${{ hashFiles('packages/temper-constraint-compiler/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-constraint-compiler-

      - name: Check temper-constraint-compiler compiles
        run: cargo check --manifest-path packages/temper-constraint-compiler/Cargo.toml

      - name: Install dependencies
        run: >
          uv sync --all-packages
          --no-install-package temper-rust-router
          --no-install-package temper-drc-rs
          --no-install-package temper-constraints

      - name: Check domain model codegen drift
        run: python3 scripts/gen_domain_models.py --check

      - name: Cache Rust build (temper-design-bundle)
        uses: actions/cache@v4
        with:
          path: packages/temper-design-bundle/target
          key: ${{ runner.os }}-design-bundle-${{ hashFiles('packages/temper-design-bundle/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-design-bundle-

      - name: Run tests and install KiCad in parallel
        run: |
          set +e
          # Start KiCad install in background (slowest step, ~33s)
          (sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases && \
           sudo apt-get update && \
           sudo apt-get install -y --no-install-recommends kicad) > /tmp/kicad-install.log 2>&1 &
          KICAD_PID=$!

          # Run test suites in parallel
          (cd packages/temper-placer && \
           uv run pytest tests/rust_integration/ -v --tb=short -p no:cacheprovider -m "not benchmark") &
          RUST_PID=$!

          (cargo test --manifest-path packages/temper-design-bundle/Cargo.toml && \
           uv run python3 -c "import temper_design_bundle_python; print('temper_design_bundle_python loaded OK')") &
          BUNDLE_PID=$!

          (cd packages/temper-placer && \
           export XLA_PYTHON_CLIENT_MEM_FRACTION=0.15 JAX_PLATFORM_NAME=cpu && \
           uv run pytest tests/router_v6/ tests/io/ tests/deterministic/ tests/losses/ \
             tests/physics/ tests/fields/ tests/validation/ tests/placer/cp_sat/ \
             -v --tb=short -p no:cacheprovider --maxfail=10 -m "not slow") &
          INVARIANT_PID=$!

          (cd packages/temper-placer && \
           export XLA_PYTHON_CLIENT_MEM_FRACTION=0.15 JAX_PLATFORM_NAME=cpu && \
           uv run pytest tests/placer/cp_sat/ tests/metrics/test_external_oracle.py \
             tests/cli/test_cp_sat_flag.py -v --tb=short -p no:cacheprovider --maxfail=10) &
          CPSAT_PID=$!

          (cd packages/temper-workflow && uv run pytest tests/ -v --tb=short) &
          WORKFLOW_PID=$!

          (uv run python tools/check_kicad_layers.py && \
           cd packages/temper-placer && \
           uv run pytest tests/io/test_4layer_output_properties.py -v --tb=short && \
           python3 firmware/test/gen_transition_table.py --generate && \
           git diff --exit-code firmware/test/test_transition_table_generated.c) &
          CHECKS_PID=$!

          # Wait for all background processes
          FAIL=0
          for pid in $KICAD_PID $RUST_PID $BUNDLE_PID $INVARIANT_PID $CPSAT_PID $WORKFLOW_PID $CHECKS_PID; do
            wait $pid || FAIL=1
          done
          exit $FAIL
        env:
          XLA_PYTHON_CLIENT_MEM_FRACTION: 0.15
          JAX_PLATFORM_NAME: cpu
        continue-on-error: true

      - name: Cache netlist
        uses: actions/cache@v4
        with:
          path: elec/build
          key: netlist-${{ hashFiles('elec/src/**') }}

      - name: Build electronics netlist
        run: make netlist

      - name: Regenerate schematics and check drift
        run: |
          python3 scripts/gen_schematics.py --check
          git diff --exit-code pcb/*.kicad_sch

      - name: Verify config reference doc is up-to-date (plan 2026-07-22-005, U7)
        run: |
          uv run python packages/temper-placer/scripts/gen_config_reference.py --check

      - name: Verify board identity gate (plan 2026-07-15-001, U7)
        run: uv run python3 scripts/ci_identity_check.py

      - name: Lint with ruff
        run: uv run ruff check packages/

      - name: Vulture dead-code gate
        run: uv run python scripts/vulture_gate.py

      - name: Script manifest gate
        run: uv run python scripts/check_manifest_gate.py

      - name: Script sunset check (warnings only)
        run: uv run python scripts/check_script_sunset.py
        continue-on-error: true  # sunset is informational, not blocking

      - name: Root artifact hygiene check
        run: uv run pytest scripts/test_root_hygiene.py -v --tb=short
        continue-on-error: true

      - name: Physics parameter provenance gate
        working-directory: packages/temper-placer
        run: |
          uv run python ../../scripts/check_physics_provenance.py --allowlist ../../.physics-provenance-allowlist --physics-dir src/temper_placer/physics/
          uv run python ../../scripts/check_physics_provenance.py --check-shrink --allowlist ../../.physics-provenance-allowlist --physics-dir src/temper_placer/physics/

      - name: Import boundary enforcement
        run: uv run python scripts/import_linter_gate.py

        continue-on-error: true
        env:
          XLA_PYTHON_CLIENT_MEM_FRACTION: 0.15
          JAX_PLATFORM_NAME: cpu

      - name: Rebuild script invocation graph
        run: uv run python scripts/trace_invocations.py

  closure:
    name: Pipeline Closure Test (Truth-Gated)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Cache virtualenv
        uses: actions/cache@v4
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: Create virtualenv (cache miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: uv venv

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Cache netlist
        uses: actions/cache@v4
        with:
          path: elec/build
          key: netlist-${{ hashFiles('elec/src/**') }}

      - name: Build electronics netlist
        run: make netlist

      - name: Run closure test (truth-gated)
        run: >
          uv run python3 scripts/ci_closure_test.py
          --pcb pcb/temper.kicad_pcb
          --output closure-result.json
        continue-on-error: true  # observability merge race; temper-N6-U8

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: closure-result
          path: closure-result.json

  regression:
    name: Performance & Quality Regression
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
      
      - name: Set up Python
        run: uv python install 3.12

      - name: Cache virtualenv
        uses: actions/cache@v4
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: Create virtualenv (cache miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: uv venv

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run regression check (temper board only)
        run: make regression REGRESSION_BOARD=temper
        continue-on-error: true  # JAX placer is nondeterministic on CI runners; temper-N6-U8
        env:
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
       
      - name: Run performance regression check
        run: make perf-regression
        continue-on-error: true  # CI runner variance vs local baseline calibration; temper-N6-U8
        env:
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}

  loc-cap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with: { version: "latest", enable-cache: true }
      - name: Set up Python
        run: uv python install 3.12
      - name: LOC cap gate
        run: uv run python tools/loc_cap_check.py

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
      
      - name: Set up Python
        run: uv python install 3.12

      - name: Cache virtualenv
        uses: actions/cache@v4
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: Create virtualenv (cache miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: uv venv

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Type-check gate (monotonic-shrink baseline)
        run: uv run python scripts/check_typecheck_gate.py

  astar-nightly:
    name: A* 4x4 Exhaustive Verification (Nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'schedule'
    env:
      RUN_NIGHTLY: 1
      XLA_PYTHON_CLIENT_MEM_FRACTION: 0.35
      JAX_PLATFORM_NAME: cpu

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Cache virtualenv
        uses: actions/cache@v4
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: Create virtualenv (cache miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: uv venv

      - name: Install dependencies
        run: uv sync --all-packages

      - name: 4x4 exhaustive A*+Dijkstra verification
        working-directory: packages/temper-placer
        run: >
          uv run pytest tests/router_v6/test_astar_inductive_ladder.py::test_l2b_4x4_exhaustive
          -v --tb=short -m nightly
          -p no:cacheprovider
        env:
          XLA_PYTHON_CLIENT_MEM_FRACTION: 0.25
          JAX_PLATFORM_NAME: cpu
          RUN_NIGHTLY: 1
