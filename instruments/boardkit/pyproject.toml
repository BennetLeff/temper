[project]
name = "temper-boardkit"
version = "0.1.0"
description = "KiCad-free PCB craft passes, pre-DRC, Gerber DFM and JLC tooling for Temper's hand-routed boards"
requires-python = ">=3.9"
dependencies = ["shapely>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
render = ["matplotlib>=3.7"]
test = ["pytest>=7.4"]

[project.scripts]
boardkit-predrc = "temper_boardkit.cli:predrc_main"
boardkit-gerber-check = "temper_boardkit.cli:gerber_main"
boardkit-edge-clearance = "temper_boardkit.cli:edge_main"
boardkit-fab-check = "temper_boardkit.cli:fab_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/temper_boardkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py39"          # KiCad's bundled Python imports the pcbnew-side modules
