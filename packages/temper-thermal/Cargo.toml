[package]
name = "temper-thermal"
version = "0.1.0"
edition = "2021"
description = "Thermal FDM assembly kernels for temper-placer"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
faer = "0.24.4"
pyo3 = { version = "0.29", features = ["extension-module"] }
temper-py-bridge = { path = "../temper-py-bridge" }

[dev-dependencies]
proptest = "1"

[profile.release]
panic = "unwind"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
