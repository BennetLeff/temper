[package]
name = "temper-drc-rs"
version = "0.1.0"
edition = "2024"
description = "Rust DRC engine — PCB design rule checks with geo + rstar spatial indexing"

[lib]
name = "temper_drc_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# `extension-module` is deliberately NOT a Cargo feature here -- it is
# supplied by the maturin build alone (`[tool.maturin] features =
# ["python", "pyo3/extension-module"]` in pyproject.toml) and nothing else.
# With `extension-module` in the Cargo features (the prior state), `cargo
# test --features python` links the test binary against an unlinked-libpython
# pyo3 and fails at link time (`undefined symbol: PyEval_RestoreThread`) --
# `extension-module` deliberately omits libpython linkage because a real
# Python-loaded .so resolves those symbols at dlopen time via the
# interpreter, which a standalone `cargo test` binary never does. Without it
# here, `cargo test`/`cargo build` link libpython normally (see
# `PYO3_PYTHON`/system libpython resolution) and the maturin-produced cdylib
# still gets `extension-module` from the pyproject.toml override, unchanged.
# Mirrors `temper-orchestration/Cargo.toml`'s identical fix and rationale
# (measured working there first); this crate's own pyproject.toml already
# carried the `pyo3/extension-module` override needed for maturin
# independent of this Cargo feature, so this change does not affect the
# Python extension build at all -- verified via `uv run maturin develop`
# after this change (see the WASM-tier scoping investigation that added this
# comment for the measured evidence).
pyo3 = { version = "0.29", optional = true }
geo = { version = "0.28", features = ["use-serde"] }
# The pad-touch predicate calls temper-geometry's single-source-of-truth
# `point_to_rotated_rect_distance` — the same function the Python arm
# delegates to (see deterministic_connectivity.rs).
# temper-geometry reference in this crate is exclusively Rust-level:
# `deterministic_connectivity.rs:21` (drc_constraints_geometry), which lives
# behind `#[cfg(feature = "python")]`.  The `--no-default-features` wasm32 build
# therefore does not need temper-geometry at all: it is `optional = true` and
# re-enabled under `python` (U1, wasm/u1-rung23-closing), and
# `default-features = false` additionally prevents the transitive pyo3 pull
# through temper-geometry's own `python` feature that would otherwise fail the
# wasm32-unknown-unknown link step (U3, wasm/u3-ci-guard).
temper-geometry = { path = "../temper-geometry", optional = true, default-features = false }
# Shared PyO3 dict extraction utilities (used from board_py_bridge).
# Optional + gated behind `python` to keep wasm32 pyo3-free.
temper-py-bridge = { path = "../temper-py-bridge", optional = true }
# req_safe_01.rs's requirement matrix (`requirement_matrix()`) is the single
# source for the 6-row IEC60335_REQUIREMENTS/MATRIX_ROWS table (2026-08-17
# placer constraint/clearance Rust-port stage 1 -- see
# docs/evidence/2026-08-17-domain-clearance-netclass-rust-port-stages-1-2.md).
# req_safe_01.rs is itself `#[cfg(feature = "python")]`-gated (see lib.rs),
# so this is optional + re-enabled under `python` only, mirroring
# temper-geometry above -- zero wasm32 impact. temper-design-bundle's own
# default features are empty (no pyo3), so `default-features = false` here
# pulls no pyo3 transitively even if this crate's `python` feature were ever
# built with default features disabled elsewhere.
temper-design-bundle = { path = "../temper-design-bundle", optional = true, default-features = false }
# `thermal_relief._is_power_net` is a `re.compile(..., re.IGNORECASE)`
# word-boundary search. Only `is_match` is used, so the automaton and
# CPython's backtracker agree by construction (match *existence* is
# engine-independent), and `\b`/`(?i)` are Unicode-aware in both.
regex = "1"
rstar = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[features]
# WASM tier R1 (plan 2026-08-03-002): pyo3 is gated behind the optional
# `python` feature and is NOT a default feature. A plain
# `cargo build --target wasm32-unknown-unknown` therefore builds the pure
# Rust kernels with pyo3 (and temper-geometry) out of the dependency graph.
# The Python extension build (maturin) re-enables `python` explicitly via
# `[tool.maturin] features` in pyproject.toml -- default features are not
# the mechanism that build relies on.
default = []
python = ["dep:pyo3", "dep:temper-geometry", "dep:temper-py-bridge", "dep:temper-design-bundle"]
# Compiles the `#[cfg(test)]` unit-test modules into a normal (non-test) build
# and exposes them through `wasm_test_registry`, so a `wasm32` entry point can
# call each test function by index.  Off by default; never enabled for the
# Python extension module.
#
# `wasm-registry` is the umbrella feature that gates module visibility: every
# per-family feature implies it, so any test-module compilation reaches all
# modules.  Per-family filtering happens in the `ALL` array of
# `wasm_test_registry.rs` via `#[cfg(feature = "wasm-registry-<family>")]`
# guards; with LTO, unreferenced test functions from excluded families are
# dead-stripped from the `.wasm`.
wasm-registry = []
wasm-registry-drc = ["wasm-registry"]
wasm-registry-emc = ["wasm-registry"]
wasm-registry-erc = ["wasm-registry"]
wasm-registry-safety = ["wasm-registry"]
wasm-registry-placement = ["wasm-registry"]
wasm-registry-routing = ["wasm-registry"]
wasm-registry-infra = ["wasm-registry"]
wasm-registry-all = [
    "wasm-registry-drc",
    "wasm-registry-emc",
    "wasm-registry-erc",
    "wasm-registry-safety",
    "wasm-registry-placement",
    "wasm-registry-routing",
    "wasm-registry-infra",
]
# The original full-registry feature: compiles all tests and includes all
# families.  Backward-compatible with existing CI and run_wasm_tests.mjs.
wasm-test-registry = ["wasm-registry", "wasm-registry-all"]

[profile.release]
panic = "unwind"

[dev-dependencies]
proptest = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
