[package]
name = "temper-wasm-test-runner"
version = "0.1.0"
edition = "2024"
description = "wasm32 entry point that runs temper-drc-rs unit tests one at a time from a host (Cloudflare Worker, Node, workerd)"
publish = false

[lib]
name = "temper_wasm_test_runner"
# `cdylib` only. There is no consumer of this as a Rust library: its whole
# surface is the seven `extern "C"` exports the host calls.
crate-type = ["cdylib"]

[dependencies]
temper-drc-rs = { path = "../temper-drc-rs", default-features = false, features = [
  "wasm-test-registry",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# Explicit, because the whole failure protocol depends on it: a panicking test
# must reach the host as a WebAssembly trap. `wasm32-unknown-unknown` has no
# unwinder on stable, so `abort` is what the default would degrade to anyway --
# naming it keeps the runner's docs true if that default ever changes, and
# drops the landing pads from the module. The panic hook still runs first, so
# the assertion text is captured before the trap.
panic = "abort"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
