[package]
name = "temper-wasm-test-runner"
version = "0.1.0"
edition = "2024"
description = "wasm32 entry point that runs Temper crates' unit tests one at a time from a host (Cloudflare Worker, Node, workerd)"
publish = false

[lib]
name = "temper_wasm_test_runner"
# `cdylib` only. There is no consumer of this as a Rust library: its whole
# surface is the seven `extern "C"` exports the host calls.
crate-type = ["cdylib"]

[features]
# Default: the full `temper-drc-rs` registry (backward-compatible with CI,
# `make wasm-runner`, `scripts/stage_wasm_families.sh` and run_wasm_tests.mjs,
# all of which pass the unprefixed feature names below by name).
default = ["wasm-test-registry"]

# --- temper-drc-rs -----------------------------------------------------------
# `drc-registry` is what `src/lib.rs` actually tests for: a crate cannot write
# `#[cfg(feature = "temper-drc-rs/wasm-registry")]`, so a dependency's feature
# has to be mirrored locally to be visible to `cfg`. Every drc feature implies
# it.
drc-registry = []
wasm-test-registry = ["drc-registry", "temper-drc-rs/wasm-test-registry"]
# Per-family shards (Phase 1 U8): build a smaller .wasm for each Worker function.
wasm-registry-drc = ["drc-registry", "temper-drc-rs/wasm-registry-drc"]
wasm-registry-emc = ["drc-registry", "temper-drc-rs/wasm-registry-emc"]
wasm-registry-erc = ["drc-registry", "temper-drc-rs/wasm-registry-erc"]
wasm-registry-safety = ["drc-registry", "temper-drc-rs/wasm-registry-safety"]
wasm-registry-placement = ["drc-registry", "temper-drc-rs/wasm-registry-placement"]
wasm-registry-routing = ["drc-registry", "temper-drc-rs/wasm-registry-routing"]
wasm-registry-infra = ["drc-registry", "temper-drc-rs/wasm-registry-infra"]
# Build all families (same as default but explicit).
wasm-registry-all = ["drc-registry", "temper-drc-rs/wasm-registry-all"]

# --- temper-geometry ---------------------------------------------------------
# `temper-geometry` is an *optional* dependency so a drc-only build's dependency
# graph is byte-for-byte what it was: nothing about the existing shards changes
# unless one of these is asked for.
geometry-registry = ["dep:temper-geometry"]
geometry-wasm-test-registry = ["geometry-registry", "temper-geometry/wasm-test-registry"]

# --- temper-thermal ----------------------------------------------------------
# Optional for the same reason `temper-geometry` is: a build that does not ask
# for thermal has exactly the dependency graph it had before this crate was
# added.
thermal-registry = ["dep:temper-thermal"]
thermal-wasm-test-registry = ["thermal-registry", "temper-thermal/wasm-test-registry"]

# --- temper-design-bundle ----------------------------------------------------
# Optional, same reason again.
design-bundle-registry = ["dep:temper-design-bundle"]
design-bundle-wasm-test-registry = [
  "design-bundle-registry",
  "temper-design-bundle/wasm-test-registry",
]

# --- temper-rust-router-core -------------------------------------------------
# Optional, same reason again. Note the dependency below carries
# `default-features = false` for a reason that is NOT `python`: this crate's
# default feature is `sat`, which pulls `rustsat-cadical` -- a C++ solver with
# no `wasm32-unknown-unknown` build.
router-core-registry = ["dep:temper-rust-router-core"]
router-core-wasm-test-registry = [
  "router-core-registry",
  "temper-rust-router-core/wasm-test-registry",
]

# --- temper-constraint-compiler ----------------------------------------------
# Optional, same reason again. Its default features are `python` AND `sat`, so
# `default-features = false` below turns off both.
constraint-compiler-registry = ["dep:temper-constraint-compiler"]
constraint-compiler-wasm-test-registry = [
  "constraint-compiler-registry",
  "temper-constraint-compiler/wasm-test-registry",
]

# --- temper-quality-oracle ---------------------------------------------------
# Optional, same reason again. `default-features = false` turns off `python`.
quality-oracle-registry = ["dep:temper-quality-oracle"]
quality-oracle-wasm-test-registry = [
  "quality-oracle-registry",
  "temper-quality-oracle/wasm-test-registry",
]

# --- temper-io-types ---------------------------------------------------------
# Optional, same reason again. Its default feature is `python`, so the
# dependency below carries `default-features = false`.
io-types-registry = ["dep:temper-io-types"]
io-types-wasm-test-registry = [
  "io-types-registry",
  "temper-io-types/wasm-test-registry",
]

# --- temper-pcl-ir ------------------------------------------------------------
# Optional, same reason again. This crate has no `python` feature (no pyo3
# dependency at all), so `default-features = false` below is written out for
# consistency with the rest of the tier rather than because it turns anything
# off.
pcl-ir-registry = ["dep:temper-pcl-ir"]
pcl-ir-wasm-test-registry = [
  "pcl-ir-registry",
  "temper-pcl-ir/wasm-test-registry",
]

[dependencies]
temper-drc-rs ={ path = "../temper-drc-rs", default-features = false }
# `default-features = false` for the same reason it is set on temper-drc-rs's
# own temper-geometry dependency: the `python` default would pull pyo3 in and
# fail the wasm32-unknown-unknown link step.
temper-geometry = { path = "../temper-geometry", optional = true, default-features = false }
# `default-features = false` is load-bearing here: temper-thermal's default
# feature IS `python`, which pulls pyo3 (and faer) in and fails the
# wasm32-unknown-unknown build.
temper-thermal = { path = "../temper-thermal", optional = true, default-features = false }
# `temper-design-bundle`'s default feature set is already empty, but
# `default-features = false` is written out anyway so every crate on the tier
# reads the same and a later default cannot quietly reach pyo3.
temper-design-bundle = { path = "../temper-design-bundle", optional = true, default-features = false }
# `default-features = false` turns off `sat`, whose `rustsat-cadical` is a C++
# solver with no wasm32-unknown-unknown build.
temper-rust-router-core = { path = "../temper-rust-router-core", optional = true, default-features = false }
# `default-features = false` turns off both `python` (pyo3) and `sat`.
temper-constraint-compiler = { path = "../temper-constraint-compiler", optional = true, default-features = false }
# `default-features = false` turns off `python` (pyo3), which has no
# wasm32-unknown-unknown build.
temper-quality-oracle = { path = "../temper-quality-oracle", optional = true, default-features = false }
# `default-features = false` is load-bearing: temper-io-types's default feature
# IS `python`, which pulls pyo3 in and fails the wasm32-unknown-unknown build.
temper-io-types = { path = "../temper-io-types", optional = true, default-features = false }
# `default-features = false` written out for consistency with the rest of the
# tier; this crate has no default features to turn off.
temper-pcl-ir = { path = "../temper-pcl-ir", optional = true, default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# Explicit, because the whole failure protocol depends on it: a panicking test
# must reach the host as a WebAssembly trap. `wasm32-unknown-unknown` has no
# unwinder on stable, so `abort` is what the default would degrade to anyway --
# naming it keeps the runner's docs true if that default ever changes, and
# drops the landing pads from the module. The panic hook still runs first, so
# the assertion text is captured before the trap.
panic = "abort"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
