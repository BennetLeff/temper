[package]
name = "temper-wasm-test-runner"
version = "0.1.0"
edition = "2024"
description = "wasm32 entry point that runs temper-drc-rs unit tests one at a time from a host (Cloudflare Worker, Node, workerd)"
publish = false

[lib]
name = "temper_wasm_test_runner"
# `cdylib` only. There is no consumer of this as a Rust library: its whole
# surface is the seven `extern "C"` exports the host calls.
crate-type = ["cdylib"]

[features]
# Default: full 147-test registry (backward-compatible with CI and run_wasm_tests.mjs).
default = ["wasm-test-registry"]
wasm-test-registry = ["temper-drc-rs/wasm-test-registry"]
# Per-family shards (Phase 1 U8): build a smaller .wasm for each Worker function.
wasm-registry-drc = ["temper-drc-rs/wasm-registry-drc"]
wasm-registry-emc = ["temper-drc-rs/wasm-registry-emc"]
wasm-registry-erc = ["temper-drc-rs/wasm-registry-erc"]
wasm-registry-safety = ["temper-drc-rs/wasm-registry-safety"]
wasm-registry-placement = ["temper-drc-rs/wasm-registry-placement"]
wasm-registry-routing = ["temper-drc-rs/wasm-registry-routing"]
wasm-registry-infra = ["temper-drc-rs/wasm-registry-infra"]
# Build all families (same as default but explicit).
wasm-registry-all = ["temper-drc-rs/wasm-registry-all"]

[dependencies]
temper-drc-rs = { path = "../temper-drc-rs", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# Explicit, because the whole failure protocol depends on it: a panicking test
# must reach the host as a WebAssembly trap. `wasm32-unknown-unknown` has no
# unwinder on stable, so `abort` is what the default would degrade to anyway --
# naming it keeps the runner's docs true if that default ever changes, and
# drops the landing pads from the module. The panic hook still runs first, so
# the assertion text is captured before the trap.
panic = "abort"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
