[package]
name = "temper-constraint-compiler"
version = "0.1.0"
edition = "2024"
description = "Constraint lowering compiler — compiles PCL designer-level constraints through a type lattice and multi-tier desugaring into SAT constraint ISA"

[lib]
name = "temper_constraint_compiler"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
temper-rust-router-core = { path = "../temper-rust-router-core", default-features = false }
temper-py-bridge = { path = "../temper-py-bridge", optional = true }
serde = { version = "1", features = ["derive"] }

[features]
default = ["python", "sat"]
python = ["dep:pyo3", "dep:temper-py-bridge"]
sat = ["temper-rust-router-core/sat"]
# Compiles the `#[cfg(test)]` unit-test modules into a normal (non-test) build
# and exposes them through `wasm_test_registry`, so a `wasm32` entry point can
# call each test function by index -- `cargo test`'s libtest harness cannot
# target `wasm32-unknown-unknown`.  Off by default; never enabled for the
# Python extension module.  Mirrors `temper-geometry`'s and `temper-thermal`'s
# feature sets exactly, so the shared runner wires every crate the same way.
#
# `wasm-registry` is the umbrella feature that gates module visibility; every
# per-family feature implies it.  One family (`constraint-compiler`): the
# lowering tiers are a flat pipeline with no taxonomy to shard along.  See
# `src/wasm_test_registry.rs`.
wasm-registry = []
wasm-registry-constraint-compiler = ["wasm-registry"]
wasm-registry-all = ["wasm-registry-constraint-compiler"]
wasm-test-registry = ["wasm-registry", "wasm-registry-all"]

[profile.release]
panic = "unwind"

[dev-dependencies]
proptest = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
