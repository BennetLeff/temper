[package]
name = "temper-orchestration"
version = "0.1.0"
edition = "2024"
description = "Orchestration compute for the temper-placer CLI/adapters and temper-workflow — Phase 5 of the Wave 4 Python→Rust migration"

[lib]
name = "temper_orchestration"
crate-type = ["cdylib", "rlib"]

[dependencies]
# `py-clone`: `Py<T>: Clone` (the plan's BoardState sketch `#[derive(Clone)]`
# over `Option<Py<PyAny>>` fields is impossible without it — `Clone for Py<T>`
# is cfg-gated behind this feature). The generated `clone()` panics if the
# thread is not attached to the interpreter AND a non-empty `Py<T>` field is
# cloned; BoardState instances with populated `Py<PyAny>` fields only exist
# inside the Python-driven pipeline (GIL held), so that path is unreachable
# for the Phase-1 scope — all-None clones (the pure-Rust unit tests) never
# touch the interpreter.
#
# NOTE: `extension-module` is deliberately NOT a Cargo feature here — it is
# supplied by the maturin build (`[tool.maturin] features` in pyproject.toml)
# and nothing else. With `extension-module` in the Cargo features, `cargo
# test`/`cargo clippy --all-targets` link the test binary against an
# unlinked-libpython pyo3 and fail (rust-lld: undefined symbol: PyExc_...)
# on toolchains whose CGU partitioning pulls pyo3 code into the test binary
# (measured: rustc 1.97.1, 2026-07-14 — the pristine crate fails the same
# way on `main`). Without it, the test build links libpython normally and
# the maturin-produced cdylib still gets `extension-module`.
pyo3 = { version = "0.29", features = ["py-clone"], optional = true }
# The pure-Rust owned data model (unit O-C3/U2): `Val` + the `Component`/
# `Pin`/`Net` leaf structs. Unconditional (not python-gated) on purpose --
# the crate is pyo3-free and wasm-compatible, so it compiles for the
# `wasm32-unknown-unknown` tier too; the `Marshal` impls that USE it are
# the `#[cfg(feature = "python")]`-gated parts (see `netlist_owned.rs`).
temper-data-model = { path = "../temper-data-model" }
# WorldPosition (2026-08-16): the pad world-position type with the
# kernel-only constructor. `run_collect_pad_positions` uses it instead of
# calling back into the Python `temper_geometry.pin_world_position_at_py`
# kernel, so the rotation/side math runs in-crate and the "naive
# comp_pos + pin_pos" bug is unrepresentable at the call site. Pure Rust,
# unconditional (like temper-data-model), so the wasm32 tier is unaffected.
temper-geometry = { path = "../temper-geometry" }

[features]
default = ["python"]
python = ["dep:pyo3"]
# Compiles the `#[cfg(test)]` unit-test modules into a normal (non-test) build
# and exposes them through `wasm_test_registry`, so a `wasm32` entry point can
# call each test function by index -- `cargo test`'s libtest harness cannot
# target `wasm32-unknown-unknown`.  Off by default; never enabled for the
# Python extension module.  Mirrors `temper-io-types`/`temper-quality-oracle`'s
# feature set exactly, so the shared runner wires this crate the same way.
#
# `wasm-registry` is the umbrella feature that gates module visibility; every
# per-family feature implies it.  What survives `--no-default-features` here
# is a flat set of pure kernels with no rule-family taxonomy to shard along,
# so it declares one family (`orchestration`).
wasm-registry = []
wasm-registry-orchestration = ["wasm-registry"]
wasm-registry-all = ["wasm-registry-orchestration"]
wasm-test-registry = ["wasm-registry", "wasm-registry-all"]

[profile.release]
panic = "unwind"

[dev-dependencies]
proptest = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
