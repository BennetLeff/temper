[package]
name = "temper-placement-topology"
version = "0.1.0"
edition = "2024"
description = "Topological placement compute — graph clustering, constraint propagation, force refinement, initial placement (Wave 4 Phase 4)"
license = "MIT"

[lib]
name = "temper_placement_topology"
crate-type = ["cdylib", "rlib"]

[dependencies]
temper-py-bridge = { path = "../temper-py-bridge", optional = true }
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }

[features]
default = ["python"]
python = ["dep:pyo3", "dep:temper-py-bridge"]

[dev-dependencies]
proptest = "1"

[profile.release]
panic = "unwind"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
