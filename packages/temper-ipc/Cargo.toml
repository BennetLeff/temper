[package]
name = "temper-ipc"
version = "0.1.0"
edition = "2024"
description = "IPC standard calculations for PCB design (current capacity, trace width)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }

[features]
default = ["python"]
python = ["dep:pyo3"]

[profile.release]
panic = "unwind"

[dev-dependencies]
proptest = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
