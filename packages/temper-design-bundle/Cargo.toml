[package]
name = "temper-design-bundle"
version = "0.1.0"
edition = "2024"
description = "Validated, provenance-carrying Atopile and PCL design boundary"

[lib]
name = "temper_design_bundle"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
pyo3 = { version = "0.29", optional = true, features = ["extension-module"] }
temper-pcl-ir = { path = "../temper-pcl-ir" }

[dev-dependencies]
proptest = "1"
temper-pcl-ir = { path = "../temper-pcl-ir" }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
