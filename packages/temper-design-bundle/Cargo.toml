[package]
name = "temper-design-bundle"
version = "0.1.0"
edition = "2024"
description = "Validated, provenance-carrying Atopile and PCL design boundary"

[lib]
name = "temper_design_bundle"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3", "dep:temper-py-bridge"]
# Compiles the `#[cfg(test)]` unit-test modules into a normal (non-test) build
# and exposes them through `wasm_test_registry`, so a `wasm32` entry point can
# call each test function by index -- `cargo test`'s libtest harness cannot
# target `wasm32-unknown-unknown`.  Off by default; never enabled for the
# Python extension module.  Mirrors `temper-geometry`'s and `temper-thermal`'s
# feature sets exactly, so the shared runner wires every crate the same way.
#
# `wasm-registry` is the umbrella feature that gates module visibility; every
# per-family feature implies it.  What survives `--no-default-features` here is
# a flat set of parsers and validators with no rule-family taxonomy, so it
# declares one family (`design-bundle`); see `src/wasm_test_registry.rs`.
wasm-registry = []
wasm-registry-design-bundle = ["wasm-registry"]
wasm-registry-all = ["wasm-registry-design-bundle"]
wasm-test-registry = ["wasm-registry", "wasm-registry-all"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
regex = "1"
pyo3 = { version = "0.29", optional = true, features = ["extension-module"] }
# G7's `catch_unwind` at every pyo3 boundary; python-feature-gated so the
# default (rlib) build stays pyo3-free.
temper-py-bridge = { path = "../temper-py-bridge", optional = true }
temper-pcl-ir = { path = "../temper-pcl-ir" }

[dev-dependencies]
proptest = "1"
temper-pcl-ir = { path = "../temper-pcl-ir" }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
