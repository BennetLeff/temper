[package]
name = "temper-design-bundle"
version = "0.1.0"
edition = "2024"
description = "Validated, provenance-carrying Atopile and PCL design boundary"

[lib]
name = "temper_design_bundle"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3", "dep:temper-py-bridge", "temper-rust-router-core/sat"]
# Compiles the `#[cfg(test)]` unit-test modules into a normal (non-test) build
# and exposes them through `wasm_test_registry`, so a `wasm32` entry point can
# call each test function by index -- `cargo test`'s libtest harness cannot
# target `wasm32-unknown-unknown`.  Off by default; never enabled for the
# Python extension module.  Mirrors `temper-geometry`'s and `temper-thermal`'s
# feature sets exactly, so the shared runner wires every crate the same way.
#
# `wasm-registry` is the umbrella feature that gates module visibility; every
# per-family feature implies it.  What survives `--no-default-features` here is
# a flat set of parsers and validators with no rule-family taxonomy, so it
# declares one family (`design-bundle`); see `src/wasm_test_registry.rs`.
wasm-registry = []
wasm-registry-design-bundle = ["wasm-registry"]
wasm-registry-all = ["wasm-registry-design-bundle"]
wasm-test-registry = ["wasm-registry", "wasm-registry-all"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
temper-rust-router-core = { path = "../temper-rust-router-core", default-features = false }
sha2 = "0.10"
thiserror = "2"
regex = "1"
# `extension-module` is deliberately NOT a Cargo feature here -- it is
# supplied by the maturin build alone (`[tool.maturin] features = ["python",
# "pyo3/extension-module"]` in pyproject.toml) and nothing else. With
# `extension-module` in the Cargo features (the prior state), `cargo test
# --features python` links the test binary against an unlinked-libpython
# pyo3 and fails at link time -- `extension-module` deliberately omits
# libpython linkage because a real Python-loaded .so resolves those symbols
# at dlopen time via the interpreter, which a standalone `cargo test` binary
# never does. Without it here, `cargo test`/`cargo build` link libpython
# normally and the maturin-produced cdylib still gets `extension-module`
# from the pyproject.toml override, unchanged. Mirrors
# `temper-orchestration`/`temper-drc-rs`'s identical fix and rationale
# (measured working there first); this crate's own pyproject.toml already
# carried the `pyo3/extension-module` override needed for maturin
# independent of this Cargo feature, so this change does not affect the
# Python extension build at all -- verified via `uv run maturin develop`
# after this change.
pyo3 = { version = "0.29", optional = true }
# G7's `catch_unwind` at every pyo3 boundary; python-feature-gated so the
# default (rlib) build stays pyo3-free.
temper-py-bridge = { path = "../temper-py-bridge", optional = true }
temper-pcl-ir = { path = "../temper-pcl-ir" }
# Single-source point-to-segment kernel (issue #987): the three Wave-4
# reimplementations (constraint_model.rs, deterministic_phase.rs,
# deterministic_leaf_drc.rs in the sibling crates) were deduplicated onto
# temper-geometry's creepage_check::point_to_segment_distance. Default
# features are empty, so this pulls no pyo3 into a --no-default-features
# wasm32 build.
temper-geometry = { path = "../temper-geometry" }

[dev-dependencies]
proptest = "1"
temper-pcl-ir = { path = "../temper-pcl-ir" }
# tests/compile_fail.rs: enforces PadOccurrence's no-`From<&str>` guard fails
# to compile for the stated reason (E0277), by diffing full rustc stderr
# against a checked-in .stderr expectation. The `compile_fail` doctest it
# supplements asserts only that the snippet does not compile, never why -- see
# packages/temper-geometry/tests/compile_fail.rs for the measured evidence.
# Dev-dependency only; native-only by construction.
trybuild = "1.0.120"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
