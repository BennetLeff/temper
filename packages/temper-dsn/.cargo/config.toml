# Allow `cargo test` to link on macOS despite pyo3's `extension-module`
# feature (which omits libpython on purpose — Python symbols are provided
# by the host process for wheel builds). maturin passes exactly these
# flags when building the wheel; plain `cargo test` does not, which is
# why the test binaries previously failed to link ("symbol(s) not found
# for architecture arm64", see docs/solutions/workflow-issues/
# 2026-07-18-plan-execution-and-ci-rot-excavation.md).
#
# `-undefined dynamic_lookup` defers Python symbol resolution to runtime.
# Pure-Rust tests (everything in tests/ today) never touch those symbols.
# If a future test calls into the Python C-API (e.g. Python::with_gil),
# it will abort at runtime — such tests belong in the pytest suite via
# the built wheel instead.

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]

# UPDATE 2026-07-27: the paragraph that used to live here claimed pyo3
# exception *data* symbols (e.g. _PyExc_BaseException) made `cargo test --lib`
# abort at dyld load even for pure-Rust tests, and that rescuing tests
# required splitting pure logic into a separate `-core` rlib. That claim did
# not hold: `temper-geometry` runs the identical shape (pyo3 0.29,
# crate-type = ["cdylib", "rlib"], same extension-module feature, tests
# living directly alongside `#[pyfunction]`/`#[pymodule]` code) and passes
# `cargo test --lib` (312/313, one pre-existing unrelated failure). The
# dsn/ipc-core split this file described was reverted in the commit that
# added this comment (folded `temper-dsn-core`'s tests back into `dsn.rs`
# here); `cargo test --lib` on this crate now passes all 8 of them directly.
