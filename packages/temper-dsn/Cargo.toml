[package]
name = "temper-dsn"
version = "0.1.0"
edition = "2024"
description = "DSN (Specctra) format utilities for temper PCB placement"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
regex = "1"

[profile.release]
panic = "unwind"
