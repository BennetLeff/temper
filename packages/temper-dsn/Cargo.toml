[package]
name = "temper-dsn"
version = "0.1.0"
edition = "2024"
description = "DSN (Specctra) format utilities for temper PCB placement"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
temper-dsn-core = { path = "../temper-dsn-core" }

[profile.release]
panic = "unwind"
