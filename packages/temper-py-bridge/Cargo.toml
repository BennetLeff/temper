[package]
name = "temper-py-bridge"
version = "0.1.0"
edition = "2024"
description = "Shared PyO3 bridge utilities for temper Rust crates"

[lib]
crate-type = ["rlib"]

[dependencies]
pyo3 = { version = "0.29" }
temper-py-bridge-derive = { path = "../temper-py-bridge-derive" }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
