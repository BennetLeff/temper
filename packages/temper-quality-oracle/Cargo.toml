[package]
name = "temper-quality-oracle"
version = "0.1.0"
edition = "2024"
description = "Typed quality oracle for PCB placement — implements the full six-layer quality pipeline as a pure Rust function"

[lib]
name = "temper_quality_oracle"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
temper-py-bridge = { path = "../temper-py-bridge", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
temper-design-bundle = { path = "../temper-design-bundle", default-features = false }

[features]
default = ["python"]
python = ["dep:pyo3", "dep:temper-py-bridge"]
# Compiles the `#[cfg(test)]` unit-test modules into a normal (non-test) build
# and exposes them through `wasm_test_registry`, so a `wasm32` entry point can
# call each test function by index -- `cargo test`'s libtest harness cannot
# target `wasm32-unknown-unknown`.  Off by default; never enabled for the
# Python extension module.  Mirrors `temper-thermal`'s feature set exactly, so
# the shared runner wires every crate on the tier the same way.
#
# `wasm-registry` is the umbrella feature that gates module visibility; every
# per-family feature implies it.  The six-layer quality pipeline is a flat
# sequence of pure scoring kernels with no rule-family taxonomy, so this crate
# declares one family (`quality-oracle`).
wasm-registry = []
wasm-registry-quality-oracle = ["wasm-registry"]
wasm-registry-all = ["wasm-registry-quality-oracle"]
wasm-test-registry = ["wasm-registry", "wasm-registry-all"]

[profile.release]
panic = "unwind"

[dev-dependencies]
proptest = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
