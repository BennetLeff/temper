[package]
name = "temper-io-types"
version = "0.1.0"
edition = "2024"
description = "KiCad PCB IO types (trace segments, vias, footprint parsing, golden serializers)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
# `arbitrary_precision` keeps raw number tokens in `serde_json::Number`, so
# `as_f64()` goes through `str::parse::<f64>()` (correctly rounded) instead of
# serde_json's vendored float parser, which is measurably off-by-one-ULP on
# full-precision inputs (20% divergence on 17-digit literals, measured
# 2026-08-11). The golden_diff JSON kernel parses Python-`json.dumps`-produced
# golden text, so its floats MUST parse identically to CPython's `float()`.
# The crate's other serde_json users (dsn.rs schema hash -- integers only;
# golden_serializers -- floats via `json!`, whose `Number::from_f64` renders
# with ryu either way) are byte-neutral under the feature; the crate test
# suite and the io differentials pin that.
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
regex = "1"
temper-py-bridge = { path = "../temper-py-bridge", optional = true }

[features]
default = ["python"]
python = ["dep:pyo3", "dep:temper-py-bridge"]
# Compiles the `#[cfg(test)]` unit-test modules into a normal (non-test) build
# and exposes them through `wasm_test_registry`, so a `wasm32` entry point can
# call each test function by index -- `cargo test`'s libtest harness cannot
# target `wasm32-unknown-unknown`.  Off by default; never enabled for the
# Python extension module.  Mirrors `temper-thermal`'s feature set exactly, so
# the shared runner wires both crates the same way.
#
# `wasm-registry` is the umbrella feature that gates module visibility; every
# per-family feature implies it.  What survives `--no-default-features` here is
# a flat set of KiCad/DSN serialisers, parsers and the placer CONTRACT kernels,
# with no rule-family taxonomy to shard along, so it declares one family
# (`io-types`).
wasm-registry = []
wasm-registry-io-types = ["wasm-registry"]
wasm-registry-all = ["wasm-registry-io-types"]
wasm-test-registry = ["wasm-registry", "wasm-registry-all"]

[profile.release]
panic = "unwind"

[dev-dependencies]
proptest = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
