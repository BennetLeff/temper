[package]
name = "temper-io-types"
version = "0.1.0"
edition = "2024"
description = "KiCad PCB IO types (trace segments, vias, footprint parsing, golden serializers)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }

[profile.release]
panic = "unwind"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
