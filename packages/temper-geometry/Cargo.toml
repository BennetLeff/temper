[package]
name = "temper-geometry"
version = "0.1.0"
edition = "2024"
description = "2D geometry math functions for temper PCB placement"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
temper-py-bridge = { path = "../temper-py-bridge", optional = true }
rand = "0.8"
# `extension-module` is deliberately NOT a Cargo feature here -- it is
# supplied by the maturin build alone (`[tool.maturin] features = ["python",
# "pyo3/extension-module"]` in pyproject.toml) and nothing else. With
# `extension-module` in the Cargo features (the prior state), `cargo test
# --features python` links the test binary against an unlinked-libpython
# pyo3 and fails at link time -- `extension-module` deliberately omits
# libpython linkage because a real Python-loaded .so resolves those symbols
# at dlopen time via the interpreter, which a standalone `cargo test` binary
# never does. Without it here, `cargo test`/`cargo build` link libpython
# normally and the maturin-produced cdylib still gets `extension-module`
# from the pyproject.toml override, unchanged. Mirrors
# `temper-orchestration`/`temper-drc-rs`'s identical fix and rationale
# (measured working there first); this crate's own pyproject.toml already
# carried the `pyo3/extension-module` override needed for maturin
# independent of this Cargo feature, so this change does not affect the
# Python extension build at all -- verified via `uv run maturin develop`
# after this change.
pyo3 = { version = "0.29", optional = true }
# Independent (non-GEOS) Delaunay/Voronoi for router_v6/channel_skeleton.py's
# medial-axis extraction. Pure Rust, exact circumcenter predicates via the
# `robust` crate (already a transitive dependency elsewhere in this repo via
# temper-drc-rs's `geo`/`rstar` stack) -- no libc/OS dependency, so it builds
# for wasm32 the same as the rest of this crate.
spade = "2.15"
# radius_pairs.rs: exact all-pairs-within-radius query for
# router_v6/channel_skeleton.py's island-bridging MST, replacing
# scipy.spatial.cKDTree.query_pairs. Same version already pinned by
# temper-drc-rs ("geo + rstar spatial indexing") -- reusing rather than
# introducing a second spatial-index crate (kiddo was evaluated and rejected;
# see radius_pairs.rs's module doc). Pure Rust (heapless/num-traits/smallvec
# only, no `geo` dependency needed -- rstar has its own Point trait with a
# blanket impl for fixed-size float arrays), so it builds for wasm32 the same
# as spade above; already proven on wasm32-unknown-unknown in this repo via
# temper-drc-rs's own WASM tier R1 build.
rstar = "0.12"
# convex_hull.rs: hull *area* for physics/loop_area.py's
# `_convex_hull_area` and validation/trace_analyzer.py's
# `calculate_actual_loop_area`, replacing scipy.spatial.ConvexHull (both
# call sites read only `hull.volume`, never vertex ordering -- see
# docs/evidence/2026-08-07-scipy-keeps-re-triage.md Sec 2). Already a
# resolved workspace dependency via temper-drc-rs ("geo + rstar spatial
# indexing"), so this adds no new external crate surface -- reusing the
# same pinned version. Pure Rust (QuickHull, Barber-Dobkin-Huhdanpaa), no
# libc/OS dependency, so it builds for wasm32 the same way temper-drc-rs's
# unconditional (non-wasm-gated) `geo` dependency already does.
geo = "0.28"
# hierarchical_clustering.rs: Ward-linkage agglomerative clustering for
# router_v6/zone_emission.py's `_cluster_positions`, replacing
# scipy.cluster.hierarchy.linkage(method="ward")/fcluster/pdist. Pure Rust,
# zero production dependencies of its own (verified: kodama's own Cargo.toml
# declares dev-dependencies only), so it builds for wasm32-unknown-unknown
# with no extra feature wiring -- confirmed directly against a throwaway
# crate depending on kodama alone before adding it here. Last published
# 2023-01-04 (no `fcluster`-equivalent flat-cut API -- this crate's own
# hierarchical_clustering.rs implements that reconstruction), but the
# linkage algorithm itself needs no further development: it is a closed,
# well-specified numerical procedure (Ward/Lance-Williams recurrence),
# verified bit-exact against scipy's own dissimilarity values on real board
# geometry -- see docs/evidence/2026-08-07-zone-emission-clustering-kodama-port.md.
kodama = "0.3"

[features]
# WASM tier R1 (plan 2026-08-03-002): pyo3 is gated behind the optional
# `python` feature and is NOT a default feature. A plain
# `cargo build --target wasm32-unknown-unknown` therefore builds the pure
# geometry kernels with pyo3 out of the dependency graph. The Python
# extension build (maturin) re-enables `python` explicitly via
# `[tool.maturin] features` in pyproject.toml -- default features are not
# the mechanism that build relies on.
default = []
python = ["dep:pyo3", "dep:temper-py-bridge"]
# Compiles the `#[cfg(test)]` unit-test modules into a normal (non-test) build
# and exposes them through `wasm_test_registry`, so a `wasm32` entry point can
# call each test function by index -- `cargo test`'s libtest harness cannot
# target `wasm32-unknown-unknown`.  Off by default; never enabled for the
# Python extension module.  Mirrors `temper-drc-rs`'s feature set exactly, so
# the shared runner wires both crates the same way.
#
# `wasm-registry` is the umbrella feature that gates module visibility; every
# per-family feature implies it.  This crate is a flat set of independent
# kernels with no rule-family taxonomy, so it declares one family
# (`geometry`).  The per-family shape is kept rather than dropped because
# `temper-drc-rs` has it and a size-driven split may later be wanted; see
# `src/wasm_test_registry.rs`.
wasm-registry = []
wasm-registry-geometry = ["wasm-registry"]
wasm-registry-all = ["wasm-registry-geometry"]
wasm-test-registry = ["wasm-registry", "wasm-registry-all"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
# rand 0.8 -> rand_core 0.6 pulls getrandom 0.2, which needs an explicit
# entropy source on wasm32-unknown-unknown (no OS RNG there). `gumbel_softmax`
# (transform.rs) calls `rand::random` unconditionally, in a pure-kernel
# function reachable with or without the `python` feature, so this is needed
# for both wasm32 build configurations, not just --no-default-features.
#
# `custom`, NOT `js`. `js` was here first and it compiles, but it links
# getrandom's wasm-bindgen browser/Node shim, which emits ~27 imports from
# `__wbindgen_placeholder__`. A wasm32 module with imports cannot be
# instantiated without generated wasm-bindgen JS glue -- glue this repo has no
# step that produces -- so `js` made the module un-instantiable in a bare
# isolate, i.e. exactly not deployable to the tier it was added for. Measured:
# `WebAssembly.instantiate(module, {})` throws
# `Import #0 "__wbindgen_placeholder__": module is not an object or function`.
#
# `custom` lets the crate name its own source; `src/wasm_entropy.rs` registers
# one that always fails, which is the truth on this target (see its module doc)
# and leaves the module import-free.
getrandom = { version = "0.2", features = ["custom"] }

[dev-dependencies]
proptest = "1"

[profile.release]
panic = "unwind"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
