# Pinned allowlist of PRE-EXISTING F.Fab body collisions on
# pcb/temper.kicad_pcb, consumed by
# temper_placer.placer.cp_sat.body_collision.audit_body_collisions.
#
# THIS IS A RATCHET, NOT A PASS. A pair listed here is permitted to remain
# AT OR BELOW its recorded baseline_overlap_mm2 -- the guard still fails
# closed if:
#   (a) any NEW pair (not listed here) shows real F.Fab body overlap, or
#   (b) a LISTED pair's overlap gets WORSE than its recorded baseline.
#
# (b) matters as much as (a): PR #1168 (2026-08-13) demonstrated a re-solve
# that made an already-bad pair worse (C2xC3-class collision growing to
# 9.47mm, from the 7.73mm this board already carries) while still reporting
# `optimal`. A guard that only checked "is this pair new" would have passed
# that placement. This allowlist's baseline comparison is what catches it.
#
# Do NOT add an entry here to silence a NEW collision the placer produces.
# This file exists ONLY to acknowledge debt already committed to
# pcb/temper.kicad_pcb before this guard existed; it must not become a
# general-purpose escape hatch (see the task brief this guard was built
# against: "a guard that passes today's board unconditionally is the
# failure mode this repo keeps hitting").
#
# Owner of paying this debt down: PR #1158 (docs/evidence/
# 2026-08-13-courtyard-collision-characterization-and-remediation-plan.md),
# which has a live-kicad-cli-verified fix for 7 of these 8 tracked
# courtyards_overlap pairs (6 of them body collisions; see that document's
# section 4). This file's `remediation_pr` /`review_by` fields exist so a
# stale allowlist entry (one whose fix has already landed, or whose review
# date has passed with no progress) is visible, not just implied.

schema_version: 1

