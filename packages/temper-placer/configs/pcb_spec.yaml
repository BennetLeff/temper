# Physical Design Specification for Temper Induction Cooker

name: "Temper V1"

thermal:
  # 125 °C = the datasheet-recovery "design for ≤125 °C" junction limit
  # (components/IKW40N120H3/IKW40N120H3_Documentation.md §5.1.1); the
  # absolute survival limit is Tvj(max) = 175 °C. 60 °C ambient = the
  # docs/ENVIRONMENTAL_SPEC.md §1.1 derating zero-power point (decision
  # doc 2026-08-15 §6.4).
  max_junction_temp_c: 125.0
  ambient_temp_c: 60.0
  target_edge: "BOTTOM"
  max_heatspread_mm: 30.0
  power_dissipation:
    Q1: 15.0
    Q2: 15.0
    U_BUCK: 2.0

emi:
  max_loop_area_mm2:
    commutation_loop: 80.0
    gate_drive_loop: 30.0
  loop_components:
    commutation_loop: [C_BUS1, Q1, Q2, C_BUS2]
    # U_GATE is the gate driver (UCC21550). Was U_GATE_DRV — a stale ref
    # absent from the netlist, which made the loop-area encoder silently
    # compute the loop over a partial component set.
    gate_drive_high: [U_GATE, R_GATE_H, Q1]
    gate_drive_low: [U_GATE, R_GATE_L, Q2]
  frequency_hz: 100000.0

signal_integrity:
  max_length_mm:
    CLK: 100.0
  length_match_mm:
    DIFF_P: 2.0
    DIFF_N: 2.0

safety:
  mains_voltage_v: 230.0
  pollution_degree: 2
