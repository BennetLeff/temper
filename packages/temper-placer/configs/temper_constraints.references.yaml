# Explicit source-backed reconciliation for the legacy placement config.
#
# This file is consumed before CP-SAT validation. It is intentionally partial:
# an entry is permitted only when its target is an existing production-board
# reference and the source name is not a live designator. Unresolved entries
# remain listed below so the solver fails closed instead of inventing a
# placement candidate.
