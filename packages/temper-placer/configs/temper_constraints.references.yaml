# Explicit source-backed reconciliation for the legacy placement config.
#
# This file is consumed before CP-SAT validation. It is intentionally partial:
# an entry is permitted only when its target is an existing production-board
# reference and the source name is not a live designator. Unresolved entries
# remain listed below so the solver fails closed instead of inventing a
# placement candidate.
schema_version: 1

authority:
  board: pcb/temper.kicad_pcb
  source_export: elec/exports/temper.design-input.v1.json
  component_identity: board Sheetpath matched to source instance path
  measured_at_commit: 3f1744ca3abfc14f8c80df78e8d359c264a46917

# Content-hash freshness identity (scripts/check_measurement_provenance.py),
# added 2026-08-07. `authority.measured_at_commit` above is advisory (human
# traceability of which commit's reconciliation produced the aliases below);
# this block is the verified freshness oracle, per the same primary-identity
# design AGENTS.md's "Board Change -> DRC Ceiling Re-measurement" section
# documents for drc_ceiling.json. Before this block existed, nothing checked
# whether `authority.measured_at_commit` even resolved, and there was no
# input hash at all -- so neither a rebase-orphaned commit nor a drifted
# board/export would have been noticed. `inputs[].sha256` below is pinned to
# the two files' content AS OF `measured_at_commit` (via `git show
# <sha>:<path>`), not today's tree -- that is what makes a future drift
# detectable at all. As of this backfill, `pcb/temper.kicad_pcb` had already
# drifted since this reconciliation was measured (the board changed after
# 3f1744ca; the source export did not) -- see the gate's STALE report; this
# was a finding, not swallowed by re-hashing today's board into a
# false-fresh record.
# Re-recorded 2026-08-11 (fix/references-record-current-board): the drift
# since 3f1744ca is commit c4956df66 "fix(pcb): declare In1.Cu/In2.Cu as
# power-plane layers, not signal" -- a 2-line layer-declaration change that
# moved ZERO components (`(at ` line count unchanged), so every alias below
# (source designator -> board reference, matched by KiCad sheetpath) is
# verified unaffected. The board hash is re-pinned to today's content; the
# source export hash is unchanged.
provenance:
  measured_at_commit: 3f1744ca3abfc14f8c80df78e8d359c264a46917
  dirty: UNKNOWN
  inputs:
    - path: pcb/temper.kicad_pcb
      sha256: 6928b7c8950a732f1991578f5ff7c080104c0847bf438ccd8bf2c75150544b64
    - path: elec/exports/temper.design-input.v1.json
      sha256: 4d724341e014a297a508b410d186219a0d81f109973e8cf14f08fef6bcd271f0
  tool_versions: {}
  source: backfilled-historical

# Re-derived 2026-08-01 against the post-#517/#521 board (169 components)
# by matching each board component's KiCad sheetpath to its source instance
# path (e.g. ...hb.gate_hs.driver -> U7). The #498 branch's manifest
# (measured 2026-07-30) predates the board resync and is stale for
# driver/boot-diode/adc/mcu/buck/gate-resistor/burden identities; the
# sheetpath match below is authoritative for the current board.
#
# Extended 2026-08-12 (docs/evidence/2026-08-12-thermal-emi-declaration-drift.md):
# thermal_management.yaml uses its own spelling for four of the same
# concepts already aliased above for temper_induction_cooker.yaml (U_RTD
# vs. MAX31865, R_GATE_HIGH/R_GATE_LOW vs. R_GATE_H/R_GATE_L) plus one name
# temper_induction_cooker.yaml never declared (TH_HEATSINK). Same sheetpath-
# match method, same authority commit/board -- these are net-new key strings
# resolving to already-verified targets below (U9, R23, R27), plus one new
# target (R60, the heatsink NTC) not previously in this manifest.
component_aliases:
  C_BUS1: C2       # power_in.c_bus1
  C_BUS2: C3       # power_in.c_bus2
  C_DC: C24        # hb.c_dc_hf
  C_BOOT: C17      # hb.gate_hs.boot_cap
  D_BOOT: U8       # hb.gate_hs.boot_diode
  U_RTD: U9        # rtd_pan.adc -- thermal_management.yaml's own spelling of the MAX31865 alias below
  TH_HEATSINK: R60 # safety.thermal.ntc (THM-01, "lug-mount on heatsink" per its own docstring
                   # in elec/src/modules.ato:2408 -- modeled as a Resistor footprint, "Using
                   # Resistor as NTC placeholder" per the same docstring, hence the R-prefix ref)
  R_GATE_HIGH: R23 # hb.gate_hs.rg_on -- thermal_management.yaml's own spelling of R_GATE_H below
  R_GATE_LOW: R27  # hb.gate_ls.rg_on -- thermal_management.yaml's own spelling of R_GATE_L below
  C_VCC2: C17      # hb.gate_hs.boot_cap -- thermal_management.yaml's own inline comment ("#
                   # Bootstrap cap") names this component; C17 is the only bootstrap cap in the
                   # design (same target as C_BOOT above) -- there is exactly one, so this is not
                   # a guess among candidates the way C_VCC1 (below, unresolved) would be
  MAX31865: U9     # rtd_pan.adc
  U_GATE: U7       # hb.gate_hs.driver
  U_GD: U7         # legacy validation.yaml spelling of U_GATE
  R_GATE_H: R23    # hb.gate_hs.rg_on
  R_GATE_L: R27    # hb.gate_ls.rg_on
  U_CT: T1         # ct_sense.ct
  R_BURDEN: R31    # ct_sense.r_burden
  C_CT_FILT: C28   # ct_sense.c_filter
  U_BUCK: U4       # power_mgmt.buck_3v3.buck
  U_MCU: U27       # mcu.mcu
  C_MCU_1: C38     # mcu.c_vcc1
  C_MCU_2: C39     # mcu.c_vcc2
  Y1: C6           # power_in.y_cap_pe

# These names are deliberately not aliases. Q1/Q2/D1/D2 are live board
# designators for different source instances, while the legacy config uses
# them as conceptual half-bridge names. C_VCC and C_TANK each have multiple
# legitimate candidates. Connector names below are absent from the source
# export/production board. Each must be resolved in the source model before
# the corresponding constraint can be enabled.
unresolved_components:
  Q1: live designator is power_in.q_relay_drv; legacy config means hb.power_loop.q_high (board ref U5)
  Q2: live designator is discharge.q_dis_drv; legacy config means hb.power_loop.q_low (board ref U6)
  D1: live designator is power_in.d_flyback; legacy config means power_in.d1 (board ref U1)
  D2: live designator is power_in.d_zcd_clamp; legacy config means power_in.d2 (board ref U2)
  C_VCC: multiple gate-driver decouplers exist (C20/C21/C22/C23)
  C_TANK: multiple resonant capacitors exist (C25/C26/C27)
  C_MCU_3: source export has only mcu.c_vcc1 and mcu.c_vcc2
  C_MCU_4: source export has only mcu.c_vcc1 and mcu.c_vcc2
  U_LDO_3V3: source has a buck regulator, not an LDO with this identity
  U_LDO_5V: no source-backed component with this identity
  J_AC_IN: no source-backed connector instance
  J_COIL: no source-backed connector instance
  J_NTC: no source-backed connector instance
  J_USB: no source-backed connector instance
  J_DEBUG: no source-backed connector instance
  R_SNUB: >-
    thermal_management.yaml describes an IGBT commutation snubber ('dissipates heat during
    switching... protect capacitor from electrolyte degradation'); the only real R/C snubber
    pair in the source is discharge.r_snub1/r_snub2 (board refs R19/R20), a contact-arc snubber
    across the bus-discharge relay contacts (elec/src/modules.ato lines 1258-1341), a different
    circuit than the one described. Two equally unprivileged real candidates exist and neither
    matches the stated intent -- not a rename.
  C_SNUB: >-
    same circuit-identity mismatch as R_SNUB -- the real pair is discharge.c_snub1/c_snub2
    (board refs C7/C8), paired with the relay-contact snubber resistors above, not an IGBT
    switching snubber cap.
  C_VCC1: >-
    paired in thermal_management.yaml with R_GATE_LOW as an implied low-side counterpart to
    C_VCC2 (the high-side bootstrap cap, aliased above to C17). No such counterpart exists in
    this half-bridge topology -- only the high side is a floating node that needs a bootstrap
    supply, the low side references ground directly. The closest real candidates
    (hb.c_vcci1/hb.c_vcci2, board refs C20/C21) are shared 3.3V logic-side decoupling for the
    gate-driver IC, not a per-side gate-drive VCC cap -- picking one would be a guess.

# auto_extract_loops() returns no production loop for the current netlist
# (loop extraction fails on the missing bus-capacitor path; the source export
# declares only a schematic-level commutation_loop). This is a
# data-completeness blocker, not a permission to map a loop by name.
loop_aliases: {}
unresolved_loops:
  commutation_loop: source export name has no extracted production loop
  high_side_gate_loop: legacy validation loop has no extracted production loop
  low_side_gate_loop: legacy validation loop has no extracted production loop
  power_stage_commutation: legacy constraint loop has no extracted production loop
  bootstrap: legacy validation loop has no extracted production loop
