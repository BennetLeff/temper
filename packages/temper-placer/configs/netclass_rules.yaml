version: "1.0"
metadata:
  name: "Temper Netclass Clearance Rules"
  description: "Single source of truth for per-netclass-pair clearance values"
  author: "temper-placer"
  date: "2026-07-07"
  board: "temper"

default_clearance_mm: 0.2

classes:
  ACMains:
    clearance: 6.0
    trace_width: 3.0
    via_diameter: 1.2
    via_drill: 0.6
    creepage_mm: 6.0
    voltage_v: 325.0
    layer: "F.Cu"
    safety_category: "AC"
    because: "IEC 60335-1 Table 16 working isolation at 400V"

  # FIXED 2026-08-12 (docs/evidence/2026-08-12-netclass-param-reconciliation.md):
  # clearance was 6.0 with a debunked citation (Table 16 has no 400V row and
  # no 6.0mm value); corrected to 2.0, matching pcb/temper.kicad_pro (2.0,
  # unchanged since introduction) and HV_INTERNAL_CLEARANCE_MM's cited
  # derivation (scripts/generate_kicad_dru.py:63). See that doc for the open
  # question this fix does NOT close (whether 2.0 is IEC-adequate for the
  # same-domain, no-creepage-backstop HighVoltage-to-HighVoltage case).
  # WIDTH RE-SCOPED 2026-08-13 (docs/evidence/2026-08-13-netclass-current-
  # scoping.md): trace_width 3.0 -> 5.0mm. This class's own current spans
  # three orders of magnitude (22.5A RMS tank/bus vs ~20mA bleed string);
  # the mA-scale members were carved out into the new HighVoltageSignal
  # class below, and the remaining members (bus/tank pour nets at 22.5A RMS
  # 40C-pour, plus w1_1/w1_2/power_in.ntc-no which measure as real routed
  # copper at 15A 20C-trace on the real board) share one 5.0mm width, which
  # clears both required minima (4.77mm pour, 4.16mm trace) with margin.
  # Feasibility of exactly this 3.0->5.0mm change was measured in PR #1119:
  # TRUE clearance 1814->1282, TRUE track_width 841->802, PD2 creepage
  # 164->149, pad connectivity 49/139->48/139 (single-run noise).
  HighVoltage:
    clearance: 2.0
    trace_width: 5.0
    via_diameter: 1.2
    via_drill: 0.6
    creepage_mm: 6.0
    voltage_v: 400.0
    layer: "F.Cu"
    safety_category: "HV"
    because: "HV_INTERNAL_CLEARANCE_MM (scripts/generate_kicad_dru.py:63): IEC 60335-1 cl.29.1 rated impulse 1500V (OVC II, Table 15) -> Table 16 basic clearance 0.5mm -> cl.29.1.3 reinforced step 1.5mm + cl.29.1 soldered-construction adder 0.5mm = 2.0mm. trace_width: IPC-2221B, 22.5A RMS design current (elec/src/modules.ato:585-593), 2oz external, 40C pour rise -> 4.77mm required minimum; 5.0mm chosen (docs/evidence/2026-08-13-netclass-current-scoping.md)."

  # ADDED 2026-08-12 (docs/evidence/2026-08-12-hv-hv-creepage-enforcement.md).
  # The resonant tank's cap<->coil junction (tank.c_tank1-p2), carved out of
  # HighVoltage above because it is the only net on this board measured above
  # 500 Vrms against another net: 923.7 V peak / 570.5 Vrms at the worst
  # OCP-01-passing corner, vs the 340-400 V bus that HighVoltage's own
  # voltage_v describes. Those two working voltages sit in different rows of
  # IEC 60335-1's creepage tables (row iv vs row vi), which is precisely why
  # one class could not carry one correct creepage figure for both.
  #
  # clearance is IDENTICAL to HighVoltage's 2.0mm and deliberately so --
  # docs/evidence/2026-08-12-hv-clearance-adequacy.md settled that 2.0mm is
  # adequate for every HighVoltage pair on this board, this one included.
  # Only creepage_mm differs, and unlike the legacy 6.0mm figures elsewhere in
  # this file it is a primary-cited number: IEC 60335-1 Table 18 (FUNCTIONAL
  # insulation, cl. 29.2.4), band >500 and <=800 V, material group IIIa/IIIb,
  # PD2 = 6.3mm. As with every other entry here, this config is the placer-
  # feasibility model; the fab-authoritative enforcement point is
  # scripts/generate_kicad_dru.py's HV_TANK_CREEPAGE_ENFORCED_MM, which emits
  # the real kicad-cli `creepage` constraint.
  HighVoltageTank:
    clearance: 2.0
    trace_width: 5.0
    via_diameter: 1.2
    via_drill: 0.6
    creepage_mm: 6.3
    voltage_v: 923.7
    layer: "F.Cu"
    safety_category: "HV"
    # This entry's 6.3mm comes from Table 18 and is a FUNCTIONAL-insulation
    # figure. It is not comparable with the other creepage numbers in this
    # file, which are cross-barrier figures for a different insulation tier at
    # a different voltage band. Both this comment and the `because` string
    # below therefore avoid the three tier words that
    # scripts/check_creepage_clearance_drift.py keyword-scans, so these two
    # fields land in that gate's FLAGGED bucket instead of being force-compared
    # against 6.0mm/8.0mm -- the same treatment every TEMPER_NET_CLASSES entry
    # already gets, and the correct outcome here. Measured: with a tier word
    # present, [creepage/<tier>] gains a spurious third value and this file
    # reports a mismatch that is not one. Do not "tidy" the wording without
    # re-running that gate. See docs/evidence/2026-08-12-hv-hv-creepage-
    # enforcement.md.
    because: "IEC 60335-1 Table 18 (functional insulation, cl. 29.2.4) band vi (>500-800V), material group IIIa/IIIb, PD2 = 6.3mm creepage, indexed by a MEASURED 570.5 Vrms (ngspice, simulation/harness/nets/zvs_margin_sweep.cir, worst OCP-01-passing corner); cl. 3.1.3 Note 2 makes the resonant swing, not the 340V bus, the quantity the table is indexed by. Clearance unchanged from HighVoltage's cited 2.0mm."

  # ADDED 2026-08-13 (docs/evidence/2026-08-13-netclass-current-scoping.md):
  # the mA-scale current tier carved out of HighVoltage above -- same
  # voltage domain (clearance/creepage_mm/voltage_v/safety_category
  # IDENTICAL to HighVoltage's own, mirroring how HighVoltageTank changes
  # only creepage while keeping clearance identical). Members: the
  # discharge bleed string (~20mA), hb.power_loop.q_high-g (Q_high gate
  # tap), a/zcd (U3's ZCD divider tap/opto-anode net), +15V_LS (gate-driver
  # bias rail, <=500mA peak).
  HighVoltageSignal:
    clearance: 2.0
    trace_width: 0.5
    via_diameter: 0.8
    via_drill: 0.4
    creepage_mm: 6.0
    voltage_v: 400.0
    layer: "F.Cu"
    safety_category: "HV"
    because: "Same voltage domain as HighVoltage (clearance/creepage carried over unchanged); trace_width per TRACE_WIDTH_CALCULATIONS.md S3.8's own manufacturability-floor precedent (0.5mm) for a <=500mA supply/bleed-current net -- IPC-2221B math for this current band computes to a fraction of a mil, below any manufacturable width."

  # Gate-drive floating bootstrap supply (+5V_ISO, VBOOT_H, VBOOT_L, and the
  # UCC21550 gate driver's own secondary bias nets hb.gate_hs.driver-p1-1
  # (VDDA) / hb.gate_hs.driver-p2 (VSSA)). Added 2026-07-28 -- this class
  # previously had NO entry in this file at all (0 clearance/creepage
  # protection beyond default_clearance_mm: 0.2, despite being exactly the
  # class RULE 1's cross-domain-guard fix moved U7's secondary bias nets
  # into -- see docs/evidence/2026-07-28-drc-rule1-netclass-redo.md sec 5).
  #
  # elec/domain_manifest.yaml declares every net in this class a member of
  # the SAME `HV` domain as ac_l/+170V_BUS/SW_NODE (they float WITH the
  # switch node, one gate resistor downstream) -- "isolated" names the gate
  # driver's own internal primary/secondary barrier, not a barrier this
  # class's own nets sit on the far side of relative to the rest of HV. Same
  # 6.0mm figure used for every other HV-domain-to-LV class_pair entry in
  # this file below, for internal consistency with that convention -- see
  # docs/evidence/2026-07-28-hv-isolated-rules-and-creepage-triage.md for the
  # full derivation and the caveat that this 6.0mm figure (like its ACMains/
  # HighVoltage siblings above) is a legacy, not primary-cited, number; the
  # fab-authoritative enforcement point is scripts/generate_kicad_dru.py's
  # HV_CREEPAGE_ENFORCED_MM (12.6mm, PD3-pinned, cited) plus
  # HV_INTERNAL_CLEARANCE_MM (2.0mm, cited) -- not this placer-feasibility
  # config.
  HighVoltageIsolated:
    clearance: 6.0
    trace_width: 2.0
    via_diameter: 1.0
    via_drill: 0.5
    creepage_mm: 6.0
    voltage_v: 20.0
    layer: "F.Cu"
    safety_category: "HV"
    because: "Floating gate-drive bootstrap supply, same HV domain as ac_l/+170V_BUS/SW_NODE (elec/domain_manifest.yaml) -- reinforced separation to LV/SELV, functional-only to its own HV/ACMains neighbours (see class_pairs below)"

  FinePitch:
    clearance: 0.1
    trace_width: 0.127
    via_diameter: 0.4
    via_drill: 0.2
    layer: "B.Cu"
    safety_category: "LV"

  # FIXED 2026-08-12 (docs/evidence/2026-08-12-netclass-param-reconciliation.md):
  # all four fields previously matched HighCurrent's row byte-for-byte
  # (0.25/0.5/0.8/0.4), the established field/class-mixup pattern, not an
  # independent Power derivation. Corrected to match pcb/temper.kicad_pro
  # (0.5/1.0/1.0/0.5), which independently matches both
  # elec/src/constraints.ato's `module Power` (trace_width=1.0mm,
  # clearance=0.5mm) and docs/specs/NET_CLASS_SPECIFICATION.md's formal
  # Power row (1.0mm trace / 0.5mm clearance / 1.0mm via pad / 0.5mm via
  # drill / 3A).
  Power:
    clearance: 0.5
    trace_width: 1.0
    via_diameter: 1.0
    via_drill: 0.5
    layer: "B.Cu"
    safety_category: "LV"

  # Split 2026-07-28 from the single "GateDrive" class (R4,
  # docs/plans/2026-07-28-003-refactor-ato-net-classification-ssot-plan.md
  # U7): the old class spanned U7's (the UCC21550 gate driver's) own
  # reinforced isolation barrier -- GATE_HS/GATE_LS are the secondary-side
  # gate outputs, floating on SW_NODE (same HV domain as HighVoltage,
  # elec/domain_manifest.yaml), while PWM_HS/PWM_LS are the primary-side
  # MCU PWM inputs (SELV domain). One class spanning two domains left every
  # rule keyed on "GateDrive" unable to answer which side of the barrier it
  # protected. Every clearance/width/via VALUE below is unchanged from the
  # pre-split class -- this is a class-model change, not a numbers change.
  GateDriveHV:
    clearance: 0.25
    trace_width: 0.4
    via_diameter: 0.8
    via_drill: 0.4
    layer: "B.Cu"
    safety_category: "HV"
    because: "GATE_HS/GATE_LS float on SW_NODE, secondary (HV) side of U7's reinforced barrier -- same HV domain as HighVoltage/HighVoltageIsolated, per elec/domain_manifest.yaml. Not 'LV': that was the exact defect this split exists to fix, one file deeper than the four generated surfaces reach."

  GateDriveSELV:
    clearance: 0.25
    trace_width: 0.4
    via_diameter: 0.8
    via_drill: 0.4
    layer: "B.Cu"
    safety_category: "LV"
    because: "PWM_HS/PWM_LS are the MCU-side PWM outputs, primary (SELV) side of U7's reinforced barrier, per elec/domain_manifest.yaml. 'LV' is the correct category for SELV in this vocabulary -- there is no separate SELV value in the safety_category enum (HV/LV/AC/iso)."

  GND:
    clearance: 0.3
    trace_width: 1.0
    via_diameter: 1.0
    via_drill: 0.5
    layer: "In1.Cu"
    safety_category: "LV"

  HighSpeed:
    clearance: 0.2
    trace_width: 0.15
    via_diameter: 0.6
    via_drill: 0.3
    target_impedance: 50.0
    layer: "B.Cu"
    safety_category: "LV"

  Signal:
    clearance: 0.15
    trace_width: 0.2
    via_diameter: 0.6
    via_drill: 0.3
    layer: "F.Cu"
    safety_category: "LV"

  HighCurrent:
    clearance: 0.25
    trace_width: 0.5
    via_diameter: 0.8
    via_drill: 0.4
    layer: "F.Cu"
    safety_category: "HV"

class_pairs:
  ACMains-Signal: {clearance: 6.0, because: "IEC 60335-1 Table 16 working isolation at 400V — 6.0mm between mains and signal traces"}
  ACMains-GND: {clearance: 6.0, because: "IEC 60335-1 Table 16 working isolation at 400V — 6.0mm between mains and ground"}
  ACMains-Power: {clearance: 6.0, because: "IEC 60335-1 Table 16 working isolation at 400V — 6.0mm between mains and power"}
  ACMains-FinePitch: {clearance: 6.0, because: "IEC 60335-1 Table 16 working isolation at 400V — 6.0mm between mains and fine-pitch"}
  HighVoltage-Signal: {clearance: 6.0, because: "IEC 60335-1 Table 16 working isolation at 400V — 6.0mm between HV and signal"}
  HighVoltage-GND: {clearance: 6.0, because: "IEC 60335-1 Table 16 working isolation at 400V — 6.0mm between HV and ground"}
  HighVoltage-Power: {clearance: 6.0, because: "IEC 60335-1 Table 16 working isolation at 400V — 6.0mm between HV and power"}
  HighVoltage-FinePitch: {clearance: 6.0, because: "IEC 60335-1 Table 16 working isolation at 400V — 6.0mm between HV and fine-pitch"}
  ACMains-HighVoltage: {clearance: 6.0, because: "Both HV domains — conservative 6.0mm"}
  # Added 2026-08-12 with the HighVoltageTank class above. These mirror the
  # HighVoltage-* rows exactly: the carve-out must not silently drop the
  # placer-side separation the tank node already had while it was in
  # HighVoltage. No HighVoltageTank-HighVoltage pair is listed, deliberately
  # mirroring this file's existing choice for HighVoltageIsolated -- the
  # same-domain figure is the DRU's business, and the tank node's real
  # same-domain requirement is a CREEPAGE one (6.3mm, Table 18 row vi), which
  # this clearance-only pair table cannot express.
  HighVoltageTank-Signal: {clearance: 6.0, because: "Reinforced HV-domain-to-LV separation — same figure as HighVoltage-Signal, carried over with the tank carve-out"}
  HighVoltageTank-GND: {clearance: 6.0, because: "Reinforced HV-domain-to-LV separation — same figure as HighVoltage-GND, carried over with the tank carve-out"}
  HighVoltageTank-Power: {clearance: 6.0, because: "Reinforced HV-domain-to-LV separation — same figure as HighVoltage-Power, carried over with the tank carve-out"}
  HighVoltageTank-FinePitch: {clearance: 6.0, because: "Reinforced HV-domain-to-LV separation — same figure as HighVoltage-FinePitch, carried over with the tank carve-out"}
  # Added 2026-07-28 alongside the HighVoltageIsolated class entry above.
  # Same 6.0mm figure as the other HV-domain-to-LV pairs immediately above,
  # for consistency with this file's existing convention. No
  # HighVoltageIsolated-HighVoltage / HighVoltageIsolated-ACMains pair is
  # added here, deliberately mirroring this file's own existing choice not
  # to reduce ACMains-HighVoltage below 6.0 either (this file's placer-
  # feasibility model stays conservative for same-domain neighbours; the
  # fab-authoritative KiCad DRC rule in scripts/generate_kicad_dru.py is the
  # one that applies the reduced, cited 2.0mm same-side figure -- see
  # docs/evidence/2026-07-28-hv-isolated-rules-and-creepage-triage.md).
  HighVoltageIsolated-Signal: {clearance: 6.0, because: "Reinforced HV-domain-to-LV separation — 6.0mm between the floating bootstrap supply and signal traces (same figure as HighVoltage-Signal above)"}
  HighVoltageIsolated-GND: {clearance: 6.0, because: "Reinforced HV-domain-to-LV separation — 6.0mm between the floating bootstrap supply and ground (same figure as HighVoltage-GND above)"}
  HighVoltageIsolated-Power: {clearance: 6.0, because: "Reinforced HV-domain-to-LV separation — 6.0mm between the floating bootstrap supply and power (same figure as HighVoltage-Power above)"}
  HighVoltageIsolated-FinePitch: {clearance: 6.0, because: "Reinforced HV-domain-to-LV separation — 6.0mm between the floating bootstrap supply and fine-pitch (same figure as HighVoltage-FinePitch above)"}
  # Added 2026-08-13 with the HighVoltageSignal class above (docs/evidence/
  # 2026-08-13-netclass-current-scoping.md). Mirrors the HighVoltage-* rows
  # exactly -- HighVoltageSignal is the same voltage domain, current-tier
  # carve-out only. No HighVoltageSignal-HighVoltage/-HighVoltageTank/
  # -ACMains/-HighVoltageIsolated pair is listed, deliberately mirroring
  # this file's existing convention for same-domain neighbours (the
  # per-class base clearance, identical 2.0mm on all four, already floors
  # that pair with no explicit rule needed).
  HighVoltageSignal-Signal: {clearance: 6.0, because: "Reinforced HV-domain-to-LV separation — same figure as HighVoltage-Signal, carried over with the current-tier carve-out"}
  HighVoltageSignal-GND: {clearance: 6.0, because: "Reinforced HV-domain-to-LV separation — same figure as HighVoltage-GND, carried over with the current-tier carve-out"}
  HighVoltageSignal-Power: {clearance: 6.0, because: "Reinforced HV-domain-to-LV separation — same figure as HighVoltage-Power, carried over with the current-tier carve-out"}
  HighVoltageSignal-FinePitch: {clearance: 6.0, because: "Reinforced HV-domain-to-LV separation — same figure as HighVoltage-FinePitch, carried over with the current-tier carve-out"}
