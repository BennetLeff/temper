# Netclass Clearance Rules
# Single source of truth for per-netclass-pair clearance values
# IEC 60335-1 compliant clearance for Temper induction cooker PCB
# Consumed by: CP-SAT placement encoder, router_v6, output-PCB writer, feedback handler

version: "1.0"

metadata:
  name: "Temper Netclass Clearance Rules"
  description: "Single source of truth for per-netclass-pair clearance values"
  author: "temper-placer"
  date: "2026-07-07"
  board: "temper"

default_clearance_mm: 0.2

net_classes:
  - name: "ACMains"
    trace_width: 2.5
    clearance: 6.0
    creepage_mm: 6.0
    via_diameter: 1.2
    via_drill: 0.6
    safety_category: "AC"
    voltage_v: 240.0

  - name: "HighVoltage"
    trace_width: 3.0
    clearance: 6.0
    creepage_mm: 6.0
    via_diameter: 1.2
    via_drill: 0.6
    safety_category: "HV"
    voltage_v: 400.0

  - name: "FinePitch"
    trace_width: 0.127
    clearance: 0.1
    via_diameter: 0.4
    via_drill: 0.2
    safety_category: "LV"

  - name: "Power"
    trace_width: 0.5
    clearance: 0.25
    via_diameter: 0.8
    via_drill: 0.4
    safety_category: "LV"

  - name: "GateDrive"
    trace_width: 0.4
    clearance: 0.25
    via_diameter: 0.8
    via_drill: 0.4
    safety_category: "LV"

  - name: "GND"
    trace_width: 1.0
    clearance: 0.3
    via_diameter: 1.0
    via_drill: 0.5
    safety_category: "LV"

  - name: "HighSpeed"
    trace_width: 0.15
    clearance: 0.2
    via_diameter: 0.6
    via_drill: 0.3
    safety_category: "LV"

  - name: "Signal"
    trace_width: 0.2
    clearance: 0.15
    via_diameter: 0.6
    via_drill: 0.3
    safety_category: "LV"

  - name: "HighCurrent"
    trace_width: 0.5
    clearance: 0.25
    via_diameter: 0.8
    via_drill: 0.4
    safety_category: "HV"

cross_class_clearances:
  # ============================================================
  # SAFETY-CRITICAL PAIRS — IEC 60335-1 Table 16
  # AC mains and high-voltage DC bus must maintain working
  # isolation clearance from all low-voltage circuits.
  # ============================================================

  - class_a: "ACMains"
    class_b: "Signal"
    clearance_mm: 6.0
    tier: 1
    because: "IEC 60335-1 Table 16 working isolation at 400V — 6.0mm clearance between mains voltage and signal traces"

  - class_a: "ACMains"
    class_b: "GND"
    clearance_mm: 6.0
    tier: 1
    because: "IEC 60335-1 Table 16 working isolation at 400V — 6.0mm clearance between mains voltage and ground planes"

  - class_a: "ACMains"
    class_b: "Power"
    clearance_mm: 6.0
    tier: 1
    because: "IEC 60335-1 Table 16 working isolation at 400V — 6.0mm clearance between mains voltage and power distribution"

  - class_a: "ACMains"
    class_b: "FinePitch"
    clearance_mm: 6.0
    tier: 1
    because: "IEC 60335-1 Table 16 working isolation at 400V — 6.0mm clearance between mains voltage and fine-pitch IC connections"

  - class_a: "HighVoltage"
    class_b: "Signal"
    clearance_mm: 6.0
    tier: 1
    because: "IEC 60335-1 Table 16 working isolation at 400V — 6.0mm clearance between high voltage DC bus and signal traces"

  - class_a: "HighVoltage"
    class_b: "GND"
    clearance_mm: 6.0
    tier: 1
    because: "IEC 60335-1 Table 16 working isolation at 400V — 6.0mm clearance between high voltage DC bus and ground planes"

  - class_a: "HighVoltage"
    class_b: "Power"
    clearance_mm: 6.0
    tier: 1
    because: "IEC 60335-1 Table 16 working isolation at 400V — 6.0mm clearance between high voltage DC bus and power distribution"

  - class_a: "HighVoltage"
    class_b: "FinePitch"
    clearance_mm: 6.0
    tier: 1
    because: "IEC 60335-1 Table 16 working isolation at 400V — 6.0mm clearance between high voltage DC bus and fine-pitch IC connections"

  - class_a: "ACMains"
    class_b: "HighVoltage"
    clearance_mm: 6.0
    tier: 1
    because: "IEC 60335-1 Table 16 working isolation at 400V — 6.0mm clearance between mains voltage and high voltage DC bus (both HV categories, conservative)"

  # ============================================================
  # ROUTINE PAIRS — manufacturer default clearances
  # No safety-critical isolation required between same-voltage
  # domain classes; clearance derived from max(self-clearance).
  # ============================================================

  - class_a: "Power"
    class_b: "Signal"
    clearance_mm: 0.25
    tier: 3

  - class_a: "Power"
    class_b: "GND"
    clearance_mm: 0.3
    tier: 3

  - class_a: "Power"
    class_b: "FinePitch"
    clearance_mm: 0.25
    tier: 3

  - class_a: "GND"
    class_b: "Signal"
    clearance_mm: 0.3
    tier: 3

  - class_a: "GND"
    class_b: "FinePitch"
    clearance_mm: 0.3
    tier: 3

  - class_a: "GateDrive"
    class_b: "Signal"
    clearance_mm: 0.25
    tier: 3

  - class_a: "GateDrive"
    class_b: "FinePitch"
    clearance_mm: 0.25
    tier: 3

  - class_a: "GateDrive"
    class_b: "Power"
    clearance_mm: 0.25
    tier: 3

  - class_a: "GateDrive"
    class_b: "GND"
    clearance_mm: 0.3
    tier: 3

  - class_a: "Signal"
    class_b: "FinePitch"
    clearance_mm: 0.15
    tier: 3

  - class_a: "HighSpeed"
    class_b: "Signal"
    clearance_mm: 0.2
    tier: 3

  - class_a: "HighCurrent"
    class_b: "Signal"
    clearance_mm: 0.25
    tier: 3
