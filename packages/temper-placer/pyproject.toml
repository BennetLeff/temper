[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "temper-placer"
version = "0.1.0"
description = "CP-SAT-based PCB placement optimizer for the Temper induction cooker"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Temper Project", email = "temper@example.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
keywords = ["pcb", "placement", "optimization", "kicad", "eda"]

dependencies = [
    "kiutils>=1.4.0",
    "numpy>=1.24.0",
    "ortools>=9.12",
    "pyyaml>=6.0",
    "plotly>=5.18.0",
    "websockets>=12.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "networkx>=3.0",
    "python-louvain>=0.16",
    "psutil>=5.9.0",
    "jsonschema>=4.20.0",
    "numba>=0.63.1",
    "tqdm>=4.67.1",
    "opencv-python>=4.11.0.86",
    "shapely>=2.1.2",
    "pandas>=2.0.0",
    "pydantic>=2.13.4",
    "scipy>=1.10.0",
    "ortools>=9.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
    "hypothesis>=6.0.0",
]
gpu = []
[project.scripts]
temper-placer = "temper_placer.cli:main"
temper = "temper_placer.cli:main"

[project.urls]
Homepage = "https://github.com/temper-project/temper-placer"
Documentation = "https://github.com/temper-project/temper-placer#readme"
Repository = "https://github.com/temper-project/temper-placer"

[tool.hatch.build.targets.wheel]
packages = ["src/temper_placer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU",
    "ci: marks tests for CI robustness validation",
    "benchmark: marks performance benchmark tests",
    "monte_carlo: marks Monte Carlo simulation tests (require many iterations)",
    "external: marks tests that use external PCB fixtures (require download first)",
    "comparison: marks ground truth comparison tests",
    "ci: marks tests suitable for fast CI validation",
    "robustness: marks tests for optimizer robustness and convergence",
    "property: marks property-based (Hypothesis) tests",
    "routing: marks routing DRC regression gate tests (golden-board CI gate)",
    "l0_unit: Level 0 - unit properties (CI: every commit)",
    "l1_exhaustive: Level 1 - exhaustive 2x2 (CI: every commit)",
    "l2_exhaustive: Level 2 - exhaustive 3x3 (CI: every commit)",
    "l3_pbt: Level 3 - PBT on arbitrary grids (CI: PR only)",
    "l4_regression: Level 4 - real-world regression (CI: PR only)",
    "dependency: marks tests for pytest-dependency lattice ordering (NFR7)",
    "pbt_low_priority: marks PBT tests that can be skipped under CI-fast to meet time budget",
    "integration: marks integration tests that span multiple components",
    "nightly: marks tests that run only in scheduled nightly CI (too heavy for per-commit)",
    "bmc_l0_encoding: Level 0 BMC encoding correctness tests — exhaustive N <= 10",
    "k1: K1 — closed-form analytic validation of thermal FDM solver",
    "k2: K2 — real copper offset / geometry-faithful validation",
    "k4: K4 — determinism / bit-stability validation",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without explicit strict parameter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002"]
"**/cli/**/*.py" = ["ARG001"]  # click decorators bind params
"**/visualization/routing_health.py" = ["E701", "E702", "F821"]  # compact routing debug logic
"**/validation/drc_runner.py" = ["E741"]  # loop variable in listcomp
"**/pcl/tag_dispatch.py" = ["UP007"]  # Optional for compat
"**/validation/results/battery_run.py" = ["SIM105", "B025"]  # intentional suppress
"**/physics/copper_coverage.py" = ["SIM102"]  # clearer as-is
"**/placer/cp_sat/feedback.py" = ["SIM102"]
"**/router_v6/adapter.py" = ["SIM102"]
"**/router_v6/quality/via_count.py" = ["SIM102"]
"**/*.py" = ["E402"]  # intentional deferred imports for circular-import avoidance
"**/core/state.py" = ["F821"]  # PyO3 dynamic attributes
"**/validation/mfem_compare.py" = ["F821"]
"**/validation/mfem_gate.py" = ["F821"]
"**/validation/mfem_mesh.py" = ["F821"]

[tool.ruff.lint.isort]
known-first-party = ["temper_placer"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
mypy_path = "stubs"
check_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = "yaml"
follow_imports = "skip"

[dependency-groups]
dev = [
    "hypothesis>=6.148.7",
    "pytest>=9.0.2",
    "pytest-bdd>=8.1.0",
    "pytest-timeout>=2.3.1",
    "python-sat>=1.8.dev14",
]
