# Cloudflare Worker configuration for the temper WASM verification tier
# — per-family shard layout (Phase 1 U8).
#
# This Worker runs one temper-drc-rs test function per HTTP invocation (R17)
# across eight family modules (full 147-test + seven per-family shards).
# The multi-family core (src/worker_core.js) lazily instantiates each family's
# module on the first request to that family's route.
#
# Deployment requires:
#   - `account_id` — filled in from the U7 deploy runbook
#   - `wrangler login` (or CLOUDFLARE_API_TOKEN in the environment)
#   - A wrangler version that supports module-syntax Workers (v3.x+; tested
#     against 4.120.0)
#
# Build + stage (then deploy):
#   bash scripts/stage_wasm_families.sh   # builds .wasm and copies to src/
#   wrangler deploy                       # from packages/temper-worker
#
# No KV, R2, D1, Durable Objects, or secrets — the Worker is stateless.
# The only bindings are the compiled WASM modules (imported directly).
name = "temper-wasm-tier"
main = "src/index.js"
compatibility_date = "2026-08-01"

[vars]
ABI_VERSION = "1"

# --- Per-family WASM modules ---
# Eight .wasm files are imported directly in src/index.js.  Module-syntax
# Workers get each file as a `WebAssembly.Module` compiled at upload time
# (wrangler's bundler handles .wasm imports natively).  Instantiation
# happens lazily per family in worker_core.js.
#
# Staged by scripts/stage_wasm_families.sh from cargo builds; gitignored.

# --- account_id ---
account_id = "03f642afe070f05b727f7cd31f02ef48"
