[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "temper-harness"
version = "0.1.0"
description = "Provider transport, accounting, and fidelity instruments for the Temper agent harness"
requires-python = ">=3.11"
dependencies = [
    # Schema validation for the ledger, usage, error, envelope, and recording
    # records. R14 requires those records be defined by committed schema files
    # rather than inline constants, and a schema nobody validates against is
    # documentation, not a contract.
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
]

[project.scripts]

[tool.hatch.build.targets.wheel]
packages = ["src/temper_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# xfail_strict = true: an @pytest.mark.xfail that unexpectedly passes (XPASS)
# is a hard failure, not a green skip. Mirrors the root pyproject.toml.
xfail_strict = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["temper_harness"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
