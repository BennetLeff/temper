[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "temper-harness"
version = "0.1.0"
description = "Provider transport, accounting, and fidelity instruments for the Temper agent harness"
requires-python = ">=3.11"
dependencies = [
    # Schema validation for the ledger, usage, error, envelope, and recording
    # records. R14 requires those records be defined by committed schema files
    # rather than inline constants, and a schema nobody validates against is
    # documentation, not a contract.
    "jsonschema>=4.0",
    # The live adapter's HTTP client. `requests` rather than a new dependency
    # because it is already the workspace's precedent (temper-workflow declares
    # it) and already installed; a second HTTP client in one repo is a second
    # set of timeout, redirect, and retry semantics to reason about.
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
]

[project.scripts]
# The probe is a process, not a library: nothing imports it, so a console-script
# entry point is what makes it reachable. Declared here rather than left as an
# orphan-with-a-note, because the entry point is the honest description of how it
# is invoked (`python -m temper_harness.provider.probe` also works).
temper-harness-probe = "temper_harness.provider.probe:main"

[tool.hatch.build.targets.wheel]
packages = ["src/temper_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# xfail_strict = true: an @pytest.mark.xfail that unexpectedly passes (XPASS)
# is a hard failure, not a green skip. Mirrors the root pyproject.toml.
xfail_strict = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["temper_harness"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
