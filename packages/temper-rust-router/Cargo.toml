[package]
name = "temper-rust-router"
version = "0.1.0"
edition = "2024"
description = "Router V6 topology stage — pyo3 Python extension (wraps temper-rust-router-core)"

[lib]
name = "temper_rust_router"
# `rlib` alongside `cdylib` so `cargo test` can build a harness for the
# in-crate unit tests (net_ordering's CPython-semantics pins). `cdylib` alone
# leaves nothing for the test binary to link against.
crate-type = ["cdylib", "rlib"]

[dependencies]
temper-rust-router-core = { path = "../temper-rust-router-core" }
pyo3 = { version = "0.29", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "unwind"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
