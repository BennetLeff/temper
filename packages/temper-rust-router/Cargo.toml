[package]
name = "temper-rust-router"
version = "0.1.0"
edition = "2024"
description = "Router V6 topology stage — pyo3 Python extension (wraps temper-rust-router-core)"

[lib]
name = "temper_rust_router"
# `rlib` alongside `cdylib` so `cargo test` can build a harness for the
# in-crate unit tests (net_ordering's CPython-semantics pins). `cdylib` alone
# leaves nothing for the test binary to link against.
crate-type = ["cdylib", "rlib"]

[dependencies]
# `default-features = false` turns off `sat` (rustsat-cadical, a C++ solver
# with no `wasm32-unknown-unknown` build) by default; the `python` feature
# below forwards it back on, since `solve_topology_rust` (behind `python`)
# is the only consumer of `temper_rust_router_core::solver`.
temper-rust-router-core = { path = "../temper-rust-router-core", default-features = false }
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[features]
default = ["python"]
python = ["dep:pyo3", "temper-rust-router-core/sat"]
# Compiles the `#[cfg(test)]` unit-test modules into a normal (non-test) build
# and exposes them through `wasm_test_registry`, so a `wasm32` entry point can
# call each test function by index -- `cargo test`'s libtest harness cannot
# target `wasm32-unknown-unknown`.  Off by default; never enabled for the
# Python extension module.  Mirrors `temper-io-types`/`temper-quality-oracle`'s
# feature set exactly, so the shared runner wires every crate on the tier the
# same way.
#
# `wasm-registry` is the umbrella feature that gates module visibility; every
# per-family feature implies it.  The three surviving modules
# (`layer_assignment`, `terminal_planning`, `net_ordering`) are a flat set of
# pure topology kernels with no rule-family taxonomy to shard along, so this
# crate declares one family (`rust-router`).
wasm-registry = []
wasm-registry-rust-router = ["wasm-registry"]
wasm-registry-all = ["wasm-registry-rust-router"]
wasm-test-registry = ["wasm-registry", "wasm-registry-all"]

[profile.release]
panic = "unwind"

[dev-dependencies]
proptest = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
