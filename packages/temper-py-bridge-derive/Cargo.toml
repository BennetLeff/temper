[package]
name = "temper-py-bridge-derive"
version = "0.1.0"
edition = "2024"
description = "Proc-macro derive for FromPyDict and ToPyDict"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
