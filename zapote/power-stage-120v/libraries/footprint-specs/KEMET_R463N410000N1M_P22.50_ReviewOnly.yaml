lead_fit: >-
  1.2 mm drill vs 0.85 mm max lead gives 0.175 mm radial play per hole,
  0.35 mm total pitch accommodation. At the 22.5 +/- 0.4 mm pitch extreme the
  leads need a further 0.05 mm of forming, which is within normal radial-lead
  insertion; confirm on the first article.
modifications_from_stock:
