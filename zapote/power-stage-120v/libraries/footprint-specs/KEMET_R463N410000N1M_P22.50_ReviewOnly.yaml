    Max body (26.8 x 11.2 mm) centred on the pitch midpoint, plus 0.25 mm
    across the width and 0.10 mm (IPC-7351 least) at the length ends. The
    length-end allowance is the least because C2's ends sit 0.16 mm from C5's
    courtyard and on the 10 mm heat-sink zone line; the length extent equals
    the stock pattern's, so C2's clearances are unchanged.
