[package]
name = "zapote-drc"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zapote-core = { path = "../zapote-core" }

serde_json.workspace = true
sha2.workspace = true
serde.workspace = true
geo = { version = "0.29.3", default-features = false }
spade = "2.15.1"
faer = { version = "0.24.4", default-features = false, features = ["std", "sparse-linalg"] }

[dev-dependencies]
proptest = "1"
flate2 = "1"

[[bench]]
name = "layout_quality"
harness = false
