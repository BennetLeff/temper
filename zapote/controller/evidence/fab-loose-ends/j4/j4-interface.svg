<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" width="1180" height="900" font-family="Helvetica, Arial, sans-serif" font-size="12">
<rect width="1180" height="900" fill="#ffffff"/>
<text x="20" y="30" font-size="20" font-weight="bold">J4 interface: controller 15 V input / native-21 harness</text>
<text x="20" y="50" fill="#444">Controller J4 = Molex Micro-Fit 3.0 43045-1600 (LCSC C277731), 2x8, right-angle THT, mating -X (left board edge). Generated by j4_drawing.py from the committed KiCad footprint and README/DECISIONS C17.</text>
<text x="20" y="80" font-size="14" font-weight="bold">Header pad grid, top view (footprint frame, mm)</text>
<rect x="30" y="90" width="900" height="200" fill="#f4f4f0" stroke="#999" stroke-dasharray="4 3"/>
<text x="34" y="102" fill="#666">courtyard not drawn: Molex envelope drawing unread (UNVERIFIED)</text>
<rect x="51.0" y="141.0" width="18" height="18" fill="#1a5fb4"/>
<text x="60.0" y="154.0" fill="#fff" font-size="10" text-anchor="middle">1</text>
<text x="60.0" y="134.0" text-anchor="middle" font-size="10" fill="#1a5fb4">v15_selv</text>
<circle cx="180.0" cy="150.0" r="9" fill="#333333"/>
<text x="180.0" y="154.0" fill="#fff" font-size="10" text-anchor="middle">2</text>
<text x="180.0" y="134.0" text-anchor="middle" font-size="10" fill="#333333">selv_gnd</text>
<circle cx="300.0" cy="150.0" r="9" fill="#c64600"/>
<text x="300.0" y="154.0" fill="#fff" font-size="10" text-anchor="middle">3</text>
<text x="300.0" y="134.0" text-anchor="middle" font-size="10" fill="#c64600">v3v3</text>
<circle cx="420.0" cy="150.0" r="9" fill="#333333"/>
<text x="420.0" y="154.0" fill="#fff" font-size="10" text-anchor="middle">4</text>
<text x="420.0" y="134.0" text-anchor="middle" font-size="10" fill="#333333">selv_gnd</text>
<circle cx="540.0" cy="150.0" r="9" fill="#c64600"/>
<text x="540.0" y="154.0" fill="#fff" font-size="10" text-anchor="middle">5</text>
<text x="540.0" y="134.0" text-anchor="middle" font-size="10" fill="#c64600">pwm_ha</text>
<circle cx="660.0" cy="150.0" r="9" fill="#c64600"/>
<text x="660.0" y="154.0" fill="#fff" font-size="10" text-anchor="middle">6</text>
<text x="660.0" y="134.0" text-anchor="middle" font-size="10" fill="#c64600">pwm_la</text>
<circle cx="780.0" cy="150.0" r="9" fill="#c64600"/>
<text x="780.0" y="154.0" fill="#fff" font-size="10" text-anchor="middle">7</text>
<text x="780.0" y="134.0" text-anchor="middle" font-size="10" fill="#c64600">pwm_hb</text>
<circle cx="900.0" cy="150.0" r="9" fill="#c64600"/>
<text x="900.0" y="154.0" fill="#fff" font-size="10" text-anchor="middle">8</text>
<text x="900.0" y="134.0" text-anchor="middle" font-size="10" fill="#c64600">pwm_lb</text>
<circle cx="60.0" cy="270.0" r="9" fill="#c64600"/>
<text x="60.0" y="274.0" fill="#fff" font-size="10" text-anchor="middle">9</text>
<text x="60.0" y="294.0" text-anchor="middle" font-size="10" fill="#c64600">permit</text>
<circle cx="180.0" cy="270.0" r="9" fill="#1a5fb4"/>
<text x="180.0" y="274.0" fill="#fff" font-size="10" text-anchor="middle">10</text>
<text x="180.0" y="294.0" text-anchor="middle" font-size="10" fill="#1a5fb4">bus_fault</text>
<circle cx="300.0" cy="270.0" r="9" fill="#1a5fb4"/>
<text x="300.0" y="274.0" fill="#fff" font-size="10" text-anchor="middle">11</text>
<text x="300.0" y="294.0" text-anchor="middle" font-size="10" fill="#1a5fb4">vbus_p</text>
<circle cx="420.0" cy="270.0" r="9" fill="#1a5fb4"/>
<text x="420.0" y="274.0" fill="#fff" font-size="10" text-anchor="middle">12</text>
<text x="420.0" y="294.0" text-anchor="middle" font-size="10" fill="#1a5fb4">vbus_n</text>
<circle cx="540.0" cy="270.0" r="9" fill="#1a5fb4"/>
<text x="540.0" y="274.0" fill="#fff" font-size="10" text-anchor="middle">13</text>
<text x="540.0" y="294.0" text-anchor="middle" font-size="10" fill="#1a5fb4">ct_zc</text>
<circle cx="660.0" cy="270.0" r="9" fill="#1a5fb4"/>
<text x="660.0" y="274.0" fill="#fff" font-size="10" text-anchor="middle">14</text>
<text x="660.0" y="294.0" text-anchor="middle" font-size="10" fill="#1a5fb4">ct_mon</text>
<circle cx="780.0" cy="270.0" r="9" fill="#333333"/>
<text x="780.0" y="274.0" fill="#fff" font-size="10" text-anchor="middle">15</text>
<text x="780.0" y="294.0" text-anchor="middle" font-size="10" fill="#333333">selv_gnd</text>
<circle cx="900.0" cy="270.0" r="9" fill="#1a5fb4"/>
<text x="900.0" y="274.0" fill="#fff" font-size="10" text-anchor="middle">16</text>
<text x="900.0" y="294.0" text-anchor="middle" font-size="10" fill="#1a5fb4">line_zc</text>
<polygon points="34,142 34,158 46,150" fill="#d00000"/>
<text x="8" y="184" fill="#d00000" font-weight="bold">PIN 1</text>
<text x="60" y="318" fill="#444">Row A = pins 1-8 (left to right), row B = pins 9-16 below it; pin 3.00 mm pitch, row spacing 3.00 mm. Pin 1 square pad.</text>
<text x="60" y="334" fill="#444">Two 3.0 mm non-plated peg holes at x = 2.16 and 18.86, y = -4.32 (footprint frame). Plated drill 1.02 mm, pad 1.5 mm.</text>
<text x="975" y="95" font-size="14" font-weight="bold">Legend</text>
<circle cx="985" cy="112" r="7" fill="#1a5fb4"/><text x="998" y="116">controller input</text>
<circle cx="985" cy="132" r="7" fill="#c64600"/><text x="998" y="136">controller output</text>
<circle cx="985" cy="152" r="7" fill="#333333"/><text x="998" y="156">return / selv_gnd</text>
<text x="20" y="375" font-size="14" font-weight="bold">Harness SELV_J4_to_controller (1:1, pin 1 to pin 1)</text>
<rect x="20" y="389" width="150" height="60" fill="#eef3ff" stroke="#1a5fb4"/><text x="95" y="413" text-anchor="middle" font-weight="bold">controller J4</text><text x="95" y="431" text-anchor="middle">43045-1600 R/A header</text>
<rect x="1010" y="389" width="150" height="60" fill="#eef3ff" stroke="#1a5fb4"/><text x="1085" y="413" text-anchor="middle" font-weight="bold">native-21 J4</text><text x="1085" y="431" text-anchor="middle">43045-1612 vertical</text>
<line x1="170" y1="419" x2="1010" y2="419" stroke="#333" stroke-width="4"/>
<rect x="170" y="401" width="110" height="36" fill="#fff" stroke="#333"/><text x="225" y="416" text-anchor="middle">43025-1600</text><text x="225" y="430" text-anchor="middle">housing, 16 pos</text>
<rect x="900" y="401" width="110" height="36" fill="#fff" stroke="#333"/><text x="955" y="416" text-anchor="middle">43025-1600</text><text x="955" y="430" text-anchor="middle">housing, 16 pos</text>
<text x="590" y="409" text-anchor="middle">16 x AWG22, length &lt;= 1 m (allocation; harness length not yet specified in ENCLOSURE-HANDOFF)</text>
<text x="590" y="435" text-anchor="middle" fill="#444">crimp: 43030-0001 (20-24 AWG, tin) x 32; gold alt 43030-0008; crimp tool / die not selected here</text>
<text x="590" y="453" text-anchor="middle" fill="#444">vbus_p/vbus_n (11/12) twisted pair; D-11 harness: &lt;= 400 pF to ground, &lt;= 200 pF between conductors</text>
<text x="20" y="475" fill="#444">Contact rating 8.5 A (LCSC C277731), 600 V; used at 0.32 A on pin 1, 0.85 A peak shared by pins 2/4/15 (DECISIONS C17), so the contacts run at about 10 % of rating or less.</text>
<text x="20" y="491" fill="#444">Polarity: the 43025/43045 shells are keyed (shell shape and latch polarise the mating, no reverse fit); pin 1 triangle on the housing at the pin 1 end; wire colours not assigned.</text>
<text x="20" y="535" font-size="14" font-weight="bold">Pin map</text>
<text x="20" y="555" font-weight="bold">Pin</text><text x="60" y="555" font-weight="bold">Net</text><text x="160" y="555" font-weight="bold">Dir</text><text x="215" y="555" font-weight="bold">Level / current / note</text>
<rect x="14" y="562" width="1152" height="19" fill="#ffffff"/>
<text x="20" y="575">1</text><text x="60" y="575" fill="#1a5fb4">v15_selv</text><text x="160" y="575">IN</text><text x="215" y="575">+15 V +/-2.5 % from PS1 IRM-20-15; ~0.32 A (4.83 W logic load); feeds the 3.3 V buck only</text>
<rect x="14" y="581" width="1152" height="19" fill="#f6f6f6"/>
<text x="20" y="594">2</text><text x="60" y="594" fill="#333333">selv_gnd</text><text x="160" y="594">RTN</text><text x="215" y="594">15 V return, shares 0.85 A peak with pins 4 and 15</text>
<rect x="14" y="600" width="1152" height="19" fill="#ffffff"/>
<text x="20" y="613">3</text><text x="60" y="613" fill="#c64600">v3v3</text><text x="160" y="613">OUT</text><text x="215" y="613">3.3 V from the controller buck; native-21 sees 3.237-3.389 V; &lt;= 49.4 mA</text>
<rect x="14" y="619" width="1152" height="19" fill="#f6f6f6"/>
<text x="20" y="632">4</text><text x="60" y="632" fill="#333333">selv_gnd</text><text x="160" y="632">RTN</text><text x="215" y="632">return</text>
<rect x="14" y="638" width="1152" height="19" fill="#ffffff"/>
<text x="20" y="651">5</text><text x="60" y="651" fill="#c64600">pwm_ha</text><text x="160" y="651">OUT</text><text x="215" y="651">3.3 V logic, GPIO-driven, 10 kOhm pull-down at J4</text>
<rect x="14" y="657" width="1152" height="19" fill="#f6f6f6"/>
<text x="20" y="670">6</text><text x="60" y="670" fill="#c64600">pwm_la</text><text x="160" y="670">OUT</text><text x="215" y="670">3.3 V logic, 10 kOhm pull-down</text>
<rect x="14" y="676" width="1152" height="19" fill="#ffffff"/>
<text x="20" y="689">7</text><text x="60" y="689" fill="#c64600">pwm_hb</text><text x="160" y="689">OUT</text><text x="215" y="689">3.3 V logic, 10 kOhm pull-down</text>
<rect x="14" y="695" width="1152" height="19" fill="#f6f6f6"/>
<text x="20" y="708">8</text><text x="60" y="708" fill="#c64600">pwm_lb</text><text x="160" y="708">OUT</text><text x="215" y="708">3.3 V logic, 10 kOhm pull-down</text>
<rect x="14" y="714" width="1152" height="19" fill="#ffffff"/>
<text x="20" y="727">9</text><text x="60" y="727" fill="#c64600">permit</text><text x="160" y="727">OUT</text><text x="215" y="727">PERMIT = latch Q AND RUN_EN (U37); 10 kOhm pull-down R103</text>
<rect x="14" y="733" width="1152" height="19" fill="#f6f6f6"/>
<text x="20" y="746">10</text><text x="60" y="746" fill="#1a5fb4">bus_fault</text><text x="160" y="746">IN</text><text x="215" y="746">native-21 OR of OCP/OVP/HOT5/CT; 10 kOhm pull-up, open wire reads fault</text>
<rect x="14" y="752" width="1152" height="19" fill="#ffffff"/>
<text x="20" y="765">11</text><text x="60" y="765" fill="#1a5fb4">vbus_p</text><text x="160" y="765">IN</text><text x="215" y="765">D-11 bus sense +, receiver U5; &lt;= 400 pF to ground, &lt;= 200 pF between pair</text>
<rect x="14" y="771" width="1152" height="19" fill="#f6f6f6"/>
<text x="20" y="784">12</text><text x="60" y="784" fill="#1a5fb4">vbus_n</text><text x="160" y="784">IN</text><text x="215" y="784">D-11 bus sense -, tight pair with pin 11</text>
<rect x="14" y="790" width="1152" height="19" fill="#ffffff"/>
<text x="20" y="803">13</text><text x="60" y="803" fill="#1a5fb4">ct_zc</text><text x="160" y="803">IN</text><text x="215" y="803">CT zero-cross to GPIO38, 1 kOhm series</text>
<rect x="14" y="809" width="1152" height="19" fill="#f6f6f6"/>
<text x="20" y="822">14</text><text x="60" y="822" fill="#1a5fb4">ct_mon</text><text x="160" y="822">IN</text><text x="215" y="822">CT monitor, U6 buffer &gt;= 10 MOhm DC, 0 V when unplugged</text>
<rect x="14" y="828" width="1152" height="19" fill="#ffffff"/>
<text x="20" y="841">15</text><text x="60" y="841" fill="#333333">selv_gnd</text><text x="160" y="841">RTN</text><text x="215" y="841">return</text>
<rect x="14" y="847" width="1152" height="19" fill="#f6f6f6"/>
<text x="20" y="860">16</text><text x="60" y="860" fill="#1a5fb4">line_zc</text><text x="160" y="860">IN</text><text x="215" y="860">line zero-cross to GPIO39, 1 kOhm series</text>
<text x="20" y="886" fill="#a00000">Open item: Molex sales drawing 430451600_sd not read (molex.com unreachable); envelope, mated height 10.29 mm (series figure, 43045-2001) and plug overhang remain [UNVERIFIED].</text>
</svg>
