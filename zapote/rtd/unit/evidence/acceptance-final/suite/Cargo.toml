[workspace]
resolver = "2"
members = [
  "packages/zapote-core",
  "packages/zapote-erc",
  "packages/zapote-drc",
  "packages/zapote-harness",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"

