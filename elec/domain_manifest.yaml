      - s1                   # ADDED 2026-08-13. OCP-02's second CT (T2 /
                             # safety.ocp2.ct)'s secondary S1 node -- the
                             # SELV twin of `hb-gnd` above (T2's HV-side
                             # primary net) and the direct analogue of
                             # `I_SENSE` above (T1's secondary). No
                             # `override_net_name` was applied for this
                             # signal (SecondaryOCPComparator.i_sense.line),
                             # so atopile's auto-namer produced the bare
                             # pin-derived name `s1` -- undeclared for the
                             # same reason `hb-gnd` was: the manifest gained
                             # safety.ocp2.ct's instance_path but never this
