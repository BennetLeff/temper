      # ---------------------------------------------------------------
      # DOMAIN-COVERAGE COMPLETION, 2026-08-20.
      #
      # THE GAP THIS CLOSES. Until this change 77 of the 139 pad-carrying
      # nets on pcb/temper.kicad_pcb (177 of 527 pads) appeared in NEITHER
      # domain list. scripts/measure_cross_domain_creepage.py skipped every
      # one of them SILENTLY (`domain = ... else None; if domain is None:
      # continue`), so they contributed nothing to its 25,833-pair
      # denominator (109 HV x 237 SELV) and their absence was invisible in
      # its output. Counted directly from the board's own bytes this pass,
      # not inherited: 168 footprints, 527 pads, 4 pads carrying no net at
      # all, 139 distinct pad-carrying net names, 62 of them declared here
      # (27 HV + 35 SELV, and all 62 do have pads on the board), 77 not.
      # The instrument now fails closed on any undeclared pad-carrying net
      # instead of dropping it, so this class of silence cannot recur.
      #
      # HOW THESE 73 WERE CLASSIFIED. From elec/src/*.ato and the pads each
      # net actually lands on -- never from the net's name. That rule is
      # load-bearing here: this board's compiled netlist contains `input`
      # (already declared HV above: UCC21550 pin 10 = OUTB, the isolator's
      # SECONDARY side) sitting three lines away from `ina`/`inb` (pins
      # 1/2 = INA/INB, the PRIMARY side, declared SELV below). A
      # name-keyword classifier gets that pair exactly backwards. Every
      # entry below names the pins the net lands on and the .ato line that
      # references them to a declared rail.
      #
      # SEPARATION-OF-CONCERNS NOTE. All 73 nets below are SELV. The
      # remaining 4 of the 77 (the OVP-01 divider mid-chain nodes) are NOT
      # declared here -- they are hazardous-live (114V normal, up to the
      # full +170V_BUS under the single fault IEC 60335-1 cl. 8.1.4
      # requires be assumed) AND simultaneously resistively continuous
      # with the already-declared-SELV far end, which is a state this
      # two-domain axis cannot represent. Re-verified independently this
      # pass by reconstructing check_domain_partition.py's own graph model
      # from the board's pad->net connectivity: the CONTROL (manifest as
      # it stands) yields 0 HV<->SELV bridges and 0 mixed connected
      # components; adding all four to `domains: HV:` yields 2 bridges
      # ('safety.ovp.r_adc_top2-p2' --[R53]--> 'V_BUS_SENSE' and
      # 'safety.ovp.r_div_top2-p2' --[R48]--> 'safety.ovp.comp-inp') and 1
      # mixed component -- reproducing the 2026-08-13 finding exactly.
      # They are declared instead as `interior_nets:` on their chains at
      # the bottom of this file, which is where the creepage instrument
      # now reads them from. Adding the 73 SELV nets below was checked the
      # same way and yields 0 new bridges and 0 mixed components.
      #
      # RESTRICTIVE-DEFAULT DISPOSITION. No net below was assigned by
      # default: all 73 trace to a declared SELV rail. The nearest thing
      # to a judgement call is the group of no-connect / unwired pads
      # (`nc_7`, `nc3`, `a3`, `b3`, `c3`, and the unwired ESP32-S3 module
      # pins) which carry no potential at all; each is classified by the
      # domain of the pin field it physically sits in, evidenced per entry
      # below by measured pad coordinates, not by assumption.
      # ---------------------------------------------------------------

