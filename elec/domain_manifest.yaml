                             # `ct.S1 ~ r_burden.p1`, `ct.S2 ~
                             # i_sense.reference`, `r_burden.p2 ~
                             # i_sense.reference`; main.ato:832
                             # `ct_sense.i_sense.reference ~ gnd` -- ct.S2
                             # and the burden's return both sit on the
                             # already-declared SELV `gnd`, not on any HV
                             # node). Feeds OCP-01's comparator
                             # (OCPComparator, `ocp.power ~ power_3v3`) via
