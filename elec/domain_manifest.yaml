                             # `safety.ocp2.vref_ext.line` to the same
                             # `rtd_pan.reference.VREF` node, so atopile
                             # emitted ONE net and kept one of the two
                             # override names; "OVP_VREF_2V5" exists in the
                             # source but not in the compiled netlist, and
                             # is deliberately NOT declared here (this file
                             # declares compiled net names, not source
                             # intentions). Pads U9.5 (VREF), U16.4 (OVP
                             # comparator INN), U19.4 (OCP-02 comparator
                             # INN). Precision reference on the 3.3V rail.
      - safety-line          # SafetyInterlock.ntc_sense.line -- the
                             # heatsink NTC divider node, NOT a "safety
                             # line" in any bus sense (bare atopile
                             # auto-name). `power.vcc ~ r_ntc_fixed.p1`,
                             # `r_ntc_fixed.p2 ~ ntc_sense.line`,
                             # `ntc_sense.line ~ ntc.p1`, `ntc.p2 ~
                             # power.gnd` (modules.ato:2489-2492) and
                             # `ntc_sense.line ~ comp.INN` (:2543). Pads
                             # R56.2 (r_ntc_fixed), R55.1 (the NTC), U17.4
                             # (TLV3201 INN -- components.ato:507 `signal
                             # INN ~ pin 4`), U27.15 (ESP32 IO3 =
                             # mcu.adc_ntc, main.ato:868). A 3.3V divider
                             # end to end. The NTC itself is an
                             # NTCALUG01A104GA lug sensor mounted on the
                             # heatsink with 1500VAC lug-to-terminal
                             # isolation and flying leads (its own
                             # component comment) -- the heatsink-side
                             # hazard is isolated INSIDE the sensor, off
                             # this board's copper.
      - safety-line-1        # CoilThermalComparator's ntc_sense.line, the
                             # THM-02 twin of `safety-line`, structurally
                             # identical (modules.ato:2597-2600, 2634).
                             # Pads R61.2 (r_ntc_fixed), R60.1 (coil NTC),
                             # U18.4 (TLV3201 INN). Not brought to the MCU.
      - safety-line-2        # SafetyInterlock.reset_n_in.line: `reset_n_in
                             # .line ~ fault_any_or.B2` (modules.ato:3328)
                             # and `safety.reset_n_in.line ~ mcu.reset_n
                             # .line` (main.ato:905). Pads U24.4 (SN74HC4075
                             # B2 -- components.ato:600 `signal B2 ~ pin 4`)
                             # and U27.22 (ESP32 IO14). Logic-level.
      - safety-line-3        # SafetyInterlock.runaway_cut.line: `runaway_cut
                             # .line ~ fault_or.C2` (modules.ato:3283) and
                             # `safety.runaway_cut.line ~ mcu.runaway_cut
                             # .line` (main.ato:906). Pads U23.5 (SN74HC4075
                             # C2, pin 5) and U27.8 (ESP32 IO15).
      - safety.ocp-line      # OCP-01 comparator output -> fault_or.A1
                             # (`ocp.fault.line ~ fault_or.A1`, modules.ato
                             # :3262). Pads U15.1 (TLV3201 OUT, pin 1),
                             # U23.1 (SN74HC4075 A1). The comparator's
                             # sense input is `I_SENSE`, the CT secondary,
                             # already declared SELV -- no HV node is read.
      - safety.ocp.comp-inn  # OCP-01 trip-threshold divider node:
                             # `r_ref_top.p2 ~ comp.INN`, `comp.INN ~
                             # r_ref_bot.p1` (modules.ato:2107-2108), both
                             # legs between power.vcc and power.gnd. Pads
                             # R44.2, R45.1, U15.4.
      - safety.ovp-line      # OVP-01 comparator OUTPUT (not its bus-sense
                             # input): `comp.OUT ~ fault.line` and
                             # `r_hyst.p2 ~ comp.OUT` (modules.ato:2345-6),
                             # `ovp.fault.line ~ fault_or.B1` (:3263). Pads
                             # U16.1 (TLV3201 OUT), R50.2 (r_hyst), U23.2
                             # (SN74HC4075 B1). The TLV3201 is powered from
                             # power_3v3 and swings 0-3.3V; the HV side of
                             # OVP-01 is upstream of comp.INP, behind the
                             # declared divider chain.
      - safety.thermal-line  # THM-01 comparator output: `comp.OUT ~
                             # fault.line`, `r_hyst.p2 ~ comp.OUT`
                             # (modules.ato:2537, 2530), `thermal.fault.line
                             # ~ fault_or.C1` (:3264). Pads U17.1, R59.2,
                             # U23.8 (SN74HC4075 C1 -- components.ato:607
                             # `signal C1 ~ pin 8`).
      - safety.thermal.comp-inp  # THM-01 reference/hysteresis node:
                             # `r_ref_top.p2 ~ comp.INP`, `comp.INP ~
                             # r_ref_bot.p1`, `comp.INP ~ r_hyst.p1`
                             # (modules.ato:2524-2530). Three resistors on
                             # one node -- pads R57.2, R58.1, R59.1, U17.3.
      - safety.coil_thermal-line     # THM-02 comparator output ->
                             # fault_any_or.C1 (`coil_thermal.fault.line ~
                             # fault_any_or.C1`, modules.ato:3300). Pads
                             # U18.1, R64.2 (r_hyst), U24.8.
      - safety.coil_thermal.comp-inp # THM-02 reference/hysteresis node, the
                             # structural twin of safety.thermal.comp-inp
                             # (modules.ato:2617-2624). Pads R62.2, R63.1,
                             # R64.1, U18.3.
      - safety.uvlo_logic.mon-ina_p  # UVL-02 sense node: the TPS3700 INA_P
                             # driven by the 698k/100k divider across
                             # power_3v3 with the 3.74M hysteresis leg on
                             # the same node (LogicUVLOComparator, modules.
                             # ato:2967+). Pads R66.2, R67.1, R68.1, U21.3.
                             # UVL-02 measures the logic rail itself -- its
                             # own docstring: "VDD of the chip IS the rail
                             # under test". No HV node anywhere in it.
      - safety.uvlo_logic.mon-outa   # UVL-02 TPS3700 OUTA (open-drain,
                             # active-low), its 10k pull-up, the hysteresis
                             # resistor's far end, and the inverting NAND's
                             # A input. Pads U21.1, R68.2, R69.2, U22.1.
      - safety.uvlo_logic.mon-outb   # UVL-02 TPS3700 OUTB, pin 6, unused
                             # second window output. Single pad (U21.6),
                             # driven pin of a SELV-powered part.
      - safety.fault_or-a2   # fault_or.Y1 fed back into fault_or.A2
                             # (modules.ato:3273). Pads U23.9 (Y1, pin 9)
                             # and U23.3 (A2, pin 3) -- one SN74HC4075's
                             # own two pins, VCC ~ power_3v3.vcc (:3260).
      - safety.fault_or-b2   # latch.Y4 -> fault_or.B2 (modules.ato:3276).
                             # Pads U26.11 (SN74HC00 Y4, components.ato:643
                             # `signal Y4 ~ pin 11`) and U23.4.
      - safety.fault_or-y2   # fault_or.Y2 -> fault_any_or.A1 (modules.ato
                             # :3288). Pads U23.6 (Y2, pin 6), U24.1 (A1).
      - safety.fault_or-y3   # fault_or gate 3's output. Single pad
                             # (U23.10). The module's own comment: "Unused
                             # base-OR gate has defined inputs and no safety
                             # consumer" -- its A3/B3/C3 are tied to
                             # power_3v3.gnd (modules.ato:3341-3343), so Y3
                             # is a DRIVEN logic-low output of a
                             # SELV-powered package, not a floating pad.
      - safety.fault_any_or-a2  # fault_any_or.Y1 fanned to its own A2 and
                             # to fault_or3.A2 (modules.ato:3326, 3316).
                             # Pads U24.9 (Y1), U24.3 (A2), U25.3
                             # (fault_or3 A2).
      - safety.fault_any_or-y2  # fault_any_or.Y2 -> latch.A3 (modules.ato
                             # :3330). Pads U24.6, U26.9 (SN74HC00 A3).
      - safety.fault_any_or-y3  # fault_any_or gate 3's output. Single pad
                             # (U24.10). This is the gate the module
                             # documents as "all four pins entirely
                             # unreferenced anywhere in this module -- not
                             # grounded, not wired, just absent"; its three
                             # inputs are the `a3`/`b3`/`c3` nets below.
                             # An unwired output pin inside a SELV-powered
                             # SOIC-14 (VCC ~ power_3v3.vcc, GND ~
                             # power_3v3.gnd, modules.ato:3295-3296).
      - safety.fault_or3-b2  # fault_or3.Y1 -> its own B2 (modules.ato
                             # :3317). Pads U25.9 (Y1), U25.4 (B2).
      - safety.fault_or3-y2  # fault_or3.Y2 -> latch.A1, the SET input
                             # (modules.ato:3319). Pads U25.6, U26.1.
      - safety.fault_or3-y3  # fault_or3 gate 3's output. Single pad
                             # (U25.10); its inputs are GND-tied
                             # (modules.ato:3322-3324), same shape as
                             # safety.fault_or-y3 above.
      - safety.latch-b2      # SN74HC00 SR-latch cross-couple: `latch.Y3 ~
                             # latch.B2` (modules.ato:3336). Pads U26.8
                             # (Y3, components.ato:640) and U26.5 (B2).
      - y1                   # the latch's OTHER cross-couple leg: `latch.Y1
                             # ~ latch.A2` (modules.ato:3335). Pads U26.3
                             # (Y1) and U26.4 (A2). Bare auto-name because
                             # both endpoints are pins of one component.
      - a3                   # fault_any_or gate 3's A3 input, single pad
                             # U24.11 (components.ato:610 `signal A3 ~ pin
                             # 11`). Genuinely unwired -- see
                             # safety.fault_any_or-y3 above for the module's
                             # own statement that this gate is untouched.
                             # No potential; classified by the package it
                             # sits in, which is SELV on every other pin.
                             # A floating CMOS input inside a SELV part is
                             # not an HV conductor, and holding it to the
                             # reinforced HV<->SELV bar (what SELV here
                             # means) is the requirement that actually
                             # protects it.
      - b3                   # same gate, B3 input, single pad U24.12.
      - c3                   # same gate, C3 input, single pad U24.13.

      # --- Gate driver PRIMARY (control) side, U6 = UCC21550BDWKR ---
      # This is the trap the manifest's ground rule exists for. U6's pins
      # 1-8 are the PRIMARY side (components.ato:60-67, its own "# Primary
      # side" group) and pins 9-16 the SECONDARY (":69-79"). Verified
      # against the placed board rather than trusted: U6's pads 1-8 all sit
      # at local x=-4.875mm and pads 9,10,11,14,15,16 at x=+4.875mm (the
      # DWK package has no 12/13). HalfBridge wires the primary side to
      # SELV -- `power_3v3.vcc ~ gate_hs.driver.VCCI_1/VCCI_2` and
      # `power_3v3.gnd ~ gate_hs.driver.GNDI` (modules.ato:381-384), with
      # `hb.power_3v3.vcc ~ vcc_3v3` (main.ato:798) -- which is why pins
      # 3/8 are already on the declared-SELV `+3V3` net and pin 4 on `gnd`.
      # Note what is NOT here: `input` (pin 10, OUTB) and `+15V_LS`,
      # `GATE_HS`, `hb-gnd`, `hb.gate_hs.driver-p1-1`/`-p2` are all
      # declared HV above. Names do not separate these two groups; pin
      # numbers do.
      - ina                  # U6 pin 1 = INA, the primary-side PWM input,
                             # behind the 51R/220pF EMI filter (`pwm_in_a ~
                             # r_filt_a.p1`, `r_filt_a.p2 ~ driver.INA`,
                             # `driver.INA ~ c_filt_a.p1`, modules.ato
                             # :132-134). Pads U6.1, R20.2, C18.1. Fed from
                             # `PWM_HS` (already SELV) via R20; the filter
                             # cap returns to `driver.GNDI` = `gnd`.
      - inb                  # U6 pin 2 = INB, the identical low-side path
                             # (modules.ato:137-139). Pads U6.2, R21.2,
                             # C19.1. Fed from `PWM_LS`, already SELV.
      - hb.gate_hs.driver-p1 # U6 pin 6 = DT, the dead-time programming pin:
                             # `dt_res.p1 ~ gate_hs.driver.DT`, `dt_res.p2 ~
                             # gate_hs.driver.GNDI` (modules.ato:275-276),
                             # i.e. a 34k resistor from this pin to `gnd`.
                             # Pads U6.6, R24.1 (R24.2 is already on `gnd`).
                             # Primary-side and GNDI-referenced -- exactly
                             # as the `hb.gate_hs.driver-p2` entry in the HV
                             # list above already warns, this net must not
                             # be conflated with `hb.gate_hs.driver-p1-1`
                             # (pin 16, VDDA, secondary/HV) which differs
                             # from it by one character.
      - nc_7                 # U6 pin 7, `signal NC_7 ~ pin 7`
                             # (components.ato:66), declared by the
                             # component under its own "# Primary side"
                             # heading. Single pad (U6.7), no connection,
                             # no potential. Classified by measured
                             # position: local x=-4.875mm, i.e. in the
                             # primary pin row between DT (pin 6) and
                             # VCCI_2 (pin 8, on `+3V3`), 9.75mm of pad
                             # pitch away from the secondary row. SELV is
                             # both the physically correct side and the
                             # requirement that actually binds here: it
                             # holds this pad to the reinforced bar against
                             # the HV row across the barrier. Declaring it
                             # HV instead would demand 8.0mm between this
                             # pad and its own SELV neighbours 1.27mm away
                             # -- an unsatisfiable, false constraint, not a
                             # conservative one.

      # --- MCU (module MCU, modules.ato:3450-3599; U27 ESP32-S3-WROOM-1) ---
      # main.ato:918-919: `mcu.power.vcc ~ vcc_3v3` / `mcu.power.gnd ~ gnd`.
      # Every net below is a module pin of U27 and nothing else. The
      # already-declared SELV nets `usb_dn`/`usb_dp` (single pads U27.13/
      # U27.14) are the existing precedent for declaring an ESP32 pin net
      # that lands on exactly one pad.
      - en                   # ESP32-S3 EN (pin 3) with its boot RC and
                             # reset button: `power.vcc ~ r_en.p1`, `r_en.p2
                             # ~ mcu.EN`, `mcu.EN ~ c_en.p1`, `c_en.p2 ~
                             # power.gnd`, `btn_reset.p1 ~ mcu.EN`
                             # (modules.ato:3518-3521, 3533). Pads U27.3,
                             # R71.2, C41.1, SW1.1.
      - io0                  # IO0 bootstrap (pin 27): 10k pull-up to
                             # power.vcc plus the download-mode button
                             # (`r_boot.p2 ~ mcu.IO0`, `btn_boot.p1 ~
                             # mcu.IO0`, modules.ato:3529, 3537). Pads
                             # U27.27, R72.2, SW2.1.
      - rx                   # RXD0, pin 36 (components.ato:685). Single
                             # pad U27.36; `uart.rx ~ mcu.RXD0`
                             # (modules.ato:3599) but UART is not wired to
                             # anything else on this board.
      - tx                   # TXD0, pin 37. Single pad U27.37.
      - io13                 # IO13, pin 21 (components.ato:706). Single
                             # pad, declared in the component's pin map but
                             # unused by module MCU.
      - io40                 # IO40, pin 33. Single pad, same disposition.
      - io41                 # IO41, pin 34. Single pad, same disposition.
      - io42                 # IO42, pin 35. Single pad, same disposition.
      - io45                 # IO45, pin 26. Single pad, same disposition.
      - io46                 # IO46, pin 16. Single pad, same disposition.
      - io48                 # IO48, pin 25. Single pad, same disposition.
      - gpio18               # GPIO18/IO18, pin 11 (components.ato:679 and
                             # :711 -- the same physical pin under both
                             # names). Single pad, unused.
      - gpio21               # GPIO21/IO21, pin 23 -- one of the four
                             # "Status LEDs" pins the design reserves but
                             # never wires (the LED indicators are
                             # explicitly left unassigned, modules.ato's
                             # SafetyInterlock tail comment). Single pad.
      - gpio35               # GPIO35/IO35, pin 28. Single pad, same.
      - gpio36               # GPIO36/IO36, pin 29. Single pad, same.
      - gpio37               # GPIO37/IO37, pin 30. Single pad, same.

      # --- 3.3V buck converter (BuckConverter3V3, modules.ato:1422+) ---
      # U3 = LMR51430XDDCR. Its input is the already-declared SELV `+15V`
      # rail (pads U3.3 = VIN and U3.5 = EN both sit on `+15V`), its
      # return is `gnd` (U3.1), and its output is `+3V3`. `+15V` itself
      # comes from AuxSupply's isolated secondary (main.ato:697-698). The
      # converter is entirely on the SELV side of the IRM-10-15 barrier;
      # nothing in it references the DC bus. Historical note, since the
      # refdes is easy to misread: U3 used to be the H11L1 ZCD
      # optocoupler, an HV-straddling part -- that component was REMOVED
      # 2026-07-30 (docs/evidence/2026-07-30-zcd-optocoupler-removal.md)
      # and U3 is now this buck. Pin map read from components.ato:376-381,
      # which itself carries a "Pin mapping fixed per datasheet" note.
      - sw                   # LMR51430 SW, pin 2 -- the buck switch node,
                             # a 15V-swinging node, not a mains node. Pads
                             # U3.2, L2.1 (the output inductor), C10.2 (the
                             # bootstrap cap's low side).
      - boot                 # LMR51430 BOOT, pin 6. Pads U3.6, C10.1.
      - fb                   # LMR51430 FB, pin 4 -- the 0.6V feedback
                             # divider tap. Pads U3.4, R16.2, R17.1
                             # (R16.1 is on `+3V3`, R17.2 on `gnd`).

      # --- gnd-referenced low-side coil drivers ---
      - power_in.q_relay_drv-g   # AO3400A gate node for the inrush-bypass
                             # relay driver: `r_gate.p1 ~ relay_ctrl`,
                             # `r_gate.p2 ~ q_relay_drv.G`, `r_gate_pd.p1 ~
                             # q_relay_drv.G`, `r_gate_pd.p2 ~ gnd`
                             # (modules.ato:898-901). Pads Q1.2, R2.2,
                             # R3.1. Driven from `RELAY_CTRL` (already
                             # SELV) with a pulldown to `gnd`; the MOSFET's
                             # source is on `gnd` (:908) and its drain on
                             # `power_in.bypass_relay-coil2` (already SELV).
                             # The relay's HV contact side is a separate,
                             # already-declared isolator group -- the gate
                             # net never touches it.
      - discharge.q_dis_drv-g    # the identical construction for the
                             # bus-discharge relay coils: `ctrl ~
                             # r_gate.p1`, `r_gate.p2 ~ q_dis_drv.G`,
                             # `r_gate_pd.p2 ~ gnd`, `q_dis_drv.S ~ gnd`
                             # (modules.ato:1400-1403, 1418). Pads Q2.2,
                             # R12.2, R13.1. Driven from `DISCHARGE_CTRL`
                             # (already SELV). K2/K3's HV NC/NO/COM
                             # contacts are declared HV above and are on
                             # the far side of those relays' declared
                             # isolator barriers.

      # --- forced-air cooling (ThermalSystem, modules.ato:1626-1660) ---
      - thermal.j_fan-p1     # the fan header's positive pin, downstream of
                             # the 39R 1W dropper: `power_15v.vcc ~
                             # r_fan_drop.p1`, `r_fan_drop.p2 ~ j_fan.p1`,
                             # `j_fan.p2 ~ power_15v.gnd` (modules.ato
                             # :1657-1659), with `thermal.power_15v.vcc ~
                             # vcc_15v` / `.gnd ~ gnd` (main.ato:922-923).
                             # Pads J2.1, R75.2. ~12.1V at the fan; the
                             # `+15V` rail it hangs off is already declared
                             # SELV, and the fan is an off-board 12V part
                             # on leadwires.

# Components whose pins do NOT connect across the barrier they implement.
# `instance_path` is the dotted atopile instance path as it appears after
# "::" in the netlist's sheetpath (stable across ref-designator reshuffles
# and across machines -- unlike the absolute path prefix, which is stripped
# before matching). `groups` partitions every pin the component actually
# has wired in the netlist; every wired pin must appear in exactly one
# group or the gate fails closed (an isolator with an undeclared pin is a
# gap in the model, not a clean bill of health).
isolators:
  - instance_path: aux_supply.psu
    component: "Mean Well IRM-10-15 (IRM_10_15), aux supply transformer -- 4.2kVAC I/O withstand"
    groups:
      primary: ["1", "2"]     # ACL, ACN
      secondary: ["3", "4"]   # VP, VN
    pin_labels:
      "1": "ACL (= aux_supply.power_in.vcc)"
      "2": "ACN (= aux_supply.power_in.gnd, i.e. power_return -- main.ato:271)"
      "3": "VP (= aux_supply.power_out.vcc)"
      "4": "VN (= aux_supply.power_out.gnd, i.e. gnd -- main.ato:273)"

  - instance_path: hb.gate_hs.driver
    component: "TI UCC21550BDWKR (UCC21550BDWK), reinforced-isolation dual gate driver"
    groups:
      primary: ["1", "2", "3", "4", "5", "6", "7", "8"]       # INA,INB,VCCI_1,GNDI,DIS,DT,NC_7,VCCI_2
      # Pins 12/13 removed 2026-07-28: the DWK (14-pin) package has no such
      # pin numbers -- TI SLUSE89C Figure 4-2 numbers DWK 1-11,14-16 -- and
      # the board footprint has no pads there. They were carried over from
      # the DW (16-pin) pinout of Figure 4-1.
      secondary: ["9", "10", "11", "14", "15", "16"]  # VSSB,OUTB,VDDB,VSSA,OUTA,VDDA
    pin_labels:
      "4": "GNDI (primary-side logic ground, should be SELV gnd)"
      "9": "VSSB (low-side secondary ground, floats on DC_BUS_RTN)"

  - instance_path: ct_sense.ct
    component: "Coilcraft CST3015-100ED (CST3015_100E), current sense transformer"
    groups:
      primary: ["1", "2"]     # P1, P2
      secondary: ["3", "4"]   # S1, S2
    pin_labels:
      "2": "P2 (primary return, in series with tank return)"
      "4": "S2 (secondary bias reference)"

  # OCP-02 second CT (Option A, WIRED 2026-08-07 -- see
  # docs/hardware/OCP02_DECISION_BRIEF.md and
  # docs/hardware/OCP02_QUANTIFIED_TRADEOFF.md for the decision record, and
  # elec/src/modules.ato SecondaryOCPComparator's docstring for the full
  # derivation). Same real MPN as ct_sense.ct above (zero incremental
  # part-verification risk), same isolator shape: primary is a two-terminal
  # splice IN the DC_BUS_RTN conductor (HV domain, both pins), secondary is
  # magnetically isolated and referenced to power.gnd (SELV `gnd`, via
  # SafetyInterlock's power_3v3), same as ct_sense.ct's own barrier.
  - instance_path: safety.ocp2.ct
    component: "Coilcraft CST3015-100ED (CST3015_100E), current sense transformer, OCP-02"
    groups:
      primary: ["1", "2"]     # P1, P2 -- both DC_BUS_RTN (in-series splice)
      secondary: ["3", "4"]   # S1, S2
    pin_labels:
      "1": "P1 (bus_in, half-bridge/load side)"
      "2": "P2 (bus_out, bulk-capacitor/bleeder side)"
      "4": "S2 (secondary bias reference, power.gnd)"

  - instance_path: power_in.bypass_relay
    component: "Omron G4A-1A-E DC12 (Relay_SPST), bypass relay"
    groups:
      coil: ["1", "2"]        # coil1, coil2
      contacts: ["3", "4"]    # NO, COM
    pin_labels:
      "1": "coil1 (SELV coil drive)"
      "2": "coil2 (SELV coil drive)"
      "3": "NO (mains contact)"
      "4": "COM (mains contact)"

  - instance_path: discharge.k_dis1
    # REPLACED 2026-07-31: TE Schrack RT314012 (temper:Relay_SPDT_Schrack-
    # RT314012) landed on K2/K3, clearing the 8.0mm reinforced creepage
    # and 6.0mm clearance minima (12.76mm coil-to-contact gap, measured
    # from the footprint geometry). Prior history: a 2026-07-28 Finder
    # 40.52.7.012.0000 (Relay_DPDT) swap attempt was retracted after its
    # own creepage justification was found invalid
    # (docs/evidence/2026-07-28-pd3-retarget-relay.md,
    # docs/evidence/2026-07-28-relay-board-resync-decision.md), and the
    # Omron G5LE-1 was restored; the G5LE-1's isolation gap is now
    # superseded by the RT314012 -- see elec/src/modules.ato BusDischarge
    # docstring.
    component: "TE Connectivity / Schrack RT314012 (Relay_SPDT), discharge relay 1"
    groups:
      coil: ["2", "5"]           # coil1, coil2
      contacts: ["1", "3", "4"]  # COM, NO, NC
    pin_labels:
      "2": "coil1 (SELV coil drive)"
      "5": "coil2 (SELV coil drive)"
      "1": "COM (HV bus contact)"

  - instance_path: discharge.k_dis2
    # SWAPPED 2026-08-02 -- the RT314012 landed on K3 in the owner-granted
    # wave-2 board write (docs/evidence/2026-08-02-k3-swap-and-board-write.md),
    # mirroring K2 (#524): the G5LE-1's 3.559mm coil-to-contact gap failed
    # both the 8.0mm reinforced-creepage bar and the 6.0mm clearance
    # minimum; the RT314012's 12.76mm internal gap clears both. Previously
    # BLOCKED 2026-07-31 on placement (new cross-net shorts in every
    # rotation at the pre-re-solve origin; see elec/src/modules.ato
    # BusDischarge and docs/evidence/2026-07-31-k2k3-relay-swap-placement.md).
    component: "TE Connectivity / Schrack RT314012 (Relay_SPDT), discharge relay 2"
    groups:
      coil: ["2", "5"]
      contacts: ["1", "3", "4"]
    pin_labels:
      "2": "coil1 (SELV coil drive)"
      "5": "coil2 (SELV coil drive)"
      "1": "COM (HV bus contact)"

  # power_in.zcd_opto (U3, H11L1TVM mains-ZCD optocoupler) and its isolator
  # declaration REMOVED 2026-07-30: no firmware consumer (PIN_ZCD_INPUT was
  # never read past its own #define), no architectural role in this DC-bus
  # resonant converter (soft-start is time-delayed, not zero-cross-
  # synchronised), not wired into the safety chain, and its 8.560mm HV<->SELV
  # pad separation permanently fails this design's 12.6mm PD3 target with no
  # optocoupler family able to reach it. See
  # docs/evidence/2026-07-30-zcd-optocoupler-removal.md.

  # --- Capacitor policy (stated and defended, not left implicit) ---
  # By default, EVERY two-terminal passive (resistor, inductor, ferrite bead,
  # zero-ohm link, ordinary capacitor) is treated as CONDUCTING by this
  # check -- see scripts/check_domain_partition.py: only components declared
  # here break connectivity. An ordinary bulk/decoupling capacitor bridging
  # HV and SELV would be a real defect and must never be modeled away by
  # adding it here.
  #
  # C6 is the one deliberate exception, and it is declared explicitly rather
  # than silently exempted by any general "capacitors don't conduct" rule:
  # it is a Y1-class, IEC 60384-14 safety-rated capacitor
  # (docs/hardware/IEC60335_CRITICAL_COMPONENTS.md: "Y1 EMI/PE-bonding
  # capacitor") whose entire regulatory purpose is to provide a bounded,
  # high-impedance AC-only path across a safety barrier while blocking DC --
  # that is what Y-cap agency approval certifies, unlike a generic capacitor.
  # docs/hardware/SELV_ISOLATION_REDESIGN.md Sec 3 independently re-derives
  # and defends this same bond as "without a DC short." Declaring it here
  # (instead of leaving it to the default conducting rule) is what lets this
  # gate distinguish "the one certified, documented, IEC-60335-legitimate
  # EMI bond" from "an accidental short" -- treating it as conducting would
  # make this gate permanently and uninformatively red over standards-
  # required behavior; treating every future undeclared capacitor as
  # non-conducting by default would hide a real fault the same way the
  # original star join was hidden. This is the only capacitor granted this
  # treatment in this manifest.
  - instance_path: power_in.y_cap_pe
    component: "Y1-class EMI/PE-bonding capacitor (IEC 60384-14) -- see capacitor policy above"
    groups:
      hv_side: ["1"]     # p1, bonded to power_return / PWR_RTN
      selv_side: ["2"]   # p2, bonded to pe (now part of the gnd net)
    pin_labels:
      "1": "p1 (HV side, power_return / PWR_RTN)"
      "2": "p2 (SELV side, pe -- merged into gnd since SELV_ISOLATION_REDESIGN.md Sec 3)"

  # --- OVP-01 protective-impedance crossings (2026-07-26) ---
  # Both dividers below run from the HV half-bus (+170V_BUS) into the
  # PE-bonded SELV `gnd` domain through nothing but resistors. Declared as
  # intentional IEC 60335-1 protective-impedance connections, not silently
  # modeled away and not left undeclared as a "known gap" either -- see
  # docs/evidence/2026-07-26-ovp-crossing-resolution.md for the full writeup,
  # falsifier, and UNVERIFIED list.
  #
  # STANDARD CLAUSE (UNVERIFIED-at-primary: IEC 60335-1's primary text is
  # paywalled; reconstructed from secondary sources -- a UL Solutions
  # explainer, a clause-3 discussion of PELV/SELV separation, and a patent
  # (US6084757) describing an equivalent series-resistor protective-
  # impedance network built to the analogous EN 60730-1 provision):
  #   - Protective impedance is a recognized alternative to basic/double/
  #     reinforced insulation for bridging a mains-derived circuit to an
  #     earthed (PE-bonded) low-voltage part, PROVIDED (a) it comprises at
  #     least two independent current-limiting elements such that no single
  #     component failure removes the current-limiting function, and (b) the
  #     resulting touch current stays under the applicable limit in both
  #     normal and single-fault operation.
  #   - This design already relies on the identical provision for
  #     `power_in.y_cap_pe` (C6, above) -- a Y1 capacitor bridging
  #     `power_return` to this same PE-bonded `gnd`. These two resistor
  #     dividers are the same technique in resistive rather than reactive
  #     form, into the same earthed reference.
  #   - Why protective impedance applies to a PE-BONDED SELV domain rather
  #     than requiring full insulation: `gnd` is not attempting to be an
  #     isolated-transformer-separated SELV/PELV circuit for THIS purpose --
  #     `main.ato: gnd ~ pe` (SELV_ISOLATION_REDESIGN.md Sec 3) hard-bonds it
  #     to protective earth, 0 ohm DC. That converts it into the same
  #     category of "earthed reference" a Class I appliance's accessible
  #     metal parts are: fault current pushed into it returns to earth
  #     through the building's protective-earth conductor, not through a
  #     person in series with much higher body impedance. Same reasoning
  #     that already makes the C6 Y-cap acceptable, applied to a resistive
  #     bridge into the identical net -- including the fact that this net
  #     carries a user-touchable RTD probe: the probe sits at the same
  #     earthed reference as the rest of `gnd`, not at an elevated floating
  #     potential a fault could lift it to.
  #     UNVERIFIED-at-primary: whether IEC 60335-1 formally distinguishes
  #     "protective impedance into an earthed reference" from "protective
  #     impedance into an accessible metal part" was not found in any source
  #     reachable in this pass; treated as equivalent here on electrical
  #     first principles, not confirmed against clause text.
  #
  # ARITHMETIC (comparator divider, r_div_top1-3 = 3x430k unchanged,
  # r_div_bot = 16.9k as of the 2026-07-27 REF2025 re-reference (was 10k;
  # docs/evidence/2026-07-27-ovp01-ref2025-implementation.md) -- re-derived
  # here, not inherited without checking; the ~0.5% change in total series
  # resistance does not materially move any of the figures below):
  #   Normal:          170V / (3*430k + 16.9k) = 170V / 1.307M = 130.1uA
  #   One top shorted: 170V / (2*430k + 16.9k) = 170V / 876.9k = 193.9uA
  #   Two top shorted: 170V / (430k + 16.9k)   = 170V / 446.9k = 380.4uA
  #   Applicable touch-current limit: IEC 60335-2-6, stationary heating
  #   appliance, 0.75mA/kW capped at 5mA -> 0.75 * 1.8 = 1.35mA @ 1.8kW.
  #   All three currents are 3.5x-10x under that limit, even with TWO of
  #   three top resistors shorted simultaneously (a double fault, stricter
  #   than the single-fault standard requires evaluating).
  #   UNVERIFIED-at-primary: the 0.75mA/kW-capped-5mA figure was carried
  #   forward from docs/evidence/2026-07-26-emc-validators-implemented.md
  #   Sec 10 and re-derived here, not re-sourced against IEC 60335-2-6's
  #   primary text in this pass (also paywalled).
  #
  # RESISTOR RATING (verified against the Yageo RC1206 (1/4W family)
  # datasheet in this pass: rated/working voltage 200V, overload 400V,
  # dielectric withstand 500V -- not assumed from the part merely appearing
  # in the BOM):
  #   Normal:        130.1uA * 430k = 55.9V per resistor  (28% of 200V rated)
  #   One shorted:   193.9uA * 430k = 83.4V per resistor  (42% of 200V rated)
  #   Two shorted:   380.4uA * 430k = 163.6V per resistor (82% of 200V rated)
  #   Comfortably rated even in the two-shorted case. `.voltage_rating = 200V`
  #   set explicitly on r_div_top1-3 in elec/src/modules.ato (this same
  #   change, previously unset) to match the verified datasheet figure.
  #   UNVERIFIED: whether IEC 60335-1 additionally requires resistors used in
  #   a protective-impedance role to be a specifically qualified/tested
  #   "safety" or flame-proof construction (analogous to Y-cap agency
  #   approval) rather than a generic 1% thick-film chip resistor -- one
  #   secondary source (summarizing patent US6084757 / EN 60730-1 practice)
  #   mentions resistors being "checked by the test of 14.1 a) in IEC 60065"
  #   in an equivalent protective-impedance context, suggesting such a
  #   requirement may exist, but this was not confirmed against IEC
  #   60335-1's own primary text or checked against this Yageo part's actual
  #   certification. Flagged as a follow-up verification item, not blocking:
  #   the arithmetic margin (56-166V against a 200V/400V/500V-rated part) is
  #   generous even for a generic resistor, and the 1206 package's ~3.2mm
  #   body length gives comfortable creepage across the part at these
  #   voltages (basic-insulation creepage per IEC 60664-1, pollution degree
  #   2, is on the order of 1.2-2mm at 170-400V working voltage) -- but no
  #   specific safety-resistor part number was sourced or substituted here.
  #
  # SINGLE-FAULT DIRECTION WHEN r_div_bot (R54) OPENS (the failure originally
  # flagged as the hazard -- confirmed fail-safe in this pass, not assumed).
  # RE-VERIFIED 2026-07-27 for the REF2025 re-reference (docs/evidence/
  # 2026-07-27-ovp01-ref2025-implementation.md): the comp.INN reference
  # figure below is now REF2025's fixed 2.5V (was a divider off power_3v3,
  # last correct value 1.5138V for the 2026-07-27 half-bus retune's
  # 11.8k/10k divider -- this comment had drifted to a stale 2.973V figure
  # from an even earlier, since-superseded fail-open 1.1k divider, and is
  # corrected here rather than left to compound):
  #   With r_div_bot open, the sense node (comp.INP) has no path to `gnd`
  #   except through the TLV3201's own input ESD structure (per TI's
  #   datasheet: back-to-back diodes clamping ~300mV beyond VCC/GND, rated
  #   for up to 10mA continuous). comp.VCC is `power_3v3` (3.3V), so the
  #   clamp point is ~3.6V. Current through the divider is essentially
  #   unchanged (170V / ~1.31M ~ 130uA, well under the ESD structure's 10mA
  #   rating -- it survives). Clamped at ~3.6V, comp.INP sits ABOVE comp.INN
  #   (2.5V reference, REF2025.VREF -- an even larger margin than the
  #   divider it replaced), so comp.OUT goes HIGH -- fault.line asserts --
  #   OVP-01 trips and latches (via fault_or -> latch, SafetyInterlock).
  #   CONFIRMED fail-safe: r_div_bot opening trips a nuisance OVP fault
  #   rather than silently disabling overvoltage detection.
  #
  # ISOLATOR-BARRIER CASCADE CHECK: before this fix, this gate reported 8
  # isolator-barrier violations against 3 independent domain-crossing paths.
  # After fixing the bootstrap wiring bug (elec/src/modules.ato, HalfBridge)
  # and this divider's redundancy defect, re-running the gate showed all 8
  # isolator-barrier violations are still produced by exactly the TWO
  # remaining root paths (this divider and the ADC divider below) -- every
  # `aux_supply.psu` / `hb.gate_hs.driver` / `ct_sense.ct` /
  # `power_in.bypass_relay` / `discharge.k_dis1` / `discharge.k_dis2` /
  # `power_in.zcd_opto` / `power_in.y_cap_pe` "barrier bridged" report shares
  # one of these two paths as its evidence. They are cascade effects of
  # these two root crossings, not independent findings -- confirmed by
  # re-running the gate after each source fix and watching the reported
  # bridge count drop from 3 to 2 (see the evidence doc for both outputs).
  # --- OVP-01 ADC-sense divider (second, independent protective-impedance
  # crossing) ---
  # Same standard clause and PE-bonded-earth reasoning as the comparator
  # divider above -- not repeated in full here. This divider feeds
  # mcu.adc_v_bus (V_BUS_SENSE, SELV) rather than the comparator's INP pin.
  #
  # CONSTRUCTION DEFECT FOUND AND FIXED (2026-07-26, this same change): this
  # divider was PREVIOUSLY a single 510k resistor (r_adc_top) in series with
  # r_adc_bot (10k) -- only ONE current-limiting element on the HV side. A
  # single short of that one resistor removes 100% of the divider's
  # impedance, putting the full +170V_BUS directly across r_adc_bot alone:
  # 170V / 10k = 17mA -- ~13x the 1.35mA touch-current limit derived above,
  # and ~29x r_adc_bot's 0.1W power rating (170V * 17mA = 2.89W). That is
  # exactly the single-point-of-failure protective impedance's own
  # construction rule exists to prevent, and this divider did not satisfy
  # it. Fixed by splitting r_adc_top into r_adc_top1/2/3 (3x169k, elec/src/
  # modules.ato, same change as this manifest update) to match the
  # comparator divider's redundant construction before declaring it here.
  #
  # ARITHMETIC (r_adc_top1-3 = 3x169k, r_adc_bot = 10k, post-fix):
  #   Normal:          170V / (3*169k + 10k) = 170V / 517k = 328.8uA
  #   One top shorted: 170V / (2*169k + 10k) = 170V / 348k = 488.5uA
  #   Two top shorted: 170V / (169k + 10k)   = 170V / 179k = 949.7uA
  #   All under the 1.35mA touch-current limit even with two of three top
  #   resistors shorted (0.95mA, ~70% of the limit -- the tightest margin of
  #   any crossing in this manifest, but still under the limit and still
  #   satisfies "no single failure removes the impedance").
  #
  # RESISTOR RATING (same Yageo RC1206 1/4W family, 200V rated/working,
  # verified against datasheet):
  #   Normal:        328.8uA * 169k = 55.6V  (28% of 200V rated)
  #   One shorted:   488.5uA * 169k = 82.6V  (41% of 200V rated)
  #   Two shorted:   949.7uA * 169k = 160.5V (80% of 200V rated)
  #   The PRIOR single-resistor version declared `.voltage_rating = 250V` in
  #   elec/src/modules.ato, which did not match this part family's actual
  #   200V datasheet rating -- corrected to 200V on all three new resistors
  #   in this same change. Same UNVERIFIED safety-resistor-certification
  #   caveat as the comparator divider above.
  #
  # SINGLE-FAULT DIRECTION WHEN r_adc_bot OPENS (not the originally-flagged
  # hazard, checked here for completeness and symmetry with r_div_bot):
  #   adc_v_bus feeds mcu.adc_v_bus, a plain ADC input (ESP32-S3), not a
  #   comparator with a known reference to compare against. With r_adc_bot
  #   open, the node floats up, clamped only by the ESP32-S3 GPIO/ADC pin's
  #   own absolute-maximum input protection. UNVERIFIED: that clamp
  #   behavior and current rating were not pulled from the ESP32-S3
  #   datasheet in this pass. Firmware would read a pinned/saturated ADC
  #   value rather than a physically meaningful bus voltage -- a
  #   firmware-visible sensor fault, not a hidden hazard, since OVP-01's
  #   actual trip path is the comparator divider above, entirely independent
  #   of this ADC path. UNVERIFIED beyond that.
# ---------------------------------------------------------------------------
# Protective-impedance chains (2026-07-26)
#
# Declared here rather than under `isolators:` for a reason that matters.
# An isolator declaration names ONE component as a barrier. The safety
# property of these dividers is NOT carried by any one resistor -- it is
# carried by the SERIES CHAIN, so that no single component failure removes
# the impedance. Declaring one element would leave the gate blessing the path
# even if the rest of the chain were later shorted or deleted.
#
# The gate therefore verifies the CONSTRUCTION: every listed element must
# exist, be a genuine two-terminal part, and be wired in series to its
# neighbour, and the chain must not fall below `min_length`. Shorten a chain
# and the declaration stops being honoured, so the crossing reappears as a
# violation.
#
# Full derivation, arithmetic, single-fault analysis and UNVERIFIED list:
# docs/evidence/2026-07-26-ovp-crossing-resolution.md
# ---------------------------------------------------------------------------
# Declared protective-impedance constructions.
#
# `interior_nets:` (ADDED 2026-08-20) names, by exact compiled net name,
# every net BETWEEN two consecutive members of the chain -- the nodes that
# are neither boundary_a nor boundary_b. It exists because those nodes are
# real copper that must be graded for creepage, and the `domains:` HV/SELV
# axis above provably cannot hold them:
#
#   * They ARE hazardous-live. Under IEC 60335-1 cl. 8.1.4's own required
#     single-fault condition (any ONE chain member fails, open or short),
#     a short of the member nearest boundary_a puts the interior node
#     adjacent to it at the FULL boundary_a potential -- 170.0V, exactly
#     `+170V_BUS`, not an approximation. See the per-chain tables below.
#   * They are ALSO resistively continuous with the already-declared-SELV
#     boundary_b under normal operation, through the remaining chain
#     members, with no galvanic isolator between. That is the whole point
#     of a protective-impedance construction, and it is true.
#
# Declaring such a node under `domains: HV:` therefore asserts that two
# nets in the SAME connected component belong to different domains, which
# scripts/check_domain_partition.py's check_domain_disjointness correctly
# rejects. Re-tested independently 2026-08-20 by rebuilding that gate's
# graph model from pcb/temper.kicad_pcb's own pad->net connectivity
# (synthesize_chain_head_isolators makes ONLY each chain's first member a
# graph isolator, so every interior node lands in boundary_b's component):
#
#   control, manifest as it stands ......... 0 bridges, 0 mixed components
#   + all 4 interior nodes under domains:HV  2 bridges, 1 mixed component
#       'safety.ovp.r_adc_top2-p2' --[R53]--> 'V_BUS_SENSE'
#       'safety.ovp.r_div_top2-p2' --[R48]--> 'safety.ovp.comp-inp'
#   + the 73 SELV nets added above .......... 0 bridges, 0 mixed components
#
# reproducing docs/evidence/2026-08-13-ovp01-midchain-single-fault-
# creepage.md Sec 3 exactly. This field is the alternative that doc named
# as missing: it records the nets as facts on the axis that CAN express
# them (chain membership) without making a galvanic-topology claim on the
# axis that cannot. scripts/measure_cross_domain_creepage.py reads it and
# grades these pads on the HV side of every cross-domain pair -- the
# restrictive choice, justified by the single-fault figures below -- so
# they are no longer skipped. `domains:` is untouched by it and
# check_domain_partition.py's verdict is unchanged.
#
# This is a declaration of nets, not a new domain and not a new threshold:
# the pads are measured against the same reinforced HV<->SELV bar every
# other HV pad on this board is already measured against.
protective_impedance_chains:
  - name: ovp01_comparator_divider
    component: "OVP-01 comparator sense divider: 3 x Yageo RC1206FR-07430KL (430k 1% 1206) in series + RT0603BRD0716K9L (16.9k 0.1% 0603, was RC0603FR-0710KL 10k 1% until the 2026-07-27 REF2025 re-reference -- docs/evidence/2026-07-27-ovp01-ref2025-implementation.md). r_div_bot is NOT itself part of this chain (only r_div_top1-3 are, min_length below); listed here for context only."
    chain:
      - safety.ovp.r_div_top1
      - safety.ovp.r_div_top2
      - safety.ovp.r_div_top3
    boundary_a: "+170V_BUS"
    boundary_b: "safety.ovp.comp-inp"
    min_length: 3
    # Read off elec/src/modules.ato:2304-2308 and confirmed against the
    # placed board's own pads, in series order boundary_a -> boundary_b:
    #   +170V_BUS (R46.1) -r_div_top1- [r_div_top1-p2: R46.2,R47.1]
    #     -r_div_top2- [r_div_top2-p2: R47.2,R48.1]
    #     -r_div_top3- safety.ovp.comp-inp (R48.2, with R49.1/R50.1/U16.3)
    # Both interior nets carry exactly the two pads the chain predicts and
    # nothing else, which is the same property check_chain_integrity
    # independently enforces ("every interior node connects ONLY those two
    # members' declared pins").
    #
    # Voltages, re-derived this pass from the declared component values
    # (3 x 430k top, 16.9k bottom, 170V at boundary_a):
    #   node              normal    worst single-fault (which fault)
    #   r_div_top1-p2     114.1 V   170.0 V  (r_div_top1 shorts)
    #   r_div_top2-p2      58.1 V    86.6 V  (r_div_top1 shorts)
    # Both exceed the 60V DC ripple-free / 42.4V AC peak SELV ceiling in
    # the governing single-fault condition; the first equals boundary_a
    # exactly. Graded HV-side by the creepage instrument on that basis.
    interior_nets:
      - safety.ovp.r_div_top1-p2
      - safety.ovp.r_div_top2-p2

  - name: ovp01_adc_sense_divider
    component: "OVP-01 ADC-sense divider: 3 x 170k in series + RC0603FR-0710KL (10k 1% 0603). Split from a single 510k top resistor on 2026-07-26 -- one short removed the impedance entirely, which is not a valid protective-impedance construction."
    chain:
      - safety.ovp.r_adc_top1
      - safety.ovp.r_adc_top2
      - safety.ovp.r_adc_top3
    boundary_a: "+170V_BUS"
    boundary_b: "V_BUS_SENSE"
    min_length: 3
    # elec/src/modules.ato:2437-2441, same structure, same confirmation
    # against the board's pads:
    #   +170V_BUS (R51.1) -r_adc_top1- [r_adc_top1-p2: R51.2,R52.1]
    #     -r_adc_top2- [r_adc_top2-p2: R52.2,R53.1]
    #     -r_adc_top3- V_BUS_SENSE (R53.2, with R54.1/C36.1/U27.38)
    #
    # Voltages (3 x 169k top -- the `component:` string above says "170k",
    # which is the stale figure; elec/src/modules.ato declares 169kohm and
    # the MPN RC1206FR-07169KL agrees -- and 10k bottom, 170V):
    #   node              normal    worst single-fault (which fault)
    #   r_adc_top1-p2     114.4 V   170.0 V  (r_adc_top1 shorts)
    #   r_adc_top2-p2      58.9 V    87.4 V  (r_adc_top1 shorts)
    # Same disposition as the comparator divider above.
    interior_nets:
      - safety.ovp.r_adc_top1-p2
      - safety.ovp.r_adc_top2-p2
