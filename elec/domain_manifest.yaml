      # main.ato:858-859: `safety.power_3v3.vcc ~ vcc_3v3` /
      # `safety.power_3v3.gnd ~ gnd`. Every comparator, OR gate and latch
      # in the module runs from that rail. The module's ONLY HV contacts
      # are (a) `safety.dc_bus.line ~ dc_bus_plus` (main.ato:864), which
      # enters through the two declared protective-impedance dividers, and
      # (b) OCP-02's CT primary splice in DC_BUS_RTN (`safety.ocp2_bus_in`
      # / `_bus_out`, main.ato:794-795) -- both already covered above. No
      # net below touches either.
