# Netlist domain-partition manifest.
#
# Declares, explicitly and by hand, which compiled nets belong to which
# electrical safety domain, and which components are legitimate galvanic
# isolators between domains. This is a claim about *intended* topology,
# reviewed against elec/src by a human; scripts/check_domain_partition.py
# verifies the *actual* compiled netlist (elec/build/default.net) upholds it.
#
# Ground rule: every entry below is an exact, literal net name or component
# instance path taken from elec/src / elec/build/default.net -- never a
# pattern, prefix, or naming-convention guess. Net names are exactly what
# lied in this design ("+340V_BUS" used to name a node that is actually the
# ~170V half-bus -- see docs/hardware/IEC60335_CRITICAL_COMPONENTS.md Sec 2
# and docs/hardware/SELV_ISOLATION_REDESIGN.md Sec 5), so domain membership
# must never be inferred from how a net is spelled.
#
# History: the original star-point join (`power_return ~ gnd`, main.ato)
# shorted the AuxSupply's isolation barrier outright -- see
# docs/hardware/IEC60335_CRITICAL_COMPONENTS.md Sec 2 and the
# 2026-07-26-domain-partition-check evidence doc for that (now-fixed)
# finding. That join has been REMOVED (docs/hardware/SELV_ISOLATION_REDESIGN.md,
# commit 6976ef44): `gnd` and `PWR_RTN` are separate compiled nets as of this
# manifest's writing.
#
# RESOLVED 2026-07-26 (docs/evidence/2026-07-26-ovp-crossing-resolution.md):
# the design's own audit (SELV_ISOLATION_REDESIGN.md Sec 4, rows 3-4) flagged
# two plain resistive dividers running from the HV half-bus
# (`dc_bus_plus`/`+170V_BUS`) into `gnd` as still-open gaps: the OVP-01
# comparator-sense divider (3x430kohm + 16.9kohm as of the 2026-07-27
# REF2025 re-reference, was 10kohm -- see docs/evidence/
# 2026-07-27-ovp01-ref2025-implementation.md; the change does not move
# this chain's boundary, see the ARITHMETIC note below, `OVPComparator`,
# `main.ato:434-435`) and the OVP-01 ADC-sense divider (`OVPComparator.
# adc_v_bus`). Investigated properly rather than either rubber-stamped or
# reflexively isolated -- see the evidence doc for the full standard clause,
# arithmetic, and single-fault analysis. Verdict: both are legitimate IEC
# 60335-1 protective-impedance connections to a PE-bonded (earthed) SELV
# circuit -- the same provision `power_in.y_cap_pe` (C6, below) already
# relies on -- PROVIDED no single component failure removes the current-
# limiting function. The comparator divider's 3x430kohm construction already
# satisfied that. The ADC divider's PRIOR construction (a single 510kohm
# resistor) did NOT -- one short removed 100% of its impedance -- so it was
# split into 3x169kohm (elec/src/modules.ato, same change as this manifest
# update) to match the comparator divider's pattern before being declared
# below. Both dividers are declared as isolators below, each resistor
# individually, with the standard clause and arithmetic in the comment
# blocks preceding their entries. A third flagged crossing (the gate-driver
# bootstrap network, D5/C17/U8) turned out to be a genuine wiring bug, not a
# manifest gap: the bootstrap diode was fed from the wrong (gnd-referenced)
# supply rail. Fixed in elec/src/modules.ato (HalfBridge) by rewiring it to
# the already-declared, HV-referenced `power_15v_ls` rail -- no manifest
# declaration needed for that one, because there is no crossing left.

schema_version: 1

# Approved split-board interface (design contract, not a claim that the
# current legacy one-board PCB already implements it).  The connector is
# deliberately restricted to nets that remain SELV on both sides of the
# reinforced isolators.  AC, the DC bus, switch node, floating gate-drive
# outputs, and every other HV-domain net are excluded by construction and are
# not permitted to be added here without changing the architecture decision.
board_interface:
  name: POWER_CONTROL_SELV_INTERFACE
  power_board: POWER_BOARD
  control_board: CONTROL_BOARD
  connector: J_POWER_CONTROL
  allowed_domains: [SELV]
  nets:
    - gnd
    - "+15V"
    - "+3V3"
    - PWM_HS
    - PWM_LS
    - SHUTDOWN
    - RELAY_CTRL
    - DISCHARGE_CTRL
    - V_BUS_SENSE

domains:
  # Mains / high-voltage power domain: AC line/neutral, the rectified DC
  # bus, the doubler midpoint (power_return), and everything that floats on
  # the half-bridge switch node or the negative DC rail.
  HV:
    nets:
      - ac_l
      - ac_n
      - "+170V_BUS"        # dc_bus_plus. Renamed from "+340V_BUS" in the
                           # SELV redesign: the old name is what caused
                           # OVP-01's reference divider to be tuned for a
                           # 340V full-bus reading it never actually sees
                           # (SELV_ISOLATION_REDESIGN.md Sec 5) -- declared
                           # here by its current exact compiled string, not
                           # inferred from either name.
      - DC_BUS_RTN         # dc_bus_minus
      - PWR_RTN            # power_return, the doubler midpoint
                           # (main.ato override_net_name). Confirmed a
                           # SEPARATE net from `gnd` as of this manifest
                           # (net 6, 17 pins) -- the star-join short that
                           # used to merge them into one net has been
                           # removed. Straddled only by the declared
                           # isolators below (C6, PS1, T1). U3 (the H11L1
                           # ZCD opto, formerly also straddling this net)
                           # was removed 2026-07-30 -- see
                           # docs/evidence/2026-07-30-zcd-optocoupler-removal.md.
      - w1_1               # CMC winding 1 taps (line side)
      - w1_2
      - "+15V_LS"          # low-side gate-driver rail; referenced to
                           # DC_BUS_RTN, not gnd (modules.ato) -- floats
                           # within the HV domain, not SELV.
      - SW_NODE            # half-bridge switch node
      - GATE_HS            # UCC21550 high-side gate output; floats on
                           # SW_NODE (secondary side of the gate driver, HV
                           # side of the barrier even though it is a
                           # "secondary" winding of that isolator)
      - GATE_LS            # UCC21550 low-side gate output; referenced to
                           # DC_BUS_RTN
      - discharge.k_dis1-nc  # discharge.k_dis1's own declared "contacts"
                             # group (pin 4, NC) -- below, the SAME group as
                             # pin 1 (COM), which that isolator entry's own
                             # pin_labels already calls "COM (HV bus contact)".
                             # The group is undifferentiated (COM/NO/NC are
                             # one physical switch mechanism, one domain);
                             # this just also lists the net name so the
                             # domain check (this file) and the isolator
                             # check (below) agree, instead of leaving pin 4
                             # unclassified despite pin 1 of the same group
                             # already being HV. See
                             # 2026-07-27-domain-classification-coverage.md
                             # for why this was previously unclassified.
                             # REVERTED 2026-07-28 to this single-NC-contact
                             # form (docs/evidence/
                             # 2026-07-28-relay-board-resync-decision.md): a
                             # same-day DPDT relay swap (Finder 40.52) briefly
                             # renamed this to -nc1/-nc2/-com1/-no1/-no2 (both
                             # poles), then was retracted after the swap's
                             # own creepage justification was found invalid
                             # (docs/evidence/2026-07-28-pd3-retarget-relay.md)
                             # -- see elec/src/modules.ato's BusDischarge
                             # docstring for the full trail.
      - discharge.k_dis2-nc  # same reasoning, discharge.k_dis2's "contacts"
                             # group (below).
      - hb.power_loop.q_high-g  # ADDED 2026-07-27 (docs/evidence/
                             # 2026-07-27-clearance-copper-balance.md Part B):
                             # Q_high's own Gate terminal (modules.ato:382,
                             # `gate_hs.drive.out ~ power_loop.q_high.G`).
                             # `drive.out` is wired to `driver.OUTA` (=
                             # GATE_HS, already declared above) through
                             # `rg_on` -- a plain 2.2ohm gate resistor
                             # (modules.ato:179-180), not an isolator -- so
                             # this net is the SAME floating HV/switch-node
                             # potential as GATE_HS, one resistor downstream.
                             # This exact net was flagged UNVERIFIED (not
                             # independently traced) by the sibling
                             # 2026-07-27-domain-classification-coverage.md
                             # (Sec 7); that doc's own tentative grouping of
                             # it under "primary-side" pins was a naming-
                             # convention guess this manifest's ground rule
                             # forbids -- direct wire tracing (above)
                             # confirms it is secondary/HV-side, not primary.
      - hb.gate_hs.driver-p1-1  # ADDED 2026-07-27, same evidence doc. UCC21550
                             # (U7) pin 16, VDDA -- the isolated secondary-
                             # side floating positive bias-supply rail
                             # (components.ato:60 `signal VDDA ~ pin 16`,
                             # under the component's own "Secondary side"
