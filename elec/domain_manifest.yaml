      - usb_dp
      - i2c_sda_ui
      - i2c_scl_ui
      - RTD_SCK
      - RTD_SDO
      - RTD_SDI
      - RTD_CS_N
      - RTD_DRDY
      - RTD_HW_FAULT
      - rtd_force_p
      - rtd_force_n
      - rtd_sense_p
      - rtd_sense_n
      - WDT_KICK
      - WDT_RESET_N
      - SHUTDOWN
      - RELAY_CTRL
      - DISCHARGE_CTRL
      - V_BUS_SENSE        # mcu.adc_v_bus -- fed by OVPComparator's second,
                           # independent resistive divider
                           # (SELV_ISOLATION_REDESIGN.md Sec 4 row 4).
                           # Declared protective-impedance crossing (see
