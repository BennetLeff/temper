                             # (elec/build/default.net, net code 117): T2.3
                             # (ct.S1), U19.3 (safety.ocp2.comp, the
                             # TLV3201's INP pin), C37.1 (safety.ocp2.
                             # c_filter), R65.1 (safety.ocp2.r_burden) are
