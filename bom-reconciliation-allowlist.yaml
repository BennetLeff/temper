# BOM<->source reconciliation gate allowlist -- hand-curated only.
#
# scripts/check_bom_source_reconciliation.py has no --init/--regenerate
# mode and never writes this file (see that module's docstring for why --
# same rationale as mpn-fabrication-allowlist.yaml). Every entry below was
# added after reading the cited elec/src/*.ato line(s) directly and
# confirming the MPN, value and functional role genuinely match the BOM.md
# row it's paired with -- this is not a bulk suppression of the gate's
# output. Deliberately NOT allowlisted, and left as real findings for a
# human to triage, at gate-introduction time (2026-08-07):
#
#   - All 8 mpn_mismatch findings (K_DIS1/K_DIS2, C_TANK1/C_TANK2,
#     R_DIS1A/R_DIS1B/R_DIS2A/R_DIS2B) -- genuine value/MPN drift.
#   - R_OVP1/R_OVP2/R_OVP3/R_OVP4/R_OVP_REF_T/R_OVP_REF_B/R_OCP_REF_T and
#     their source-side counterparts -- the OVP-01/OCP-01 protective-
#     impedance redesign (docs/evidence/2026-07-26-ovp-crossing-
#     resolution.md, docs/evidence/2026-07-27-ocp01-uvl02-part-
#     resolution.md) that BOM.md never absorbed.
#   - R_THM_REF_T/R_THM_REF_B/R_THM_HYST/R_THM2_REF_T/R_THM2_REF_B/
#     R_THM2_HYST and their source-side counterparts (r_ref_top/r_ref_bot/
#     r_hyst under ThermalComparator and CoilThermalComparator) -- BOM.md's
#     section 5.7/5.8 reference-divider and hysteresis values are stale/
#     cross-attributed between THM-01 and THM-02 (confirmed against
#     source's own inline comments admitting prior values), a newly-found
#     drift this gate's introduction surfaced beyond the previously-known
#     gap list.
#   - c_tank3, r_div_top1/2/3 unmatched siblings, r_adc_top1/2/3 -- named
#     explicitly in the gap this gate was built to close.
#   - The entire LogicUVLOComparator (UVLO-02) circuit (mon, r_div_top,
#     r_div_bot, r_hyst, r_outa_pullup, inv, r_fault_pullup at lines
#     2906-2985) and the ZCD-to-SELV optocoupler redesign (zcd_opto,
#     r_zcd_opto, r_zcd_pullup at lines 1028-1046) -- genuinely wired,
#     genuinely uncosted, no BOM section exists for either at all.
#   - boot_cap (elec/src/modules.ato:98, gate-driver bootstrap cap) --
#     BOM.md reuses the designator "C_BOOT" for two structurally
#     different capacitors (this one, 10uF GRM32ER71H106KA12L, and the
#     buck converter's 100nF bootstrap cap at modules.ato:1481, which
#     already matches by normalized name). A known false-negative of this
#     gate's per-normalized-designator set comparison: because "C_BOOT"
#     already has a matching source entry, no finding fires for the
#     second, different physical part sharing that label. See the module
#     docstring's "FALSE NEGATIVES" paragraph.
#
# Each entry:
#   kind:       costed_no_circuit | wired_uncosted | mpn_mismatch
#   designator: BOM designator (costed_no_circuit) or elec/src/*.ato
#               variable name (wired_uncosted, mpn_mismatch)
#   file:       optional, scopes a wired_uncosted entry to one file (all
#               current entries needing this are in elec/src/modules.ato)
#   reason:     why this is a genuine same-part-different-label match, not
#               a content defect, with a citation

