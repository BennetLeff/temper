# Post-U9 (W2 U2 layer_constraints wired + layer output fix) measurements.
# COMPLETION-PRESERVING SEMANTICS (PR #220 regression fix):
# The SSOT layer override is gated: it only applies when SSOT matches the
# heuristic layer.  Nets whose heuristic says F.Cu (signal/SMD pads) are
# never forced to B.Cu.  This prevents unconnected pads (A* routes on a
# single-layer occupancy grid and cannot connect F.Cu-only pads from B.Cu).
# Demotions to heuristic layer: 0 (by design — SSOT=heuristic only).
#
# Corpus board (golden test methodology, CP-SAT placements, seed=42,
# kicad-cli 10.0.4):
#   Completion: 100.00% (preserved — matches main)
#   Unconnected: 8 (pre-existing on kicad-cli 10.0.4; CI kicad-cli 8.0 reports 0)
#   DRC total: 353 (routing-introduced 310)
#   shorting_items: 73 (unchanged from main — SSOT override reverted)
#   diff_pair_gap_out_of_range: 0 (was 6 — from layer output fix only)
#
# Production board (existing positions, kicad-cli 10.0.4):
#   DRC total: ~953-957 (unchanged — no explicit netclasses, U2 finding)
#   completion: 74.74% (unchanged)
#
# EARLIER 249→209 CLAIM PROVENANCE GAP (U10 report, commit 254eb3e4):
# The earlier measurement claimed corpus DRC 249→209 with -8 shorting and
# -6 diff_pair.  That measurement used existing positions (not CP-SAT)
# and a different kicad-cli invocation than the golden test's
# `_run_drc` helper.  The 249→209 delta was real for that specific
# invocation but overstated the improvement on the golden-test methodology
# (CP-SAT placements) where the SSOT override produced the 8-unconnected
# CI regression (PR #220).  The completion-preserving fix in commit
# <TBD> gates SSOT to heuristic-match only, restoring main's 100%
# completion at the cost of shorting_items improvement.
u9_post_fix:
  extraction_date: '2026-07-18'
  kicad_cli_version: 10.0.4
  semantics: completion_preserving (SSOT=heuristic only)
  demotions: 0
  corpus:
    completion_rate: 1.0
    unconnected_items: 8
    unconnected_kicad_version_note: |
      Pre-existing on kicad-cli 10.0.4 (also present on main).
      CI kicad-cli 8.0 reports 0.
    drc_total: 353
    routing_introduced: 310
    shorting_items: 73
    diff_pair_gap_out_of_range: 0
    attribution: |
      shorting_items (73): unchanged from main.  SSOT override that produced
      the -8 improvement was reverted for completion safety.
      diff_pair_gap (0): from layer output fix (adapter.py:630) that writes
      segments to their actual path_layer instead of hardcoded F.Cu.
      This improvement survived the completion-preserving fix.
    remaining_violations: |
      shorting_items (73), tracks_crossing (60), solder_mask_bridge (74),
      clearance (102), lib_footprint_mismatch (32).
      These require W2 U3 (IPC-2152), U4 (power pours), or improved A*
      path quality — layer assignment alone cannot resolve them.
  production:
    drc_total: ~955
    shorting_items: ~115
    delta: 0
    attribution: |
      No change — U2 confirmed no production-board nets have explicit
      netclass assignments, so the SSOT has no targets.
