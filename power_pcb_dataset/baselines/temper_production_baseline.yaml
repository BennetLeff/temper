# Post-U9 (W2 U2 layer_constraints wired + layer output fix) measurements.
# Corpus board: DRC 249 -> 209 (-40), shorting_items 46 -> 38 (-8),
# diff_pair_gap_out_of_range 6 -> 0 (-6).  Production board: essentially
# flat (953 -> 957, within A* noise) because no production-board nets
# have explicit netclass assignments (see U2 finding).
u9_post_fix:
  extraction_date: '2026-07-18'
  corpus:
    drc_total: 209
    shorting_items: 38
    diff_pair_gap_out_of_range: 0
    tracks_crossing: 32
    solder_mask_bridge: 61
    clearance: 40
    completion_rate: 0.8333
    unrouted_nets: 4
    unrouted_nets_list: [PWM_H, PWM_L, SPI_CS_TEMP, SPI_MOSI]
    delta_from_baseline_249: -40
    attribution: |
      layer_constraints wired to A* via _assign_layer (channel_mapping.py) +
      _write_routes_to_content hardcoded "F.Cu" replaced with path_layer
      (adapter.py:630,652,674).
      shorting_items -8: tracks now split across F.Cu/B.Cu by netclass.
      diff_pair_gap 6->0: USB_D+/D- now routed on distinct layers.
      tracks_crossing -11: fewer tracks sharing same-layer surface area.
    remaining_violations: |
      shorting_items (38): still genuine F.Cu/B.Cu track-to-track shorts.
      clearance (40): inter-net clearance below netclass rules.
      solder_mask_bridge (61): mask openings from routing segments.
      tracks_crossing (32): tracks crossing over each other.
      lib_footprint_mismatch (32): pre-existing footprint issues.
      These cannot be eliminated by layer assignment alone; they require
      W2 U3 (IPC-2152 trace widths), U4 (power pours), or improved A*
      path quality.
  production:
    drc_total: 957
    shorting_items: 115
    delta_from_baseline_953: 4
    attribution: |
      Essentially flat (within A* non-determinism noise).  U2 confirmed
      that production-board nets have no explicit netclass assignments,
      so the SSOT layer constraints have no effect.  To improve
      production-board DRC, net_class_assignments must be configured
      for the production board's hierarchical net names.
