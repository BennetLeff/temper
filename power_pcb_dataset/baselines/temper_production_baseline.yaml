# Baseline metrics for the Temper production board.
# Source: pcb/temper.kicad_pcb (149 components, 95 nets [>=2-pin connectivity;
# see docs/solutions/logic-errors/
# net-count-metric-definition-mismatch-regression-baseline.md], 100x150mm).
#
# Extraction method changed from JAX gradient-descent (deleted 2026-07) to CP-SAT.
# The JAX loss-based metrics (overlap_loss, wirelength_loss, boundary_loss,
# hpwl_final, final_loss) are replaced by CP-SAT metrics below.
#
# cp_sat block is currently unpopulated -- NOT because it wasn't attempted.
# `temper-placer optimize` (with or without --loop) is a non-functional stub
# for this board: it prints "Full CP-SAT pipeline integration is in
# progress" and exits without ever running a CP-SAT solve or writing an
# output file, regardless of config. Its own suggested fallback ("Use
# `temper pipeline` for router-based placement flows") also doesn't exist as
# a command (`temper-placer --help` lists no `pipeline` subcommand). See
# docs/solutions/logic-errors/
# cp-sat-optimize-cli-non-functional-stub-2026-07-17.md for full findings.
# Do not fill this block with fabricated or approximate numbers -- leave it
# null until the underlying CP-SAT integration is actually finished.

component_count: 149
net_count: 95
drc_available: false
drc_errors: 0
drc_warnings: 0
extraction_date: "2026-07-17"
extraction_method: "deterministic-pipeline"

# Deterministic 22-stage pipeline baseline (U6), re-run after the
# fixed_positions sheetpath fix (see docs/solutions/logic-errors/
# fixed-positions-ref-fragility-across-renumbering.md).
# Command: create_drc_aware_pipeline(config=configs/temper_production_config.yaml)
# against pcb/temper.kicad_pcb (149 components / 95 netlist nets, 100x150mm).
deterministic_pipeline:
  config: "configs/temper_production_config.yaml"
  placed_components: 149        # of 149 — all finite positions
  placement_violations: 0  # PlacementValidationStage's own check -- scope not
                            # independently verified against kicad-cli as of
                            # this note; do not assume it means "no overlaps"
                            # without checking, per the drc_violations lesson below
  drc_violations: 0  # VERIFIED MISLEADING 2026-07-17: this is
                      # router_v6.constraints_drc_oracle.DRCOracle.validate_all(),
                      # which checks ONLY track-to-track and via-to-via
                      # clearance -- not courtyard overlap, silk clearance,
                      # shorts, or unrouted nets. With routed_nets: 0 (below)
                      # there is almost no routing geometry for it to check,
                      # so 0 here is close to vacuous, not a clean bill of
                      # health. See docs/solutions/logic-errors/
                      # deterministic-pipeline-drc-oracle-only-checks-routing-not-real-drc.md.
  kicad_cli_drc_errors: 225    # ground truth, verified 2026-07-17 via
  kicad_cli_drc_warnings: 578  # temper_placer.validation._drc_api.run_drc
                                # (same kicad-cli backend DrcRatchet uses)
                                # against this exact deterministic-pipeline
                                # export. For comparison: the UNPLACED INPUT
                                # board (pcb/temper.kicad_pcb) already carries
                                # 170 errors / 459 warnings before any
                                # placement or routing runs.
  escape_vias: 124
  routed_nets: 0                # routing stages currently emit escape vias only
  connectivity_unconnected_pads: 269  # honest pre-routing figure
  wall_time_s: 2.4

# CP-SAT placement metrics: unpopulated, see the header note above --
# `temper-placer optimize` does not currently produce a real result for
# this board to record.
cp_sat:
  # From CpSatPlacementResult
  solve_time_ms: null
  objective_value: null
  placed_components: null  # int: count of successfully placed components
  status: null  # "optimal" | "feasible" | "infeasible" | "model_invalid"

  # From PlaceRouteLoop LoopResult
  rounds: null  # int: number of loop rounds until convergence
  routing_completion_pct: null  # float: fraction of nets fully routed
  loop_drc_errors: null  # int: post-route DRC errors at convergence
  loop_success: null  # bool: whether the place-route loop converged
