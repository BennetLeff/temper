# Baseline metrics for the Temper production board.
# Source: pcb/temper.kicad_pcb (123 components, 79 nets, 100x150mm).
#
# Extraction method changed from JAX gradient-descent (deleted 2026-07) to CP-SAT.
# The JAX loss-based metrics (overlap_loss, wirelength_loss, boundary_loss,
# hpwl_final, final_loss) are replaced by CP-SAT metrics below.
#
# To run a fresh baseline extraction:
#   temper-placer optimize pcb/temper.kicad_pcb -c constraints.yaml -o output.kicad_pcb --all-gates

component_count: 149
net_count: 95
drc_available: false
drc_errors: 0
drc_warnings: 0
extraction_date: "2026-07-17"
extraction_method: "deterministic-pipeline"

# Deterministic 22-stage pipeline baseline (U6), first full-board run.
# Command: create_drc_aware_pipeline(config=configs/temper_production_config.yaml)
# against pcb/temper.kicad_pcb (144 components / 150 netlist nets, 100x150mm).
deterministic_pipeline:
  config: "configs/temper_production_config.yaml"
  placed_components: 144        # of 144 — all finite positions
  placement_violations: 0
  drc_violations: 0
  escape_vias: 121
  routed_nets: 0                # routing stages currently emit escape vias only
  connectivity_unconnected_pads: 261  # honest pre-routing figure
  wall_time_s: 2.3

# CP-SAT placement metrics (to be populated from a baseline run):
cp_sat:
  # From CpSatPlacementResult
  solve_time_ms: null
  objective_value: null
  placed_components: null  # int: count of successfully placed components
  status: null  # "optimal" | "feasible" | "infeasible" | "model_invalid"

  # From PlaceRouteLoop LoopResult
  rounds: null  # int: number of loop rounds until convergence
  routing_completion_pct: null  # float: fraction of nets fully routed
  loop_drc_errors: null  # int: post-route DRC errors at convergence
  loop_success: null  # bool: whether the place-route loop converged
