# Post-U9 (W2 U2 layer_constraints wired + layer output fix) measurements.
# COMPLETION-PRESERVING SEMANTICS (PR #220 regression fix):
# The SSOT layer override is gated: it only applies when SSOT matches the
# heuristic layer.  Nets whose heuristic says F.Cu (signal/SMD pads) are
# never forced to B.Cu.  This prevents unconnected pads (A* routes on a
# single-layer occupancy grid and cannot connect F.Cu-only pads from B.Cu).
# Demotions to heuristic layer: 0 (by design — SSOT=heuristic only).
#
# Corpus board (golden test methodology, CP-SAT placements, seed=42,
# kicad-cli 10.0.4):
#   Completion: 100.00% (preserved — matches main)
#   Unconnected: 8 (pre-existing on kicad-cli 10.0.4; CI kicad-cli 8.0 reports 0)
#   DRC total: 353 (routing-introduced 310)
#   shorting_items: 73 (unchanged from main — SSOT override reverted)
#   diff_pair_gap_out_of_range: 0 (was 6 — from layer output fix only)
#
# Production board (existing positions, kicad-cli 10.0.4):
#   DRC total: ~953-957 (unchanged — no explicit netclasses, U2 finding)
#   completion: 74.74% (unchanged)
#
# EARLIER 249→209 CLAIM PROVENANCE GAP (U10 report, commit 254eb3e4):
# The earlier measurement claimed corpus DRC 249→209 with -8 shorting and
# -6 diff_pair.  That measurement used existing positions (not CP-SAT)
# and a different kicad-cli invocation than the golden test's
# `_run_drc` helper.  The 249→209 delta was real for that specific
# invocation but overstated the improvement on the golden-test methodology
# (CP-SAT placements) where the SSOT override produced the 8-unconnected
# CI regression (PR #220).  Final U9 state: layer_constraints threading
# is landed but completion-gated (SSOT applies only when it equals the
# heuristic layer), and routed-segment output remains F.Cu — divergent
# SSOT layers require via-aware layer transitions (A* routes B.Cu but
# SMD pads exist only on F.Cu).  Router output is byte-identical to
# main; enabling divergent layers is the W2 via-insertion follow-up.
u9_final:
  extraction_date: '2026-07-18'
  kicad_cli_version: 10.0.4
  semantics: |
    completion-gated: _assign_layer applies SSOT only when it matches
    the heuristic; _write_routes_to_content writes routed segments to
    F.Cu (main behavior).  Net effect vs main: none, by construction.
  corpus:
    golden_test_signature: |
      Measured post-revert on kicad-cli 10.0.4 (2026-07-18):
      unconnected_items assert PASSES (0; delta -84 vs placement
      baseline, matching main's CI signature).  Final
      routing_introduced assert fails with 406 locally / 443 on CI —
      the pre-existing corpus red (single-layer routing quality),
      unchanged by this branch.
    provenance_note: |
      Earlier u9_post_fix claims are retracted: the 249->209 (-16%)
      improvement was measured with a non-golden invocation (existing
      positions, not CP-SAT placements) while the path_layer output
      change was active — that change broke completion (8 unconnected)
      and was reverted.  The "diff_pair_gap survived" and "unconnected
      8 also present on main" claims were artifacts of the same
      invocation mismatch and do not hold under the golden test.
    remaining_violations: |
      Pre-existing corpus categories (CI, kicad-cli 8.x): clearance 144,
      tracks_crossing 108, solder_mask_bridge 99, shorting_items 88,
      diff_pair_gap_out_of_range 4.  These require via-aware multi-layer
      output (W2 follow-up), W2 U3 (IPC-2152), U4 (power pours), or
      improved A* path quality — layer assignment alone cannot resolve
      them.
  production:
    drc_total: 953
    delta_vs_u3_baseline: 0
    attribution: |
      No change — U2 confirmed no production-board nets have explicit
      netclass assignments, so the SSOT has no targets; output layers
      match the U3 baseline measurement.
