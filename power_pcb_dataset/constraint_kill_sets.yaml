schema_version: 1
generated: '2026-08-02'
generator: scripts/constraint_mutation_runner.py
note: 'Kill-set register for the constraint mutation suite (R32). Each surface''s mutations are the R4 bug classes (sign-flip,
  dropped-term, loosened-bound, off-by-one, double-count) applied at source level; outcome is killed when the surface''s existing
  defenses (encoder unit-test mirrors + post-solve PlacementAuditor) fail. Survivors are triaged: benign (documented rationale),
  test-gap (TODO), or non-applicable (mutation not expressible on the current code shape, with a recorded reason). Enforced
  by scripts/constraint_mutation_gate.py.'
families:
  placer-pcl-handlers:
    status: active
    surfaces:
    - id: adjacent
      constraint_type: ADJACENT
      handler_module: temper_placer.placer.cp_sat.handlers.adjacent
      mutations:
      - id: adj_drop_x_direction
        operator: dropped-term
        description: 'second edge-to-edge x bound (vb.x_start - va.x_end <= max_d) dropped: the pair may drift arbitrarily
          far apart in the b-right-of-a direction'
        outcome: survived
        triage: test-gap
        triage_rationale: 'The b-left-of-a direction bound is dropped, so the pair may drift arbitrarily far in that direction.
          The existing test''s origin-parked solve (no objective) never exploits it and the auditor sees the parked (still
          adjacent) placement. TODO: a probe that incentivizes the solver to separate the pair (plan 2026-08-02-005 exhaustive
          bound).'
      - id: adj_loosened_bound
        operator: loosened-bound
        description: 'max_distance_mm doubled before mm_to_units: the enforced proximity cap is twice the stated requirement'
        outcome: survived
        triage: test-gap
        triage_rationale: 'The proximity cap is doubled; the parked solve has coincident centers so the doubled cap is unobservable.
          TODO: a probe that forces the pair apart (plan 2026-08-02-005).'
      - id: adj_off_by_one
        operator: off-by-one
        description: 'max_distance_mm loosened by one grid unit (max_d + 1): a 0.01 mm fencepost error in the proximity cap'
        outcome: survived
        triage: benign
        triage_rationale: Cap loosened by 1 grid unit = 0.01 mm at units_per_mm=100 — below placement and audit resolution;
          the stated mm requirement is unaffected at any enforceable precision.
      - id: adj_sign_flip_comparison
        operator: sign-flip
        description: 'first edge-to-edge x bound direction flipped (va.x_start - vb.x_end <= max_d becomes >= max_d): the
          proximity cap becomes a minimum-distance floor on x'
        outcome: killed
        defenses_fired:
        - encoder-unit:adjacent
      killed:
      - adj_sign_flip_comparison
      survived:
      - adj_drop_x_direction
      - adj_loosened_bound
      - adj_off_by_one
