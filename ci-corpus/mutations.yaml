# R42 gate-mutation testing manifest (docs/plans/2026-08-02-035).
#
# Each entry is a (gate, mutation, canary) triple, KTD1: a reviewer sees
# every weakening applied to a real gate script in this diff, in plain
# language, rather than trusting a blind generator. `scripts/gate_mutate.py`
# applies the mutation fields (everything except `canary`) to a temp copy of
# the named gate; `scripts/check_gate_mutations.py` then runs the `canary`
# block's `pristine`/`seed` functions (from the sibling module under
# ci-corpus/canaries/) against both the unmutated and mutated gate and
# checks whether the seed verdict flips.
#
# Scope (R42's explicit "gates that matter most"): creepage/clearance
# drift, the physical isolation keepout, HV netclass coverage, the R27 DRC
# ceiling ratchet approval gate, both provenance checkers, the
# anti-vacuity guard itself (check_vacuous_gates.py), and (added
# 2026-08-12) the HighVoltage/Power netclass-parameter correspondence gate
# -- not the full fail-closed gate inventory (R19/R30's incident-corpus/
# canary-contract plan, which this suite bootstraps around per the plan's
# own "Assumptions" section, has not landed yet; this is a first sweep of
# the safety-critical subset, not a claim of exhaustive coverage). See
# docs/evidence/2026-08-12-gate-vacuity-structural-prevention.md for the
# assessment of how far this scope is from covering all ~86
# `disposition: ci-gate` scripts, and why.
#
# Mutation axes deliberately model the nine observed failure mechanisms
# from the 2026-08-07 session (see docs/plans/.../035's own header), not
# generic arithmetic off-by-ones -- see scripts/gate_mutate.py's module
# docstring for the axis-by-axis rationale.

mutations:
  # ---------------------------------------------------------------------
  # scripts/check_creepage_clearance_drift.py
  # ---------------------------------------------------------------------
  - gate: scripts/check_creepage_clearance_drift.py
    mutation_id: creepage-guard-strip-zero-declarations
    axis: guard-strip
    function: run
    match: raise
    index: 0
    line_hint: "raise GateError("
    description: >-
      Strip the anti-vacuity raise that fires when discovery finds zero
      creepage/clearance declarations anywhere -- models "seven vacuous
      validators iterating empty dicts": a scan that found nothing must
      report a gate ERROR, never a silent 0-violations pass.
    canary:
      module: ci-corpus/canaries/check_creepage_clearance_drift.py
      pristine: pristine_agree
      seed: seed_zero_declarations
      expected_pristine: clean
      expected_seed: error

  - gate: scripts/check_creepage_clearance_drift.py
    mutation_id: creepage-invert-mismatch-detection
    axis: condition-invert
    function: run
    match: if-invert
    index: 3
    line_hint: "not fam.is_consistent"
    description: >-
      Invert the family-mismatch guard (`if not fam.is_consistent:`) so a
      drifted (metric, tier) family is marked clean and an internally
      consistent one is marked a violation -- the backwards-comparison
      class (cf. the schematic `rated >= actual*0.5` bug), mechanized.
    canary:
      module: ci-corpus/canaries/check_creepage_clearance_drift.py
      pristine: pristine_agree
      seed: seed_mismatch
      expected_pristine: clean
      expected_seed: violation

  - gate: scripts/check_creepage_clearance_drift.py
    mutation_id: creepage-scope-remove-scripts-root
    axis: scope-remove
    match: container-remove
    name: SCAN_ROOT_NAMES
    remove_value: "scripts"
    line_hint: 'SCAN_ROOT_NAMES = ("elec", "scripts", "packages", "configs")'
    description: >-
      Drop "scripts" from SCAN_ROOT_NAMES -- the exact gate-subset-blindness
      class this project has already hit for real
      (docs/evidence/2026-07-27-gate-subset-blindness-audit.md): a whole
      declaration-bearing directory silently stops being scanned, and any
      drift living only there goes unseen.
    canary:
      module: ci-corpus/canaries/check_creepage_clearance_drift.py
      pristine: pristine_agree
      seed: seed_mismatch
      expected_pristine: clean
      expected_seed: violation

  - gate: scripts/check_creepage_clearance_drift.py
    mutation_id: creepage-return-stub-always-clean
    axis: return-stub
    function: run
    match: return-stub
    stub_code: "return 'clean', Report(), [], [], [], [], []"
    line_hint: "def run("
    description: >-
      Force run() to unconditionally return a clean verdict as its first
      statement -- "a test binary returning 0 instead of calling
      UnityEnd()" / "return a constant success", the highest-severity
      mutant this suite can register.
    canary:
      module: ci-corpus/canaries/check_creepage_clearance_drift.py
      pristine: pristine_agree
      seed: seed_mismatch
      expected_pristine: clean
      expected_seed: violation

  # ---------------------------------------------------------------------
  # scripts/check_isolation_keepout.py
  # ---------------------------------------------------------------------
  - gate: scripts/check_isolation_keepout.py
    mutation_id: isolation-loosen-width-divisor
    axis: threshold-set
    function: run
    match: constant-set
    index: 4
    old_value: 2.0
    new_value: 200.0
    line_hint: "buffer(-min_width / 2.0)"
    description: >-
      Loosen the width-check erosion divisor (2.0 -> 200.0) so
      `barrier_poly.buffer(-min_width / divisor)` erodes almost nothing --
      a barrier far narrower than MIN_BARRIER_WIDTH_MM stops registering
      as `eroded.is_empty`. Models a threshold that quietly loosens.
    canary:
      module: ci-corpus/canaries/check_isolation_keepout.py
      pristine: pristine_valid_barrier
      seed: seed_narrow_barrier
      expected_pristine: clean
      expected_seed: violation

  - gate: scripts/check_isolation_keepout.py
    mutation_id: isolation-discard-width-violation
    axis: violation-discard
    function: run
    match: append-drop
    index: 3
    line_hint: "report.violations.append("
    description: >-
      Drop the `report.violations.append(Violation("width", ...))` call
      inside the width-check branch to `pass` -- the detection logic still
      runs (eroded.is_empty is still computed correctly) but the finding
      never reaches the verdict. Models "a value discarded before reaching
      its consumer".
    canary:
      module: ci-corpus/canaries/check_isolation_keepout.py
      pristine: pristine_valid_barrier
      seed: seed_narrow_barrier
      expected_pristine: clean
      expected_seed: violation

  - gate: scripts/check_isolation_keepout.py
    mutation_id: isolation-invert-width-guard
    axis: condition-invert
    function: run
    match: if-invert
    index: 6
    line_hint: "if eroded.is_empty:"
    description: >-
      Invert `if eroded.is_empty:` so the width violation fires exactly
      when the barrier IS wide enough and stays silent when it is not --
      the width check runs entirely backwards.
    canary:
      module: ci-corpus/canaries/check_isolation_keepout.py
      pristine: pristine_valid_barrier
      seed: seed_narrow_barrier
      expected_pristine: clean
      expected_seed: violation

  # ---------------------------------------------------------------------
  # scripts/check_hv_netclass_coverage.py
  # ---------------------------------------------------------------------
  - gate: scripts/check_hv_netclass_coverage.py
    mutation_id: hv-netclass-invert-membership-test
    axis: comparison-flip
    function: check_hv_net_coverage
    match: compare-op-flip
    index: 0
    line_hint: "n not in net_assignments"
    description: >-
      Flip `n not in net_assignments` to `n in net_assignments` -- the
      real +170V_BUS defect this gate exists to catch (a manifest-HV net
      silently falling through to the LV default) becomes structurally
      invisible: only ASSIGNED nets are ever reported.
    canary:
      module: ci-corpus/canaries/check_hv_netclass_coverage.py
      pristine: pristine_fully_covered
      seed: seed_unassigned_hv_net
      expected_pristine: clean
      expected_seed: "violation:['dc_bus']"

  - gate: scripts/check_hv_netclass_coverage.py
    mutation_id: hv-netclass-invert-verdict-guard
    axis: condition-invert
    function: run
    match: if-invert
    index: 4
    line_hint: "if ("
    description: >-
      Invert the final violation guard in run() so a clean run is reported
      as a violation and a real violation is reported clean -- the
      StageDRCFailure-gated-behind-verbose class, mechanized on this gate's
      own verdict line.
    canary:
      module: ci-corpus/canaries/check_hv_netclass_coverage.py
      pristine: pristine_fully_covered
      seed: seed_unassigned_hv_net
      expected_pristine: clean
      expected_seed: "violation:['dc_bus']"

  - gate: scripts/check_hv_netclass_coverage.py
    mutation_id: hv-netclass-return-stub-always-clean
    axis: return-stub
    function: run
    match: return-stub
    stub_code: "return 'clean', Report()"
    line_hint: "def run("
    description: >-
      Force run() to unconditionally return a clean verdict -- the
      "return a constant success" mutant.
    canary:
      module: ci-corpus/canaries/check_hv_netclass_coverage.py
      pristine: pristine_fully_covered
      seed: seed_class_with_no_rules
      expected_pristine: clean
      expected_seed: violation

  # ---------------------------------------------------------------------
  # scripts/check_vacuous_gates.py (the anti-vacuity guard itself)
  # ---------------------------------------------------------------------
  - gate: scripts/check_vacuous_gates.py
    mutation_id: vacuous-scope-remove-all-aggregator
    axis: scope-remove
    match: container-remove
    name: AGGREGATORS
    remove_value: "all"
    line_hint: 'AGGREGATORS = {"all"}'
    description: >-
      Drop "all" from AGGREGATORS = {"all"} -- the anti-vacuity gate's own
      scope, emptied. Models "a CI group collecting zero tests from a
      deleted path": the meta case where the gate that catches vacuous
      checks becomes vacuous itself.
    canary:
      module: ci-corpus/canaries/check_vacuous_gates.py
      pristine: pristine_guarded
      seed: seed_unguarded_all
      expected_pristine: clean
      expected_seed: violation

  - gate: scripts/check_vacuous_gates.py
    mutation_id: vacuous-return-stub-find-violations
    axis: return-stub
    function: find_violations
    match: return-stub
    stub_code: "return []"
    line_hint: "def find_violations(py_file: Path) -> list[tuple[int, str]]:"
    description: >-
      Force find_violations() to unconditionally return no violations --
      the highest-severity "return True" mutant applied to the gate this
      whole plan takes its name from.
    canary:
      module: ci-corpus/canaries/check_vacuous_gates.py
      pristine: pristine_guarded
      seed: seed_unguarded_all
      expected_pristine: clean
      expected_seed: violation

  # ---------------------------------------------------------------------
  # scripts/check_drc_ceiling_approval.py (R27 DRC ceiling ratchet)
  # ---------------------------------------------------------------------
  - gate: scripts/check_drc_ceiling_approval.py
    mutation_id: drc-ratchet-invert-no-raise-shortcircuit
    axis: condition-invert
    function: run_gate
    match: if-invert
    index: 6
    line_hint: "if not raises:"
    description: >-
      Invert `if not raises:` (the early "no ceiling raise, nothing to
      check" return) so it fires exactly when a raise WAS detected --
      every real raise now short-circuits straight to PASS before the
      trailer/evidence checks ever run.
    canary:
      module: ci-corpus/canaries/check_drc_ceiling_approval.py
      pristine: pristine_no_raise
      seed: seed_unapproved_raise
      expected_pristine: clean
      expected_seed: violation

  - gate: scripts/check_drc_ceiling_approval.py
    mutation_id: drc-ratchet-invert-trailer-check
    axis: comparison-flip
    function: run_gate
    match: compare-op-flip
    index: 2
    line_hint: "Ceiling-Approval:\" in commit_messages"
    description: >-
      Flip `"Ceiling-Approval:" in commit_messages` to `not in` -- the
      trailer-detection the R27 contract is built on runs backwards: a PR
      WITHOUT the trailer is treated as approved, and one WITH it is
      treated as unapproved.
    canary:
      module: ci-corpus/canaries/check_drc_ceiling_approval.py
      pristine: pristine_no_raise
      seed: seed_unapproved_raise_with_valid_evidence
      expected_pristine: clean
      expected_seed: violation

  - gate: scripts/check_drc_ceiling_approval.py
    mutation_id: drc-ratchet-return-stub-always-pass
    axis: return-stub
    function: run_gate
    match: return-stub
    stub_code: "return EXIT_OK, 'PASS: stub'"
    line_hint: "def run_gate("
    description: >-
      Force run_gate() to unconditionally return EXIT_OK -- the "return a
      constant success" mutant applied to the safety-critical R27 ratchet
      gate itself.
    canary:
      module: ci-corpus/canaries/check_drc_ceiling_approval.py
      pristine: pristine_no_raise
      seed: seed_unapproved_raise
      expected_pristine: clean
      expected_seed: violation

  # ---------------------------------------------------------------------
  # scripts/check_measurement_provenance.py
  # ---------------------------------------------------------------------
  - gate: scripts/check_measurement_provenance.py
    mutation_id: measurement-guard-strip-zero-artifacts
    axis: guard-strip
    function: evaluate
    match: raise
    index: 0
    line_hint: "raise GateError("
    description: >-
      Strip the anti-vacuity raise that fires when zero measurement
      artifacts are registered -- "no records therefore no violations" is
      exactly the vacuous-pass shape this gate's own docstring names as
      the failure it exists to avoid.
    canary:
      module: ci-corpus/canaries/check_measurement_provenance.py
      pristine: pristine_fresh
      seed: seed_zero_artifacts
      expected_pristine: clean
      expected_seed: "error:zero-artifacts"

  - gate: scripts/check_measurement_provenance.py
    mutation_id: measurement-invert-freshness-guard
    axis: condition-invert
    function: evaluate
    match: if-invert
    # Re-located 2026-08-11: `ast.walk`'s BFS order placed this at index 6
    # when the mutation was first authored (2026-08-07), but re-running
    # scripts/gate_mutate.py's own locator against HEAD reports this
    # `if mismatches:` at index 5 -- a nested `if` earlier in the function
    # (inside the artifact-loading loop) now sorts after it in `ast.walk`'s
    # per-depth ordering, shifting every later top-level `if` in `evaluate`
    # down by one. The target line's TEXT is unchanged (still verbatim
    # `if mismatches:` at line 495); only its walk-order index drifted --
    # confirmed by `check_gate_mutations.py` itself, which reported this
    # entry NOT APPLICABLE (line_hint not found on the index-6 line, which
    # had become `if not TICKET_PATTERN.search(comment):`) rather than
    # silently mutating the wrong line, exactly as the drift guard is
    # designed to do.
    index: 5
    line_hint: "if mismatches:"
    description: >-
      Invert `if mismatches:` so a record with real content-hash
      mismatches is filed as `fresh` and a genuinely fresh record is filed
      as `stale` -- the exact drc_ceiling.json incident (measured 91,
      actual ~710 errors) this gate exists to catch, run backwards.
    canary:
      module: ci-corpus/canaries/check_measurement_provenance.py
      pristine: pristine_fresh
      seed: seed_stale_input
      expected_pristine: clean
      expected_seed: violation

  - gate: scripts/check_measurement_provenance.py
    mutation_id: measurement-return-stub-always-clean
    axis: return-stub
    function: evaluate
    match: return-stub
    stub_code: "return Outcome()"
    line_hint: "def evaluate("
    description: >-
      Force evaluate() to unconditionally return an empty (all-clean)
      Outcome -- the "return a constant success" mutant.
    canary:
      module: ci-corpus/canaries/check_measurement_provenance.py
      pristine: pristine_fresh
      seed: seed_stale_input
      expected_pristine: clean
      expected_seed: violation

  # ---------------------------------------------------------------------
  # scripts/check_evidence_provenance.py
  # ---------------------------------------------------------------------
  - gate: scripts/check_evidence_provenance.py
    mutation_id: evidence-return-stub-always-ok
    axis: return-stub
    function: check_file
    match: return-stub
    stub_code: "return FileCheckResult(True)"
    line_hint: "def check_file(path: Path) -> FileCheckResult:"
    description: >-
      Force check_file() to unconditionally report ok=True -- an evidence
      doc with no provenance stamp at all would be certified traceable.
      The "return a constant success" mutant.
    canary:
      module: ci-corpus/canaries/check_evidence_provenance.py
      pristine: pristine_stamped
      seed: seed_no_stamp
      expected_pristine: clean
      expected_seed: violation

  # ---------------------------------------------------------------------
  # scripts/check_netclass_class_param_correspondence.py (added
  # 2026-08-12, alongside the gate itself -- see docs/evidence/
  # 2026-08-12-gate-vacuity-structural-prevention.md. First correspondence
  # gate in this repo to ship with an R42 mutation triple on day one,
  # rather than added retroactively.)
  # ---------------------------------------------------------------------
  - gate: scripts/check_netclass_class_param_correspondence.py
    mutation_id: netclass-param-invert-mismatch-detection
    axis: comparison-flip
    function: compare_class_params
    match: compare-op-flip
    index: 0
    line_hint: "if dr_val != kc_val:"
    description: >-
      Flip `dr_val != kc_val` to `dr_val == kc_val` -- the exact
      backwards-comparison class (cf. `rated >= actual*0.5`), mechanized
      on the one comparison this gate exists to get right: every
      AGREEING field would be reported a mismatch, and the real
      HighVoltage.clearance 6.0-vs-2.0 defect would go unreported.
    canary:
      module: ci-corpus/canaries/check_netclass_class_param_correspondence.py
      pristine: pristine_agree
      seed: seed_mismatch
      expected_pristine: clean
      expected_seed: "violation:['clearance']"

  - gate: scripts/check_netclass_class_param_correspondence.py
    mutation_id: netclass-param-invert-verdict-guard
    axis: condition-invert
    function: run
    match: if-invert
    index: 2
    line_hint: "if report.mismatches or report.unresolved_references:"
    description: >-
      Invert the final violation guard in run() so a real field mismatch
      is reported clean and an agreeing class is reported a violation --
      the StageDRCFailure-gated-behind-verbose class, mechanized on this
      gate's own verdict line (same axis and shape as
      hv-netclass-invert-verdict-guard above; index differs because
      ast.walk's traversal order over this function's four `if`
      statements is not lexical top-to-bottom -- confirmed directly
      against a live parse, not assumed. See
      measurement-invert-freshness-guard's own history in
      docs/evidence/2026-08-11-phase3-mutation-state-of-play.md for the
      exact same drift class hitting a hand-authored index before).
    canary:
      module: ci-corpus/canaries/check_netclass_class_param_correspondence.py
      pristine: pristine_agree
      seed: seed_mismatch
      expected_pristine: clean
      expected_seed: "violation:['clearance']"

  - gate: scripts/check_netclass_class_param_correspondence.py
    mutation_id: netclass-param-return-stub-always-clean
    axis: return-stub
    function: run
    match: return-stub
    stub_code: "return 'clean', Report()"
    line_hint: "def run("
    description: >-
      Force run() to unconditionally return a clean verdict as its first
      statement -- the "return a constant success" mutant.
    canary:
      module: ci-corpus/canaries/check_netclass_class_param_correspondence.py
      pristine: pristine_agree
      seed: seed_mismatch
      expected_pristine: clean
      expected_seed: "violation:['clearance']"

  # ---------------------------------------------------------------------
  # scripts/check_ato_assertion_vacuity.py
  #
  # A vacuity detector that cannot detect vacuity is the joke writing
  # itself. These five triples weaken, in turn, each of the gate's load-
  # bearing parts: both anti-vacuity floors, the two detectors that catch
  # the 2026-08-17 ground-truth defects, and the fail-closed leaf
  # classification. The pristine fixture in every case is a genuinely
  # sound, circuit-coupled assertion, so a mutation that makes the gate
  # fire on correct input is caught as surely as one that makes it silent.
  # ---------------------------------------------------------------------
  - gate: scripts/check_ato_assertion_vacuity.py
    mutation_id: ato-vacuity-guard-strip-file-floor
    axis: guard-strip
    function: find_violations
    match: raise
    index: 0
    line_hint: "raise GateError("
    description: >-
      Strip the raise that fires when the .ato glob matches fewer files than
      expected. A gate whose scope evaporated reports zero findings, which
      reads identically to a clean design -- the exact illusion this gate
      exists to break.
    canary:
      module: ci-corpus/canaries/check_ato_assertion_vacuity.py
      pristine: pristine_circuit_coupled
      seed: seed_scope_evaporated
      expected_pristine: clean
      expected_seed: error

  - gate: scripts/check_ato_assertion_vacuity.py
    mutation_id: ato-vacuity-guard-strip-assertion-floor
    axis: guard-strip
    function: find_violations
    match: raise
    index: 1
    line_hint: "raise GateError("
    description: >-
      Strip the raise that fires when the sources parse but yield almost no
      assertions. Models the reader silently losing its grammar as the .ato
      files evolve: 86 assertions become 0, and the gate congratulates the
      design on having nothing wrong with it.
    canary:
      module: ci-corpus/canaries/check_ato_assertion_vacuity.py
      pristine: pristine_circuit_coupled
      seed: seed_no_assertions
      expected_pristine: clean
      expected_seed: error

  - gate: scripts/check_ato_assertion_vacuity.py
    mutation_id: ato-vacuity-discard-no-circuit-coupling
    axis: violation-discard
    function: find_violations
    match: append-drop
    index: 4
    line_hint: "# NO_CIRCUIT_COUPLING"
    description: >-
      Drop the NO_CIRCUIT_COUPLING finding. This is ground truth #1: without
      it, PowerInput's `fuse.current_rating >= constraints.i_max` and
      `cmc.current_rating >= constraints.i_max` -- a datasheet rating checked
      against the DECLARED 15A rather than the ~27A the doubler draws -- go
      unreported.
    canary:
      module: ci-corpus/canaries/check_ato_assertion_vacuity.py
      pristine: pristine_circuit_coupled
      seed: seed_rating_vs_declared
      expected_pristine: clean
      expected_seed: violation

  - gate: scripts/check_ato_assertion_vacuity.py
    mutation_id: ato-vacuity-discard-tie-margin
    axis: violation-discard
    function: find_violations
    match: append-drop
    index: 0
    line_hint: 'Finding("TIE_MARGIN", assertion, tie)'
    description: >-
      Drop the TIE_MARGIN finding. This is ground truth #2: without it,
      `p_output_max = 1800W` asserted `within 1500W to 1800W` -- a value
      pinned to the unreachable end of its own band -- passes unremarked.
      The seed is deliberately circuit-coupled so only TIE_MARGIN fires and
      the flip cannot be masked by a second finding on the same assertion.
    canary:
      module: ci-corpus/canaries/check_ato_assertion_vacuity.py
      pristine: pristine_circuit_coupled
      seed: seed_tie_margin_only
      expected_pristine: clean
      expected_seed: violation

  - gate: scripts/check_ato_assertion_vacuity.py
    mutation_id: ato-vacuity-scope-remove-circuit-value
    axis: scope-remove
    function: null
    match: container-remove
    name: CIRCUIT_ATTRS
    remove_value: "value"
    line_hint: "CIRCUIT_ATTRS = frozenset("
    description: >-
      Remove `value` from the set of attributes that count as
      circuit-determining. `.value` is the ONLY circuit-coupled attribute in
      the whole design today, so this is the single edit that would silently
      reclassify all 12 sound assertions as vacuous. The gate must not absorb
      it: an unclassified component attribute is a hard error.
    canary:
      module: ci-corpus/canaries/check_ato_assertion_vacuity.py
      pristine: pristine_circuit_coupled
      seed: seed_circuit_value_classification
      expected_pristine: clean
      expected_seed: clean
